# The geographical axis.
#
# The parameters themselves do not belong to a region. But once a parameter
# set exists, a user wants to ask what a typical Scandinavian, or northern
# Chinese, combination looks like -- not as the right answer, but as a
# defensible default when nothing else is known. That makes region a way of
# viewing the database, not a property stored on each value.
#
# Together with schema/parameter_groups.yml this gives the matrix the
# database is really shaped like: a parameter belongs to a group along one
# axis and carries a regional specificity along the other.

# The record migration implemented the mechanism this file used to call for:
#
#   place                every record resolves its raw Origin string (kept
#                        verbatim as `origin:`) to a slug in db/places.yml,
#                        via the judgement layer in schema/origins_map.yml
#   representativeness   every placed record says how far it travels:
#                        site | city | regional | generic
#   region               derived, not stored: archetypes/regions/* and
#                        archetypes/countries/* carry the 22-region UN-style
#                        vocabulary and the 229-country mapping, and a
#                        record's place chains to them through db/places.yml
status:
  mechanism: implemented
  populated: true
  remaining:
    - >
      db/places.yml holds names only; lat/lon and a Koeppen class per place
      would let the axis be queried climatically as well as geographically.
    - >
      origins_map entries flagged needs-review await confirmation (see the
      migration report): the pseudo-places (Tropics, the porosity dummy), the
      value marked "(not used)", and the Newcastle disambiguation.

# Recorded rather than answered. The existing vocabulary is geographic;
# whether that is the right basis is undecided.
open_question: >
  Is the grouping climatic, cultural, or merely geographic? The regions
  vocabulary is geographic, which puts Helsinki and Reykjavik together but
  separates Helsinki from climatically similar places elsewhere. A climate
  classification such as Koeppen would group differently, and building
  typology -- which drives the material and morphology parameters -- follows
  construction practice and regulation rather than either. The three may need
  to be separate axes rather than one compromise. Storing place (not region)
  on each record keeps all three derivable.

# Related data that should funnel in rather than be merged, carrying its
# provenance with it.
external_links:
  - source: UMEP / QGIS morphology data
    holds: Building heights by building type.
    relation: >
      Overlaps archetypes/typologies and the building records. The intent is
      a funnel from one database to the other, with each value keeping a
      record of where it came from, not a merge of the two stores.
