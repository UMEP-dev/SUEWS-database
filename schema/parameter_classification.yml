# Parameter classification registry.
#
# One entry per generalised parameter path found in db/records. A generalised
# path is `<target>.<dotted leaf path under parameters>`, with every integer
# key (a layer index, an hour) written as `*` and a list of mappings (the
# layers of a construction) summarised as `.*`, so construction layers give
# `construction.roof.*.material` and hourly profiles give
# `profile.traffic.working_day.*`. A list of scalars such as
# `thermal_layers.dz` is one path. scripts/check_db.py holds the one function
# that computes these paths; the site build and the tests reuse it.
#
# Classification lives here, beside the records, and is never written into a
# record file. `make check` requires every path carried by an evidence record
# to have exactly one entry here and every entry to match at least one
# evidence record.
#
# Each entry:
#   admission          one of vocabulary.admission
#   type               one of vocabulary.type, or null
#   status             one of vocabulary.status
#   reason             one of vocabulary.reason; required with pending_review,
#                      otherwise null
#   activity           true when the parameter describes human activity
#                      (anthropogenic heat, water use, daily activity
#                      profiles), false when it does not, null when not yet
#                      assessed; it cuts across every type and scale
#   note               free text: for a pending case, what would settle it
#   record_exceptions  optional: <record path without .yml>: {type, status,
#                      reason, note} for a record whose own evidence places
#                      this path differently from the rest; an exception
#                      replaces these four fields, and any it omits are null
#
# Rules the checker enforces: a clear, held parameter has a type; a
# pending_review entry has a reason; an entry whose admission is not `held`
# has a null type. How a value was obtained stays in each record's `method`
# field and is not part of this classification.
#
# Seeded with every path unclassified. Classifications arrive from a reviewed
# pass against the baseline in UMEP-dev/SUEWS-database#1158; none is inferred
# here. Record metadata, links and selectors (`context` fields, construction
# `*.material` links and `*_insulation_layer` selectors) are marked
# `not_a_parameter`, because they are not classified.

vocabulary:
  admission:
    held: The database holds the parameter, because SUEWS uses it directly or through the database's preparation of a SUEWS input.
    not_exported: SUEWS does not use it, directly or through the database's preparation of an input; it is not exported as a live parameter, but its sources stay in the database.
    sources_only: It can be derived from other parameters without further assumptions, so only its sources are kept.
    site_input: It belongs to one particular site (land-cover fractions, latitude and longitude, population density); users supply it and the database does not hold it.
    not_a_parameter: Record metadata, a link or a selector, such as a context field, a construction's material link or its insulation-layer selector; it is not classified.
  type:
    model_setting: A numerical choice of equation or option; an observed schedule, such as a daily activity profile or an irrigation timetable, is a quantity, not a setting.
    physical_attribute: The quantity has a definition independent of the model equation that uses it, such as thermal conductivity, interception capacity or albedo, however it was estimated.
    model_coefficient: Its meaning is defined by a particular equation or parameterisation, such as the OHM a2 and a3 or the drainage coefficients, whose units change with drain_eq.
  status:
    unclassified: Not yet assessed against the baseline; the default, and not a claim either way.
    clear: The evidence establishes the classification.
    pending_review: The evidence does not establish which definition applies; the entry names the reason and what would settle it.
  reason:
    insufficient_evidence: The available evidence is not enough to decide.
    conflicting_evidence: The evidence points to more than one answer.

