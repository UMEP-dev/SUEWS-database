$schema: https://json-schema.org/draft/2020-12/schema
$id: https://database.suews.io/schema/provenance-verifier-policy.schema.yml
title: SUEWS provenance verifier policy
type: object
additionalProperties: false
required:
  - version
  - repository
  - required_signoffs
  - required_scopes
  - verifiers
properties:
  version:
    const: 1
  repository:
    const: UMEP-dev/SUEWS-database
  required_signoffs:
    type: integer
    minimum: 1
  required_scopes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      const: record
  verifiers:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - github_handle
        - github_user_id
        - scopes
      properties:
        github_handle:
          type: string
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
        github_user_id:
          type: integer
          minimum: 1
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            const: record
