# Resolution of every distinct legacy `Origin` string to a place slug.
#
# This is the human-judgement layer regional_axis.yml called for. Each entry
# resolves one raw Origin string to a place (db/places.yml) and a
# representativeness class, with a confidence flag:
#   certain      - unambiguous reading of the string
#   needs-review - a judgement call; listed in the migration report for Ting
#
# Representativeness: how far the value travels beyond where it was obtained.
#   site      - a specific measurement site
#   city      - offered as typical of a city
#   regional  - typical of a region or country
#   generic   - not tied to any place
#
# The raw string is also kept verbatim on every migrated record (`origin:`),
# so this mapping adds interpretation without destroying information.

origins:
  Helsinki:                {place: helsinki, representativeness: city, confidence: certain}
  Helsinki, Finland:       {place: helsinki, representativeness: city, confidence: certain}
  Helsinki-Kumpula:        {place: helsinki, representativeness: site, confidence: certain,
                            note: Kumpula measurement site}
  London:                  {place: london, representativeness: city, confidence: certain}
  London, UK:              {place: london, representativeness: city, confidence: certain}
  Barbican, London:        {place: london, representativeness: site, confidence: certain,
                            note: Barbican estate}
  London (River Thames), UK: {place: london, representativeness: site, confidence: certain,
                            note: River Thames}
  SE England:              {place: se-england, representativeness: regional, confidence: certain}
  UK, SE England:          {place: se-england, representativeness: regional, confidence: certain}
  UK:                      {place: uk, representativeness: regional, confidence: certain}
  Sweden:                  {place: sweden, representativeness: regional, confidence: certain}
  Finland:                 {place: finland, representativeness: regional, confidence: certain}
  China:                   {place: china, representativeness: regional, confidence: certain}
