# Records that carry a `url` but whose image cannot be shown yet. Listed here
# so the omission is deliberate and auditable rather than silent;
# scripts/check_db.py requires every typology with a `url` to appear in one
# section or the other. `tracked_by` is the issue where the question is being
# settled; the site links a reader to it rather than leaving the absence
# unexplained.

unresolved:

  archetypes/typologies/sweden--mixed-city-ideal:
    tracked_by: 56
    reason: >-
      The record's url points at an item in the City of Gothenburg's media
      library. That library's own metadata for the item gives no author,
      no title, no description and no licence; the stored filename is
      "Framtidens Backaplan Dp1 Dp2 Dp3 Flygvy Norr_White-arkitekter
      23012-36-10.jpg", which names White arkitekter and identifies the
      image as an architectural visualisation of a planned development
      rather than a photograph of an existing neighbourhood. Neither the
      attribution nor the terms of reuse can be established from the source,
      and the record carries no image_source of its own.
    what_would_settle_it: >-
      A statement from the City of Gothenburg or White arkitekter naming the
      rights holder and the terms under which the image may be republished.
      Failing that, a different photograph of a built example of this
      typology, with its own provenance.

  archetypes/typologies/uk--sub-urban:
    tracked_by: 55
    reason: >-
      The record credits "By Helen Ward" for an image hosted on a University
      of Gothenburg file share. The host publishes no licence, metadata or
      terms of any kind alongside the file, so no licence can be established
      from the source. The url is also http-only, so the image would in any
      case be blocked as mixed content on the https site.
    what_would_settle_it: >-
      Confirmation from the photographer of the terms under which the image
      may be republished, together with an https-reachable original.
