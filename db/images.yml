# Photographs illustrating the urban typologies.
#
# A typology is a visual idea: "Mixed-City Ideal" and "Traditional Stone House
# Neighbourhood" are not self-explanatory from their names, and a reader
# choosing between them is choosing between kinds of place they would
# recognise on sight. This table is what lets the site show them.
#
# It is a reference table in the same sense as db/sources.yml and
# db/places.yml: keyed by the record it illustrates, holding provenance
# rather than parameters. The typology records themselves are untouched --
# their legacy `url` and `image_source` strings stay verbatim as migrated.
#
# Every entry states where the copy came from, who took it and under what
# licence, established by reading the source's own metadata. A photograph
# whose licence cannot be established from its source does not get an entry:
# it goes under `unresolved` below, naming what would settle it. The site
# shows an image only if it appears here, so an image can never reach a
# reader without its attribution.
#
# The image files are not in this repository. They are individual assets on
# the release named by `release` below -- the same place the archived
# workbook lives. scripts/build_site.py fetches them from there at build
# time, verifies each against its sha256, and serves them from the site's own
# origin, so a reader's browser never contacts a third-party host and no
# upstream link rot can blank a page. scripts/fetch_images.py stages the
# assets from their origins for that release.

