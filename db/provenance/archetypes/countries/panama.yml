  scientific_note: 'Panama''s default takes Panama''s own rows, every one of them classed regional, which
    is what a country default should do. Each component attaches where its slot expects: the traffic record
    to anthropogenic_emissions.co2.traffprof_24hr and the human-activity record to anthropogenic_emissions.co2.humactivity_24hr.
    The archetype declares no anthropogenic heat or population diurnal profile, so exported defaults fall
    back to supy''s uniform 24-hour profiles for anthropogenic_emissions.heat.ahprof_24hr and heat.popprof_24hr;
