  scientific_note: Sweden's default takes Sweden's own rows, every one of them classed regional, which
    is what a country default should do. The slot mapping, however, is not. Reading the composite against
    the components' own declarations, the energy_use slot takes records/profiles/traffic/lucy/sweden,
    which declares attaches_to anthropogenic_emissions.co2.traffprof_24hr rather than the anthropogenic_emissions.heat.ahprof_24hr
    field that slot fills, and the population slot takes records/profiles/human-activity/lucy/sweden,
    which declares attaches_to anthropogenic_emissions.co2.humactivity_24hr rather than the anthropogenic_emissions.heat.popprof_24hr
    field that slot fills. Two of the four profile fields therefore receive a series that was never derived
    for them. This lives in the composite, so it is fixable without touching any component value, and
    the same mapping recurs across the country defaults, so a maintainer should settle it once rather
    than country by country. The components' values remain subject to their own evidence assessments;
    this review does not revisit them.
