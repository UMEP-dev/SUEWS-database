    or population diurnal profile, so exported defaults fall back to supy''s uniform 24-hour profiles
    for anthropogenic_emissions.heat.ahprof_24hr and heat.popprof_24hr; that omission is a documented
    property of the country defaults rather than a silent slot mismatch. The components'' values remain
    subject to their own evidence assessments; this review does not revisit them.'
