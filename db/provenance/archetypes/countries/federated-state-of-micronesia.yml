    and the human-activity record to anthropogenic_emissions.co2.humactivity_24hr. The archetype declares
    no anthropogenic heat or population diurnal profile, so exported defaults fall back to supy''s uniform
    24-hour profiles for anthropogenic_emissions.heat.ahprof_24hr and heat.popprof_24hr; that omission
