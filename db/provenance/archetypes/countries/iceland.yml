  scientific_note: 'Iceland''s default is not assembled from Iceland''s own country-scale rows: it borrows
    records/profiles/energy-use/helsinki--jarvi2019--energy-use (place helsinki) and stands records/profiles/energy-use/helsinki--jarvi2019--energy-use,
    classed city, in for a country-scale value. The slot mapping is now consistent: the traffic and human-activity
    records attach to their CO2 paths, and the energy_use slot retains only its holiday side, records/profiles/energy-use/helsinki--jarvi2019--energy-use,
    which attaches to anthropogenic_emissions.heat.ahprof_24hr as the slot expects. The former working_day
    side, which re-declared the traffic record against a heat-namespace field it never filled, and the
    population slot have been removed; the exported ahprof_24hr therefore carries a holiday series with
    no working_day counterpart, and the population profile falls back to supy''s uniform default. The
    components'' values remain subject to their own evidence assessments; this review does not revisit
    them.'
