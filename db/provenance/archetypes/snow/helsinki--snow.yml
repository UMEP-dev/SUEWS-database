  scientific_note: 'The selection holds up. archetypes/snow/helsinki--snow declares place helsinki, representativeness
    city and source jarvi2014, and both components declare exactly those three, so a city-scale Helsinki
    snow set is assembled from that city''s own rows in the study it cites. The mapping holds too: the
    albedo slot takes the record carrying snow_albedo_min and snow_albedo_max, the emissivity slot the
    record carrying narp_emissivity_snow, and the assembled fragment shows snow_albedo_min 0.18, snow_albedo_max
    0.85 and narp_emissivity_snow 0.99 arriving from the components with the composite''s own eleven scalars
    merged over them. One thing a reader should carry forward without acting on it here: records/snow/helsinki--jarvi2014--emissivity
    is named "Snow (sample data)", and whether a value migrated from a sample run belongs in the database
    is a question for that record''s own evidence review. It is the only snow emissivity record in the
    database, so every snow composite rests on it.'
