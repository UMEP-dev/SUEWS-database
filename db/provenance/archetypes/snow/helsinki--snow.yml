  findings:
    name:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: The composite's name reads Snow and both components declare target snow, so the label matches
        what it assembles. The label on its own does not distinguish it from the two other snow composites,
        whose names read Not used and No Snow; the place field and the entry path carry that distinction.
    target:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: The composite declares target snow and both components declare target snow. Snow records carry
        no attaches_to field; in this database attaches_to appears only on the profile records under records/profiles/,
        so the slot check rests on the parameter names each component carries. The albedo slot takes the
        record holding snow_albedo_min and snow_albedo_max and the emissivity slot takes the record holding
        narp_emissivity_snow, so each slot receives a component declared for it.
    values:
      conclusion: curation_required
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      - legacy-ohm-helsinki--jarvi2014--snow
      note: 'The composite asserts eleven parameters of its own, from radiation_melt_factor 0.0016 to
        temperature_rain_snow_threshold 2.2. None is a field either component supplies, so the assembly
        overrides no component value. Whether jarvi2014 supports the eleven is not settled here and cannot
        be settled by any assessment that currently exists: docs/FORMAT.md requires a value a composite
        introduces to be represented and evidence-reviewed as a record first, and these eleven appear
        nowhere under db/records/. Until they do, a composition review cannot call them supported, and
        this review does not. Separately, all four legacy OHM condition fields point to ID 50240016,
        represented by records/ohm/helsinki--jarvi2014--snow; that binding stays in the legacy block and
        does not enter the assembled fragment.'
    source:
      conclusion: not_applicable
      note: The composite claims no composition rationale. Its source field, jarvi2014, attributes the
        parameter block the composite asserts itself, which belongs to its evidence assessment. The albedo
        component declares jarvi2014, while the emissivity component declares jarvi2011 because the later
        paper explicitly inherits that value. Component-level evidence therefore distinguishes derivation
        from compilation rather than forcing one source key across the assembly.
    place:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      - legacy-ohm-helsinki--jarvi2014--snow
      note: The composite declares place helsinki. The emissivity component is placeless because Järvi
        et al. (2011) publishes 0.99 as a general model input, while the albedo component declares montreal-suburban
        because that is where Järvi et al. (2014) determined 0.18 and 0.85. The later article applies both
        at Helsinki. The legacy OHM fields likewise point to a triplet fitted at the Montreal Pr site
        and subsequently applied at all sites, so the assembly is a documented Helsinki configuration
        rather than a claim that each input was measured there.
    representativeness:
      conclusion: curation_required
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      - legacy-ohm-helsinki--jarvi2014--snow
      note: The composite declares representativeness city. The emissivity component declares generic,
        while the albedo component declares site because its values were determined at the single Pr suburban
        site in Montreal. The legacy OHM record also declares site because a2 and a3 were optimized at
        Pr. Järvi et al. apply those values at Helsinki, but the composition still promotes site-derived
        evidence into a city configuration; a verifier should sign off that use knowingly rather than
        treating the inputs as city-scale evidence.
    method:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: An assembly of two existing records into the albedo and emissivity slots, and assembled is
        the method a composition sidecar takes. The composite is not purely an assembly, since it also
        asserts eleven scalars directly, which docs/FORMAT.md sanctions for the snow entries; those values
        are reviewed as the composite's own evidence, not here.
    identity:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      related_records:
      - archetypes/snow/se-england--not-used
      - archetypes/snow/suews--no-snow
      note: The composite fills both slots the snow archetypes use, albedo and emissivity, and it is the
        only Helsinki snow set in the database. Its uses block is identical to those of archetypes/snow/se-england--not-used
        and archetypes/snow/suews--no-snow, which take the same two records in the same two slots; records/snow/helsinki--jarvi2014--emissivity
        is the only snow emissivity record there is, so that part of the sharing is forced. The one remaining
        snow record, records/snow/generic--kawai2009--thermal-layers, carries an empty parameters block
        with everything in legacy, so no slot is missing on its account.
  evidence:
  - id: component-snow-helsinki-jarvi2014-albedo
    record: records/snow/helsinki--jarvi2014--albedo
    role: component
    note: Fills the albedo slot. The record declares target snow, name Snow, place montreal-suburban,
      representativeness site and source jarvi2014, and carries snow_albedo_min and snow_albedo_max. Its
      stable path and origin retain legacy Helsinki migration text.
  - id: component-snow-helsinki-jarvi2014-emissivity
    record: records/snow/helsinki--jarvi2014--emissivity
    role: component
    note: Fills the emissivity slot. The record declares target snow, name Snow emissivity, no place,
      representativeness generic, source jarvi2011 and method literature, and carries narp_emissivity_snow.
      Its stable path and origin retain legacy Helsinki migration text.
  - id: legacy-ohm-helsinki--jarvi2014--snow
    record: records/ohm/helsinki--jarvi2014--snow
    role: related
    note: All four legacy OHM condition fields point to legacy ID 50240016. The stable record declares
      target ohm_coefficients, place montreal-suburban, representativeness site and source jarvi2014,
      and carries a1 0.25, a2 0.6 and a3 -30. Its path and origin retain legacy Helsinki migration text.
  scientific_note: 'The selection is documented but spans evidence scales. archetypes/snow/helsinki--snow
    declares place helsinki, representativeness city and source jarvi2014. Its albedo component now correctly
    declares the Montreal suburban site and site representativeness because that is where Järvi et al.
    determined 0.18 and 0.85; the paper subsequently checks and applies those values at Helsinki. The mapping holds: the
    albedo slot takes the record carrying snow_albedo_min and snow_albedo_max, the emissivity slot the
    record carrying narp_emissivity_snow, and the assembled fragment shows snow_albedo_min 0.18, snow_albedo_max
    0.85 under jarvi2014 and narp_emissivity_snow 0.99 under jarvi2011, arriving from the components with
    the composite''s own eleven scalars
    merged over them. Three things a reader should carry forward without acting on them here. The first
    is that the albedo''s use in a city configuration promotes site-derived evidence and needs verifier
    sign-off at the composition layer; the same applies to the Montreal-site OHM record referenced by
    all four legacy condition fields. The second is that the eleven scalars the composite asserts have
    no record behind them, so nothing in the database can yet review them. The emissivity component is
    the database''s only snow emissivity record, and its own evidence review establishes it as a generic
    literature parameter.'
