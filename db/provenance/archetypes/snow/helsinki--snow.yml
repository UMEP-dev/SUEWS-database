    name:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: The composite's name reads Snow, its place reads helsinki and its origin reads Helsinki, and
        both components are Helsinki snow records, so the entry identifies what it assembles. The label
        on its own does not distinguish it from the two other snow composites, whose names read Not used
        and No Snow; the place field and the entry path carry that distinction.
    target:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: The composite declares target snow and both components declare target snow. Snow records carry
        no attaches_to field; in this database attaches_to appears only on the profile records under records/profiles/,
        so the slot check rests on the parameter names each component carries. The albedo slot takes the
        record holding snow_albedo_min and snow_albedo_max and the emissivity slot takes the record holding
        narp_emissivity_snow, so each slot receives a component declared for it.
    values:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: The composite asserts eleven parameters of its own, from radiation_melt_factor 0.0016 to temperature_rain_snow_threshold
        2.2. None of them is a field either component supplies, so the assembly overrides no component
        value and the exported fragment carries the components' snow_albedo_min, snow_albedo_max and narp_emissivity_snow
        alongside them. Whether jarvi2014 supports those eleven scalars belongs to the composite's own
        evidence assessment.
    source:
      conclusion: not_applicable
      note: The composite claims no composition rationale. Its source field, jarvi2014, attributes the
        parameter block the composite asserts itself, which belongs to its evidence assessment. Both components
        independently declare source jarvi2014, so the assembly draws on a single publication throughout.
    place:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: The composite declares place helsinki and both components declare place helsinki, so a Helsinki
