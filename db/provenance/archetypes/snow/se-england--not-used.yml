  - id: component-snow-helsinki-jarvi2014-albedo
    record: records/snow/helsinki--jarvi2014--albedo
    role: component
    note: Fills the albedo slot. The record declares target snow, name Snow, place montreal-suburban,
      representativeness site and source jarvi2014, and carries snow_albedo_min and snow_albedo_max. Its
      stable path and origin retain legacy Helsinki migration text.
  - id: component-snow-helsinki-jarvi2014-emissivity
    record: records/snow/helsinki--jarvi2014--emissivity
    role: component
    note: Fills the emissivity slot. The record declares target snow, name "Snow (sample data)", place
      helsinki, representativeness city and source jarvi2014, and carries narp_emissivity_snow.
  scientific_note: 'The mapping is internally consistent, in that the albedo slot takes the record carrying
    snow_albedo_min and snow_albedo_max, the emissivity slot the record carrying narp_emissivity_snow,
    and both components declare target snow. The selection does not match what the composite claims about
    itself. archetypes/snow/se-england--not-used declares place se-england, representativeness regional
    and source ward2016, then takes a site-classed albedo component from Montreal and a city-classed emissivity
    component from Helsinki, both sourced to jarvi2014. The assembled fragment shows the split plainly:
    snow_albedo_min 0.18 and snow_albedo_max 0.85 arrive under ID jarvi2014 described as montreal-suburban,
    site, narp_emissivity_snow 0.99 arrives under the same ID described as helsinki, city, while the
    eleven scalars the composite asserts arrive under ID ward2016 described as se-england, regional. Two
    readings fit and the files do not decide between them. The first is that the arrangement is deliberate:
    the composite is named Not used, and records/snow/se-england--ward2016--albedo, which matches the
    composite on place, class and source, is named "Snow (not used in Ward et al. 2016)", so the whole
    set may be a placeholder nobody intended to be selective about. The second is that the albedo slot
    was pointed at the wrong record, since that SE England record exists, agrees with the composite on
    all three fields and is referenced by no archetype at all. The choice is not free either way: no SE
    England snow emissivity record exists, so re-pointing the albedo slot alone would leave a regional
    composite drawing its emissivity from Helsinki. A maintainer should settle both slots in one decision.'
