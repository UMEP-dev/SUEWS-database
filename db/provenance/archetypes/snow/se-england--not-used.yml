  findings:
    name:
      conclusion: supported
      note: The composite's name reads Not used, its place reads se-england and its origin reads SE England.
        Read with those fields the label says what the entry is, a snow parameter set held for SE England
        that the study it cites did not use. It says nothing about which components were chosen, which
        is dealt with under place.
    target:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: The composite declares target snow and both components declare target snow. Snow records carry
        no attaches_to field; in this database attaches_to appears only on the profile records under records/profiles/,
        so the slot check rests on the parameter names each component carries. The albedo slot takes the
        record holding snow_albedo_min and snow_albedo_max and the emissivity slot takes the record holding
        narp_emissivity_snow, so each slot receives a component declared for it.
    values:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: The composite asserts eleven parameters of its own, from radiation_melt_factor 0.001 to temperature_rain_snow_threshold
        2.2. None of them is a field either component supplies, so the assembly overrides no component
        value. Whether ward2016 supports those eleven scalars belongs to the composite's own evidence
        assessment.
    source:
      conclusion: not_applicable
      note: 'The composite claims no composition rationale. Its source field, ward2016, attributes the
        parameter block the composite asserts itself. Neither component declares that key: both declare
        source jarvi2014, so the exported fragment carries snow_albedo_min, snow_albedo_max and narp_emissivity_snow
        under ID jarvi2014 while the eleven asserted scalars carry ID ward2016. What follows from that
        split is recorded under place.'
    place:
      conclusion: curation_required
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      related_records:
      - records/snow/se-england--ward2016--albedo
      note: The composite declares place se-england. Its albedo component declares montreal-suburban and
        its emissivity component declares helsinki, so an SE England snow set publishes values from a
        Montreal site and Helsinki. The database holds records/snow/se-england--ward2016--albedo,
        which declares place se-england, representativeness regional and source ward2016, the composite's
        own three fields, carries snow_albedo_min and snow_albedo_max, and is referenced by no archetype;
        it would fill the albedo slot. There is no SE England snow emissivity record, and records/snow/helsinki--jarvi2014--emissivity
        is the only snow emissivity record in the database, so the emissivity slot has no local alternative
        and re-pointing the albedo slot alone would still leave the composite partly non-local. A maintainer
        has to decide whether the two transplants are deliberate stand-ins or a mis-selection.
    representativeness:
      conclusion: curation_required
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      related_records:
      - records/snow/se-england--ward2016--albedo
      note: The composite declares representativeness regional. The albedo component declares site and
        the emissivity component declares city, so both stand in below the composite's scale. The unused
        records/snow/se-england--ward2016--albedo is classed regional, so for the albedo slot the class
        gap and the place gap would close together, while the emissivity slot has no regional snow record
        to take. This rides on the decision recorded under place rather than being a separate defect.
    method:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      note: An assembly of two existing records into the albedo and emissivity slots, and assembled is
        the method a composition sidecar takes. The composite also asserts eleven scalars directly, which
        docs/FORMAT.md sanctions for the snow entries; those values are reviewed as the composite's own
        evidence, not here.
    identity:
      conclusion: supported
      evidence_ids:
      - component-snow-helsinki-jarvi2014-albedo
      - component-snow-helsinki-jarvi2014-emissivity
      related_records:
      - archetypes/snow/helsinki--snow
      - archetypes/snow/suews--no-snow
      note: The composite fills both slots the snow archetypes use and is the only SE England snow set
        in the database. Its uses block is identical to those of archetypes/snow/helsinki--snow and archetypes/snow/suews--no-snow,
        the same two records in the same two slots, while the eleven scalars it asserts differ from theirs,
        snow_density_max 450 against Helsinki's 400 and tau_refreezing_snow 0.02 against 0.043 among them,
        so these are distinct entries that happen to share every component. The one remaining snow record,
        records/snow/generic--kawai2009--thermal-layers, carries an empty parameters block with everything
        in legacy, so no slot is missing on its account.
