    role: component
    note: Fills the emissivity slot. The record declares target snow, name Snow emissivity, no place,
      representativeness generic, source jarvi2011 and method literature, and carries narp_emissivity_snow.
      Its stable path and origin retain legacy Helsinki migration text.
  - id: legacy-ohm-helsinki--jarvi2014--snow
    record: records/ohm/helsinki--jarvi2014--snow
    role: related
    note: All four legacy OHM condition fields point to legacy ID 50240016. The stable record declares
      target ohm_coefficients, place montreal-suburban, representativeness site and source jarvi2014,
      and carries a1 0.25, a2 0.6 and a3 -30. Its path and origin retain legacy Helsinki migration text.
  scientific_note: 'The mapping is internally consistent, in that the albedo slot takes the record carrying
    snow_albedo_min and snow_albedo_max, the emissivity slot the record carrying narp_emissivity_snow,
    and both components declare target snow. The selection does not match what the composite claims about
    itself. archetypes/snow/se-england--not-used declares place se-england, representativeness regional
    and source ward2016, then takes a site-classed albedo component from Montreal sourced to jarvi2014
    and a generic, placeless emissivity component sourced to jarvi2011. The assembled fragment shows the split plainly:
    snow_albedo_min 0.18 and snow_albedo_max 0.85 arrive under ID jarvi2014 described as montreal-suburban,
    site, narp_emissivity_snow 0.99 arrives under jarvi2011 described as generic, while the
    eleven scalars the composite asserts arrive under ID ward2016 described as se-england, regional. A
    separate legacy binding does not enter that assembled fragment: all four OHM condition fields point
    to the same Montreal-site triplet under legacy ID 50240016. Two
    readings fit and the files do not decide between them. The first is that the arrangement is deliberate:
    the composite is named Not used, so the whole set may be a placeholder whose transplanted components
    were deliberately retained. The second is that the albedo slot should use the archived SE England
    configuration, since that record matches the composite on place and regional class and is referenced
    by no archetype at all. It does not provide independent literature evidence: it is now correctly marked
    unreferenced and assumed, and selecting it would change the assembled albedo maximum from 0.85 to 0.80.
    The choice is not free either way: no SE
    England snow emissivity record exists, but the remaining emissivity is now correctly identified as
    generic rather than Helsinki evidence. A maintainer should settle the albedo selection knowingly.'
