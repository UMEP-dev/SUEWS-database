    name:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-bldgs-london-uk-central-london-ward-et-al-2016
      - component-surfaces-paved-london-uk-central-london-ward-et-al-2016
      note: 'The composite is named ''CBD'' and described as ''Central London (sample data)''. Both slots
        take archetypes named ''Central London, Ward et al. (2016)'', so the central-London half of the
        description matches what is assembled. The sample-data half appears nowhere in the name, and it
        is not incidental: the entry path is archetypes/typologies/uk--cbd-sample-run, and the construction
        under the bldgs component is records/constructions/uk--lindberg-f2020--central-london-sample-run,
        named ''Central London [sample run]''. SUSPECT_MARKERS in scripts/check_db.py lists ''sample run''
        and ''sample data'' as names that read as test fixtures rather than data, and make check does
        report that construction record; the check inspects only the name field, which here reads ''CBD'',
        so the composite itself passes silently. A reader choosing this entry from the site sees ''CBD''
        and a UK regional class, not a demonstration dataset. A maintainer should decide whether the entry
        is a publishable urban type and, if it is, whether its name should say what its description already
        says.'
    target:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-london-uk-central-london-ward-et-al-2016
      - component-surfaces-paved-london-uk-central-london-ward-et-al-2016
      note: 'The composite''s own target is ''typology'', which is what every entry under archetypes/typologies
        declares, and each slot takes a component declared for it: the bldgs slot takes an archetype declaring
        target land_cover.bldgs and the paved slot an archetype declaring target land_cover.paved. The
        two share the slug ''london-uk--central-london-ward-et-al-2016'' under different surface families,
        so the shared name does not put either in the wrong slot. Neither component declares attaches_to;
        in this database that field is carried only by the profile records under db/records/profiles,
        so slot fit here is judged on the components'' declared target.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters block of its own, so it asserts no value beyond the two
        components it selects.
    source:
      conclusion: not_applicable
      note: The composite claims no composition source, and the repository records no published rationale
        for taking central London as the UK's CBD type. The components' own sources belong to their assessments,
        not to this review.
    place:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-london-uk-central-london-ward-et-al-2016
      - component-surfaces-paved-london-uk-central-london-ward-et-al-2016
      note: The composite claims place 'uk', which db/places.yml gives as name 'UK', country 'united-kingdom'
        and subnational true. Both components declare place 'london', which db/places.yml resolves to
        country 'united-kingdom'. Every part of the typology comes from inside the country it claims.
    representativeness:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-bldgs-london-uk-central-london-ward-et-al-2016
      - component-surfaces-paved-london-uk-central-london-ward-et-al-2016
      note: 'The composite declares representativeness ''regional'' while both components declare ''city''.
        Nothing in this assembly carries the class the composite claims: a single central-London pair
        of surfaces is offered as a UK-wide urban type. A maintainer should decide whether to reclassify
        the composite or to record that central London is the intended stand-in for UK city centres.'
    method:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-london-uk-central-london-ward-et-al-2016
      - component-surfaces-paved-london-uk-central-london-ward-et-al-2016
      note: An assembly of two existing surface archetypes into the two slots the typology format defines;
        the composite produces no value of its own. A typology carries no season and no wet/dry mapping
        of its own, because those live inside the surface components' ohm blocks, so there is no seasonal
        mapping to check at this level.
    identity:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-london-uk-central-london-ward-et-al-2016
      - component-surfaces-paved-london-uk-central-london-ward-et-al-2016
      note: 'The assembly is complete: scripts/migrate_to_records.py maps only the legacy Types table''s
        ''Buildings'' and ''Paved'' columns into a typology''s uses block, and both slots are filled. The
        former OBTESTCASE sibling and its dedicated building surface were retired as an earlier compilation
        test chain under issue 58. No other surviving typology has this uses block, so the identity is
        now unique. The remaining questions concern whether this sample-run assembly should be published
        as a UK-wide CBD type and how it should be named, not whether it duplicates another published
        entry.'
