      land_cover.bldgs, place 'london' and representativeness 'city'. It declares no attaches_to, and
      its construction slot takes records/constructions/uk--lindberg-f2020--central-london-sample-run.
  - id: component-surfaces-paved-london-uk-central-london-ward-et-al-2016
    record: archetypes/surfaces/paved/london-uk--central-london-ward-et-al-2016
    role: component
    note: Fills paved. The archetype is named 'Central London, Ward et al. (2016)' and declares target
      land_cover.paved, place 'london' and representativeness 'city'. It declares no attaches_to. The
      same archetype also fills the paved slot of archetypes/typologies/uk--obtestcase.
  scientific_note: 'The slot mechanics are sound. Both components are a matched central-London pair from
    the same curated bundle, both declare place ''london'' inside the country the composite claims, and
    each is declared for the slot it fills. What the entry claims around that assembly is where it fails.
    It declares representativeness ''regional'' while both components declare ''city'', so one city centre
    stands for the whole UK. It describes itself as ''Central London (sample data)'' while presenting
    under the name ''CBD'', and the sample-run character runs down into the building archetype''s construction,
    records/constructions/uk--lindberg-f2020--central-london-sample-run, which make check already reports
    as a suspect name; the composite escapes the same warning only because the check reads the name field
    and the name field says ''CBD''. And it is not distinguishable from archetypes/typologies/uk--obtestcase,
    which repeats its place, representativeness, profile_type, period and description word for word, shares
    its paved component, and differs only in one construction record two levels down. These are curation
    decisions rather than data errors: whether demonstration data should be published as a UK urban type
    at all, and if so which of the two central-London entries survives and what it should be called. None
    of it depends on a component''s values, which remain subject to their own assessments.'
