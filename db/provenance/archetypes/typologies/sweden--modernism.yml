  findings:
    name:
      conclusion: supported
      evidence_ids: &id001
      - component-surfaces-bldgs-sweden-concrete-million-program
      - component-surfaces-paved-sweden-asphalt-mixed-city
      note: The composite's name field reads 'Modernism ' with a trailing space. Its description, 'Million
        programme. Mid 20th century modernistic suburban neighbourhood development', and its period 'Pre80'
        agree with the building component, which is named 'Concrete (Million Program)', and with the paved
        component named 'Asphalt, mixed city'. The label identifies what is assembled; the trailing space
        is a migration artefact of the kind several archetype names in this database carry.
    target:
      conclusion: supported
      evidence_ids: *id001
      note: 'The composite''s own target is typology, and each slot takes a component declared for it:
        the bldgs slot takes an archetype declaring target land_cover.bldgs and the paved slot an archetype
        declaring target land_cover.paved. No archetype in this database declares attaches_to, which is
        carried only by the 477 records under records/profiles, so slot fit here is judged on the components''
        declared target.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters block of its own, so it asserts no value beyond the two
        archetypes it selects.
    source:
      conclusion: not_applicable
      note: The composite claims no composition source, and the repository records no published rationale
        for pairing these two archetypes. Its url and image_source fields are photograph locators, published
        in db/images.yml with the credit 'Holger Ellgaard' and the licence 'CC BY-SA 3.0'; a photograph
        of Rinkeby is not a rationale for a component selection. The components' own selections belong
        to their composition assessments, not to this review.
    place:
      conclusion: supported
      evidence_ids: *id001
      note: The composite claims place sweden, and both components declare place sweden. The assembly
        stays inside the country it claims and imports nothing.
    representativeness:
      conclusion: supported
      evidence_ids: *id001
      note: The composite declares representativeness regional and both components declare regional, so
        no component is stretched past its stated reach and no city row stands in for a national default.
    method:
      conclusion: supported
      evidence_ids: *id001
      note: An assembly of two existing archetypes into two slots; the composite produces no value of
        its own. A typology carries no seasonal or wet/dry axis, because the four OHM positions live inside
        the surface archetypes, so the only mapping made here is one archetype per slot and each slot
        receives exactly one.
    identity:
      conclusion: supported
      evidence_ids: *id001
      note: 'A typology has two component slots and no others: the migration maps the legacy Types table''s
        Buildings and Paved columns into bldgs and paved and nothing else (scripts/migrate_to_records.py),
        and all fourteen entries under archetypes/typologies fill exactly those two. This composite fills
        both, so the assembly is complete. Its pair of components is unique: archetypes/surfaces/bldgs/sweden--concrete-million-program
        is selected by no other typology, while archetypes/surfaces/paved/sweden--asphalt-mixed-city is
        shared with archetypes/typologies/sweden--mixed-city-ideal, archetypes/typologies/sweden--residential-functionalism
        and archetypes/typologies/sweden--traditional-neighborhood. The building archetype is therefore
        what separates the four, and here the separation is substantive: archetypes/surfaces/bldgs/sweden--concrete-million-program
        differs from archetypes/surfaces/bldgs/sweden--nordic-functionalism-wood in two slots, taking
        records/surfaces/bldgs/london--ward2016--albedo rather than records/surfaces/bldgs/gothenburg--oke1987--albedo--wood
        and records/constructions/sweden--bjork2002--high-rise-million-program-mid-1900s rather than records/constructions/sweden--bjork2002--nordic-functionalism-mid-1900s,
        which is what a concrete high-rise stock should differ in from a wooden low-rise one.'
      related_records:
      - archetypes/typologies/sweden--mixed-city-ideal
      - archetypes/typologies/sweden--residential-functionalism
      - archetypes/typologies/sweden--traditional-neighborhood
