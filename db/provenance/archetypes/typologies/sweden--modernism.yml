  scientific_note: 'The Million Programme typology selects a Swedish concrete building archetype and a
    Swedish asphalt paved archetype, both classed regional, which is the class the composite itself claims,
    and both declaring the target their slot needs. Both of the two slots a typology has are filled, nothing
    is imported from another country, and nothing narrower stands in for the national claim. Its identity
    holds up better than the shared paved archetype suggests: four Swedish typologies take the same paved
    row, but the building archetype selected here differs from its nearest neighbour in both albedo and
    construction, which is the difference between concrete high-rise and wooden low-rise stock. The composite
    name carries a trailing space and the url and image_source fields carry a Wikimedia photograph of
    Rinkeby, credited and licensed in db/images.yml; neither bears on component selection. The components''
    own compositions and values remain subject to their own assessments; this review does not revisit
    them.'
