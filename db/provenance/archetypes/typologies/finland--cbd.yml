    record: archetypes/surfaces/bldgs/helsinki--city-centre
    role: component
    note: Fills bldgs. The archetype is named 'City centre ', declares target land_cover.bldgs, place
      helsinki and representativeness city.
  - id: component-surfaces-paved-helsinki-city-centre
    record: archetypes/surfaces/paved/helsinki--city-centre
    role: component
    note: Fills paved. The archetype is named 'City centre ', declares target land_cover.paved, place
      helsinki and representativeness city.
  scientific_note: 'Finland''s CBD typology is internally consistent in everything a composition review
    can check from the composite itself. Both components are Helsinki city-centre archetypes, helsinki
    resolves to country finland, the building slot takes an archetype declaring land_cover.bldgs and the
    paved slot one declaring land_cover.paved, both of the two slots a typology has are filled, and the
    label, the description ''Central Helsinki'' and the profile type ''Commercial'' agree with each other
    and with what is assembled. The one thing the composite asserts beyond its components is reach: it
    declares representativeness regional while both components declare city, so Helsinki stands for Finland.
    The database holds no Finnish building or paved archetype classed regional, so nothing better was
    available, which makes this an unrecorded decision rather than a wrong selection, and the same decision
    is embedded in every typology built on a named city. It should be settled once for the set. The components''
    own compositions and values remain subject to their own assessments; this review does not revisit
    them.'
