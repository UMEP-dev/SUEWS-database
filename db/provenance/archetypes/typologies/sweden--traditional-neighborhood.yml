  scientific_note: 'On place and reach this is the cleanest of the Swedish typologies: both components
    declare place ''sweden'' and representativeness ''regional'', so a Swedish country-scale typology
    is assembled entirely from Swedish country-scale surfaces, and the paved component is the same one
    three sibling Swedish typologies use. The problem is what the entry says it assembles. Its description
    reads ''Traditional neighborhood (Stone houses)'', but the building archetype it selects is named
    ''Brick House, Traditional Neighbourhood'' and rests on a construction named ''Traditional Neighbourhood,
    early 1900s''. The database is not indifferent to that distinction: it holds a separate archetypes/surfaces/bldgs/sweden--stone-houses-traditional-neighbourhood
    with its own stone construction, and a separate typology, archetypes/typologies/sweden--traditional-stone-house-neighbourhood,
    that uses it. So either this composite''s description belongs to that other typology and should be
    corrected here, or the bldgs slot is filled by the wrong archetype and the two Swedish traditional-neighbourhood
    entries are crossed. The evidence in the repository does not distinguish those two readings, and they
    have different consequences for anyone selecting this typology, so a maintainer should settle it.
    Nothing here turns on a component''s values, which remain subject to their own assessments.'
