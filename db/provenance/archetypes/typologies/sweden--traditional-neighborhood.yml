  findings:
    name:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-bldgs-sweden-brick-house-traditional-neighbourhood
      note: 'The composite is named ''Traditional neighborhood'' and described as ''Traditional neighborhood
        (Stone houses)''. The bldgs slot takes archetypes/surfaces/bldgs/sweden--brick-house-traditional-neighbourhood,
        named ''Brick House, Traditional Neighbourhood'', whose construction is records/constructions/gothenburg--bjork2002--traditional-neighbourhood-early-1900s,
        named ''Traditional Neighbourhood, early 1900s''. The description therefore says stone while the
        component it selects says brick, and this database keeps the two apart: archetypes/surfaces/bldgs/sweden--stone-houses-traditional-neighbourhood
        exists separately, is named ''Stone Houses, Traditional Neighbourhood'', rests on records/constructions/gothenburg--bjork2002--traditional-stone-neighbourhood-city-late-1800s-early-1900s,
        and is the bldgs component of archetypes/typologies/sweden--traditional-stone-house-neighbourhood.
        Either the description names a wall material this composite does not assemble, or the wrong building
        archetype fills the slot. Nothing in the repository decides which, and the two fixes are not equivalent,
        so a maintainer must settle it.'
    target:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-sweden-brick-house-traditional-neighbourhood
      - component-surfaces-paved-sweden-asphalt-mixed-city
      note: 'The composite''s own target is ''typology'', which is what every entry under archetypes/typologies
        declares, and each slot takes a component declared for it: the bldgs slot takes an archetype declaring
        target land_cover.bldgs and the paved slot an archetype declaring target land_cover.paved. Neither
        component declares attaches_to; in this database that field is carried only by the profile records
        under db/records/profiles, so slot fit here is judged on the components'' declared target.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters block of its own, so it asserts no value beyond the two
        components it selects.
    source:
      conclusion: not_applicable
      note: The composite claims no composition source, and the repository records no published rationale
        for this pairing. The components' own sources belong to their assessments, not to this review.
    place:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-sweden-brick-house-traditional-neighbourhood
      - component-surfaces-paved-sweden-asphalt-mixed-city
      note: 'The composite claims place ''sweden'' and both components declare place ''sweden'', so the
        typology is assembled entirely from Swedish rows. The claim survives a level down as well: the
        bldgs component''s construction, records/constructions/gothenburg--bjork2002--traditional-neighbourhood-early-1900s,
        declares place ''gothenburg'', which db/places.yml resolves to country ''sweden''.'
    representativeness:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-sweden-brick-house-traditional-neighbourhood
      - component-surfaces-paved-sweden-asphalt-mixed-city
      note: The composite declares representativeness 'regional' and both components declare 'regional',
        so nothing here stretches a narrower class to cover a country-scale typology. Four of the seven
        Swedish typologies are assembled this way; the other three (archetypes/typologies/sweden--industrial,
        archetypes/typologies/sweden--sub-urban and archetypes/typologies/sweden--traditional-stone-house-neighbourhood)
        reach into Helsinki city surfaces for their paved slot.
    method:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-sweden-brick-house-traditional-neighbourhood
      - component-surfaces-paved-sweden-asphalt-mixed-city
      note: An assembly of two existing surface archetypes into the two slots the typology format defines;
        the composite produces no value of its own. A typology carries no season and no wet/dry mapping
        of its own, because those live inside the surface components' ohm blocks, so there is no seasonal
        mapping to check at this level.
    identity:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-sweden-brick-house-traditional-neighbourhood
      - component-surfaces-paved-sweden-asphalt-mixed-city
      note: 'The assembly is complete: scripts/migrate_to_records.py maps only the legacy Types table''s
        ''Buildings'' and ''Paved'' columns into a typology''s uses block, and both slots are filled.
        The bldgs component is used by no other typology. The paved component is the Swedish set''s common
        surface, shared with archetypes/typologies/sweden--mixed-city-ideal, archetypes/typologies/sweden--modernism
        and archetypes/typologies/sweden--residential-functionalism, which is reuse rather than duplication.
        The nearest composite is archetypes/typologies/sweden--traditional-stone-house-neighbourhood,
        which shares this one''s place ''sweden'', representativeness ''regional'', profile_type ''Residential''
        and period ''Pre80'' and also describes a traditional neighbourhood, but selects different components
        in both slots and carries a distinct legacy_id (12251392 against 12240002 here). The two are separate
        entries whose descriptions overlap more than their contents do, which is the subject of the name
        finding rather than a duplication.'
      related_records:
