  scientific_note: 'This typology is assembled the way a national typology should be. Both components
    are Swedish, both are classed regional, which is the class the composite itself claims, the building
    slot takes an archetype declaring land_cover.bldgs and the paved slot one declaring land_cover.paved,
    and both of the two slots a typology has are filled. The label names the components it selects. Nothing
    is imported from another country and nothing narrower stands in for the national claim, which distinguishes
    this entry from the typologies built on a single city. The one thing worth a reader knowing is how
    little separates it from the other Swedish residential typologies: they share the same paved archetype,
    and the building archetype here differs from the one in archetypes/typologies/sweden--residential-functionalism
    only in its construction record. That is the axis these entries are meant to differ on, so it is a
    thin distinction rather than a defect. The url field carries a photograph that db/images.yml has already
    set aside as unlicensable, which is an image question and not a composition one. The components''
    own compositions and values remain subject to their own assessments; this review does not revisit
    them.'
