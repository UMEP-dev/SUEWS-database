  findings:
    name:
      conclusion: supported
      evidence_ids: &id001
      - component-surfaces-bldgs-sweden-mixed-city
      - component-surfaces-paved-sweden-asphalt-mixed-city
      note: 'The composite is named ''Mixed-City Ideal'' and described ''Eco-Sustainable Residential Areas.
        Modern high density residential neighbourhood'', with period ''New'' and profile_type ''Residential''.
        The building component is named ''Mixed-City'' and the paved component ''Asphalt, mixed city'',
        so the label names exactly the two archetypes selected. The label announces an ideal type rather
        than an observed neighbourhood, and the components are ordinary Swedish archetypes classed regional,
        which is consistent: what marks the entry as modern is which building archetype it selects, not
        a claim made in the composite.'
    target:
      conclusion: supported
      evidence_ids: *id001
      note: 'The composite''s own target is typology, and each slot takes a component declared for it:
        the bldgs slot takes an archetype declaring target land_cover.bldgs and the paved slot an archetype
        declaring target land_cover.paved. No archetype in this database declares attaches_to, which is
        carried only by the 477 records under records/profiles, so slot fit here is judged on the components''
        declared target.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters block of its own, so it asserts no value beyond the two
        archetypes it selects.
    source:
      conclusion: not_applicable
      note: 'The composite claims no composition source, and the repository records no published rationale
        for pairing these two archetypes. Its url field is a photograph locator rather than a rationale:
        db/images.yml carries this entry under unresolved, because the attribution and licence of the
        linked item could not be established and the item is an architectural visualisation of a planned
        development. That bears on whether a photograph may be published, not on why these components
        were selected. The components'' own selections belong to their composition assessments, not to
        this review.'
    place:
      conclusion: supported
      evidence_ids: *id001
      note: The composite claims place sweden, and both components declare place sweden. The assembly
        stays inside the country it claims and imports nothing.
    representativeness:
      conclusion: supported
      evidence_ids: *id001
      note: The composite declares representativeness regional and both components declare regional, so
        no component is stretched past its stated reach and no city row stands in for a national default.
    method:
      conclusion: supported
      evidence_ids: *id001
      note: An assembly of two existing archetypes into two slots; the composite produces no value of
        its own. A typology carries no seasonal or wet/dry axis, because the four OHM positions live inside
        the surface archetypes, so the only mapping made here is one archetype per slot and each slot
        receives exactly one.
    identity:
      conclusion: supported
      evidence_ids: *id001
      note: 'A typology has two component slots and no others: the migration maps the legacy Types table''s
        Buildings and Paved columns into bldgs and paved and nothing else (scripts/migrate_to_records.py),
        and all fourteen entries under archetypes/typologies fill exactly those two. This composite fills
        both, so the assembly is complete. Its pair of components is unique, though the paved side is
        shared widely: archetypes/surfaces/paved/sweden--asphalt-mixed-city is also selected by archetypes/typologies/sweden--modernism,
        archetypes/typologies/sweden--residential-functionalism and archetypes/typologies/sweden--traditional-neighborhood,
        so the building archetype is what separates these four entries. That separation is thin between
        this entry and archetypes/typologies/sweden--residential-functionalism: archetypes/surfaces/bldgs/sweden--mixed-city
        and archetypes/surfaces/bldgs/sweden--nordic-functionalism-wood select the same record in every
        slot but construction, where this one takes records/constructions/stockholm--bjork2002--mixed-city-2000s
        rather than records/constructions/sweden--bjork2002--nordic-functionalism-mid-1900s. Construction
        is the axis a period typology is built on, so one differing construction record is the intended
        distinction rather than a duplication.'
      related_records:
      - archetypes/typologies/sweden--residential-functionalism
      - archetypes/typologies/sweden--modernism
      - archetypes/typologies/sweden--traditional-neighborhood
