      and representativeness regional.
  - id: component-surfaces-paved-sweden-asphalt-mixed-city
    record: archetypes/surfaces/paved/sweden--asphalt-mixed-city
    role: component
    note: Fills paved. The archetype is named 'Asphalt, mixed city', declares target land_cover.paved,
