    place:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-bldgs-sweden-detached-houses-wood
      - component-surfaces-paved-helsinki-kumpula
      note: 'The composite claims place ''sweden''. The bldgs component declares place ''sweden''. The
        paved component declares place ''helsinki'', which db/places.yml resolves to country ''finland'',
        so half of a Swedish typology is a Finnish city surface. The substitution was not forced by an
        empty record set: archetypes/surfaces/paved/sweden--asphalt-mixed-city declares place ''sweden''
        and representativeness ''regional'', and four other Swedish typologies (archetypes/typologies/sweden--mixed-city-ideal,
        archetypes/typologies/sweden--modernism, archetypes/typologies/sweden--residential-functionalism
        and archetypes/typologies/sweden--traditional-neighborhood) take it in this slot. Against that,
        archetypes/surfaces/paved/helsinki--kumpula is also the paved component of archetypes/typologies/finland--sub-urban,
        whose description reads ''Helsinki (sub-urban, mixed)'', so it may have been chosen as the database''s
        sub-urban paved surface rather than by oversight. The composite records neither consideration,
        and only a maintainer can decide whether country or sub-urban character governs this slot.'
    representativeness:
