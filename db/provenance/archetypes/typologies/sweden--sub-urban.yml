  scientific_note: 'The building side of this typology is Swedish and matches its own label. archetypes/surfaces/bldgs/sweden--detached-houses-wood
    declares place ''sweden'' and representativeness ''regional'', is named ''Detached houses, Wood'',
    and is used by no other typology, so the description ''Wooden detached houses'' is carried by the
    component that decides it. The paved side is neither Swedish nor regional: archetypes/surfaces/paved/helsinki--kumpula
    declares place ''helsinki'' and representativeness ''city'', so a Swedish country-scale typology takes
    half its surface description from one Finnish city. That choice was available to be made differently,
    because archetypes/surfaces/paved/sweden--asphalt-mixed-city is Swedish and regional and four other
    Swedish typologies use it; it may nonetheless be the right choice, because the same Kumpula surface
    fills the paved slot of the Finnish sub-urban typology and is the closest thing the database has to
    a sub-urban paved surface. The composite records neither reason. Both questions live in the composite
    and can be settled without touching a component value: a maintainer should either state on the composite
    that sub-urban character outranks country for this slot, or swap it to the Swedish surface the sibling
    typologies already use. The components'' own selections and values remain subject to their own assessments;
    this review does not revisit them.'
