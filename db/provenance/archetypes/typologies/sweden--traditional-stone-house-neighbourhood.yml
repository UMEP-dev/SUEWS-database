  scientific_note: 'The composite says what it assembles and assembles what it says on the building side.
    Its bldgs component is Swedish, regional, named ''Stone Houses, Traditional Neighbourhood'' and built
    on a Gothenburg construction named ''Traditional Stone Neighbourhood City, late 1800s-early 1900s'',
    which matches the entry''s own ''early 1900s'' and its city-centre framing. The paved component is
    Finnish. archetypes/surfaces/paved/helsinki--city-centre declares place ''helsinki'' and representativeness
    ''city'', so a Swedish country-scale typology takes half its surface description from one Finnish
    city. Unlike the building slot, this one had a Swedish option: archetypes/surfaces/paved/sweden--asphalt-mixed-city
    is Swedish and regional and four sibling Swedish typologies use it. The reason it was probably not
    used is visible in the two names, because the Swedish surface describes a mixed city and this typology
    describes a city centre, and the Helsinki surface is the database''s city-centre paved bundle. That
    is a defensible trade of country for urban form, but it is nowhere stated, and it leaves an entry
    claiming regional reach while half of it is a city row. A maintainer should either record on the composite
    that urban form governs this slot and accept the cross-border substitution, or narrow what the entry
    claims. Neither question requires touching a component''s values, which remain subject to their own
    assessments.'
