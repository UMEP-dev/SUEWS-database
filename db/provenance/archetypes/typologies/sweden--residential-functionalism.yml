    identity:
      conclusion: supported
      evidence_ids: *id001
      note: 'A typology has two component slots and no others: the migration maps the legacy Types table''s
        Buildings and Paved columns into bldgs and paved and nothing else (scripts/migrate_to_records.py),
        and all fourteen entries under archetypes/typologies fill exactly those two. This composite fills
        both, so the assembly is complete. Its pair of components is unique: archetypes/surfaces/bldgs/sweden--nordic-functionalism-wood
        is selected by no other typology, while archetypes/surfaces/paved/sweden--asphalt-mixed-city is
        shared with archetypes/typologies/sweden--mixed-city-ideal, archetypes/typologies/sweden--modernism
        and archetypes/typologies/sweden--traditional-neighborhood. The separation from archetypes/typologies/sweden--mixed-city-ideal
        is thin: archetypes/surfaces/bldgs/sweden--nordic-functionalism-wood and archetypes/surfaces/bldgs/sweden--mixed-city
        select the same record in every slot but construction, where this one takes records/constructions/sweden--bjork2002--nordic-functionalism-mid-1900s
        rather than records/constructions/stockholm--bjork2002--mixed-city-2000s. Construction is the
        axis a period typology is built on, so one differing construction record is the intended distinction
        rather than a duplication.'
