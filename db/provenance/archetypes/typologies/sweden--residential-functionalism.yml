  scientific_note: 'The residential functionalism typology selects a Swedish wooden building archetype
    and a Swedish asphalt paved archetype, both classed regional, which is the class the composite itself
    claims, and both declaring the target their slot needs. Both of the two slots a typology has are filled,
    nothing is imported from another country, and nothing narrower stands in for the national claim, which
    is what separates this entry from the typologies assembled out of a single city. Its identity rests
    on a narrow margin: it shares its paved archetype with three other Swedish typologies, and its building
    archetype differs from the one in archetypes/typologies/sweden--mixed-city-ideal in the construction
    slot alone, a mid-1900s functionalist assembly against a 2000s mixed-city one. That is the axis these
    entries exist to differ on, so the margin is thin by design rather than by accident, and a reader
    should know how much of the distinction rests on one record. The url and image_source fields carry
    a credited and licensed photograph and no composition rationale. The components'' own compositions
    and values remain subject to their own assessments; this review does not revisit them.'
