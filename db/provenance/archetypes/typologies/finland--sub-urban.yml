  findings:
    name:
      conclusion: supported
      evidence_ids: &id001
      - component-surfaces-bldgs-helsinki-kumpula
      - component-surfaces-paved-helsinki-kumpula
      note: 'The composite is named Sub-urban and described ''Helsinki (sub-urban, mixed)'', and both
        components are the archetypes named Kumpula carrying place helsinki, so the label identifies what
        is assembled. One envelope field does not fit that reading: profile_type reads ''Industrial''
        on an entry named ''Sub-urban'' and described as mixed suburban. profile_type is descriptive metadata
        migrated verbatim from the legacy Types table, it selects no component and sits outside the uses
        block, so it changes nothing this review covers, but it contradicts both the name and the description
        and is worth settling when the typology metadata is next revisited.'
    target:
      conclusion: supported
      evidence_ids: *id001
      note: 'The composite''s own target is typology, and each slot takes a component declared for it:
        the bldgs slot takes an archetype declaring target land_cover.bldgs and the paved slot an archetype
        declaring target land_cover.paved. No archetype in this database declares attaches_to, which is
        carried only by the 477 records under records/profiles, so slot fit here is judged on the components''
        declared target.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters block of its own, so it asserts no value beyond the two
        archetypes it selects.
    source:
      conclusion: not_applicable
      note: The composite claims no composition source, and the repository records no published rationale
        for pairing these two archetypes. The components' own selections belong to their composition assessments,
        not to this review.
    place:
      conclusion: supported
      evidence_ids: *id001
      note: The composite claims place finland, and both components declare place helsinki, which db/places.yml
        resolves to country finland. Nothing is imported from outside the country the composite claims,
        and Kumpula is the Helsinki neighbourhood the description names.
    representativeness:
      conclusion: curation_required
      evidence_ids: *id001
      note: The composite declares representativeness regional while both components declare city, so
        one neighbourhood of one city stands for a national suburban typology. The database holds no Finnish
        building or paved archetype classed regional, so the substitution was not avoidable, but the national
        reach is the composite's own claim and nothing records the decision to make it. The same city-under-regional
        pattern holds for every typology whose components come from a named city, so a maintainer should
        settle it once across the typology set rather than entry by entry.
    method:
      conclusion: supported
      evidence_ids: *id001
      note: An assembly of two existing archetypes into two slots; the composite produces no value of
        its own. A typology carries no seasonal or wet/dry axis, because the four OHM positions live inside
        the surface archetypes, so the only mapping made here is one archetype per slot and each slot
        receives exactly one.
    identity:
      conclusion: supported
      evidence_ids: *id001
      note: 'A typology has two component slots and no others: the migration maps the legacy Types table''s
        Buildings and Paved columns into bldgs and paved and nothing else (scripts/migrate_to_records.py),
        and all fourteen entries under archetypes/typologies fill exactly those two. This composite fills
        both, so the assembly is complete. Its pair of components is unique: archetypes/surfaces/bldgs/helsinki--kumpula
        is selected by no other typology, and archetypes/surfaces/paved/helsinki--kumpula, though it is
        also taken by archetypes/typologies/sweden--industrial and archetypes/typologies/sweden--sub-urban,
        is paired with a different building archetype in both. The name Sub-urban is shared with archetypes/typologies/sweden--sub-urban
        and archetypes/typologies/uk--sub-urban, so the path, the place and the components separate the
        three.'
      related_records:
      - archetypes/typologies/sweden--industrial
      - archetypes/typologies/sweden--sub-urban
      - archetypes/typologies/uk--sub-urban
  evidence:
  - id: component-surfaces-bldgs-helsinki-kumpula
    record: archetypes/surfaces/bldgs/helsinki--kumpula
    role: component
    note: Fills bldgs. The archetype is named Kumpula, declares target land_cover.bldgs, place helsinki
      and representativeness city.
  - id: component-surfaces-paved-helsinki-kumpula
    record: archetypes/surfaces/paved/helsinki--kumpula
    role: component
    note: Fills paved. The archetype is named Kumpula, declares target land_cover.paved, place helsinki
      and representativeness city.
  scientific_note: Finland's sub-urban typology takes the building and paved archetypes of a single Helsinki
    neighbourhood, Kumpula, which is exactly what its description names, and pairs them without reaching
    outside Finland or outside the targets the two slots need. Both of the two slots a typology has are
    filled and the pair appears in no other entry. Two things sit above the components. The composite
    declares representativeness regional against city components, so one neighbourhood stands for a national
    suburban typology; nothing better was available, since the database holds no Finnish building or paved
    archetype classed regional, so this is an unrecorded decision rather than a wrong selection, and it
    is the same decision every city-based typology embeds. And the legacy profile_type field reads 'Industrial'
    on an entry named 'Sub-urban' and described as mixed suburban; it selects nothing, but the contradiction
    is in the stored data and a maintainer should decide which of the two readings the entry means. The
    components' own compositions and values remain subject to their own assessments; this review does
    not revisit them.
