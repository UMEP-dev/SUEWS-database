  scientific_note: 'This is the tidiest typology of the seven reviewed. The bldgs and paved slots take
    the matched Swindon pair from one curated bundle, both named ''Suburban residential, Ward et al. (2016)'',
    both declaring place ''swindon'' inside the country the composite claims, and neither is used anywhere
    else, so name, description, profile type and components all say the same thing and nothing borrows
    across a border or across an urban form. The one claim the assembly does not support is reach: the
    composite declares representativeness ''regional'' while both components declare ''city'', so the
    UK''s sub-urban type rests entirely on one town''s measurements. That may well be intended, since
    a national typology has to come from somewhere and Swindon is what the database has, but the composite
    records no such decision, and a country-scale claim resting on a single city is exactly what the representativeness
    field exists to make visible. A maintainer should either narrow the class or state on the composite
    that Swindon stands deliberately for UK suburbs. No component value is at issue; those remain subject
    to their own assessments.'
