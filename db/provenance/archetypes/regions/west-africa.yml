      note: 'The composite''s own target, site, is right for a region default, and the structural slots
        each take an entry declared for them: anthropogenic_emissions, irrigation and conductance take
        records whose declared target is the slot name, soil takes records/surfaces/common/se-england--ward2016--soil
        declaring target land_cover.common, and snow takes archetypes/snow/helsinki--snow declaring target
        snow. profiles.snow_clearing is sound as well: it takes records/profiles/snow-removal/helsinki--jarvi2014--snow-removed-daytime,
        which declares attaches_to snow.snow_profile_24hr, the field schema/table_mapping.yml gives for
        that slot, and it carries both a working_day and a holiday series. The water-use mapping is where
        it breaks. table_mapping.yml maps the legacy columns WaterUseProfManuWD and WaterUseProfManuWE
        to irrigation.wuprofm_24hr and WaterUseProfAutoWD and WaterUseProfAutoWE to irrigation.wuprofa_24hr,
        so the water_use_manual slot fills irrigation.wuprofm_24hr and the water_use_automatic slot fills
        irrigation.wuprofa_24hr. The composite crosses them: profiles.water_use_manual.holiday takes records/profiles/water-use-automatic/los-angeles--lindberg2013--old-code-12,
        which declares attaches_to irrigation.wuprofa_24hr, and profiles.water_use_automatic.working_day
        takes records/profiles/water-use-manual/los-angeles--loridan2011--old-code-11, which declares
        attaches_to irrigation.wuprofm_24hr. Swapping the two will not repair it, because loridan2011
        carries only a working_day series and lindberg2013 only a holiday series, so the four water-use
        cells are stitched from two half-records and no rearrangement of these two entries fills all four
        with a series derived for the field it lands in.'
