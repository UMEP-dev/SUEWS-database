  scientific_note: 'Sixteen West African countries inherit, through this composite, a London and Swindon
    configuration with SE England soil, Vancouver irrigation and Los Angeles water use, together with
    a Helsinki snow archetype and a Helsinki daytime snow-clearing profile. No component carries a place
    the database assigns to west Africa, and the file is identical to eleven other region defaults once
    archetype, name, region and legacy_id are set aside, so it makes no regional statement. The snow selection
    is worth a curator''s attention on its own terms: places.yml gives helsinki Koppen class Dfb, and
    the database already holds archetypes/snow/suews--no-snow, classed generic, so a snow-free default
    was available and was not taken. The mapping carries the same crossed water-use slots as every region
    default, unrepairable by swapping the two records because each supplies only one day-type. Thirteen
    single-city components stand for the region and the composite''s own two base temperatures have no
    recorded origin. Everything here is a question of selection and mapping, not of the components'' values.'
