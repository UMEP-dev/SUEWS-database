      note: No component carries a place that the country archetypes assign to archetypes/regions/west-africa,
        the composite that sixteen countries from Senegal and Mali to Nigeria and Ghana defer to. The
        anthropogenic_emissions record and the paved, bldgs, bsoil, grass, evetr and dectr archetypes
        all carry place london, the water archetype carries place swindon and the soil record place se-england;
        places.yml gives all three country united-kingdom, which region_ref assigns to archetypes/regions/northern-europe.
        The snow archetype and the snow-clearing profile carry place helsinki, country finland, likewise
        northern-europe, and places.yml gives helsinki Koppen class Dfb. records/irrigation/vancouver--unreferenced
        carries place vancouver, which places.yml gives country canada and the country archetypes assign
        to archetypes/regions/north-america, and both water-use profiles carry place los-angeles, country
        united-states-of-america, likewise north-america. records/conductance/generic--ward2016 carries
        place generic, a row that names no country at all. The default that sixteen West African countries
        inherit is therefore assembled entirely from Northern European and North American rows, including
        a snow parameterisation and a daytime snow-clearing profile. The snow slot takes archetypes/snow/helsinki--snow,
        place helsinki; the database also holds archetypes/snow/se-england--not-used, classed regional,
        and archetypes/snow/suews--no-snow, classed generic, so a Helsinki snow parameterisation is one
        choice of three rather than the only one available. A maintainer must decide whether this is an
        accepted fallback or a gap to be filled.
