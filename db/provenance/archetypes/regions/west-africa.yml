      note: 'The assembly is complete for the layer this composite occupies: anthropogenic_emissions,
        irrigation, soil, snow and conductance, all seven land_cover slots, the snow-clearing profile
        and the four water-use cells. The four remaining profile slots, traffic, energy_use, human_activity
        and population, belong to the country layer, which reaches this composite through region_ref rather
        than through uses; archetypes/countries/france, for example, carries region_ref archetypes/regions/western-europe
        and a uses block holding exactly those four. Because region_ref is not a uses reference, the country
        entries are not documented as components here. Setting aside the archetype, name, region and legacy_id
        fields, this file is identical to eleven other region defaults: central-africa, central-america,
        central-south-america, eastern-africa, middle-east, north-america, northern-africa, northern-south-america,
        southern-africa, southern-south-america, west-africa and western-south-america are one file repeated
        twelve times under twelve names. Twelve of the 22 regions therefore hand their countries an identical
        configuration spanning Africa, the Americas and the Middle East, which is the largest undifferentiated
        block in the region layer and the single fact a maintainer should weigh before treating any of
        these twelve as a regional statement.'
