  scientific_note: 'Southern Europe is one of only four region defaults with a component set of its own,
    and the choice it makes is visible: paved, bldgs, grass, evetr and dectr are all Zurich archetypes,
    three of them from the Stagakis et al. 2024 family, with London bare soil, Swindon water, SE England
    soil and Helsinki snow behind them. The difficulty is that the database assigns Switzerland to western-europe
    through the country archetypes'' region_ref, so the seventeen countries deferring to this file, from
    Portugal and Spain to Greece and Turkey, inherit a Central European city as their regional exemplar
    with nothing in the entry acknowledging the substitution. The mapping repeats the crossed water-use
    slots found in every region default, and because loridan2011 holds only a working_day series and lindberg2013
    only a holiday series the four cells cannot be fixed by swapping the two. With thirteen single-city
    components standing for a region and two unsourced base temperatures declared on the composite itself,
    the file needs a curator to confirm or replace the Zurich selection rather than any change to the
    components'' values.'
