      note: 'No component carries a place that the country archetypes assign to archetypes/regions/south-central-asia,
        the composite that Bangladesh, Bhutan, India, Iran, Maldives, Nepal, Pakistan and Sri Lanka defer
        to. Five of the seven land_cover slots take Beijing archetypes: paved, bldgs, grass, evetr and
