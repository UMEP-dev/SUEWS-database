  scientific_note: 'The South-Central Asia default is the Asian block file: it is identical, once archetype,
    name, region and legacy_id are set aside, to central-asia, eastern-asia and southeast-asia, so Bangladesh,
    Bhutan, India, Iran, Maldives, Nepal, Pakistan and Sri Lanka inherit exactly what China and Mongolia
    inherit. That shows in the components: paved, bldgs, grass, evetr and dectr are all Beijing archetypes,
    which the database assigns to eastern-asia, and the remainder are London, Swindon, SE England, Helsinki,
    Vancouver and Los Angeles rows. Beijing surfaces are a more plausible stand-in for this region than
    London ones would be, but the entry says nothing about that and this review may not infer a rationale
    from resemblance. The water-use slots are crossed as in every region default, and cannot be repaired
    by exchanging the two records because each carries only half the day-types. Add thirteen single-city
    rows carrying a regional default and two unsourced base temperatures, and what the file needs is a
    curator''s decision on the region layer rather than any change to the components'' values.'
