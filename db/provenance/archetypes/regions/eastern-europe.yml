  scientific_note: 'The Eastern Europe default is the only entry in this batch with a composition of its
    own. Four land-cover slots, bldgs, grass, evetr and dectr, take Zurich archetypes, three of them from
    Stagakis et al. 2024, and no other region default shares its uses, parameters and legacy blocks. That
    distinctiveness is not the same as regional fit. Zurich chains through switzerland to archetypes/regions/western-europe,
    so the four rows that give the entry its character come from a neighbouring region; paved, bsoil,
    the anthropogenic set and the soil come from London and SE England, water from Swindon, the snow set
    and its clearing profile from Helsinki, irrigation from Vancouver and both water-use profiles from
    Los Angeles, none of which chains to Eastern Europe either. Only two entries in the database chain
    to the region at all, records/surfaces/bldgs/lodz--offerle2005--thermal-layers and records/surfaces/bsoil/lodz--offerle2005--thermal-layers,
    and each carries a thermal_layers block alone rather than the complete surface description a land_cover
    slot receives, so using them would mean building archetypes around them first. Thirteen of the fifteen
    components declare representativeness city. Two defects need no judgement about the region: the profiles.water_use_manual
    slot takes its holiday half from a record declared attaches_to irrigation.wuprofa_24hr and the profiles.water_use_automatic
    slot takes its working_day half from a record declared attaches_to irrigation.wuprofm_24hr, and no
    record in the database can close either gap. The composite also asserts baset_heating and baset_cooling
    of 7 with no source, identical in all twenty-two region defaults. Beyond this entry, all twenty-two
    take archetypes/snow/helsinki--snow while archetypes/snow/suews--no-snow exists with target snow and
    is referenced by none of them, though it carries no melt parameters and its legacy block holds -999
    throughout. The components'' own values remain subject to their evidence assessments; this review
    does not revisit them.'
