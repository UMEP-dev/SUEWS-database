      - component-records-profiles-snow-removal-helsinki--jarvi2014--snow-removed-daytime
      note: 'The composite''s own target, site, is correct for a default that a country archetype inherits
        through region_ref, and fifteen of the seventeen slot positions take a component declared for
        them. That includes the two least obvious: the soil slot takes records/surfaces/common/se-england--ward2016--soil,
        whose target land_cover.common is the surface-agnostic target docs/FORMAT.md names for soils,
        and the profiles.snow_clearing slot takes records/profiles/snow-removal/helsinki--jarvi2014--snow-removed-daytime,
        which declares attaches_to snow.snow_profile_24hr. The remaining two do not. The profiles.water_use_manual
        slot fills irrigation.wuprofm_24hr, but its holiday position takes records/profiles/water-use-automatic/los-angeles--lindberg2013--old-code-12,
        which declares attaches_to irrigation.wuprofa_24hr; the profiles.water_use_automatic slot fills
        irrigation.wuprofa_24hr, but its working_day position takes records/profiles/water-use-manual/los-angeles--loridan2011--old-code-11,
        which declares attaches_to irrigation.wuprofm_24hr. Each of the two irrigation profiles is therefore
        half composed of the other kind. No correctly declared record can close either gap: every record
        under records/profiles/water-use-manual carries a working_day block only, and the single record
        under records/profiles/water-use-automatic carries a holiday block only, which is why the same
        crossing appears in all twenty-two region defaults and should be settled once rather than region
        by region.'
    values:
      conclusion: curation_required
      note: 'The composite declares parameters of its own: anthropogenic_emissions.heat.baset_heating
        and anthropogenic_emissions.heat.baset_cooling, each 7 for working_day and for holiday. schema/table_mapping.yml
        maps those from the legacy Region table''s TCritic_Heating_WD and WE and TCritic_Cooling_WD and
        WE columns, so they are migrated rather than invented, but three things about them are unsettled.
        They carry no source of their own. They are identical in all twenty-two region defaults, so a
        value living in a region default conveys nothing region-specific. And docs/FORMAT.md requires
        a value a composite introduces to be represented and evidence-reviewed as a record first, which
        these are not, even though the same document allows a migrated composite row to carry its own
        scalars under the same rules as a record. The file''s legacy block also retains BaseT_HC: 18.2,
        which schema/table_mapping.yml flags needs-review because BaseT_HC and TCritic_* serve different
        QF formulations. A maintainer has to decide whether the region layer should assert a heating and
        a cooling base temperature at all, and on what basis.'
    source:
      conclusion: not_applicable
      note: The composite declares no source field and the repository records no published rationale for
        this regional default. schema/regional_axis.yml describes the region axis as a way of viewing
        the database and leaves open whether the grouping is climatic, cultural or merely geographic;
        that is a design note about the axis, not a rationale for this selection, and nothing in the repository
        explains why these particular rows were chosen. The components' own sources belong to their evidence
        assessments, not to this review.
