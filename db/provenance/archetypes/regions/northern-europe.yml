  scientific_note: This is the best-founded of the region defaults examined. Under places.yml and the
    region_ref field of the country archetypes, every land_cover archetype, the soil record, the snow
    archetype, the snow-clearing profile and the anthropogenic_emissions record come from Finland or the
    United Kingdom, both of which the database assigns to Northern Europe, and the file is one of only
    four region defaults with a component set of its own. The selection is defensible; two things about
    the mapping and the framing are not. The water-use slots are crossed, so irrigation.wuprofm_24hr receives
    a record declaring attaches_to irrigation.wuprofa_24hr and irrigation.wuprofa_24hr receives one declaring
    attaches_to irrigation.wuprofm_24hr, and because loridan2011 holds only a working_day series and lindberg2013
    only a holiday series the four cells cannot be repaired by exchanging the two entries; that defect
    is identical in all 22 region defaults and should be settled once. Beyond it, thirteen of the fifteen
    components are single-city rows carrying a regional default with nothing in the entry to say they
    are being generalised, the irrigation and water-use rows come from North America, and the two base-temperature
    values the composite declares itself have no recorded origin. None of those is a value error, and
    this review does not touch the components' own numbers, but each needs a curator's decision rather
    than an agent's.
