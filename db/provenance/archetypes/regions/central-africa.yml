  scientific_note: 'The Central Africa default is assembled from a single well-studied city and its neighbours.
    Six of the seven land-cover surfaces come from London, the seventh from Swindon, the soil from SE
    England and the anthropogenic set from London again, which puts nine of the fifteen components in
    one country, united-kingdom; the snow set and its clearing profile come from Helsinki, the irrigation
    set from Vancouver and both water-use profiles from Los Angeles. Following each component''s place
    through its country''s region_ref, not one chains to Central Africa, and the database holds no land-cover,
    anthropogenic, irrigation, conductance, snow or soil entry that does; the only Central Africa-chaining
    entries are nine traffic and nine human-activity profiles the country layer uses. The entry is a fallback,
    not a regional characterisation, and thirteen of its fifteen components declare representativeness
    city, so each travels further here than its own declaration allows. Two defects need no judgement
    about the region. The profiles.water_use_manual slot takes its holiday half from a record declared
    attaches_to irrigation.wuprofa_24hr and the profiles.water_use_automatic slot takes its working_day
    half from a record declared attaches_to irrigation.wuprofm_24hr, and no record in the database can
    close either gap. The composite also asserts baset_heating and baset_cooling of 7 with no source,
    identical in all twenty-two region defaults. And the entry is one of twelve region defaults whose
    uses, parameters and legacy blocks are identical, a duplication make check cannot see because scripts/check_db.py
    compares value sets only under records/. One selection deserves a maintainer''s eye beyond this entry:
    all twenty-two region defaults take archetypes/snow/helsinki--snow, whose place helsinki carries koppen
    Dfb, while archetypes/snow/suews--no-snow exists with target snow and is referenced by none of them,
    though it carries no melt parameters at all and its legacy block holds -999 throughout. The components''
    own values remain subject to their evidence assessments; this review does not revisit them.'
