  scientific_note: 'Eastern Asia is the one composite in this batch whose land-cover core is drawn from
    its own region. The paved, bldgs, grass, evetr and dectr slots all take Beijing archetypes, and beijing
    chains through china to archetypes/regions/eastern-asia, so five of the fifteen components are regionally
    apt in a way that no other entry reviewed here can claim. The selection stops short of where it could
    have gone. The soil slot takes records/surfaces/common/se-england--ward2016--soil although records/surfaces/common/beijing--zheng-y2023--soil
    carries the same target land_cover.common, and the irrigation slot takes records/irrigation/vancouver--unreferenced
    although records/irrigation/beijing--zheng-y2023 carries the same target irrigation; bsoil comes from
    London, water from Swindon, the anthropogenic set from London and the snow set, its clearing profile
    and both water-use profiles from Helsinki and Los Angeles. A maintainer should decide whether the
    two available Beijing rows belong in those slots. Thirteen of the fifteen components declare representativeness
    city, so even the in-region ones travel further here than their own declaration allows. Two defects
    need no judgement about the region: the profiles.water_use_manual slot takes its holiday half from
    a record declared attaches_to irrigation.wuprofa_24hr and the profiles.water_use_automatic slot takes
    its working_day half from a record declared attaches_to irrigation.wuprofm_24hr, and no record in
    the database can close either gap. The composite also asserts baset_heating and baset_cooling of 7
    with no source, identical in all twenty-two region defaults, and its uses, parameters and legacy blocks
    are identical to those of Central Asia, South Central Asia and Southeast Asia, so the Beijing selection
    that is local here is a cross-region reach in the other three. Beyond this entry, all twenty-two take
    archetypes/snow/helsinki--snow while archetypes/snow/suews--no-snow exists with target snow and is
    referenced by none of them, though it carries no melt parameters and its legacy block holds -999 throughout.
    The components'' own values remain subject to their evidence assessments; this review does not revisit
    them.'
