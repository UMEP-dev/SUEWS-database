      note: 'One component sits inside the region the composite claims: archetypes/surfaces/paved/zurich--city-centre
        carries place zurich, which places.yml gives country switzerland and the country archetypes assign
        to archetypes/regions/western-europe through region_ref. The rest do not. land_cover.bldgs takes
