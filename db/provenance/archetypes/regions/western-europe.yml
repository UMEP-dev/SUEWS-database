      note: 'The composite declares no representativeness of its own and stands as the default for the
        11 countries whose country archetypes carry region_ref archetypes/regions/western-europe, so it
        operates at regional scale. Of its 15 distinct components, 13 are classed city, records/surfaces/common/se-england--ward2016--soil
        is classed regional and records/conductance/generic--ward2016 is classed generic. Every land_cover
        slot and the snow slot is therefore filled by a single-city archetype presented, with nothing
        in the entry saying so, as the value a whole region inherits. The choice is not forced: the database
        holds surface archetypes classed regional for land_cover.bldgs (seven of them), land_cover.paved
        (one) and land_cover.evetr (one), and a regional snow archetype in archetypes/snow/se-england--not-used,
        although for land_cover.bsoil, land_cover.dectr, land_cover.grass and land_cover.water every archetype
        in the database is classed city. A maintainer must decide whether city rows may carry a regional
        default or whether the generalisation should be recorded.'
