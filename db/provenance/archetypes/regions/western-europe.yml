      note: 'The composite declares one set of overrides of its own: anthropogenic_emissions.heat.baset_heating
        and anthropogenic_emissions.heat.baset_cooling, each 7 for both working_day and holiday. The entry
        names no source for them, and the same four numbers appear in all 22 region defaults. They do
        not displace a component value: schema/table_mapping.yml maps the legacy columns TCritic_Heating_WD,
        TCritic_Heating_WE, TCritic_Cooling_WD and TCritic_Cooling_WE onto exactly these four fields,
        and records/anthropogenic/london--ward2016, the record mapped into the anthropogenic_emissions
        slot, carries all four at -999, so the override fills fields the component leaves unset. The entry''s
        own legacy block records BaseT_HC 18.2, which the same mapping deliberately retains under legacy
        as a separate Jarvi-method degree-day base rather than as the origin of these values. Where the
        7 came from cannot be settled inside the repository, which holds no legacy region table, so a
        maintainer with the migration source must record its provenance or replace it.'
