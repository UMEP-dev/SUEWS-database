  scientific_note: 'Western Europe still has several curation questions after its land-cover slots are
    made target-compatible. The places are mixed: paving from Zurich, which is the only component the
    database places inside this region, buildings from Helsinki, bare soil and deciduous trees from London,
    grass, evergreen trees and water from Swindon, soil from SE England, snow from Helsinki,
    irrigation from Vancouver and water use from Los Angeles. Paving and buildings from two different
    cities in two different regions is done by only one other region default, archetypes/regions/eastern-europe.
    On top of that sit the crossed water-use slots common to all 22 region defaults, which cannot be repaired
    by exchanging the two records because each holds only one day-type, thirteen single-city components
    carrying a regional default, and two base temperatures declared on the composite with no recorded
    origin. These remaining questions need a curator.'
