        which declares attaches_to irrigation.wuprofa_24hr, and profiles.water_use_automatic.working_day
        takes records/profiles/water-use-manual/los-angeles--loridan2011--old-code-11, which declares
        attaches_to irrigation.wuprofm_24hr. Swapping the two will not repair it, because loridan2011
