  scientific_note: 'The Oceania default takes its street and building fabric from Beijing and everything
    else from Northern Europe and North America, and no component carries a place the database assigns
    to Oceania, although 23 countries including Australia and New Zealand defer to it. It is also not
    a distinct file: setting aside archetype, name, region and legacy_id it is identical to archetypes/regions/caribbean,
    so two regions with almost nothing in common inherit the same configuration. The Beijing paving and
    buildings are the one deliberate-looking choice in it, and the entry records no reason for them, which
    under this review''s rules cannot be supplied by resemblance to any other archetype. The water-use
    slots are crossed in the same way as in every region default, with irrigation.wuprofm_24hr receiving
    a record declaring attaches_to irrigation.wuprofa_24hr and the converse, and the half-record problem
    means a straight swap will not fix it. Thirteen of fifteen components are single-city rows standing
    for a region, and the two base temperatures the composite declares have no recorded origin. The selection
    needs a curator, not a value correction.'
