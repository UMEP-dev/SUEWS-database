      - records/surfaces/bsoil/london--ward2016--albedo
      note: 'The composite declares place london and only its construction component does. The albedo,
        water_storage and drainage slots take records with place se-england, which db/places.yml records
        as ''SE England'', subnational: true, country united-kingdom, the region containing London, so
        applying them to the city is a downscaling and no London-specific adjusted surface record exists
        to displace them. The site-scoped emissivity is likewise documented for both London and Swindon,
        so its se-england place includes this application but does not establish city-wide reach. The
        selected albedo record is the Ward adjusted UK value 0.18. The unused stable
        London-path record is now correctly documented as generic original-value evidence at 0.21, while
        the pinned London application also uses 0.18; it is therefore not a closer London alternative.
        The snow_lim_patch slot takes records/surfaces/bsoil/helsinki--jarvi2014--snow-lim, place helsinki,
        which is forced, since it is the only bare-soil snow_lim record in the database, and the construction
        slot takes a record with place london.'
