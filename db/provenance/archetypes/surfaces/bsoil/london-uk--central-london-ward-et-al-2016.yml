      note: 'The composite fills all seven slots the land_cover.bsoil archetypes use, albedo, emissivity,
        water_storage, drainage, construction, snow_lim_patch and ohm, so the assembly is complete, and
        it is the only Central London bare-soil typology in the database. Its uses block is byte-identical
        to that of archetypes/surfaces/bsoil/swindon-uk--suburban-residential-ward-et-al-2016: the same
        eight records in the same eleven positions, and neither entry declares parameters of its own,
        so the two export the same fragment. They are not duplicates in the sense the other entry could
        be deleted, because they declare different places, london and swindon. The construction now supports
        London but not Swindon. Two exported SE England components are regional, while the shared Ward
        albedo and emissivity are site-scoped and therefore do not automatically support either city claim;
        that question is recorded under representativeness. Sharing still means that any correction to one component
        reaches both. records/surfaces/bsoil/se-england--ward2016--water-state
        carries state_limit and is referenced by no archetype, but no land_cover.bsoil archetype declares
        a water_state slot, so that is a target-wide design question rather than an omission in this entry.'
