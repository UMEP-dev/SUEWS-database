  scientific_note: The mapping and selection are sound. archetypes/surfaces/bsoil/london-uk--central-london-ward-et-al-2016
    declares place london and representativeness city, and takes four of its eight components from ward2016,
    the study its name cites. Water storage and drainage take ward2018 se-england rows, classed regional
    and applied down to a city inside that region, which is the sound direction for a class difference and
    the closest the database offers. The selected albedo is Ward's adjusted UK value 0.18 and the emissivity
    is Ward's BSoil value 0.94; both are site-scoped, so their use in a city typology remains a composition-level
    curation question.
    The unselected stable London-path record is now documented as the generic original value 0.21,
    while the pinned London application also uses 0.18, so it is not a closer London alternative. Two
    further observations change no number. The snow_lim_patch
    slot leaves the UK entirely because records/surfaces/bsoil/helsinki--jarvi2014--snow-lim is the only
    bare-soil snowpack-limit record there is. And the construction slot points at a record named 'Central
    London [sample run]', a building-fabric entry with roof and wall layers, which sits oddly on a bare-soil
    surface but contributes nothing to the exported fragment, because scripts/export_record.py keeps the
    construction slot out of it.
