      note: 'The composite fills all seven slots the land_cover.bsoil archetypes use, albedo, emissivity,
        water_storage, drainage, construction, snow_lim_patch and ohm, so the assembly is complete, and
        it is the only Swindon bare-soil typology in the database. Its uses block is byte-identical to
        that of archetypes/surfaces/bsoil/london-uk--central-london-ward-et-al-2016: the same eight records
        in the same eleven positions, and neither entry declares parameters of its own, so the two export
        the same fragment. They are not duplicates in the sense the other entry could be deleted, because
        they declare different places, swindon and london. The construction now supports London but not
        Swindon, while the exported surface components declare se-england or helsinki and the same regional
        surface evidence legitimately covers both. What the sharing does mean is that neither entry carries
        any locally derived value, and that any correction to one component reaches both. records/surfaces/bsoil/se-england--ward2016--water-state
        carries state_limit and is referenced by no archetype, but no land_cover.bsoil archetype declares
        a water_state slot, so that is a target-wide design question rather than an omission in this entry.'
