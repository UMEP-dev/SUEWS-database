      note: 'The composite declares place swindon. No component declares that place, and none could: the
        database holds no bare-soil record for Swindon. The albedo, emissivity, water_storage and drainage
        slots take records with place se-england, which db/places.yml records as ''SE England'', subnational:
        true, country united-kingdom, the region containing Swindon, so applying them to the town is a
        downscaling rather than a substitution and it is the closest the database offers. The snow_lim_patch
        slot takes records/surfaces/bsoil/helsinki--jarvi2014--snow-lim, place helsinki, the only bare-soil
        snow_lim record there is. The construction slot takes records/constructions/uk--lindberg-f2020--central-london-sample-run,
        whose corrected place is london and representativeness is city; neither supports the Swindon place
        claim, although the slot contributes no exported value because scripts/export_record.py keeps
        construction out of the surface fragment. Selecting another construction remains a separate curation
        decision.
        The two OHM records declare no place.'
