  scientific_note: 'Nothing in this assembly can be improved by re-pointing a slot. archetypes/surfaces/bsoil/swindon-uk--suburban-residential-ward-et-al-2016
    declares place swindon and representativeness city, and the database holds no bare-soil record for
    Swindon at all, so its albedo and emissivity come from ward2016 se-england rows, while water storage
    and drainage come from ward2018 se-england rows. These regional records cover the town and are applied
    down. The season mapping follows
    the components'' own season_label fields, and every slot takes a record declaring the target that
    slot fills. Two things are worth a reader''s attention without being defects in the selection. The
    snow_lim_patch slot leaves the UK entirely, because records/surfaces/bsoil/helsinki--jarvi2014--snow-lim
    is the only bare-soil snowpack-limit record in the database. And the construction slot points at a
    record named ''Central London [sample run]'', and its corrected London place does not cover Swindon,
    though the slot
    contributes no exported value because scripts/export_record.py keeps construction out of the surface
    fragment. The entry shares every component with archetypes/surfaces/bsoil/london-uk--central-london-ward-et-al-2016
    and exports the same fragment, which is defensible here in a way it would not be for two entries claiming
    the same place: the exported surface evidence is regional and covers both towns; the London construction
    mismatch is non-exporting but remains a composition-provenance defect. It does mean that neither bare-soil
    typology rests on anything locally measured, and that a correction to any one component reaches both.'
