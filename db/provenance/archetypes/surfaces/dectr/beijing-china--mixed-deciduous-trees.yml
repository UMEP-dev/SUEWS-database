      note: 'The composite claims place beijing, registered in db/places.yml with Koppen class Dwa, but
        only two of its twelve components carry that place. Three carry place helsinki, registered Dfb;
        one carries place london, registered Cfb; one carries place se-england, four are generic; and the
        OHM record carries no place at all. The newly explicit Helsinki component is the Viikki Tilia
        biogenic fit applied by Zheng in Beijing. Two other Helsinki imports are conditioned on climate rather than on species:
        records/surfaces/dectr/helsinki--jarvi2014--snow-lim supplies snowpack_limit and records/surfaces/dectr/helsinki--jarvi2014--phenology
