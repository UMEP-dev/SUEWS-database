      note: The composite is named "Mixed Deciduous Trees", its origin reads "Beijing, China" and its
        place is beijing. Two components retain Beijing evidence, namely leaf growth power and maximum
        conductance, while the biogenic CO2 set is now correctly scoped to its Viikki, Helsinki evidence
        site. The leaf area index is a generic literature input used by the Beijing configuration. The
        albedo component is named "Deciduous Forest"; only the biogenic CO2 component carries the
        mixed qualifier in its name, "Mixed trees". Alone among the eight deciduous-tree composites
        this label names no study, so it claims nothing about authorship that the components could contradict.
