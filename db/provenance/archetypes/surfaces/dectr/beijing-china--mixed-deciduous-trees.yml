      note: The composite is named "Mixed Deciduous Trees", its origin reads "Beijing, China" and its
        place is beijing, and the four Beijing-placed components that make it a Beijing typology are the
        leaf area index, the leaf growth power, the maximum conductance and the biogenic CO2 set. The
        mixed qualifier is carried by the components' own names, "Mixed Deciduous Tree" on the albedo
        record and "Mixed trees" on the biogenic CO2 record. Alone among the eight deciduous-tree composites
        this label names no study, so it claims nothing about authorship that the components could contradict.
    target:
      conclusion: supported
      evidence_ids:
