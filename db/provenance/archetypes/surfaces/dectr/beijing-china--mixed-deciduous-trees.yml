  scientific_note: 'The Beijing-specific content of this typology is real but partial. Two slots take
    Beijing evidence: leaf growth power and maximum conductance from zheng-y2023. The biogenic CO2 slot
    retains its stable Beijing path and Zheng source but is now correctly scoped to the Viikki, Helsinki
    site where its strongest local fit was produced. The
    leaf area index is a generic literature input from jarvi2011. The LAI pair is internally consistent,
    both records declaring lai.lai_type
    0, and the targets and the OHM mapping are sound. The leaf_growth_power component is a one-park site
    fit inside this city-classed composite, which now requires explicit composition curation. The biogenic
    site transfer creates the same explicit scale question. Of the other imports, two
    them matter more than the rest: the snowpack limit and the four degree-day thresholds both come from
    Helsinki, a Dfb city, into a composite placed at Beijing, a Dwa city, and both quantities describe
    when snow accumulates and when leaves appear and fall rather than what a deciduous tree is. Drainage
    is openly generic literature evidence and no longer compounds that transfer question. The remaining
    climate-conditioned choices cannot be settled from the entries and are not defects in component values;
    it is a composition decision that was never written down. A maintainer should either record why these
    transfers are acceptable for Beijing or replace the two climate-conditioned slots. The components''
    values remain subject to their own evidence assessments; this review does not revisit them.'
