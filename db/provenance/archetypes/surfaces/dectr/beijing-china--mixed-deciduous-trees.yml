      - component-surfaces-dectr-beijing-ward2013-lai
      - component-surfaces-dectr-beijing-zheng-y2023-lai-power
      note: The composite's own target is land_cover.dectr. Ten of its twelve components declare target
        land_cover.dectr; the biogenic CO2 component declares land_cover.common, which docs/FORMAT.md
        defines as the target for surface-agnostic sets; and the four OHM positions take a record declaring
        ohm_coefficients, the type that slot carries. The leaf_area_index and leaf_growth_power components
        both declare lai.lai_type 0, so the pair belongs to one LAI equation, which is the coupling schema/parameter_groups.yml
        makes a rule for that slot pair.
