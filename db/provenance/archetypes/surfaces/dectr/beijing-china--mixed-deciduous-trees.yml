  scientific_note: 'The Beijing-specific content of this typology is real but partial. Four slots take
    Beijing records: the leaf area index from ward2013 and the leaf growth power, maximum conductance
    and biogenic CO2 set from zheng-y2023, whose registered title in db/sources.yml is about simulating
    heat and CO2 fluxes in Beijing. The LAI pair is internally consistent, both records declaring lai.lai_type
    0, and the targets and the OHM mapping are sound. The remaining eight slots are imports, and two of
    them matter more than the rest: the snowpack limit and the four degree-day thresholds both come from
    Helsinki, a Dfb city, into a composite placed at Beijing, a Dwa city, and both quantities describe
    when snow accumulates and when leaves appear and fall rather than what a deciduous tree is. The drainage
    slot compounds the doubt, since its record names Beijing in its title and London in its place field.
    None of this can be settled from the entries, and none of it is a defect in a component''s value;
    it is a composition decision that was never written down. A maintainer should either record why these
    transfers are acceptable for Beijing or replace the two climate-conditioned slots. The components''
    values remain subject to their own evidence assessments; this review does not revisit them.'
