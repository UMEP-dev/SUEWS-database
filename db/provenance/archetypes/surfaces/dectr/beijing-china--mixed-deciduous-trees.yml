      note: 'The composite claims place beijing, registered in db/places.yml with Koppen class Dwa, but
        only four of its twelve components carry that place. Three carry place helsinki, registered Dfb;
        three carry place london, registered Cfb; one carries place se-england; and the OHM record carries
        no place at all. Two of the Helsinki imports are conditioned on climate rather than on species:
        records/surfaces/dectr/helsinki--jarvi2014--snow-lim supplies snowpack_limit and records/surfaces/dectr/helsinki--jarvi2014--phenology
        supplies the growing- and senescing-degree-day thresholds, both set for a cold-climate Nordic
        city and carried here into a monsoon-influenced continental one. The drainage component records/surfaces/dectr/london--havu-m2024--drainage
        declares place london while its own name reads "Deciduous Tree - Helsinki, Zurich, Beijing", so
        whether that slot applies to Beijing cannot be read off the field that is supposed to say so.
        Nothing in the entries settles whether these transfers are intended, and a maintainer should record
        the reasoning or replace the components.'
