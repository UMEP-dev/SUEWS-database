  - id: component-surfaces-dectr-zurich-jarvi2011-lai-deciduous-tree-sample-data-c
    record: records/surfaces/dectr/zurich--jarvi2011--lai--deciduous-tree-sample-data-c
    role: component
    note: Fills leaf_area_index. The record declares target land_cover.dectr, place zurich and representativeness
      city. It is an archived sample-C configuration with source unreferenced and method assumed; legacy
