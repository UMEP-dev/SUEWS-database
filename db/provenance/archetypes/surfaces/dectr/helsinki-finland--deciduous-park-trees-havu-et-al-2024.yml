      Table S3 Trees 0.66/4.8, and it declares lai.lai_type 1.
  scientific_note: The park typology is coherent in its vegetation slots. Its leaf growth power, maximum
    conductance and biogenic CO2 set all come from havu-m2024 records placed at Helsinki, and the biogenic
    record is named for deciduous trees plus grass, which is what a park canopy is. The climate-conditioned
    slots are Helsinki records, so nothing about the Nordic winter or growing season has been moved. One
    slot does not fit that pattern. The leaf area index is taken from an archived Zurich sample with
    source unreferenced and method assumed, where the two sibling Havu 2024 composites take
    the SE England Ward 2016 record. Since the database holds no Helsinki leaf-area-index record for deciduous
    trees, some import was necessary; what is not settled is why this one. It also matters more here than
    it would elsewhere, because the leaf_area_index slot is the only thing distinguishing this composite
    from the street-trees composite, which shares its other eleven components. A maintainer should decide
    whether the archived Zurich sample is the intended park leaf area index and, if it is, record why.
    The components' values remain subject to their own evidence assessments; this review does not revisit
    them.
