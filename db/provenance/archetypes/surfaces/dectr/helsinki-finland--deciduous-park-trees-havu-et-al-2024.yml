  findings:
    name:
      conclusion: supported
      evidence_ids:
      - component-surfaces-dectr-helsinki-havu-m2024-biogen-co2-deciduous-trees-grass
      - component-surfaces-dectr-helsinki-havu-m2024-max-conductance-dec-tree
      - component-surfaces-dectr-helsinki-havu-m2024-lai-power
      note: 'The composite is named "Deciduous Park trees, Havu et al. 2024" and three of its components
        declare source havu-m2024: the leaf growth power, the maximum conductance and the biogenic CO2
        set. The biogenic component is named "Deciduous trees + grass", a mixed tree and grass canopy,
        which is what a park cover is, so the label and that component agree. The same two havu-m2024
        components also fill those slots in the street-trees composite, so the park qualifier is not carried
        by them alone; it rests in addition on the leaf-area-index record this composite alone selects.'
    target:
      conclusion: supported
      evidence_ids:
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
      - component-surfaces-dectr-zurich-jarvi2011-lai-deciduous-tree-sample-data-c
      - component-surfaces-dectr-helsinki-havu-m2024-lai-power
      note: The composite's own target is land_cover.dectr. Eleven of its twelve components declare target
        land_cover.dectr, and the four OHM positions take a record declaring ohm_coefficients, the type
        that slot carries. The leaf_area_index and leaf_growth_power components both declare lai.lai_type
        1, so the pair belongs to one LAI equation, which is the coupling schema/parameter_groups.yml
        makes a rule for that slot pair.
    values:
      conclusion: not_applicable
      note: The composite declares no parameter overrides of its own.
    source:
      conclusion: not_applicable
      note: The composite claims no composition source, and the repository records no published rationale
        for this typology. The components' own sources belong to their evidence assessments, not to this
        review.
    place:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-dectr-zurich-jarvi2011-lai-deciduous-tree-sample-data-c
      - component-surfaces-dectr-se-england-ward2016-water-storage
      - component-surfaces-dectr-london-ward2016-emissivity
      - component-surfaces-dectr-london-havu-m2024-drainage
      - component-surfaces-dectr-london-jarvi2011-porosity
      - component-surfaces-dectr-helsinki-vargo2013-albedo
      note: The composite claims place helsinki, and five of its twelve components carry that place, including
        both climate-conditioned ones, the snowpack limit and the four degree-day thresholds. One carries
        place london, one carries place se-england, one carries place zurich, drainage, albedo and porosity
        are generic, and the OHM record carries no place. The exception
        that needs a decision is the leaf_area_index slot, which takes an archived Zurich sample with
        source unreferenced and method assumed. The database holds no Helsinki deciduous-tree
        leaf-area-index record, so that slot has to import from somewhere, but this import is a third
        city's configuration without scientific provenance, while its two Havu 2024 siblings import
        records/surfaces/dectr/se-england--ward2016--lai instead. Which import belongs in a Helsinki park
        typology is a curation decision the entries do not settle.
      related_records:
      - records/surfaces/dectr/se-england--ward2016--lai
    representativeness:
      conclusion: supported
      evidence_ids:
      - component-surfaces-dectr-se-england-ward2016-water-storage
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
      - component-surfaces-dectr-helsinki-vargo2013-albedo
      - component-surfaces-dectr-london-jarvi2011-porosity
      note: The composite claims representativeness city. Seven components are classed city, records/surfaces/dectr/se-england--ward2016--water-storage
        is classed regional, drainage, albedo and porosity are generic and the OHM record declares no
        class. Regional and generic values cover a city, so no component claims a narrower scale than
        the composite does.
    method:
      conclusion: supported
      evidence_ids:
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
      note: The composite assembles existing records into slots and produces no value of its own. All
        four OHM positions take records/ohm/generic--unreferenced--all-vegetation--mixed-forest-20-mccaughey-1985,
        which declares no season_label, and no OHM record in the database declares a wet or dry label,
        so one season-agnostic coefficient set in all four positions is the only mapping the entries support.
    identity:
      conclusion: supported
      note: 'Twelve distinct records fill the fifteen slot positions the deciduous-tree composites use,
        and every one of those slots is filled. The composite is distinct from its siblings, but only
        just: it shares eleven of its twelve component paths with the street-trees composite and differs
        from it in the leaf_area_index slot alone, so the whole park-versus-street distinction rests on
        one record. It differs from the forest-trees composite in three components. scripts/export_record.py
        also recognises a water_state slot and db/records/surfaces/dectr holds records/surfaces/dectr/se-england--ward2016--water-state,
        which no deciduous-tree composite references.'
      related_records:
      - archetypes/surfaces/dectr/helsinki-finland--deciduous-street-trees-havu-et-al-2022
      - archetypes/surfaces/dectr/helsinki-finland--deciduous-forest-trees-havu-et-al-2024
  evidence:
  - id: component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
    record: records/ohm/generic--unreferenced--all-vegetation--mixed-forest-20-mccaughey-1985
    role: component
    note: Fills the four OHM positions summer_wet, summer_dry, winter_wet and winter_dry. The record declares
