  findings:
    name:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-dectr-helsinki-havu-m2024-biogen-co2-deciduous-trees-grass
      - component-surfaces-dectr-helsinki-havu-m2024-lai-power
      - component-surfaces-dectr-helsinki-havu-m2024-max-conductance-dec-tree
      note: Two things in the label do not match what the composite assembles. First, the label reads
        "Deciduous Street trees, Havu et al. 2022", but db/sources.yml carries no Havu key other than
        havu-m2024, registered as Havu M., Kulmala L., Lee H.S., Saranko O., Soininen J., Ahongshangbam
        J. and Järvi L, 2024, "CO2 uptake of urban vegetation in a warming Nordic city", Urban Forestry
        and Urban Greening, doi 10.1016/j.ufug.2024.128261, and all three Havu components here declare
        that key. Whether a 2022 Havu publication exists and should be registered and cited, or whether
        the label should read 2024, cannot be settled from the entries. Second, the biogen_co2 slot takes
        records/surfaces/dectr/helsinki--havu-m2024--biogen-co2--deciduous-trees-grass, named "Deciduous
        trees + grass", while records/surfaces/dectr/helsinki--havu-m2024--biogen-co2--deciduous-trees-street,
        named "Deciduous trees - street", exists under the same source and the same place and is selected
        instead by archetypes/surfaces/dectr/helsinki-finland--mixed-dec-jarvi-et-al-2014. A street-tree
        typology not taking the street-tree record, while a mixed-deciduous typology does, reads as a
        swap, and a maintainer should confirm or correct it.
      related_records:
      - records/surfaces/dectr/helsinki--havu-m2024--biogen-co2--deciduous-trees-street
      - archetypes/surfaces/dectr/helsinki-finland--mixed-dec-jarvi-et-al-2014
    target:
      conclusion: supported
      evidence_ids:
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
      - component-surfaces-dectr-se-england-ward2016-lai
      - component-surfaces-dectr-helsinki-havu-m2024-lai-power
      note: The composite's own target is land_cover.dectr. Eleven of its twelve components declare target
        land_cover.dectr, and the four OHM positions take a record declaring ohm_coefficients, the type
        that slot carries. The leaf_area_index and leaf_growth_power components both declare lai.lai_type
        1, so the pair belongs to one LAI equation, which is the coupling schema/parameter_groups.yml
        makes a rule for that slot pair.
    values:
      conclusion: not_applicable
      note: The composite declares no parameter overrides of its own.
    source:
      conclusion: not_applicable
      note: The composite claims no composition source, and the repository records no published rationale
        for this typology. The components' own sources belong to their evidence assessments, not to this
        review.
    place:
      conclusion: supported
      evidence_ids:
      - component-surfaces-dectr-helsinki-jarvi2014-snow-lim
      - component-surfaces-dectr-helsinki-jarvi2014-phenology
      - component-surfaces-dectr-se-england-ward2016-lai
      - component-surfaces-dectr-se-england-ward2016-water-storage
      - component-surfaces-dectr-london-ward2016-emissivity
      - component-surfaces-dectr-london-havu-m2024-drainage
      - component-surfaces-dectr-london-jarvi2011-porosity
      note: 'The composite claims place helsinki, and six of its twelve components carry that place, including
        both climate-conditioned ones: the snowpack limit and the four degree-day thresholds are Helsinki
        records. Three carry place london (emissivity, drainage, porosity), two carry place se-england
        (water storage and leaf area index) and the OHM record carries no place. The leaf_area_index import
        is forced, since db/records/surfaces/dectr holds leaf-area-index records placed at beijing, se-england,
        shanghai and zurich and none placed at helsinki.'
    representativeness:
      conclusion: supported
      evidence_ids:
      - component-surfaces-dectr-se-england-ward2016-water-storage
      - component-surfaces-dectr-se-england-ward2016-lai
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
      note: The composite claims representativeness city. Nine components are classed city, the two SE
        England Ward 2016 records are classed regional and the OHM record declares no class. A regional
        value covers a city, so no component claims a narrower scale than the composite does.
    method:
      conclusion: supported
      evidence_ids:
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
      note: The composite assembles existing records into slots and produces no value of its own. All
        four OHM positions take records/ohm/generic--unreferenced--all-vegetation--mixed-forest-20-mccaughey-1985,
        which declares no season_label, and no OHM record in the database declares a wet or dry label,
        so one season-agnostic coefficient set in all four positions is the only mapping the entries support.
    identity:
      conclusion: supported
      note: Twelve distinct records fill the fifteen slot positions the deciduous-tree composites use,
        and every one of those slots is filled. The composite shares eleven of its twelve component paths
        with the park-trees composite, differing only in the leaf_area_index slot, and differs from the
        forest-trees composite in two components. It is therefore distinct, but the street and park typologies
        are separated by one record. scripts/export_record.py also recognises a water_state slot and db/records/surfaces/dectr
        holds records/surfaces/dectr/se-england--ward2016--water-state, which no deciduous-tree composite
        references.
      related_records:
      - archetypes/surfaces/dectr/helsinki-finland--deciduous-park-trees-havu-et-al-2024
      - archetypes/surfaces/dectr/helsinki-finland--deciduous-forest-trees-havu-et-al-2024
  evidence:
  - id: component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
    record: records/ohm/generic--unreferenced--all-vegetation--mixed-forest-20-mccaughey-1985
    role: component
    note: Fills the four OHM positions summer_wet, summer_dry, winter_wet and winter_dry. The record declares
      target ohm_coefficients, source grimmond1991b, no place and no representativeness, and is named
      "Mixed Forest [20]  McCaughey (1985)". It declares no season_label, so nothing in it distinguishes
      the four positions it fills.
  - id: component-surfaces-dectr-helsinki-havu-m2024-biogen-co2-deciduous-trees-grass
    record: records/surfaces/dectr/helsinki--havu-m2024--biogen-co2--deciduous-trees-grass
    role: component
    note: Fills biogen_co2. The record declares target land_cover.dectr, place helsinki and representativeness
      city. It is named "Deciduous trees + grass" and carries source havu-m2024, so it describes a mixed
      tree and grass canopy rather than the street trees the composite is named for.
  - id: component-surfaces-dectr-helsinki-havu-m2024-lai-power
    record: records/surfaces/dectr/helsinki--havu-m2024--lai-power
    role: component
    note: Fills leaf_growth_power. The record declares target land_cover.dectr, place helsinki and representativeness
      city. It is named "Deciduous Tree, LaiEq = 1", carries source havu-m2024 and declares lai.lai_type
      1, matching the leaf_area_index component.
  - id: component-surfaces-dectr-helsinki-havu-m2024-max-conductance-dec-tree
    record: records/surfaces/dectr/helsinki--havu-m2024--max-conductance--dec-tree
    role: component
    note: Fills max_vegetation_conductance. The record declares target land_cover.dectr, place helsinki
      and representativeness city. It is named "Dec Tree" and carries source havu-m2024.
  - id: component-surfaces-dectr-helsinki-jarvi2014-phenology
    record: records/surfaces/dectr/helsinki--jarvi2014--phenology
    role: component
    note: Fills vegetation_growth. The record declares target land_cover.dectr, place helsinki and representativeness
      city. It carries source jarvi2014 and supplies base_temperature, base_temperature_senescence, gdd_full
      and sdd_full as one set; its place is the composite's own.
  - id: component-surfaces-dectr-helsinki-jarvi2014-snow-lim
    record: records/surfaces/dectr/helsinki--jarvi2014--snow-lim
    role: component
    note: Fills snow_lim_patch. The record declares target land_cover.dectr, place helsinki and representativeness
      city. It carries source jarvi2014 and supplies snowpack_limit; its place is the composite's own,
      so the snow climate it was set for is the right one.
  - id: component-surfaces-dectr-helsinki-vargo2013-albedo
    record: records/surfaces/dectr/helsinki--vargo2013--albedo
    role: component
    note: Fills albedo. The record declares target land_cover.dectr, place helsinki and representativeness
      city. It is named "Mixed Deciduous Tree" and carries source vargo2013.
  - id: component-surfaces-dectr-london-havu-m2024-drainage
    record: records/surfaces/dectr/london--havu-m2024--drainage
    role: component
    note: Fills drainage. The record declares target land_cover.dectr, place london and representativeness
      city. Its own name reads "Deciduous Tree - Helsinki, Zurich, Beijing", which names three cities
      its place field does not.
  - id: component-surfaces-dectr-london-jarvi2011-porosity
    record: records/surfaces/dectr/london--jarvi2011--porosity
    role: component
    note: Fills porosity. The record declares target land_cover.dectr, place london and representativeness
      city. It carries source jarvi2011 and supplies porosity_min_deciduous and porosity_max_deciduous
      to all eight deciduous-tree composites.
  - id: component-surfaces-dectr-london-ward2016-emissivity
    record: records/surfaces/dectr/london--ward2016--emissivity
    role: component
    note: Fills emissivity. The record declares target land_cover.dectr, place london and representativeness
      city. It is named "Deciduous trees" and carries source ward2016.
  - id: component-surfaces-dectr-se-england-ward2016-lai
    record: records/surfaces/dectr/se-england--ward2016--lai
    role: component
    note: Fills leaf_area_index. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It is named "Deciduous Tree (SE England)", carries source ward2016 and declares lai.lai_type
      1.
  - id: component-surfaces-dectr-se-england-ward2016-water-storage
    record: records/surfaces/dectr/se-england--ward2016--water-storage
    role: component
    note: Fills water_storage. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It carries source jarvi2011 and is the store_min and store_max entry of every deciduous-tree
      composite.
  scientific_note: 'The assembly itself is sound: Helsinki places for the climate-conditioned slots, a
    consistent LAI equation across the two LAI slots, UK imports only for the radiative, hydrological
    and canopy-structure slots, and a generic mixed-forest storage-heat set in all four OHM positions.
    The label is what does not hold up. It cites Havu et al. 2022, and no such key exists in db/sources.yml,
    which carries havu-m2024 alone; all three Havu components here declare that 2024 key. Nothing in the
    repository establishes that a 2022 Havu publication is the source of anything in this composite, and
    this review will not supply a citation it has not read. Separately, the slot that should carry what
    makes street trees different, the biogenic CO2 set, takes the record named for deciduous trees plus
    grass, while the record named for street deciduous trees sits in the Järvi 2014 mixed-deciduous composite
    instead. Both records share a source and a place, so this is a selection question rather than a value
    question, and it is cheap for a maintainer to settle by reading the two typologies against the publication.
    The components'' values remain subject to their own evidence assessments; this review does not revisit
    them.'
