  - id: component-surfaces-dectr-se-england-ward2016-lai
    record: records/surfaces/dectr/se-england--ward2016--lai
    role: component
    note: Fills leaf_area_index. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It is named "Deciduous Tree (SE England)", carries source jarvi2011, declares method
      literature and has lai.lai_type 1.
  - id: component-surfaces-dectr-se-england-ward2016-lai-power
    record: records/surfaces/dectr/se-england--ward2016--lai-power
    role: component
    note: Fills leaf_growth_power. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It is named "Deciduous Tree (SE England)", carries source ward2016 and declares lai.lai_type
      1, matching the leaf_area_index component.
  - id: component-surfaces-dectr-se-england-ward2016-max-conductance
    record: records/surfaces/dectr/se-england--ward2016--max-conductance
    role: component
    note: Fills max_vegetation_conductance. The record declares target land_cover.dectr, place se-england
