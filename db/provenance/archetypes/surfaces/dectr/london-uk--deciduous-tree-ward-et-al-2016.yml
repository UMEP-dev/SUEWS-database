      composite.
  - id: component-surfaces-dectr-swindon-ward2016-emissivity
    record: records/surfaces/dectr/swindon--ward2016--emissivity
    role: component
    note: Fills emissivity. The record declares target land_cover.dectr, place swindon and representativeness
