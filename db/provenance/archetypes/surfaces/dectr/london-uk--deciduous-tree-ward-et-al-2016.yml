  scientific_note: Three of the thirteen components come from Ward et al. 2016, the study the label names,
    while six components are placed at se-england, which contains London; maximum conductance is a Breuer
    literature value applied there; the two LAI records agree on lai.lai_type
    1; and the OHM mapping is the best in this family, with the summer record in both summer positions
    and the winter record in both winter positions, each confirmed by its own season_label. The emissivity
    component carries the generic Oke literature value, so its stable Swindon path does not create a place
    mismatch or distinguish this composition from its Swindon counterpart. Two whole-record slots and
    one mixed-scope tuple do not follow. The
    phenology comes from Helsinki when an SE England Ward 2016 phenology record exists, carries the localised base temperatures,
    and is referenced by no archetype at all. The snowpack limit is a Helsinki value in a Cfb city. The
    biogen_co2 tuple combines Ruimy's generic fit with site-scoped Schmid respiration coefficients and
    a site-scoped Järvi minimum-respiration floor without a published composition rationale. Separately,
    this composite and the Swindon one are identical in every component and in their name, differing only
    in place, origin and legacy_id, so nothing in the data tells the two UK sites apart. None of this
    questions a stored value; all of it is selection and mapping, which is where a composition review
    can act. The components' values remain subject to their own evidence assessments; this review does
    not revisit them.
