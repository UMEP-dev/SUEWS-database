      the one the composite claims.
  scientific_note: Four of the thirteen components come from Ward et al. 2016, the study the label names,
    while seven components are placed at se-england, which contains London; maximum conductance is a Breuer
    literature value applied there; the two LAI records agree on lai.lai_type
    1; and the OHM mapping is the best in this family, with the summer record in both summer positions
    and the winter record in both winter positions, each confirmed by its own season_label. Three slots
    do not follow. The emissivity comes from the Swindon record when a London record with the same source
    and the same stored emis 0.98 exists and is used by six sibling composites. The phenology comes from
    Helsinki when an SE England Ward 2016 phenology record exists, carries the localised base temperatures,
    and is referenced by no archetype at all. The snowpack limit is a Helsinki value in a Cfb city. Separately,
    this composite and the Swindon one are identical in every component and in their name, differing only
    in place, origin and legacy_id, so nothing in the data tells the two UK sites apart. None of this
    questions a stored value; all of it is selection and mapping, which is where a composition review
    can act. The components' values remain subject to their own evidence assessments; this review does
    not revisit them.
