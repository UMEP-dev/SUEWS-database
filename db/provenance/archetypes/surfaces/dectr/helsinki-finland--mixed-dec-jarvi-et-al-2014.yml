      in Temperate climates", so the entry is a literature value rather than a Vancouver measurement.
  scientific_note: 'This composite is the least internally consistent of the four placed at Helsinki.
    Its label names Järvi et al. 2014, and the two slots that do declare source jarvi2014, the snowpack
    limit and the degree-day thresholds, are the two that a Nordic city typology most needs; both are
    placed at helsinki, so the place claim holds. Everything that describes the canopy comes from elsewhere.
    The leaf growth power and the biogenic CO2 set are havu-m2024 records, the maximum conductance is
    a breuer2003 literature value classed generic, the albedo is a generic Vargo literature constant,
    and the four storage-heat positions take
    an unreferenced average that its own name says includes soil and water. Two of those choices bear
    directly on what the composite claims to be: the unreferenced OHM average has no representativeness,
    and the mixed-deciduous typology takes the biogenic record named for street trees while the street-trees
    typology takes the one named for trees plus grass. The generic conductance and albedo are broader
    than a city and do not create a scale contradiction. The unresolved component choices cannot be settled
    from the entries and are not faults in the stored values. A maintainer should read the two Helsinki
    typologies against their publications together, since a swap in one implies the other. The components''
    values remain subject to their own evidence assessments; this review does not revisit them.'
