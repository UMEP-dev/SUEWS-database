        that slot carries; what that record averages is taken up under representativeness rather than
        here. The leaf_area_index and leaf_growth_power components both declare lai.lai_type 1, so the
        pair belongs to one LAI equation, which is the coupling schema/parameter_groups.yml makes a rule
        for that slot pair.
