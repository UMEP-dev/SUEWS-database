  - id: component-surfaces-dectr-vancouver-jarvi2011-max-conductance
    record: records/surfaces/dectr/vancouver--jarvi2011--max-conductance
    role: component
    note: Fills max_vegetation_conductance. The record declares target land_cover.dectr, place generic
      and representativeness generic. Its path and its origin field read Vancouver, but its place is generic
