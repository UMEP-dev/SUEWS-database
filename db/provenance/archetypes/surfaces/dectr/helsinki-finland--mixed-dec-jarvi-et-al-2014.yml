      note: 'The composite is named "Mixed Dec, Järvi et al (2014)", and two components declare source
        jarvi2014: records/surfaces/dectr/helsinki--jarvi2014--snow-lim and records/surfaces/dectr/helsinki--jarvi2014--phenology.
        The slots that describe how the canopy behaves do not. The leaf growth power and the biogenic
        CO2 set declare source havu-m2024, registered in db/sources.yml with year 2024, and the maximum
        conductance declares source breuer2003, so a label naming a 2014 study stands over a selection
        made from later and earlier work. The biogenic component is named "Deciduous trees - street",
        which is not a mixed deciduous cover and is the record the street-trees composite does not take.
        Whether the label or the selection should move is a curation decision.'
