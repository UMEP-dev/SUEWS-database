  findings:
    name:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-dectr-zurich-stagakis-s2024-lai-power
      - component-surfaces-dectr-zurich-stagakis-s2024-max-conductance
      - component-surfaces-dectr-zurich-stagakis-s2024-biogen-co2
      - component-surfaces-dectr-zurich-jarvi2011-lai
      note: 'The composite is named "Deciduous Tree Stagakis et al. 2024", and two components declare
        source stagakis-s2024: the leaf growth power and the biogenic CO2 set. The maximum conductance
        is now sourced to breuer2003 as an earlier literature value.
        db/sources.yml registers that key as Stagakis S., Brunner D., Li J., Backman L., Karvonen A.,
        Constantin L., Järvi L., Havu M., Chen J., Emberger S. and Kulmala L., "Intercomparison of biogenic
        CO2 flux models in four urban parks in the city of Zurich", Biogeosciences, with year 2025 and
        doi 10.5194/bg-22-2133-2025, so the year in the label and the year in the registry disagree. Which
        of the two moves remains a label-curation question. The label also covers only two of the four
        Zurich slots: the leaf_area_index component is records/surfaces/dectr/zurich--jarvi2011--lai,
        an archived unreferenced sample whose 0/4.8 range differs from the 0.66/4.8 Trees range in
        Stagakis Supplement Table S3, while the maximum conductance is sourced breuer2003.'
    target:
      conclusion: supported
      evidence_ids:
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
      - component-surfaces-dectr-zurich-jarvi2011-lai
      - component-surfaces-dectr-zurich-stagakis-s2024-lai-power
      note: The composite's own target is land_cover.dectr. Eleven of its twelve components declare target
        land_cover.dectr, and the four OHM positions take a record declaring ohm_coefficients, the type
        that slot carries. The leaf_area_index and leaf_growth_power components both declare lai.lai_type
        1, so the pair belongs to one LAI equation, which is the coupling schema/parameter_groups.yml
        makes a rule for that slot pair.
    values:
      conclusion: not_applicable
      note: The composite declares no parameter overrides of its own.
    source:
      conclusion: not_applicable
      note: The composite claims no composition source, and the repository records no published rationale
        for this typology. The components' own sources belong to their evidence assessments, not to this
        review.
    place:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-dectr-helsinki-jarvi2014-snow-lim
      - component-surfaces-dectr-helsinki-jarvi2014-phenology
      - component-surfaces-dectr-helsinki-vargo2013-albedo
      - component-surfaces-dectr-london-havu-m2024-drainage
      - component-surfaces-dectr-london-ward2016-emissivity
      - component-surfaces-dectr-london-jarvi2011-porosity
      - component-surfaces-dectr-se-england-ward2016-water-storage
      note: 'The composite claims place zurich, registered in db/places.yml with Köppen class Cfb, and
        four of its twelve components carry that place: the leaf area index, the leaf growth power, the
        maximum conductance and the biogenic CO2 set. Two carry place helsinki, registered Dfb; one carries
        place london; one carries place se-england, drainage, albedo and porosity are generic; and the
        OHM record carries no place. Two of
        the Helsinki imports are conditioned on climate rather than on species: records/surfaces/dectr/helsinki--jarvi2014--snow-lim
        supplies snowpack_limit and records/surfaces/dectr/helsinki--jarvi2014--phenology supplies the
        growing- and senescing-degree-day thresholds, both set for a Nordic city and carried here into
        a temperate one. Drainage is a generic land-cover literature tuple and creates no London-to-Zurich
        transfer. A maintainer should still record why the Nordic snow limit and phenology stand for Zurich,
        or replace them.'
    representativeness:
      conclusion: supported
      evidence_ids:
      - component-surfaces-dectr-se-england-ward2016-water-storage
      - component-surfaces-dectr-helsinki-vargo2013-albedo
      - component-surfaces-dectr-london-jarvi2011-porosity
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
      note: The composite claims representativeness city. Seven components are classed city, records/surfaces/dectr/se-england--ward2016--water-storage
        is classed regional, drainage, albedo and porosity are generic and the OHM record declares no
        class. Regional and generic values cover a city, and no component claims a narrower scale than
        the composite does.
    method:
      conclusion: supported
      evidence_ids:
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
      note: The composite assembles existing records into slots and produces no value of its own. All
        four OHM positions take records/ohm/generic--unreferenced--all-vegetation--mixed-forest-20-mccaughey-1985,
        which declares no season_label, and no OHM record in the database declares a wet or dry label,
        so one season-agnostic coefficient set in all four positions is the only mapping the entries support.
    identity:
      conclusion: supported
      note: Twelve distinct records fill the fifteen slot positions the deciduous-tree composites use,
        and every one of those slots is filled. No other archetype under db/archetypes/surfaces/dectr
        carries place zurich, and this is the only one of the eight to take the three stagakis-s2024 records,
        so it is not a duplicate of any sibling. db/records/surfaces/dectr holds three Zurich jarvi2011
        leaf-area-index records; this composite takes the archived sample-A record while
        the Helsinki park-trees composite takes the one suffixed deciduous-tree-sample-data-c, and the
        one suffixed deciduous-tree-sample-data-b is used by no deciduous-tree composite. scripts/export_record.py
        also recognises a water_state slot and db/records/surfaces/dectr holds records/surfaces/dectr/se-england--ward2016--water-state,
        which no deciduous-tree composite references.
      related_records:
      - archetypes/surfaces/dectr/helsinki-finland--deciduous-park-trees-havu-et-al-2024
  evidence:
  - id: component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey-1985
    record: records/ohm/generic--unreferenced--all-vegetation--mixed-forest-20-mccaughey-1985
    role: component
    note: Fills the four OHM positions summer_wet, summer_dry, winter_wet and winter_dry. The record declares
      target ohm_coefficients, source grimmond1991b, no place and no representativeness, and is named
      "Mixed Forest [20]  McCaughey (1985)". It declares no season_label, so nothing in it distinguishes
      the four positions it fills.
  - id: component-surfaces-dectr-helsinki-jarvi2014-phenology
    record: records/surfaces/dectr/helsinki--jarvi2014--phenology
    role: component
    note: Fills vegetation_growth. The record declares target land_cover.dectr, place helsinki and representativeness
      city. It carries source jarvi2014 and supplies base_temperature, base_temperature_senescence, gdd_full
      and sdd_full, which schema/parameter_groups.yml classes as one tightly linked set.
  - id: component-surfaces-dectr-helsinki-jarvi2014-snow-lim
    record: records/surfaces/dectr/helsinki--jarvi2014--snow-lim
    role: component
    note: Fills snow_lim_patch. The record declares target land_cover.dectr, place helsinki and representativeness
      city. It carries source jarvi2014 and supplies snowpack_limit, a quantity conditioned on the snow
      climate it was set for.
  - id: component-surfaces-dectr-helsinki-vargo2013-albedo
    record: records/surfaces/dectr/helsinki--vargo2013--albedo
    role: component
    note: Fills albedo. The record declares target land_cover.dectr, place generic and representativeness
      generic. It is named "Deciduous Forest", carries source vargo2013 and declares method literature.
  - id: component-surfaces-dectr-london-havu-m2024-drainage
    record: records/surfaces/dectr/london--havu-m2024--drainage
    role: component
    note: Fills drainage. The record is the generic, land-cover-scale Deciduous Tree literature tuple
      compiled by Järvi et al.; Havu's archive is retained as later application evidence.
  - id: component-surfaces-dectr-london-jarvi2011-porosity
    record: records/surfaces/dectr/london--jarvi2011--porosity
    role: component
    note: Fills porosity. The record declares target land_cover.dectr, place generic, representativeness
      generic, applicable_scale land_cover, source unreferenced and method assumed. It supplies
      porosity_min_deciduous and porosity_max_deciduous to all eight deciduous-tree composites.
  - id: component-surfaces-dectr-london-ward2016-emissivity
    record: records/surfaces/dectr/london--ward2016--emissivity
    role: component
    note: Fills emissivity. The record declares target land_cover.dectr, place generic and representativeness
      generic. It is named "Deciduous trees", carries source oke1987 and declares method literature.
  - id: component-surfaces-dectr-se-england-ward2016-water-storage
    record: records/surfaces/dectr/se-england--ward2016--water-storage
    role: component
    note: Fills water_storage. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It carries source jarvi2011 and is the store_min and store_max entry of every deciduous-tree
      composite.
  - id: component-surfaces-dectr-zurich-jarvi2011-lai
    record: records/surfaces/dectr/zurich--jarvi2011--lai
    role: component
    note: Fills leaf_area_index. The record declares target land_cover.dectr, place zurich and representativeness
      city. It is an archived sample-A configuration with source unreferenced and method assumed; legacy
      Ref 90240054 is retained only as source_legacy_ref. Its 0/4.8 range differs from Stagakis Supplement
      Table S3 Trees 0.66/4.8, and it declares lai.lai_type 1.
  - id: component-surfaces-dectr-zurich-stagakis-s2024-biogen-co2
    record: records/surfaces/dectr/zurich--stagakis-s2024--biogen-co2
    role: component
    note: Fills biogen_co2. The record declares target land_cover.dectr, place zurich and representativeness
      city. It is named "Deciduous trees" and carries source stagakis-s2024. Supplement Table S3 supports
      beta_bio_co2 8.3, resp_a 0.78 and resp_b 0.08; alpha_bio_co2, theta_bio_co2 and min_res_bioco2
      remain unresolved in the component evidence review.
  - id: component-surfaces-dectr-zurich-stagakis-s2024-lai-power
    record: records/surfaces/dectr/zurich--stagakis-s2024--lai-power
    role: component
    note: Fills leaf_growth_power. The record declares target land_cover.dectr, place zurich and representativeness
      city. It is named "Deciduous Tree, LaiEq = 1", carries source stagakis-s2024 and declares lai.lai_type
      1, matching the leaf_area_index component.
  - id: component-surfaces-dectr-zurich-stagakis-s2024-max-conductance
    record: records/surfaces/dectr/zurich--stagakis-s2024--max-conductance
    role: component
    note: Fills max_vegetation_conductance. The record declares target land_cover.dectr, place zurich
      and representativeness city. It carries source breuer2003 and method literature.
  scientific_note: 'The Zurich-specific content is the configuration and application context rather than
    a single common parameter source. Leaf growth power and the biogenic CO2 set come from stagakis-s2024
    records placed at Zurich; maximum conductance is a Breuer 2003 literature value applied there; albedo
    is a generic Vargo literature constant; and the leaf area index is a Zurich-labelled archived sample
    with source unreferenced rather than a Stagakis parameter. The LAI pair agrees on lai.lai_type 1, the targets are right
    and the OHM mapping is the only one the entries allow. Two things need a decision. The label reads
    2024 while db/sources.yml registers stagakis-s2024 with year 2025 and a 2025 Biogeosciences doi, and
    the composite label still says 2024. And the snowpack limit and the four degree-day thresholds
    are Helsinki records, Dfb values standing in a Cfb city, which is the same transfer the Beijing composite
    makes. Drainage is now explicit generic literature evidence. Neither remaining question touches a stored value; both are composition
    decisions nobody wrote down. The components'' values remain subject to their own evidence assessments;
    this review does not revisit them. The corrected biogen_co2 component has three values directly
    supported by Supplement Table S3 and three retained values whose provenance remains unresolved.'
