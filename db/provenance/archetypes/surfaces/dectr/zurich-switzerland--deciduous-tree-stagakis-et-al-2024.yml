  - id: component-surfaces-dectr-helsinki-vargo2013-albedo
    record: records/surfaces/dectr/helsinki--vargo2013--albedo
    role: component
    note: Fills albedo. The record declares target land_cover.dectr, place helsinki and representativeness
      city. It is named "Deciduous Forest" and carries source vargo2013.
  - id: component-surfaces-dectr-london-havu-m2024-drainage
    record: records/surfaces/dectr/london--havu-m2024--drainage
    role: component
    note: Fills drainage. The record declares target land_cover.dectr, place london and representativeness
      city, source jarvi2011 and method literature. Its own name reads "Deciduous Tree - Helsinki, Zurich,
      Beijing", which names three cities its place field does not; Havu's archive is retained as later
