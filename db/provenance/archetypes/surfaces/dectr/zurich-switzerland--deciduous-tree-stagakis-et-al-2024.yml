  - id: component-surfaces-dectr-london-jarvi2011-porosity
    record: records/surfaces/dectr/london--jarvi2011--porosity
    role: component
    note: Fills porosity. The record declares target land_cover.dectr, place london and representativeness
      city. It carries source jarvi2011 and supplies porosity_min_deciduous and porosity_max_deciduous
      to all eight deciduous-tree composites.
  - id: component-surfaces-dectr-london-ward2016-emissivity
    record: records/surfaces/dectr/london--ward2016--emissivity
    role: component
    note: Fills emissivity. The record declares target land_cover.dectr, place london and representativeness
      city. It is named "Deciduous trees" and carries source ward2016.
  - id: component-surfaces-dectr-se-england-ward2016-water-storage
    record: records/surfaces/dectr/se-england--ward2016--water-storage
    role: component
    note: Fills water_storage. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It carries source jarvi2011 and is the store_min and store_max entry of every deciduous-tree
      composite.
  - id: component-surfaces-dectr-zurich-jarvi2011-lai
    record: records/surfaces/dectr/zurich--jarvi2011--lai
    role: component
    note: Fills leaf_area_index. The record declares target land_cover.dectr, place zurich and representativeness
      city. It is named "Deciduous Tree (sample data) a", carries source jarvi2011 rather than the stagakis-s2024
      the composite's label names, and declares lai.lai_type 1; it is one of three Zurich jarvi2011 leaf-area-index
      records in db/records/surfaces/dectr.
  - id: component-surfaces-dectr-zurich-stagakis-s2024-biogen-co2
    record: records/surfaces/dectr/zurich--stagakis-s2024--biogen-co2
    role: component
    note: Fills biogen_co2. The record declares target land_cover.dectr, place zurich and representativeness
      city. It is named "Deciduous trees" and carries source stagakis-s2024.
  - id: component-surfaces-dectr-zurich-stagakis-s2024-lai-power
    record: records/surfaces/dectr/zurich--stagakis-s2024--lai-power
    role: component
    note: Fills leaf_growth_power. The record declares target land_cover.dectr, place zurich and representativeness
      city. It is named "Deciduous Tree, LaiEq = 1", carries source stagakis-s2024 and declares lai.lai_type
      1, matching the leaf_area_index component.
  - id: component-surfaces-dectr-zurich-stagakis-s2024-max-conductance
    record: records/surfaces/dectr/zurich--stagakis-s2024--max-conductance
    role: component
    note: Fills max_vegetation_conductance. The record declares target land_cover.dectr, place zurich
      and representativeness city. It carries source breuer2003 and method literature.
  scientific_note: 'The Zurich-specific content is the configuration and application context rather than
    a single common parameter source. Leaf growth power and the biogenic CO2 set come from stagakis-s2024
    records placed at Zurich; maximum conductance is a Breuer 2003 literature value applied there; and
    the leaf area index is a Zurich record too, though it comes from jarvi2011
    and its own name calls it sample data. The LAI pair agrees on lai.lai_type 1, the targets are right
    and the OHM mapping is the only one the entries allow. Two things need a decision. The label reads
    2024 while db/sources.yml registers stagakis-s2024 with year 2025 and a 2025 Biogeosciences doi, and
    nothing in the repository says which is correct. And the snowpack limit and the four degree-day thresholds
    are Helsinki records, Dfb values standing in a Cfb city, which is the same transfer the Beijing composite
    makes and the one a reader is least able to check, since the drainage record''s own name mentions
    Zurich while its place field says London. Neither question touches a stored value; both are composition
    decisions nobody wrote down. The components'' values remain subject to their own evidence assessments;
    this review does not revisit them.'
