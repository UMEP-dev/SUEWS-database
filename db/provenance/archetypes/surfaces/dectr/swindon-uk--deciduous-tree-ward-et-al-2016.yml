      [2011]". It declares season_label Summer, which is the season it is mapped into.
  - id: component-ohm-generic-ward2016-all-vegetation-code-201-x-multiplier-for-winter-2012
    record: records/ohm/generic--ward2016--all-vegetation--code-201-x-multiplier-for-winter-2012
    role: component
    note: Fills the OHM positions winter_wet and winter_dry. The record declares target ohm_coefficients,
      source ward2016, no place and no representativeness, and is named "Code 201 x Multiplier for winter
      [2012]". It declares season_label Winter, which is the season it is mapped into.
  - id: component-surfaces-common-se-england-ruimy1995-biogen-co2
    record: records/surfaces/common/se-england--ruimy1995--biogen-co2
    role: component
    note: Fills biogen_co2. The record declares target land_cover.common, place se-england and representativeness
      regional. It is named "Plant canopies" and carries source ruimy1995; docs/FORMAT.md defines land_cover.common
      as the surface-agnostic target, so it is admissible in a deciduous-tree composite.
  - id: component-surfaces-dectr-helsinki-jarvi2014-phenology
