  findings:
    name:
      conclusion: supported
      evidence_ids:
      - component-surfaces-dectr-swindon-ward2016-emissivity
      - component-surfaces-dectr-se-england-ward2016-albedo
      - component-surfaces-dectr-se-england-ward2016-max-conductance
      - component-ohm-generic-ward2016-all-vegetation
      - component-ohm-generic-ward2016-all-vegetation-code-201-x-multiplier-for-winter-2012
      note: 'The composite is named "Deciduous Tree Ward et al. (2016)" and eight of its thirteen components
        declare source ward2016, registered in db/sources.yml as Ward, H. C.; Kotthaus, S.; Järvi, L.;
        Grimmond, C. S. B., 2016, "Surface Urban Energy and Water Balance Scheme (SUEWS): Development
        and evaluation at two UK sites", Urban Climate. The label names the study rather than the city,
        and the origin field, "Swindon, UK", is what distinguishes this entry; the identically named London
        composite is taken up under identity.'
      related_records:
      - archetypes/surfaces/dectr/london-uk--deciduous-tree-ward-et-al-2016
    target:
      conclusion: supported
      evidence_ids:
      - component-surfaces-common-se-england-ruimy1995-biogen-co2
      - component-ohm-generic-ward2016-all-vegetation
      - component-ohm-generic-ward2016-all-vegetation-code-201-x-multiplier-for-winter-2012
      - component-surfaces-dectr-se-england-ward2016-lai
      - component-surfaces-dectr-se-england-ward2016-lai-power
      note: The composite's own target is land_cover.dectr. Ten of its thirteen components declare target
        land_cover.dectr; the biogenic CO2 component declares land_cover.common, which docs/FORMAT.md
        defines as the target for surface-agnostic sets; and the two OHM records declare ohm_coefficients,
        the type that slot carries. The leaf_area_index and leaf_growth_power components both declare
        lai.lai_type 1, so the pair belongs to one LAI equation, which is the coupling schema/parameter_groups.yml
        makes a rule for that slot pair.
    values:
      conclusion: not_applicable
      note: The composite declares no parameter overrides of its own.
    source:
      conclusion: not_applicable
      note: The composite claims no composition source, and the repository records no published rationale
        for this typology. The components' own sources belong to their evidence assessments, not to this
        review.
    place:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-dectr-helsinki-jarvi2014-phenology
      - component-surfaces-dectr-helsinki-jarvi2014-snow-lim
      - component-surfaces-dectr-london-jarvi2011-porosity
      - component-surfaces-dectr-swindon-ward2016-emissivity
      note: The composite claims place swindon, registered in db/places.yml with Köppen class Cfb, and
        the emissivity component is the one record placed there. Seven carry place se-england, which db/places.yml
        marks subnational and which contains Swindon, so the Ward set sits comfortably. Three do not.
        The porosity slot takes a London record, which is a neighbouring Cfb city and a mild import. The
        vegetation_growth slot takes records/surfaces/dectr/helsinki--jarvi2014--phenology (base_temperature
        5, base_temperature_senescence 10) although records/surfaces/dectr/se-england--ward2016--phenology
        exists with the composite's own source and region (base_temperature 6, base_temperature_senescence
        11) and is referenced by no archetype in the database; schema/parameter_groups.yml classes those
        thresholds as a tightly linked set whose base temperature was localised for SE England. The snow_lim_patch
        slot takes a Helsinki snowpack limit, a Dfb value, for a Cfb place. A maintainer should settle
        the phenology and the snow limit.
      related_records:
      - records/surfaces/dectr/se-england--ward2016--phenology
    representativeness:
      conclusion: supported
      evidence_ids:
      - component-surfaces-dectr-se-england-ward2016-albedo
      - component-surfaces-dectr-swindon-ward2016-emissivity
      - component-ohm-generic-ward2016-all-vegetation
      - component-ohm-generic-ward2016-all-vegetation-code-201-x-multiplier-for-winter-2012
      note: The composite claims representativeness city. Seven components are classed regional, the SE
        England Ward 2016 set and the Ruimy biogenic record; four are classed city, the Swindon emissivity,
        the London porosity and the two Helsinki records; and the two OHM records declare no class. A
        regional value is offered as typical of a wider area and so covers a city, and no component claims
        a narrower scale than the composite does.
    method:
      conclusion: supported
      evidence_ids:
      - component-ohm-generic-ward2016-all-vegetation
      - component-ohm-generic-ward2016-all-vegetation-code-201-x-multiplier-for-winter-2012
      note: The composite assembles existing records into slots and produces no value of its own, and
        its season mapping is the one the entries support. summer_wet and summer_dry take records/ohm/generic--ward2016--all-vegetation,
        which declares season_label Summer; winter_wet and winter_dry take records/ohm/generic--ward2016--all-vegetation--code-201-x-multiplier-for-winter-2012,
        which declares season_label Winter. This is the only deciduous-tree composite pair that separates
        the seasons rather than repeating one set four times. Wet and dry take the same record within
        each season, which is all the entries allow, since no OHM record in the database declares a wet
        or dry label.
    identity:
      conclusion: curation_required
      note: 'Thirteen distinct records fill the fifteen slot positions, and every slot the deciduous-tree
        composites use is filled. Uniqueness is not satisfied: archetypes/surfaces/dectr/london-uk--deciduous-tree-ward-et-al-2016
        carries the identical name "Deciduous Tree Ward et al. (2016)" and an identical uses block, component
        for component and slot for slot, so the two differ only in place, origin and legacy_id and export
        the same fragment. This entry has the better claim of the two, since its emissivity component
        is the Swindon record and its place field reads swindon, but as stored neither can be told from
        the other by content. A maintainer should either differentiate them or record that one entry serves
        both sites. scripts/export_record.py also recognises a water_state slot and db/records/surfaces/dectr
        holds records/surfaces/dectr/se-england--ward2016--water-state, which no deciduous-tree composite
        references.'
      related_records:
      - archetypes/surfaces/dectr/london-uk--deciduous-tree-ward-et-al-2016
  evidence:
  - id: component-ohm-generic-ward2016-all-vegetation
