  - id: component-surfaces-dectr-helsinki-jarvi2014-snow-lim
    record: records/surfaces/dectr/helsinki--jarvi2014--snow-lim
    role: component
    note: Fills snow_lim_patch. The record declares target land_cover.dectr, place helsinki and representativeness
      city. It carries source jarvi2014 and supplies snowpack_limit, a quantity conditioned on the snow
      climate it was set for.
  - id: component-surfaces-dectr-london-jarvi2011-porosity
    record: records/surfaces/dectr/london--jarvi2011--porosity
    role: component
    note: Fills porosity. The record declares target land_cover.dectr, place london and representativeness
      city. It carries source jarvi2011 and supplies porosity_min_deciduous and porosity_max_deciduous
      to all eight deciduous-tree composites.
  - id: component-surfaces-dectr-se-england-ward2016-albedo
    record: records/surfaces/dectr/se-england--ward2016--albedo
    role: component
    note: Fills albedo. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It is named "Deciduous trees" and carries source ward2016.
  - id: component-surfaces-dectr-se-england-ward2016-drainage
    record: records/surfaces/dectr/se-england--ward2016--drainage
    role: component
    note: Fills drainage. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It carries source ward2016 and declares storage_drain_params.drain_eq 2.
  - id: component-surfaces-dectr-se-england-ward2016-lai
    record: records/surfaces/dectr/se-england--ward2016--lai
    role: component
    note: Fills leaf_area_index. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It is named "Deciduous Tree (SE England)", carries source jarvi2014 and declares lai.lai_type
      1.
  - id: component-surfaces-dectr-se-england-ward2016-lai-power
    record: records/surfaces/dectr/se-england--ward2016--lai-power
    role: component
    note: Fills leaf_growth_power. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It is named "Deciduous Tree (SE England)", carries source ward2016 and declares lai.lai_type
      1, matching the leaf_area_index component.
  - id: component-surfaces-dectr-se-england-ward2016-max-conductance
    record: records/surfaces/dectr/se-england--ward2016--max-conductance
    role: component
    note: Fills max_vegetation_conductance. The record declares target land_cover.dectr, place se-england
      and representativeness regional. It is named "Deciduous Tree (SE England)" and carries source ward2016.
  - id: component-surfaces-dectr-se-england-ward2016-water-storage
    record: records/surfaces/dectr/se-england--ward2016--water-storage
    role: component
    note: Fills water_storage. The record declares target land_cover.dectr, place se-england and representativeness
      regional. It carries source jarvi2011 and is the store_min and store_max entry of every deciduous-tree
      composite.
  - id: component-surfaces-dectr-swindon-ward2016-emissivity
    record: records/surfaces/dectr/swindon--ward2016--emissivity
    role: component
    note: Fills emissivity. The record declares target land_cover.dectr, place swindon and representativeness
      city. It is named "Deciduous trees" and carries source ward2016; its place is the composite's own.
  scientific_note: 'Of the two Ward et al. 2016 typologies this is the better assembled: its emissivity
    is the Swindon record, and the seven SE England components are regional values for the region that
    contains Swindon. The two LAI records agree on lai.lai_type 1, and the OHM mapping is correct, the
    summer record filling both summer positions and the winter record both winter positions, each confirmed
    by its own season_label. Two slots still do not follow the composite''s place. The phenology is the
    Helsinki Järvi 2014 record even though an SE England Ward 2016 phenology record exists with the localised
    base temperatures and is referenced by no archetype in the database, and the snowpack limit is a Helsinki
    value in a Cfb city. The larger problem is not in this file alone: the London composite is identical
    to it in every component and in its name, so the database offers two entries for two different UK
    sites that cannot be told apart by their content. A maintainer should settle the phenology and the
    snow limit, and decide whether the two site typologies should differ at all. The components'' values
    remain subject to their own evidence assessments; this review does not revisit them.'
