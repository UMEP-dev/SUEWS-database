  scientific_note: 'The entry is a demonstration configuration and says so: its name reads "Irrigated
    [sample run]" and the drainage slot takes records/surfaces/grass/london--jarvi2011--drainage, named
    "Grass [sample run]". The mapping itself is sound, every slot receiving a component declared for it
    and the ohm slot taking the grass-specific "Short grass [30]" set. Two of the twelve components declare
    place vancouver, the jarvi2011 leaf_growth_power and max_vegetation_conductance records, and they
    are the only grass records in the database declaring that place; three come from SE England, three
    from Helsinki, one from London and one from Lethbridge, and the last two are a generic dummy and an unreferenced
    coefficient set. Two things need a maintainer. The biogen_co2 slot takes records/surfaces/grass/lethbridge--flanagan2002--biogen-co2,
    a site-classed temperate grassland record from a semi-arid prairie location (koppen BSk) filling a
    slot in a marine west-coast city composite (koppen Cfb), and it is the only component across these
    nine grass composites classed narrower than the composite that carries it; the alternative the London
    and Swindon composites take, records/surfaces/common/se-england--ruimy1995--biogen-co2, is no more
    local, so the choice between two transplants is a maintainer''s and not a correction. And whether
    a sample-run configuration belongs in the published archetype set beside descriptions of real sites
    is a curation decision of the same kind.'
