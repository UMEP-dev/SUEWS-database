  findings:
    name:
      conclusion: supported
      evidence_ids:
      - component-surfaces-grass-vancouver-jarvi2011-max-conductance
      - component-surfaces-grass-london-jarvi2011-drainage
      - component-surfaces-grass-vancouver-jarvi2011-lai-power
      note: The composite's name reads "Irrigated [sample run]", its place reads vancouver and its origin
        reads Vancouver. The irrigated qualifier is carried by records/surfaces/grass/vancouver--jarvi2011--max-conductance,
        named "Irrigated Grass", so the label matches the assembly. The bracketed marker says the configuration
        comes from a demonstration run rather than from a description of a site, and the drainage component,
        records/surfaces/grass/london--jarvi2011--drainage, is named "Grass [sample run]" in the same
        spirit. scripts/check_db.py lists "sample run" among its SUSPECT_MARKERS, so make check already
        reports both names as entries that read as test fixtures rather than data. The label is honest
        about what the entry is; whether an entry of that kind belongs in the published archetype set
        is taken under identity.
    target:
      conclusion: supported
      evidence_ids: &id001
      - component-ohm-generic-unreferenced-grass
      - component-surfaces-grass-generic-unreferenced-porosity
      - component-surfaces-grass-helsinki-jarvi2014-phenology
      - component-surfaces-grass-helsinki-jarvi2014-snow-lim
      - component-surfaces-grass-lethbridge-flanagan2002-biogen-co2
      - component-surfaces-grass-london-jarvi2011-drainage
      - component-surfaces-grass-se-england-havu-m2024-lai
      - component-surfaces-grass-se-england-ward2016-albedo
      - component-surfaces-grass-se-england-ward2016-emissivity
      - component-surfaces-grass-se-england-ward2016-water-storage
      - component-surfaces-grass-vancouver-jarvi2011-lai-power
      - component-surfaces-grass-vancouver-jarvi2011-max-conductance
      note: 'The composite declares target land_cover.grass. Eleven of the twelve components declare target
        land_cover.grass and the twelfth, records/ohm/generic--unreferenced--grass, declares target ohm_coefficients,
        which is what the ohm slot takes: docs/FORMAT.md puts the four season and wetness positions of
        supy''s ohm_coef on the archetype rather than on the coefficient records. Surface records carry
        no attaches_to field, which in this database appears only on the profile records under records/profiles/,
        so the slot check rests on the parameter names each component carries, and every slot receives
        a component holding the fields that slot names. The ohm component is named "Short grass [30]",
        the grass-specific coefficient set rather than a vegetation average, and it fills all four positions
        because it declares no season_label and no wet or dry distinction.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters of its own, so it overrides no component value; the exported
        fragment is its components merged into their slots.
    source:
      conclusion: not_applicable
      note: The composite declares no source field and asserts no parameters of its own, so there is no
        published composition rationale to review. The archetype format does allow a composite to carry
        a source, as the snow archetypes do for the scalars they assert themselves, and this entry carries
        none. Each component's own source belongs to that component's evidence assessment.
    place:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-grass-lethbridge-flanagan2002-biogen-co2
      - component-surfaces-grass-vancouver-jarvi2011-lai-power
      - component-surfaces-grass-vancouver-jarvi2011-max-conductance
      - component-surfaces-grass-london-jarvi2011-drainage
      related_records:
      - records/surfaces/common/se-england--ruimy1995--biogen-co2
      note: 'The composite declares place vancouver, which db/places.yml gives as lat 49.28, lon -123.12,
        koppen Cfb. Two components declare place vancouver, filling leaf_growth_power and max_vegetation_conductance,
        and they are the only grass records in the database declaring that place; a third file whose path
        begins vancouver--jarvi2011, records/surfaces/grass/vancouver--jarvi2011--max-conductance--unirrigated-grass,
        declares place generic and is not used here. Three declare place se-england, filling albedo, emissivity
        and water_storage, three declare place helsinki, filling leaf_area_index, snow_lim_patch and vegetation_growth,
        one declares place london, filling drainage, porosity declares place generic and the ohm component
        carries no place field. The slot that needs settling is biogen_co2. It takes records/surfaces/grass/lethbridge--flanagan2002--biogen-co2,
        which declares place lethbridge, given in db/places.yml as lat 49.69, lon -112.83, koppen BSk,
        origin "Lethbridge, Alberta, Canada", name "Temperate grassland" and representativeness site:
        a semi-arid prairie grassland standing in for irrigated urban grass in a marine west-coast city,
        where the country is the only thing the two places share. The database holds a surface-agnostic
        alternative, records/surfaces/common/se-england--ruimy1995--biogen-co2, named "Plant canopies",
        which the London and Swindon grass composites take; it is no more Vancouver-local than the Lethbridge
        record, so this is a choice between two transplants rather than a correction, and exchanging them
        would change a model input. A maintainer should decide which transplant this entry should carry.'
    representativeness:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-grass-lethbridge-flanagan2002-biogen-co2
      - component-surfaces-grass-se-england-ward2016-albedo
      - component-surfaces-grass-generic-unreferenced-porosity
      note: 'The composite declares representativeness city. Six components declare city, three declare
        regional, records/surfaces/grass/generic--unreferenced--porosity declares generic, and one declares
        site; the ohm component carries no representativeness field. The site-classed component is records/surfaces/grass/lethbridge--flanagan2002--biogen-co2,
        and it is the only component in any of the nine grass composites classed narrower than the composite
        carrying it. A single-site flux measurement inside a city typology is exactly what the representativeness
        field exists to make visible, and the composition layer cannot reconcile it: either the slot should
        take a component classed at or above the composite''s scale, or a maintainer should accept the
        site value knowingly and say so.'
    method:
      conclusion: supported
      evidence_ids: *id001
      note: An assembly of twelve existing records into the twelve slots the vegetation archetypes use,
        and assembled is the method a composition sidecar takes. The composite produces no value of its
        own.
    identity:
      conclusion: curation_required
      evidence_ids: *id001
      note: The uses block fills all twelve slots the vegetation archetypes use, namely albedo, emissivity,
        water_storage, leaf_area_index, leaf_growth_power, drainage, max_vegetation_conductance, porosity,
        biogen_co2, snow_lim_patch, vegetation_growth and ohm, which is the slot vocabulary every land_cover.grass,
        land_cover.dectr and land_cover.evetr archetype in the database uses, so no slot is missing. The
        ohm slot names one record in all four positions, and no other archetype in the database repeats
        this uses block, so the entry is complete and unique. What is unsettled is whether it should be
        in the set at all. Its own name reads "Irrigated [sample run]" and its drainage component is named
        "Grass [sample run]", both of which scripts/check_db.py reports as suspect names, and it is published
        beside entries that describe real sites with nothing but those names to distinguish it. Whether
        a demonstration configuration should stand in the published archetype set, and if it should whether
        it needs marking beyond its name, is a curation decision this review cannot take.
