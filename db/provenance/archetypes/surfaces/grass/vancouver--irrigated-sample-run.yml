  scientific_note: 'The entry is a demonstration configuration and says so: its name reads "Irrigated
    [sample run]". The mapping itself is sound, every slot receiving a component declared for it
    and the ohm slot taking the grass-specific "Short grass [30]" set. None of the twelve components declares
    place vancouver; drainage, leaf_growth_power and max_vegetation_conductance are generic Järvi literature
    parameters whose stable paths retain application lineage. Albedo comes from SE England, water storage
    from Swindon, three components from Helsinki and one from Lethbridge; drainage, porosity, emissivity,
    leaf-growth power and maximum conductance are generic, and the unreferenced coefficient set carries
    no place. Two things need a maintainer. The biogen_co2 slot takes records/surfaces/grass/lethbridge--flanagan2002--biogen-co2,
    a site-classed temperate grassland record from a semi-arid prairie location (koppen BSk) filling a
    slot in a marine west-coast city composite (koppen Cfb). The Ward grass albedo and Ward 2018 water
    storage are also site-scoped, so all three are narrower than the composite. The alternative the London
    and Swindon composites take, records/surfaces/common/se-england--ruimy1995--biogen-co2, is no more
    local, so the choice between two transplants is a maintainer''s and not a correction. And whether
    a sample-run configuration belongs in the published archetype set beside descriptions of real sites
    is a curation decision of the same kind.'
