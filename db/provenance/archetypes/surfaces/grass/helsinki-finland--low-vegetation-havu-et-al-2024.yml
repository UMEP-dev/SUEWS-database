  scientific_note: 'The entry is the mixed-low-vegetation sibling of archetypes/surfaces/grass/helsinki-finland--grass-havu-et-al-2024
    and differs from it in one slot only, biogen_co2, where it takes records/surfaces/grass/helsinki--havu-m2024--biogen-co2--mixed-low-vegetation
    rather than the lawn record. That is a deliberate split rather than a duplication, and the names carry
    it. Everything else reads as it should: six of twelve components declare place helsinki, four declare
    source havu-m2024 and the Järvi-sourced drainage record appears in Havu''s archive. The leaf-area slot
    takes that study''s Helsinki record whose stable path and label
    retain legacy SE England text, and the label sits correctly on a land_cover.grass target because grass
    is the only low-vegetation tile in the land-cover set. The one field-level inconsistency to carry
    forward without acting on it here is records/surfaces/grass/london--havu-m2024--drainage, which declares
    place london while its name reads "Grass - Helsinki, Zurich, Beijing"; that belongs to the record''s
