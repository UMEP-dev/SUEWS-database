        water_storage, leaf_area_index, leaf_growth_power, drainage, max_vegetation_conductance, porosity,
        biogen_co2, snow_lim_patch, vegetation_growth and ohm, which is the slot vocabulary every land_cover.grass,
        land_cover.dectr and land_cover.evetr archetype in the database uses, so no slot is missing. The
        ohm slot names one record in all four positions. archetypes/surfaces/grass/helsinki-finland--grass-havu-et-al-2024
        takes the same eleven components and differs only in the biogen_co2 slot, where it takes records/surfaces/grass/helsinki--havu-m2024--biogen-co2
        ("Grass (lawn)") in place of the "Mixed low vegetation" record this entry takes. The two records
        differ, so the pair is not a duplication, but the entire distinction between two published typologies
        rests on one biogenic CO2 set, which a reader comparing them should know.
