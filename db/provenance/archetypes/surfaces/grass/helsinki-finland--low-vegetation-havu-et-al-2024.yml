    it. Everything else reads as it should: six of twelve components declare place helsinki, five declare
    source havu-m2024, the leaf-area slot takes that study''s SE England record because the database holds
    no Helsinki leaf-area record, and the label sits correctly on a land_cover.grass target because grass
    is the only low-vegetation tile in the land-cover set. The one field-level inconsistency to carry
    forward without acting on it here is records/surfaces/grass/london--havu-m2024--drainage, which declares
    place london while its name reads "Grass - Helsinki, Zurich, Beijing"; that belongs to the record''s
