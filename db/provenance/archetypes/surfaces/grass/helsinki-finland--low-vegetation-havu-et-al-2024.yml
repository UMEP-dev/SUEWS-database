      note: 'The composite''s name reads "Low vegetation (Havu et al 2024)", its place reads helsinki
        and its origin reads Helsinki, Finland. The low-vegetation label sits correctly on a land_cover.grass
        target: of the land-cover surfaces docs/FORMAT.md lists, namely paved, bldgs, evetr, dectr, grass,
        bsoil and water, grass is the only low-vegetation tile. The label is carried by one component,
        records/surfaces/grass/helsinki--havu-m2024--biogen-co2--mixed-low-vegetation, named "Mixed low
        vegetation", which is the single slot separating this entry from archetypes/surfaces/grass/helsinki-finland--grass-havu-et-al-2024.
        Four components in all declare source havu-m2024, and the drainage component declares jarvi2011
        while appearing in Havu''s archived configuration. Together those slots give the entry its identity.'
    target:
      conclusion: supported
      evidence_ids: &id001
      - component-ohm-generic-unreferenced-grass
      - component-surfaces-grass-generic-unreferenced-porosity
      - component-surfaces-grass-helsinki-havu-m2024-biogen-co2-mixed-low-vegetation
