      - component-surfaces-grass-zurich-stagakis-s2024-biogen-co2
      - component-surfaces-grass-zurich-ao2018-lai
      note: 'The composite''s name reads "Grass Stagakis et al. 2024", its place reads zurich and its
        origin reads Zurich, Switzerland. Three of the twelve components declare source stagakis-s2024,
        filling leaf_growth_power, max_vegetation_conductance and biogen_co2, and a fourth Zurich record
        fills leaf_area_index, so the four slots that distinguish this entry from its neighbours are the
        locally sourced ones. One discrepancy is worth recording without treating it as a composition
        defect: db/sources.yml gives stagakis-s2024 the year 2025 and the doi 10.5194/bg-22-2133-2025,
        while the composite''s label and the source key itself read 2024. Which year is right is a question
        about the source registry, and AGENTS.md routes bibliographic corrections to db/sources.yml separately
        from record and composite changes.'
    target:
      conclusion: supported
      evidence_ids: &id001
      - component-ohm-generic-unreferenced-grass
      - component-surfaces-grass-generic-unreferenced-porosity
      - component-surfaces-grass-helsinki-jarvi2014-phenology
      - component-surfaces-grass-helsinki-jarvi2014-snow-lim
      - component-surfaces-grass-helsinki-vargo2013-albedo
