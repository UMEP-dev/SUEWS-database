  scientific_note: 'This is the best-localised of the nine grass composites. Four of its twelve components
    declare place zurich and they are every Zurich grass record the database holds, three of them from
    stagakis-s2024, the study the label names, and they fill the four slots that distinguish the entry
    from its neighbours. The rest are transparent transfers: albedo, the snowpack limit and phenology
    from Helsinki, emissivity and water storage from SE England, porosity from an unreferenced dummy record
    and the ohm coefficients from the unreferenced "Short grass [30]" set. Three observations belong to
    other reviews rather than this one. db/sources.yml gives stagakis-s2024 the year 2025 while the label
    and the source key read 2024, which is a source registry matter. records/surfaces/grass/zurich--ao2018--lai
    declares place zurich while db/sources.yml titles ao2018 an evaluation at a dense urban site in Shanghai,
    which that record''s own evidence review must settle. And records/surfaces/grass/london--havu-m2024--drainage
    declares place london while its name reads "Grass - Helsinki, Zurich, Beijing"; the drainage selection
    is defensible under either reading, so this review is not blocked by it.'
