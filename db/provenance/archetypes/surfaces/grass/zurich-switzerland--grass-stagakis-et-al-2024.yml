  scientific_note: 'Three of the twelve components declare place zurich and cite stagakis-s2024 for
    leaf area index, leaf-growth power and the directly stated parts of the biogenic CO2 configuration;
    the LAI-power record separately preserves Järvi provenance for its inherited leaves, and the biogenic
    record preserves Bellucco and Järvi field provenance. The maximum-conductance component retains Zurich
    in its path and origin but is now explicitly the fitted Helsinki/Havu value.
    Together these four selected records distinguish the entry from its neighbours without claiming four
    local determinations. The rest are transparent transfers: generic literature albedo, emissivity and
    drainage, a generic dummy porosity adapter, water storage from SE England, the snowpack limit and
    phenology from Helsinki,
    and the ohm coefficients from the unreferenced "Short grass [30]" set. Two observations belong to
    other reviews rather than this one. db/sources.yml gives stagakis-s2024 the year 2025 while the label
    and the source key read 2024, which is a source registry matter. The drainage component is openly generic
    literature evidence rather than a Zurich observation. The composite now uses site representativeness
    because its biogenic CO2 and LAI-power components are supported at the four studied park sites rather
    than city-wide.'
