      - component-surfaces-grass-zurich-ao2018-lai
      - component-surfaces-grass-zurich-stagakis-s2024-biogen-co2
      - component-surfaces-grass-zurich-stagakis-s2024-lai-power
      - component-surfaces-grass-zurich-stagakis-s2024-max-conductance
      note: 'The composite declares target land_cover.grass. Eleven of the twelve components declare target
        land_cover.grass and the twelfth, records/ohm/generic--unreferenced--grass, declares target ohm_coefficients,
        which is what the ohm slot takes: docs/FORMAT.md puts the four season and wetness positions of
        supy''s ohm_coef on the archetype rather than on the coefficient records. Surface records carry
        no attaches_to field, which in this database appears only on the profile records under records/profiles/,
        so the slot check rests on the parameter names each component carries, and every slot receives
        a component holding the fields that slot names. The ohm component is named "Short grass [30]",
        the grass-specific coefficient set rather than a vegetation average, and it fills all four positions
        because it declares no season_label and no wet or dry distinction.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters of its own, so it overrides no component value; the exported
        fragment is its components merged into their slots.
    source:
      conclusion: not_applicable
      note: The composite declares no source field and asserts no parameters of its own, so there is no
        published composition rationale to review. The archetype format does allow a composite to carry
        a source, as the snow archetypes do for the scalars they assert themselves, and this entry carries
        none. Each component's own source belongs to that component's evidence assessment.
    place:
      conclusion: supported
      evidence_ids:
      - component-surfaces-grass-zurich-ao2018-lai
      - component-surfaces-grass-zurich-stagakis-s2024-biogen-co2
      - component-surfaces-grass-helsinki-vargo2013-albedo
      - component-surfaces-grass-london-havu-m2024-drainage
      note: 'The composite declares place zurich, which db/places.yml gives as lat 47.37, lon 8.54, koppen
        Cfb. Four of the twelve components declare place zurich, filling leaf_area_index, leaf_growth_power,
        max_vegetation_conductance and biogen_co2, and they are every Zurich grass record the database
        holds. Three declare place helsinki (koppen Dfb), filling albedo, snow_lim_patch and vegetation_growth,
        and two declare place se-england (koppen Cfb), filling emissivity and water_storage; porosity
        declares place generic and the ohm component carries no place field. One component deserves a
        note that this review does not settle: records/surfaces/grass/zurich--ao2018--lai declares place
        zurich and origin Zurich, while db/sources.yml titles ao2018 "Evaluation of the Surface Urban
        Energy and Water balance Scheme (SUEWS) at a dense urban site in Shanghai: Sensitivity to anthropogenic
        heat and irrigation". The declared place is what this composite rests on and it fits, and it is
        the only Zurich leaf-area record in the database; whether the placement is right belongs to that
        record''s own evidence review. One component has to be recorded without being settled here. records/surfaces/grass/london--havu-m2024--drainage
        declares place london and origin London while its name reads "Grass - Helsinki, Zurich, Beijing".
        Under the declared place it is a London value standing in for Zurich; under its own name it is
        the set havu-m2024 intended for Zurich among others. The selection is defensible for the drainage
        slot on either reading, so this review is not blocked by it, and which of the two fields is authoritative
        is a question for that record''s own evidence review.'
    representativeness:
      conclusion: supported
      evidence_ids:
      - component-surfaces-grass-se-england-ward2016-emissivity
      - component-surfaces-grass-se-england-ward2016-water-storage
      - component-surfaces-grass-generic-unreferenced-porosity
      note: The composite declares representativeness city. Eight components declare city, two declare
        regional, records/surfaces/grass/generic--unreferenced--porosity declares generic and the ohm
        component carries no representativeness field. No component is classed narrower than the composite,
        so nothing site-specific is offered as a city typology, and this entry rests on city-classed values
        in more slots than any other of the nine grass composites.
    method:
      conclusion: supported
      evidence_ids: *id001
      note: An assembly of twelve existing records into the twelve slots the vegetation archetypes use,
        and assembled is the method a composition sidecar takes. The composite produces no value of its
        own.
    identity:
      conclusion: supported
      evidence_ids: *id001
      note: The uses block fills all twelve slots the vegetation archetypes use, namely albedo, emissivity,
        water_storage, leaf_area_index, leaf_growth_power, drainage, max_vegetation_conductance, porosity,
        biogen_co2, snow_lim_patch, vegetation_growth and ohm, which is the slot vocabulary every land_cover.grass,
        land_cover.dectr and land_cover.evetr archetype in the database uses, so no slot is missing. The
        ohm slot names one record in all four positions. This is the only Zurich grass composite in the
        database and no other archetype repeats its uses block; the three nearest entries, archetypes/surfaces/grass/beijing-china--grass,
        archetypes/surfaces/grass/helsinki-finland--grass-havu-et-al-2024 and archetypes/surfaces/grass/helsinki-finland--low-vegetation-havu-et-al-2024,
        each differ from it in the leaf_area_index, leaf_growth_power, max_vegetation_conductance and
        biogen_co2 slots, which are the slots each local study supplies.
