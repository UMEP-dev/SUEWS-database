  scientific_note: 'The selection holds up and the label is honest about it. Six of the twelve components
    declare place helsinki and four declare source havu-m2024. Those four plus the Järvi-sourced drainage
    record present in Havu''s archive are precisely the five slots in which this composite differs from
    its neighbours, so the entry is what its name says: the
    Helsinki grass configuration of that study, with its Havu leaf-area record now correctly placed in
    Helsinki, resting on SE England values for emissivity and water storage, on a generic vargo2013 albedo,
    on jarvi2014 for the snowpack limit and phenology,
    and on unreferenced generic sets for porosity and the ohm coefficients. Three Helsinki grass records
    go unused here, the two jarvi2014 drainage records and the mixed-low-vegetation biogenic CO2 record
    that separates this entry from its low-vegetation sibling; taking the drainage record compiled in
    Havu''s archive rather than a jarvi2014 one keeps the composite within the study configuration while
    crediting the original Järvi source. This entry and archetypes/surfaces/grass/helsinki-finland--low-vegetation-havu-et-al-2024
    differ in one slot only, which is the lawn against mixed-low-vegetation distinction their names carry;
    the drainage component is now explicitly generic literature evidence with archived Helsinki reuse.'
