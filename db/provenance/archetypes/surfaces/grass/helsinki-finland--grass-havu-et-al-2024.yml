  scientific_note: 'The selection holds up and the label is honest about it. Six of the twelve components
    declare place helsinki and five declare source havu-m2024, and the five havu-m2024 slots are precisely
    those in which this composite differs from its neighbours, so the entry is what its name says: the
    Helsinki grass configuration of that study, resting on ward2016 SE England values for emissivity,
    water storage and leaf area, on vargo2013 for albedo, on jarvi2014 for the snowpack limit and phenology,
    and on unreferenced generic sets for porosity and the ohm coefficients. Three Helsinki grass records
    go unused here, the two jarvi2014 drainage records and the mixed-low-vegetation biogenic CO2 record
    that separates this entry from its low-vegetation sibling; taking havu-m2024''s own drainage record
    rather than a jarvi2014 one keeps the composite within the study it cites. Two things a reader should
    carry forward without acting on them here: records/surfaces/grass/london--havu-m2024--drainage declares
    place london while its name reads "Grass - Helsinki, Zurich, Beijing", which its own evidence review
    must settle; and this entry and archetypes/surfaces/grass/helsinki-finland--low-vegetation-havu-et-al-2024
    differ in one slot only, which is the lawn against mixed-low-vegetation distinction their names carry.'
