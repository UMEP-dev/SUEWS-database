      note: The composite's name reads "Grass (Havu et al 2024)", its place reads helsinki and its origin
        reads Helsinki, Finland. Five of the twelve components declare source havu-m2024, filling leaf_area_index,
        leaf_growth_power, drainage, max_vegetation_conductance and biogen_co2, and those five are exactly
        the slots in which this composite differs from its neighbours, so the study named in the label
        is the one that gives the entry its identity. The remaining slots declare other sources, vargo2013
        for albedo, ward2016 for emissivity and water_storage, jarvi2014 for snow_lim_patch and vegetation_growth,
        and unreferenced for porosity and ohm; the label names the study the configuration follows rather
        than the source of every component.
    target:
      conclusion: supported
      evidence_ids: &id001
      - component-ohm-generic-unreferenced-grass
      - component-surfaces-grass-generic-unreferenced-porosity
      - component-surfaces-grass-helsinki-havu-m2024-biogen-co2
