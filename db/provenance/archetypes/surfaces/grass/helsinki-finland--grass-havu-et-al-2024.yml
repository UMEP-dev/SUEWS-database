      - component-surfaces-grass-se-england-ward2016-water-storage
      note: 'The composite declares target land_cover.grass. Eleven of the twelve components declare target
        land_cover.grass and the twelfth, records/ohm/generic--unreferenced--grass, declares target ohm_coefficients,
        which is what the ohm slot takes: docs/FORMAT.md puts the four season and wetness positions of
        supy''s ohm_coef on the archetype rather than on the coefficient records. Surface records carry
        no attaches_to field, which in this database appears only on the profile records under records/profiles/,
        so the slot check rests on the parameter names each component carries, and every slot receives
        a component holding the fields that slot names. The ohm component is named "Short grass [30]",
        the grass-specific coefficient set rather than a vegetation average, and it fills all four positions
        because it declares no season_label and no wet or dry distinction.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters of its own, so it overrides no component value; the exported
        fragment is its components merged into their slots.
    source:
      conclusion: not_applicable
      note: The composite declares no source field and asserts no parameters of its own, so there is no
        published composition rationale to review. The archetype format does allow a composite to carry
        a source, as the snow archetypes do for the scalars they assert themselves, and this entry carries
        none. Each component's own source belongs to that component's evidence assessment.
    place:
      conclusion: supported
      evidence_ids:
      - component-surfaces-grass-helsinki-vargo2013-albedo
      - component-surfaces-grass-se-england-havu-m2024-lai
      - component-surfaces-grass-se-england-ward2016-emissivity
      - component-surfaces-grass-london-havu-m2024-drainage
      note: The composite declares place helsinki, which db/places.yml gives as lat 60.17, lon 24.94,
        koppen Dfb. Six of the twelve components declare place helsinki, filling albedo, leaf_growth_power,
        max_vegetation_conductance, biogen_co2, snow_lim_patch and vegetation_growth. Three declare place
        se-england (koppen Cfb, subnational), filling emissivity, water_storage and leaf_area_index; the
        leaf_area_index component, records/surfaces/grass/se-england--havu-m2024--lai, is a record of
        the same study placed in SE England and named "Grass (SE England)", and the database holds no
        Helsinki leaf-area record. porosity declares place generic and the ohm component carries no place
        field. The two unused Helsinki drainage records, records/surfaces/grass/helsinki--jarvi2014--drainage
        and records/surfaces/grass/helsinki--jarvi2014--drainage--grass-irrigated, come from a different
        study, so taking havu-m2024's own drainage record keeps the composite within the study it is named
        for. One component has to be recorded without being settled here. records/surfaces/grass/london--havu-m2024--drainage
        declares place london and origin London while its name reads "Grass - Helsinki, Zurich, Beijing".
        Under the declared place it is a London value standing in for Helsinki; under its own name it
        is the set havu-m2024 intended for Helsinki among others. The selection is defensible for the
        drainage slot on either reading, so this review is not blocked by it, and which of the two fields
        is authoritative is a question for that record's own evidence review.
    representativeness:
      conclusion: supported
      evidence_ids:
      - component-surfaces-grass-se-england-havu-m2024-lai
      - component-surfaces-grass-se-england-ward2016-emissivity
      - component-surfaces-grass-se-england-ward2016-water-storage
      - component-surfaces-grass-generic-unreferenced-porosity
      note: The composite declares representativeness city. Seven components declare city, three declare
        regional, records/surfaces/grass/generic--unreferenced--porosity declares generic and the ohm
        component carries no representativeness field. No component is classed narrower than the composite,
        so nothing site-specific is offered as a city typology, and the three regional components are
        classed broader, the direction that does not over-claim on scale.
    method:
      conclusion: supported
      evidence_ids: *id001
      note: An assembly of twelve existing records into the twelve slots the vegetation archetypes use,
        and assembled is the method a composition sidecar takes. The composite produces no value of its
        own.
    identity:
      conclusion: supported
      evidence_ids: *id001
      related_records:
      - archetypes/surfaces/grass/helsinki-finland--low-vegetation-havu-et-al-2024
      note: 'The uses block fills all twelve slots the vegetation archetypes use, namely albedo, emissivity,
        water_storage, leaf_area_index, leaf_growth_power, drainage, max_vegetation_conductance, porosity,
        biogen_co2, snow_lim_patch, vegetation_growth and ohm, which is the slot vocabulary every land_cover.grass,
        land_cover.dectr and land_cover.evetr archetype in the database uses, so no slot is missing. The
        ohm slot names one record in all four positions. The entry is not unique in its component set
        in the strict sense: archetypes/surfaces/grass/helsinki-finland--low-vegetation-havu-et-al-2024
        takes the same eleven components and differs only in the biogen_co2 slot, where it takes records/surfaces/grass/helsinki--havu-m2024--biogen-co2--mixed-low-vegetation
        ("Mixed low vegetation") in place of records/surfaces/grass/helsinki--havu-m2024--biogen-co2 ("Grass
        (lawn)"). That single difference is the distinction the two names carry, lawn against mixed low
        vegetation, so the pair is a deliberate split rather than a duplication.'
