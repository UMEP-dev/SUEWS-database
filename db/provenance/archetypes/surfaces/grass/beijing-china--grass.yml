      note: The composite declares place beijing. Two of twelve components carry that place; one site-scoped
        biogenic record carries place espoo, one site-scoped water-storage record carries place swindon,
        the phenology record carries place helsinki, six components are generic and the OHM record carries
        no place. Snowpack limit and drainage are generic literature inputs. The Espoo, Swindon and Helsinki
        selections need an explicit composition rationale rather than being presented as Beijing evidence.
    representativeness:
