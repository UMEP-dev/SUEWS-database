      - component-surfaces-grass-se-england-ward2016-lai
      - component-surfaces-grass-se-england-ward2016-water-storage
      note: 'The composite declares target land_cover.grass. Eleven of the twelve components declare target
        land_cover.grass and the twelfth, records/ohm/generic--unreferenced--grass, declares target ohm_coefficients,
        which is what the ohm slot takes: docs/FORMAT.md puts the four season and wetness positions of
        supy''s ohm_coef on the archetype rather than on the coefficient records. Surface records carry
        no attaches_to field, which in this database appears only on the profile records under records/profiles/,
        so the slot check rests on the parameter names each component carries, and every slot receives
        a component holding the fields that slot names. The ohm component is named "Short grass [30]",
        the grass-specific coefficient set rather than a vegetation average, and it fills all four positions
        because it declares no season_label and no wet or dry distinction.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters of its own, so it overrides no component value; the exported
        fragment is its components merged into their slots.
    source:
      conclusion: not_applicable
      note: The composite declares no source field and asserts no parameters of its own, so there is no
        published composition rationale to review. The archetype format does allow a composite to carry
        a source, as the snow archetypes do for the scalars they assert themselves, and this entry carries
        none. Each component's own source belongs to that component's evidence assessment.
    place:
      conclusion: supported
      evidence_ids:
      - component-surfaces-grass-beijing-zheng-y2023-lai-power
      - component-surfaces-grass-beijing-zheng-y2023-max-conductance
      - component-surfaces-grass-beijing-zheng-y2023-biogen-co2
      - component-surfaces-grass-helsinki-vargo2013-albedo
      - component-surfaces-grass-se-england-ward2016-emissivity
      - component-surfaces-grass-london-havu-m2024-drainage
      note: The composite declares place beijing, which db/places.yml gives as lat 39.9, lon 116.41, koppen
        Dwa. Two of the twelve components declare place beijing, filling leaf_growth_power and max_vegetation_conductance;
        biogen_co2 declares place espoo for its fitted lawn evidence, and no unused Beijing grass record
        exists for any remaining slot. One declares place helsinki (koppen Dfb), filling snow_lim_patch,
        and one declares place se-england (koppen Cfb, subnational), filling water_storage; phenology,
        drainage, albedo, emissivity, leaf_area_index and porosity declare place generic; and the ohm component carries
        no place field. Ten of twelve slots
        are therefore filled from outside China because the database offers nothing closer, which is a
        transparent transfer rather than a defect. The drainage component is a generic grass parameter
        published by Järvi et al.; its Havu archive locator records later reuse rather than a Beijing fit.
    representativeness:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-grass-beijing-zheng-y2023-lai-power
      - component-surfaces-grass-beijing-zheng-y2023-biogen-co2
      - component-surfaces-grass-se-england-ward2016-emissivity
      - component-surfaces-grass-se-england-ward2016-water-storage
      - component-surfaces-grass-se-england-ward2016-lai
      - component-surfaces-grass-helsinki-vargo2013-albedo
      - component-surfaces-grass-generic-unreferenced-porosity
      note: The composite declares representativeness city, but its leaf_growth_power component is now
        correctly classed site because the coefficients were fitted to one park, and its biogenic CO2
        component is site evidence from one Espoo lawn. A city archetype therefore contains two narrower
        site-only fits. Whether to retain them knowingly or narrow the composite is
        a separate composition-curation decision; the regional water-storage component and the six
        generic components are broader than the composite and do not create the same over-claim.
    method:
      conclusion: supported
      evidence_ids: *id001
      note: An assembly of twelve existing records into the twelve slots the vegetation archetypes use,
        and assembled is the method a composition sidecar takes. The composite produces no value of its
        own.
    identity:
      conclusion: supported
      evidence_ids: *id001
      note: 'The uses block fills all twelve slots the vegetation archetypes use, namely albedo, emissivity,
        water_storage, leaf_area_index, leaf_growth_power, drainage, max_vegetation_conductance, porosity,
        biogen_co2, snow_lim_patch, vegetation_growth and ohm, which is the slot vocabulary every land_cover.grass,
        land_cover.dectr and land_cover.evetr archetype in the database uses, so no slot is missing. The
        ohm slot names one record in all four positions. This is the only Beijing grass composite in the
        database, and its uses block is not repeated anywhere: the three nearest entries, archetypes/surfaces/grass/helsinki-finland--grass-havu-et-al-2024,
        archetypes/surfaces/grass/helsinki-finland--low-vegetation-havu-et-al-2024 and archetypes/surfaces/grass/zurich-switzerland--grass-stagakis-et-al-2024,
        each differ from it in the leaf_area_index, leaf_growth_power, max_vegetation_conductance and
        biogen_co2 slots.'
