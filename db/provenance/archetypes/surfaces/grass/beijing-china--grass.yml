  scientific_note: 'The mapping is sound and the selection is defensible, but the entry is only in part
    a Beijing set. Three of its twelve components declare place beijing, filling leaf_growth_power, max_vegetation_conductance
    and biogen_co2 from zheng-y2023, and those three are every Beijing grass record the database holds,
    so the other nine slots had no local option to take. The radiative and hydrological slots come from
    generic literature, Helsinki, London and SE England, and the ohm slot from an unreferenced generic set named "Short grass [30]".
    A reader should treat the composite as the phenology and conductance parameters zheng-y2023 fitted
    for Beijing, carried on borrowed values elsewhere, rather than as a set observed in Beijing; every
    component''s own place is declared on its record, so the transfer is visible rather than hidden. The
    leaf_growth_power component is a one-park site fit inside this city-classed composite, which now requires
    explicit composition curation rather than being treated as city-wide evidence. One field-level inconsistency
    is also worth carrying forward without acting on it here: records/surfaces/grass/london--havu-m2024--drainage
    declares place london while its name reads "Grass - Helsinki, Zurich, Beijing", and settling which
    field is authoritative belongs to that record''s evidence review, not to this one.'
