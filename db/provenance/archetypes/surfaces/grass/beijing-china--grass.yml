  scientific_note: 'The mapping is sound and the selection is defensible, but the entry is only in part
    a Beijing set. Two of its twelve components declare place beijing, filling leaf_growth_power and max_vegetation_conductance
    from zheng-y2023. The Zheng-sourced biogen_co2 component retains its stable Beijing path but is now
    correctly scoped to the Espoo lawn where beta was fitted, so the other ten slots have no Beijing evidence.
    The radiative and hydrological slots come from generic literature, Helsinki, London and SE England;
    phenology is a generic mixed-source assumed tuple, and the ohm slot comes from an unreferenced generic set named "Short grass [30]".
    A reader should treat the composite as the conductance parameters zheng-y2023 fitted
    for Beijing, carried on borrowed values elsewhere, rather than as a set observed in Beijing; every
    component''s own place is declared on its record, so the transfer is visible rather than hidden. The
    leaf_growth_power component is a one-park site fit and the biogenic CO2 component is one-lawn site
    evidence inside this city-classed composite, which requires explicit composition curation rather
    than being treated as city-wide evidence. The phenology component separately retains its 10-versus-11
    source conflict, and drainage is openly generic literature evidence rather than a Beijing observation.'
