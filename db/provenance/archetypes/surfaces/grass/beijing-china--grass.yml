      note: The composite's name reads Grass, its place reads beijing and its origin reads Beijing, China,
        so the label together with the entry path identifies a grass surface for Beijing. The label on
        its own is the barest of the nine grass composites, the other eight naming a study or a qualifier,
        so the place field and the path carry the distinction. Two components declare place beijing and
        source zheng-y2023; the third Zheng-sourced component is now correctly scoped to its Espoo evidence
        site while retaining its stable Beijing path.
