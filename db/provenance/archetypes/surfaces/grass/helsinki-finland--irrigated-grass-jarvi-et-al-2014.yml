  scientific_note: 'The assembly is coherent as an irrigated Helsinki grass surface: max_vegetation_conductance
    takes the generic record named "Irrigated Grass" rather than the Helsinki record named simply "Grass",
    because the jarvi2011 pair
    is the only irrigation-differentiated conductance the database holds, and that distinction is what
    the composite exists to carry. The label is looser than the assembly: only three of twelve components
    declare source jarvi2014, three more declare havu-m2024, and the albedo slot takes the irrigation-neutral
    Vargo grassland class because it is the only Helsinki-path grass albedo record there is. What a maintainer
    has to settle is the ohm slot. All four season and wetness positions take records/ohm/generic--unreferenced--all-vegetation--vegetation-average-200-this-is-the-average-of-codes-20-30-50-51-52-53-60-i-e-includes-soil-and-water,
    a set the record itself describes as an average that includes soil and water, while five of the nine
    grass composites take the grass-specific "Short grass [30]" set instead. Only this entry and its unirrigated
    sibling take the average. Changing it would change a model input, so the decision is a maintainer''s
    and should be taken for both entries at once.'
