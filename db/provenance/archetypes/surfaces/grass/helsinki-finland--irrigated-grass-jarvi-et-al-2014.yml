      - component-surfaces-grass-se-england-havu-m2024-lai
      - component-surfaces-grass-se-england-ward2016-emissivity
      - component-surfaces-grass-helsinki-jarvi2014-drainage-grass-irrigated
      - component-surfaces-grass-helsinki-vargo2013-albedo
      note: The composite declares place helsinki, which db/places.yml gives as lat 60.17, lon 24.94,
        koppen Dfb. Six of the twelve components declare place helsinki, filling leaf_area_index, leaf_growth_power,
        drainage, biogen_co2, snow_lim_patch and vegetation_growth. Two declare place
        se-england (koppen Cfb, subnational), filling emissivity and water_storage. albedo, porosity and
        max_vegetation_conductance declare place generic, and the ohm component carries no place field.
        A Helsinki conductance alternative exists, records/surfaces/grass/helsinki--havu-m2024--max-conductance,
        but it is named simply "Grass" and draws no irrigation distinction, whereas the jarvi2011 pair
        named "Irrigated Grass" and "Unirrigated Grass" is the only irrigation-differentiated conductance
        in the database. Taking the generic irrigation-specific record therefore preserves the feature
        the composite exists to represent without importing evidence from another city.
    representativeness:
