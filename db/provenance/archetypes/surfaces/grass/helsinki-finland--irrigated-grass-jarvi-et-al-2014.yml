      - component-surfaces-grass-helsinki-vargo2013-albedo
      - component-surfaces-grass-se-england-havu-m2024-lai
      - component-surfaces-grass-se-england-ward2016-emissivity
      - component-surfaces-grass-se-england-ward2016-water-storage
      - component-surfaces-grass-vancouver-jarvi2011-max-conductance
      note: 'The composite declares target land_cover.grass. Eleven of the twelve components declare target
        land_cover.grass and the twelfth, records/ohm/generic--unreferenced--all-vegetation--vegetation-average-200-this-is-the-average-of-codes-20-30-50-51-52-53-60-i-e-includes-soil-and-water,
        declares target ohm_coefficients, which is what the ohm slot takes: docs/FORMAT.md puts the four
        season and wetness positions of supy''s ohm_coef on the archetype rather than on the coefficient
        records. Surface records carry no attaches_to field, which in this database appears only on the
        profile records under records/profiles/, so the slot check rests on the parameter names each component
        carries, and every slot receives a component holding the fields that slot names. The ohm slot
        is the one that does not sit right. It receives the a1, a2 and a3 coefficients it names, but from
        a set whose declared scope is wider than the composite''s surface: the component is named "Vegetation
        (average). [200] This is the average of Codes 20, 30, 50, 51, 52, 53, 60 (i.e. includes soil and
        water).", so the record itself states that it averages vegetated, bare-soil and water surfaces,
        and it fills all four season and wetness positions of a composite whose target is land_cover.grass.
        The database holds a grass-specific unreferenced set, records/ohm/generic--unreferenced--grass,
        named "Short grass [30]", which five of the nine grass composites take; archetypes/surfaces/grass/helsinki-finland--irrigated-grass-jarvi-et-al-2014
        and archetypes/surfaces/grass/helsinki-finland--unirrigated-grass-jarvi-et-al-2014 are the only
        two taking the vegetation average. Substituting one for the other changes a model input, so it
        is not a correction to make from a composition review. A maintainer should decide whether the
        vegetation-average set is what the legacy composite rows intended for these two entries or an
        artefact of the migration, and settle both together.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters of its own, so it overrides no component value; the exported
        fragment is its components merged into their slots.
    source:
      conclusion: not_applicable
      note: The composite declares no source field and asserts no parameters of its own, so there is no
        published composition rationale to review. The archetype format does allow a composite to carry
        a source, as the snow archetypes do for the scalars they assert themselves, and this entry carries
        none. Each component's own source belongs to that component's evidence assessment.
    place:
