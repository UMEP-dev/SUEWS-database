      - component-surfaces-grass-helsinki-vargo2013-albedo
      note: 'The composite''s name reads "Irrigated Grass, Järvi et al (2014)", its place reads helsinki
        and its origin reads Helsinki, Finland, and the entry path spells the same author jarvi as the
        path slug convention requires. Three of the twelve components declare source jarvi2014, filling
        drainage, snow_lim_patch and vegetation_growth, and three more declare source havu-m2024, filling
        leaf_area_index, leaf_growth_power and biogen_co2, so the study in the label supplies a quarter
        of the assembly rather than most of it. The irrigated qualifier is carried by two components that
        do declare it: records/surfaces/grass/helsinki--jarvi2014--drainage--grass-irrigated, named "Grass,
        irrigated", and records/surfaces/grass/vancouver--jarvi2011--max-conductance, named "Irrigated
        Grass". records/surfaces/grass/helsinki--vargo2013--albedo is the only Helsinki grass albedo record
        in the database, so the albedo slot had no alternative. Its corrected name, "Grassland/herbaceous",
        makes no irrigation claim and is therefore neutral rather than contradictory within this assembly.'
    target:
      conclusion: curation_required
      evidence_ids: &id001
      - component-ohm-generic-unreferenced-all-vegetation-vegetation-average-200-this-is-the-average-of-codes-20-30-50-51-52-53-60-i-e-includes-soil-and-water
