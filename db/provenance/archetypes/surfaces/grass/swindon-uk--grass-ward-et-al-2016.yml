      - component-surfaces-common-se-england-ruimy1995-biogen-co2
      note: The composite's name reads "Grass Ward et al. (2016)", its place reads swindon and its origin
        reads Swindon, UK. Three of the thirteen components declare source ward2016, filling albedo and
        both ohm positions. The other ten use independently declared sources; ward2018 for drainage,
        breuer2003 for max_vegetation_conductance, ruimy1995 for biogen_co2, jarvi2014 for snow_lim_patch,
        vegetation_growth and leaf_growth_power, jarvi2011 for emissivity, leaf_area_index and
        water_storage, and unreferenced for porosity.
        The name field is identical to that of archetypes/surfaces/grass/london-uk--grass-ward-et-al-2016,
        so the label alone does not distinguish the two entries; the place field and the entry path do.
        Nothing the label claims is contradicted by the assembly.
    target:
      conclusion: supported
      evidence_ids: &id001
      - component-ohm-generic-ward2016-all-vegetation
      - component-ohm-generic-ward2016-all-vegetation-code-201-x-multiplier-for-winter-2012
      - component-surfaces-common-se-england-ruimy1995-biogen-co2
      - component-surfaces-grass-generic-unreferenced-porosity
      - component-surfaces-grass-helsinki-jarvi2014-phenology
      - component-surfaces-grass-helsinki-jarvi2014-snow-lim
      - component-surfaces-grass-se-england-ward2016-albedo
      - component-surfaces-grass-se-england-ward2016-drainage
      - component-surfaces-grass-se-england-ward2016-emissivity
      - component-surfaces-grass-se-england-ward2016-lai
      - component-surfaces-grass-se-england-ward2016-lai-power
      - component-surfaces-grass-se-england-ward2016-max-conductance
      - component-surfaces-grass-se-england-ward2016-water-storage
      note: 'The composite declares target land_cover.grass. Ten of the thirteen components declare target
        land_cover.grass. records/surfaces/common/se-england--ruimy1995--biogen-co2 declares target land_cover.common,
        which docs/FORMAT.md defines as the surface-agnostic target used "for surface-agnostic sets such
        as soils", so a plant-canopy CO2 set declared common is admissible in the biogen_co2 slot of a
        grass composite. The remaining two declare target ohm_coefficients, which is what the ohm slot
        takes: docs/FORMAT.md puts the four season and wetness positions of supy''s ohm_coef on the archetype
        rather than on the coefficient records. Surface records carry no attaches_to field, which in this
        database appears only on the profile records under records/profiles/, so the slot check rests
        on the parameter names each component carries, and every slot receives a component holding the
        fields that slot names. The season mapping is right: records/ohm/generic--ward2016--all-vegetation
        declares season_label Summer and fills summer_wet and summer_dry, and records/ohm/generic--ward2016--all-vegetation--code-201-x-multiplier-for-winter-2012
        declares season_label Winter and fills winter_wet and winter_dry; neither declares a wet or dry
        distinction, so one set fills both positions within its season. Both are all-vegetation sets rather
        than grass-specific ones, but ward2016 contributes no grass-specific coefficient record to this
        database, its vegetation entries being the summer and winter forms of code 201, so the all-vegetation
        set is the only choice consistent with the study the composite is named for.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters of its own, so it overrides no component value; the exported
        fragment is its components merged into their slots.
    source:
      conclusion: not_applicable
      note: The composite declares no source field and asserts no parameters of its own, so there is no
        published composition rationale to review. The archetype format does allow a composite to carry
        a source, as the snow archetypes do for the scalars they assert themselves, and this entry carries
        none. Each component's own source belongs to that component's evidence assessment.
    place:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-grass-helsinki-jarvi2014-phenology
      - component-surfaces-grass-helsinki-jarvi2014-snow-lim
      - component-surfaces-grass-se-england-ward2016-albedo
      - component-surfaces-common-se-england-ruimy1995-biogen-co2
      related_records:
      - records/surfaces/grass/se-england--ward2016--phenology
      note: The composite declares place swindon, which db/places.yml gives as lat 51.56, lon -1.78, koppen
        Cfb. Six of the thirteen components declare place se-england, which db/places.yml gives as lat
        51.2, lon -0.8, koppen Cfb and subnational true, a region containing Swindon and sharing its koppen
        class; porosity, emissivity and leaf_area_index declare place generic, and the two ohm components
        carry no place field. The remaining
        two slots, snow_lim_patch and vegetation_growth, take Helsinki records (koppen Dfb). For snow_lim_patch
        that is forced, because records/surfaces/grass/helsinki--jarvi2014--snow-lim is the only grass
        record in the database carrying snowpack_limit. For vegetation_growth it is not. records/surfaces/grass/se-england--ward2016--phenology
        exists, declaring target land_cover.grass, place se-england, representativeness regional and source
        ward2016. No archetype in the database references it, while all nine grass composites
        take the Helsinki phenology record instead. The two records hold different values, so exchanging
        them changes a model input and this review does not propose it; a maintainer should decide whether
        Helsinki phenology inside a Ward et al. (2016) SE England composite is deliberate or an artefact
        of the migration, and settle the question for both this entry and its counterpart at once.
    representativeness:
      conclusion: supported
      evidence_ids:
      - component-surfaces-grass-se-england-ward2016-albedo
      - component-surfaces-grass-se-england-ward2016-lai
      - component-surfaces-grass-helsinki-jarvi2014-phenology
      - component-surfaces-grass-generic-unreferenced-porosity
      note: 'The composite declares representativeness city. Six components declare regional, two declare
        city, being the Helsinki snow_lim_patch and vegetation_growth records, porosity, emissivity and
        leaf_area_index declare generic, and the two ohm components carry no representativeness field.
        No component is classed narrower than the composite, so nothing site-specific is offered as a
        city typology. The two city archetypes use the same shared component set and carry nothing specific
        to Swindon, which is what
        makes it indistinguishable from archetypes/surfaces/grass/london-uk--grass-ward-et-al-2016; that
        is taken under identity.'
    method:
      conclusion: supported
      evidence_ids: *id001
      note: An assembly of thirteen existing records into the twelve slots the vegetation archetypes use,
        the ohm slot taking a summer set and a winter set, and assembled is the method a composition sidecar
        takes. The composite produces no value of its own.
    identity:
      conclusion: curation_required
      evidence_ids: *id001
      related_records:
      - archetypes/surfaces/grass/london-uk--grass-ward-et-al-2016
      note: 'The uses block fills all twelve slots the vegetation archetypes use, namely albedo, emissivity,
        water_storage, leaf_area_index, leaf_growth_power, drainage, max_vegetation_conductance, porosity,
        biogen_co2, snow_lim_patch, vegetation_growth and ohm, which is the slot vocabulary every land_cover.grass,
        land_cover.dectr and land_cover.evetr archetype in the database uses, so no slot is missing. The
        ohm slot names a summer set and a winter set, which is why thirteen distinct records fill twelve
        slots. The entry is not unique: archetypes/surfaces/grass/london-uk--grass-ward-et-al-2016 carries
        a byte-identical uses block and the identical name field, "Grass Ward et al. (2016)", differing
        from this entry only in archetype path, place, origin and legacy_id, this one declaring legacy_id
        24240025. Because the entries select the same components, neither holds anything specific to its
        city, so the two published typologies are the same values presented
        twice. The same pair of cities repeats this in three other surfaces: archetypes/surfaces/bsoil/london-uk--central-london-ward-et-al-2016
        and archetypes/surfaces/bsoil/swindon-uk--suburban-residential-ward-et-al-2016, archetypes/surfaces/dectr/london-uk--deciduous-tree-ward-et-al-2016
        and archetypes/surfaces/dectr/swindon-uk--deciduous-tree-ward-et-al-2016, and archetypes/surfaces/evetr/london-uk--evergreen-tree-ward-et-al-2016
        and archetypes/surfaces/evetr/swindon-uk--evergreen-tree-ward-et-al-2016 each carry an identical
        uses block. The duplicate-value quality warning in scripts/check_db.py scans entries under records/
        only, so make check does not report this. Whether to keep two city entries, collapse them into
        one SE England regional archetype, or differentiate them is a curation decision.'
