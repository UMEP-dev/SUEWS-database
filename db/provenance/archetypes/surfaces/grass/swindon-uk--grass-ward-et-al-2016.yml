  scientific_note: 'Read on its own the composite is coherent. Three of thirteen components declare source
    ward2016; maximum conductance is a Breuer et al. literature value applied through an SE England record,
    while emissivity, leaf_area_index and water_storage cite Järvi et al. (2011). Six components declare
    place se-england, a region that contains Swindon and shares its koppen
    class Cfb, and the ohm season mapping is right, the summer-labelled code 201 set filling summer_wet
    and summer_dry and the winter-labelled set filling winter_wet and winter_dry. Two questions need a
    maintainer. The first is the vegetation_growth slot, which takes records/surfaces/grass/helsinki--jarvi2014--phenology
    although records/surfaces/grass/se-england--ward2016--phenology is an available regional record
    referenced by no archetype at all; the snow_lim_patch slot beside it is forced, the Helsinki record being the only
    grass record carrying snowpack_limit, but the phenology slot is not. The second is that this entry
    and archetypes/surfaces/grass/london-uk--grass-ward-et-al-2016 carry byte-identical uses blocks and
    the identical name field and no city-specific component. The same duplication runs through the bsoil, dectr and
    evetr archetypes for the same two cities, so the pattern should be settled once rather than surface
    by surface. Neither question can be closed from the composition layer: exchanging the phenology component
    changes a model input, and collapsing or differentiating two published typologies is a curation decision.'
