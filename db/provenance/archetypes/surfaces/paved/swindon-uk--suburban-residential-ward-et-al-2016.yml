        and their keys do not overlap, so neither overrides the other. The two OHM components carry season_label:
        records/ohm/generic--ward2016--paved declares Summer and fills summer_wet and summer_dry, and
        records/ohm/generic--ward2016--paved--code-851-x-multiplier-for-winter-8512 declares Winter and
        fills winter_wet and winter_dry, so the season mapping follows each record''s own label. Neither
        carries a wetness label, so a season''s wet and dry positions taking the same record asserts nothing
        the records deny.'
