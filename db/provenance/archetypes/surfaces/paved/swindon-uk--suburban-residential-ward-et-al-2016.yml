  scientific_note: 'The selection follows the study the entry is named for. archetypes/surfaces/paved/swindon-uk--suburban-residential-ward-et-al-2016
    declares place swindon and representativeness city, and four of its eight components declare source
    ward2016. The one slot with a Swindon-specific ward2016 record, emissivity, takes it; albedo takes the
    se-england row from that study, water storage takes the Järvi et al. (2011) row, and drainage takes
    the Ward et al. (2018) SE England row, all classed regional and
    applied down to the town, which is the sound direction for a class difference. The season mapping
    is right, the Summer-labelled OHM record filling the two summer positions and the Winter-labelled
    one the two winter positions, and neither record carries a wetness label, so nothing is asserted by
    the wet and dry positions sharing coefficients. One alternative is worth naming so nobody has to rediscover
    it: records/surfaces/paved/swindon--ward2013--drainage is a Swindon record, classed site, referenced
    by no archetype, and the drainage slot passes over it for the regional row. Both drainage records
    declare source ward2018 and carry identical parameter values; only their place and representativeness
    differ. Preserving the regional reference keeps the established assembly stable, while deciding whether
    the duplicate records should be consolidated is separate curation.
    The remaining two slots leave the ward2016 set for want of alternatives: snow_lim_patch takes the
    only paved snowpack-limit record there is, and construction takes an archived internal fixture that
    contributes no exported value, since scripts/export_record.py keeps construction out of the surface
    fragment.'
