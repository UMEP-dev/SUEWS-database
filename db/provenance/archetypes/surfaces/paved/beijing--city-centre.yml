  scientific_note: 'archetypes/surfaces/paved/beijing--city-centre is a Beijing typology with no component
    measured or fitted in Beijing. records/ohm/beijing--zheng-y2023--paved supplies site-scale Alland evidence
    to all four season
    and wetness positions, and since it declares no season_label and is named ''An99 weighted average
    (all year)'' the four-way mapping contradicts nothing the record claims. Everything else is borrowed:
    albedo from a site in a Shanghai central business district, emissivity, water storage and snowpack
    limit from Helsinki, drainage from London,
    and the construction reference from a record named Placeholder. The database holds no paved surface
    record for Beijing, so borrowing as such is the design docs/FORMAT.md describes rather than a defect.
    One selection does not follow from scarcity. The composite took records/surfaces/paved/shanghai--ao2016--albedo,
    and records/surfaces/paved/shanghai--ao2016--emissivity sits in the database with the same site-scale
    Shanghai CBD setting and source, referenced by no archetype, while the emissivity slot reaches to Helsinki instead.
    Either the Shanghai pair was meant to be taken together and half of it was missed, or the Helsinki
    emissivity was judged the better value for Beijing; the files do not say which, and a maintainer should
    settle it. The drainage component is now documented as generic literature evidence; the construction
    component remains named Placeholder, a question for that record''s own evidence review. The construction reference changes no exported number in
    any case, because scripts/export_record.py deliberately keeps the construction slot out of the surface
    fragment. No composition source supports transferring the site-scale Shanghai albedo to city-scale
    Beijing.'
