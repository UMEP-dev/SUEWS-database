  scientific_note: 'archetypes/surfaces/paved/beijing--city-centre is a Beijing typology with no component
    measured or fitted in Beijing. records/ohm/beijing--zheng-y2023--paved supplies site-scale Alland evidence
    to all four season
    and wetness positions, and since it declares no season_label and is named ''Archived AN99 all-year
    paved configuration'' the four-way mapping contradicts nothing the record claims. Everything else is borrowed:
    albedo from a site in a Shanghai central business district; emissivity, water storage and drainage from
    generic Järvi et al. (2011) literature parameters; snowpack limit from Helsinki;
    and the construction reference from an archived internal construction fixture. The database holds no paved surface
    record for Beijing, so borrowing as such is the design docs/FORMAT.md describes rather than a defect.
    The related records/surfaces/paved/shanghai--ao2016--emissivity is no longer a paired Shanghai site record:
    it is generic Oke (1987) Asphalt-road literature evidence, with Shanghai retained only as migrated origin.
    It therefore does not settle the selected generic pavement emissivity. The drainage component is now documented as generic literature evidence; the construction
    component is explicitly retained as an archived internal fixture rather than an evidence-backed physical
    assembly. The construction reference changes no exported number in
    any case, because scripts/export_record.py deliberately keeps the construction slot out of the surface
    fragment. No composition source supports transferring the site-scale Shanghai albedo to city-scale
    Beijing.'
