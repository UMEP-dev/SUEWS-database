  scientific_note: 'archetypes/surfaces/paved/beijing--city-centre is a Beijing typology whose only Beijing
    content is its storage heat coefficients. records/ohm/beijing--zheng-y2023--paved fills all four season
    and wetness positions, and since it declares no season_label and is named ''An99 weighted average
    (all year)'' the four-way mapping contradicts nothing the record claims. Everything else is borrowed:
    albedo from Shanghai, emissivity, water storage and snowpack limit from Helsinki, drainage from London,
    and the construction reference from a record named Placeholder. The database holds no paved surface
    record for Beijing, so borrowing as such is the design docs/FORMAT.md describes rather than a defect.
    One selection does not follow from scarcity. The composite took records/surfaces/paved/shanghai--ao2016--albedo,
    and records/surfaces/paved/shanghai--ao2016--emissivity sits in the database with the same place and
    the same source, referenced by no archetype, while the emissivity slot reaches to Helsinki instead.
    Either the Shanghai pair was meant to be taken together and half of it was missed, or the Helsinki
    emissivity was judged the better value for Beijing; the files do not say which, and a maintainer should
    settle it. Two labels a reader should carry forward without acting on them here: the drainage component
    is named ''Paved [sample run]'' and the construction component is named Placeholder, both questions
    for those records'' own evidence reviews. The construction reference changes no exported number in
    any case, because scripts/export_record.py deliberately keeps the construction slot out of the surface
    fragment.'
