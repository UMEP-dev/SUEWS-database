  scientific_note: 'This is a country-scale default assembled almost entirely from one city''s rows. archetypes/surfaces/paved/sweden--asphalt-mixed-city
    declares place sweden and representativeness regional, and then takes its albedo, water storage and
    snowpack limit from Helsinki, its drainage from a generic literature record, its
    emissivity from a London/site spectral-library row for grey and white concrete, and its four OHM positions
    from a generic row whose source field reads unreferenced. The place side of that is not a defect:
    the database holds no Swedish paved record of any kind, so borrowing is forced, and borrowing across
    places is the design docs/FORMAT.md describes. The class side is the finding. Four city rows are standing
    in for a country, and a reader taking this entry as Sweden''s paved default is taking Helsinki''s
    albedo and snowpack limit and London''s drainage as representative of a country spanning far more
    than one climate. The database offers no way to fix that by re-pointing a slot, so the decision is
    about the entry rather than about its components: keep the regional class and say what justifies it,
    reclassify the entry to the scale its evidence actually supports, or withdraw it. The Swedish building-fabric
    records under records/constructions/ do not bear on this, because the construction slot contributes
    nothing to a paved surface fragment. The drainage record is now documented as generic literature
    evidence; the unreferenced source on the OHM record remains a question for that record''s own evidence review.'
