      note: 'The composite declares place zurich, which db/places.yml records as Zurich, Koppen Cfb, country
        switzerland. Not one of its seven components declares that place. Only the albedo slot takes a
        Helsinki record, which db/places.yml records as Koppen Dfb; emissivity, water_storage, snow_lim_patch
        and drainage take generic literature records; the construction
        record declares place generic and records/ohm/generic--unreferenced--paved declares no place.
        The database holds Zurich records elsewhere, under records/surfaces/evetr/, records/surfaces/grass/,
        records/surfaces/dectr/, records/surfaces/common/ and records/irrigation/, but none for land_cover.paved,
