      related_records:
      - archetypes/surfaces/paved/helsinki--city-centre
      - archetypes/surfaces/paved/helsinki--kumpula
      note: 'The composite declares place zurich, which db/places.yml records as Zurich, Koppen Cfb, country
        switzerland. Not one of its seven components declares that place. The albedo, emissivity, water_storage
        and snow_lim_patch slots take Helsinki records, which db/places.yml records as Koppen Dfb; the
        drainage slot takes records/surfaces/paved/london--jarvi2011--drainage, place generic; the construction
        record declares place generic and records/ohm/generic--unreferenced--paved declares no place.
        The database holds Zurich records elsewhere, under records/surfaces/evetr/, records/surfaces/grass/,
        records/surfaces/dectr/, records/surfaces/common/ and records/irrigation/, but none for land_cover.paved,
        so no Zurich paved value is being passed over. What makes this a decision rather than a forced
        gap is that the uses block is byte-identical to those of archetypes/surfaces/paved/helsinki--city-centre
        and archetypes/surfaces/paved/helsinki--kumpula: the entry publishes the Helsinki paved set under
        a Zurich label, including a snowpack_limit carried across a Dfb to Cfb difference the place registry
        itself records. A maintainer has to decide whether that is a deliberate stand-in or an artefact
        of the migration.'
