      - component-ohm-generic--unreferenced--paved
      note: 'The composite declares target land_cover.paved. The albedo, emissivity, water_storage, drainage
        and snow_lim_patch slots each take a record declaring target land_cover.paved; the construction
        slot takes a record declaring target construction and the four ohm positions take records declaring
        target ohm_coefficients, which are the entry types those slots exist for. Surface records carry
        no attaches_to field, since attaches_to appears in this database only on the profile records under
        records/profiles/, so the slot check rests on the parameters each component carries: alb into
        albedo, emis into emissivity, store_min and store_max into water_storage, drain_eq, drain_coef_1,
        drain_coef_2 and wet_threshold into drainage, snowpack_limit into snow_lim_patch, and a1, a2 and
        a3 into each ohm position. The water_storage and drainage components both write into storage_drain_params
        and their keys do not overlap, so neither overrides the other. records/ohm/generic--unreferenced--paved
        declares no season_label, so filling all four season and wetness positions from it asserts no
        seasonal split the record itself denies.'
