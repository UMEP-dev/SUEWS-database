  scientific_note: 'archetypes/surfaces/paved/zurich--city-centre is a Zurich typology with no Zurich
    content. Its site-fitted albedo comes from Helsinki; emissivity, water storage and drainage are generic
    Järvi et al. (2011) literature records; snowpack limit is generic Järvi et al. (2014) literature
    evidence; its construction comes from an archived internal fixture
    and its four OHM positions from a generic row whose source field reads unreferenced. Scarcity explains
    part of that, since the database holds no paved surface record for Zurich at all, and its Zurich records
    sit under vegetation, soil and irrigation instead. Scarcity does not explain the shape of the result.
    The uses block is identical, record for record and position for position, to those of archetypes/surfaces/paved/helsinki--city-centre
    and archetypes/surfaces/paved/helsinki--kumpula, so what this entry publishes is the Helsinki paved
    set relabelled. Two readings fit and the files do not decide between them: the Helsinki-linked set may
    be a deliberate stand-in chosen because nothing closer exists, or the Zurich row may simply have
    inherited its neighbours'' references during migration. The albedo additionally moves from a site fit
    to a city typology without a stated rationale. A maintainer should settle it, and should settle it
    together with the duplication between the two Helsinki entries, because the same seven components
    carry all three.'
