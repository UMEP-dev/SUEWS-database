  scientific_note: 'This entry does what a study-named composite should. archetypes/surfaces/paved/london-uk--central-london-ward-et-al-2016
    declares place london and representativeness city, and four of its eight components declare source
    ward2016, the study its name cites. Its water-storage component is published by Järvi et al. (2011),
    and its drainage component is the Ward et al. (2018) publication of the SE England tuple. Where the
    named study reports a London value the composite takes it in the emissivity slot. Water storage and
    drainage use regional rows, while albedo uses the fitted site-scoped SE England row. That albedo-to-city
    extrapolation remains a human curation question even though the selected value belongs to the named study.
    The season mapping is right: the OHM record labelled Summer fills the two summer positions and the
    one labelled Winter fills the two winter positions, and since neither record carries a wetness label
    the wet and dry positions within a season taking the same coefficients contradicts nothing. Two slots
    leave the ward2016 set. snow_lim_patch takes the Helsinki record because it is the only paved snowpack-limit
    record in the database, and construction takes an archived internal construction fixture, which changes no exported
    number because scripts/export_record.py keeps the construction slot out of the surface fragment. Neither
    is a selection error. Together with the water-storage and drainage source corrections, four component slots therefore
    do not declare ward2016. The fixture identity is explicit rather than a physical construction claim;
    the other components'' own values and any ''sample run'' labels remain subject to their own evidence
    assessments, which this review does not revisit.'
