  scientific_note: 'This entry does what a study-named composite should. archetypes/surfaces/paved/london-uk--central-london-ward-et-al-2016
    declares place london and representativeness city, and six of its eight components declare source
    ward2016, the study its name cites. Where the study reports a London value the composite takes it,
    in the emissivity slot; where it reports a value for the wider region the composite takes the se-england
    row, classed regional, and applies it down to the city, which is the sound direction for a class mismatch.
    The season mapping is right: the OHM record labelled Summer fills the two summer positions and the
    one labelled Winter fills the two winter positions, and since neither record carries a wetness label
    the wet and dry positions within a season taking the same coefficients contradicts nothing. Two slots
    leave the ward2016 set. snow_lim_patch takes the Helsinki record because it is the only paved snowpack-limit
    record in the database, and construction takes a record named Placeholder, which changes no exported
    number because scripts/export_record.py keeps the construction slot out of the surface fragment. Neither
    is a selection error. The components'' own values, and the ''sample run'' and Placeholder labels some
    of them carry, remain subject to their own evidence assessments; this review does not revisit them.'
