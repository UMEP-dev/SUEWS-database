  scientific_note: 'The selection itself holds up. archetypes/surfaces/paved/helsinki--city-centre declares
    place helsinki and representativeness city; albedo, water storage and snowpack limit come from Helsinki
    city rows, while emissivity is a generic Järvi et al. (2011) pavement parameter. Four components are
    non-Helsinki: emissivity, drainage and construction are generic, and the OHM record declares no place.
    No paved drainage or OHM record carries place helsinki, and the construction slot contributes no exported value at all, since scripts/export_record.py
    keeps construction out of the surface fragment. What a maintainer does have to settle is that this
    entry is not distinguishable from archetypes/surfaces/paved/helsinki--kumpula. The two declare the
    same place, the same representativeness and the same seven components in the same eleven positions,
    and neither asserts a parameter of its own, so a reader choosing between a Helsinki city centre and
    a Helsinki Kumpula paved surface is choosing between two labels over one set of numbers. archetypes/surfaces/paved/zurich--city-centre
    carries the same seven components again under a Zurich label, so whatever is decided here bears on
    that entry too. The drainage record is now documented as generic literature evidence; the OHM record
    still declares source unreferenced, a question for that record''s own evidence review rather than for the assembly.'
