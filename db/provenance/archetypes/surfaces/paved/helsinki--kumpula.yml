  scientific_note: 'The selection itself holds up. archetypes/surfaces/paved/helsinki--kumpula declares
    place helsinki and representativeness city, and its albedo, emissivity, water storage and snowpack
    limit all come from Helsinki city rows in jarvi2014. The drainage and OHM slots leave the city because
    no paved drainage record and no paved OHM record in the database carries place helsinki, and the construction
    slot contributes no exported value, since scripts/export_record.py keeps construction out of the surface
    fragment. The question a maintainer has to settle is what this entry adds. Its name points at a district
    while its representativeness field reads city, and its components are identical, record for record
    and position for position, to those of archetypes/surfaces/paved/helsinki--city-centre, which declares
    the same place and the same class. Two entries that export the same fragment and differ only in label
    are either one entry with two names or two typologies whose distinct evidence has not been supplied;
    the files do not say which. archetypes/surfaces/paved/zurich--city-centre takes the same seven components
    again, so the decision reaches beyond this pair. The drainage record is now documented as generic
    literature evidence; the OHM record still declares source unreferenced, a question for that record''s own evidence review.'
