        take records declaring target ohm_coefficients, which is the entry type that slot exists for.
        Surface records carry no attaches_to field, since attaches_to appears in this database only on
        the profile records under records/profiles/, so the slot check rests on the parameters each component
        carries: alb into albedo, emis into emissivity, store_min and store_max into water_storage, state_limit
