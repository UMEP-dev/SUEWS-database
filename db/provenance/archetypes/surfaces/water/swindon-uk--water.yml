  scientific_note: 'Every check this review can make comes out clean. archetypes/surfaces/water/swindon-uk--water
    declares place swindon and representativeness city; its water_state component declares exactly that
    place and that class. Its albedo and emissivity come from ward2016 se-england rows, while water storage
    and drainage come from ward2018 se-england rows; these regional rows cover Swindon and are applied
    down to the town. The
    season mapping follows the components'' own season_label fields, the drainage slot supplies wet_threshold
    and no drainage equation because the component holds the drainage coefficients in legacy as -999,
    and every slot takes a record declaring the target that slot fills. One thing a reader should carry
    forward without acting on it here: records/surfaces/water/swindon--ward2016--water-state is named
    ''Swindon, UK (not used)'', so the state_limit this entry publishes comes from a row the migration
    marked as unused in the study it cites. Whether such a value belongs in the database at all is a question
    for that record''s own evidence review. As a selection it is beyond argument, because it is the only
    Swindon water-state record there is and it agrees with the composite on place, class and source.'
