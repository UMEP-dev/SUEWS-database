  scientific_note: 'The assembly is coherent and its one problem is a matter of scale, not of place. archetypes/surfaces/water/london--water
    declares place london and takes its albedo, emissivity, water storage and drainage from the ward2016
    se-england rows, which are the region containing the city, and its state_limit from London''s own
    row. The mapping is right throughout: the drainage slot supplies wet_threshold and no drainage equation
    because the component holds DrainageEq, DrainageCoef1 and DrainageCoef2 in legacy as -999, and the
    Summer-labelled and Winter-labelled OHM records fill their own seasons. The finding is that records/surfaces/water/london--ward2016--water-state
    declares representativeness site and is named ''London (River Thames), UK'', so a city-scale entry
    publishes a state_limit derived for one river. That is the direction of class mismatch that matters,
    because the composite claims more than its component does, unlike the se-england rows, which claim
    more than the composite and are simply applied down. Re-pointing the slot is not an obvious improvement:
    the only other London water-state record is named ''Small Fountain'' and declares source unreferenced,
    and the remaining alternative belongs to Helsinki. So the decision is between keeping the Thames row
    and accepting that this entry is really a Thames typology, and relabelling the composite''s class
    to match what its evidence supports. A maintainer should make that choice explicitly.'
