      note: 'The composite declares target land_cover.water. The albedo, emissivity, water_storage, water_state
        and drainage slots each take a record declaring target land_cover.water, and the four ohm positions
        take records declaring target ohm_coefficients, which is the entry type that slot exists for.
        Surface records carry no attaches_to field, since attaches_to appears in this database only on
        the profile records under records/profiles/, so the slot check rests on the parameters each component
        carries: alb into albedo, emis into emissivity, store_min and store_max into water_storage, state_limit
        into water_state, wet_threshold into drainage, and a1, a2 and a3 into each ohm position. The drainage
        component carries wet_threshold alone and keeps DrainageEq, DrainageCoef1 and DrainageCoef2 in
        legacy as -999, so the slot supplies no drainage equation, which is what that record declares
        rather than a mapping error. The two OHM components carry season_label: records/ohm/generic--ward2016--water
        declares Summer and fills summer_wet and summer_dry, and records/ohm/generic--ward2016--water--code-60-x-multiplier-for-winter-602
        declares Winter and fills winter_wet and winter_dry, so the season mapping follows each record''s
        own label. Neither carries a wetness label, so a season''s wet and dry positions taking the same
        record asserts nothing the records deny.'
