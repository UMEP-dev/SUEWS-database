  findings:
    name:
      conclusion: supported
      evidence_ids:
      - component-surfaces-common-midwest-usa-schmid2000-biogen-co2
      note: The composite is named "Broad leaf" and declares place tropics with origin "Tropics" and representativeness
        regional. The label names a leaf form rather than a place or a source, so the tropical claim rests
        entirely on the place and origin fields; db/places.yml gives tropics a name and nothing else,
        with no lat, lon, koppen or country field. The label does not misdescribe what is assembled, but
        it carries none of the composite's identity either, which is why the place and representativeness
        findings below do the work.
    target:
      conclusion: curation_required
      evidence_ids:
      - component-ohm-generic-ward2016-all-vegetation
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey
      - component-surfaces-evetr-se-england-ward2016-lai
      - component-surfaces-evetr-zurich-stagakis-s2024-lai-power
      note: 'The composite declares target land_cover.evetr. Every component declares that same target
        except two: biogen_co2 takes records/surfaces/common/midwest-usa--schmid2000--biogen-co2, declaring
        target land_cover.common, which docs/FORMAT.md defines as the surface-agnostic class, and the
        OHM positions take records declaring target ohm_coefficients. leaf_area_index and leaf_growth_power
        both declare lai.lai_type 1, which satisfies the leaf_area_index coupling rule in schema/parameter_groups.yml,
        which makes an archetype whose two LAI components carry different lai_type values internally contradictory.
        The season mapping is mixed and needs a decision. summer_wet and summer_dry take records/ohm/generic--ward2016--all-vegetation,
        which declares season_label Summer, so those two positions agree with the record''s own declaration;
        winter_wet and winter_dry take records/ohm/generic--unreferenced--all-vegetation--mixed-forest-20-mccaughey-1985,
        which carries no season_label at all, so the winter positions take a coefficient set never declared
        for a season, from a different source, alongside a summer multiplier sourced to ward2016. In a
        composite whose place is Tropics the summer/winter split is itself questionable, and a maintainer
        has to settle what the four positions should carry.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters of its own, so every value it delivers is the component's.
