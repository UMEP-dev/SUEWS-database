      note: The composite declares place tropics, and not one component declares a tropical place. Four
        declare se-england, one zurich, one london, one morgan-monroe-state-forest, two helsinki, two generic,
        and the two OHM records declare no place at all. The biogen_co2 component is a single Indiana
