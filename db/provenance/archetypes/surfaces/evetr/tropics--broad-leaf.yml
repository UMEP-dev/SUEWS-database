      - component-surfaces-common-midwest-usa-schmid2000-biogen-co2
      note: 'The composite declares representativeness regional, the class this database uses for a value
        offered as typical of a region. Two of its thirteen components are classed city and one is classed
        site, so they stand in for a regional default: records/surfaces/evetr/zurich--stagakis-s2024--lai-power
        and records/surfaces/evetr/helsinki--jarvi2014--snow-lim.
        The site-only component is records/surfaces/common/midwest-usa--schmid2000--biogen-co2.
        Five more are classed generic, including drainage and phenology, and the two OHM records carry no representativeness,
        which leaves three regional rows to carry the regional claim. Correcting drainage removes one city-to-regional
        extrapolation but does not establish the composite''s tropical regional scope.'
