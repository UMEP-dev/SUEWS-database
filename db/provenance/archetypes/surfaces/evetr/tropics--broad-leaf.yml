      - component-surfaces-common-midwest-usa-schmid2000-biogen-co2
      note: 'The composite declares representativeness regional, the class this database uses for a value
        offered as typical of a region. One of its thirteen components is classed city and three are classed
        site, so they stand in for a regional default. The Helsinki phenology record is city-classed;
        records/surfaces/evetr/zurich--stagakis-s2024--lai-power,
        records/surfaces/common/midwest-usa--schmid2000--biogen-co2 and
        records/surfaces/evetr/se-england--ward2016--water-storage are site-only. Six more are classed
        generic, the two OHM records carry no representativeness, and only leaf_area_index is regional.
        These scopes do not establish the composite''s tropical regional claim.'
