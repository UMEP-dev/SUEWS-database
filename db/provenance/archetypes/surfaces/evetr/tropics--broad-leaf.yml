  scientific_note: 'The assembly is structurally complete and the two LAI components agree on lai_type
    1, but the composite''s own claims are not supported by what it selects. It declares place tropics
    and representativeness regional, while its place-specific components are mid-latitude rows: SE England
    for leaf area index, Swindon for water storage, Zurich for leaf growth power, Helsinki for phenology,
    and Morgan–Monroe State Forest in Indiana for biogenic CO2. Albedo, emissivity, drainage, snow limit,
    maximum conductance and porosity are generic rows. One place-specific component is classed city and
    three are classed site, and they stand in for a regional default, which is the
    substitution the scale test exists to catch. The generic rows do not compound that problem. The OHM
    mapping does: the summer positions take a record that declares
    season_label Summer and the winter positions a record that declares no season at all, in a place where
    a summer and winter split is not obviously meaningful. None of this is a claim about any component''s
    value; it is a claim that a tropical broad-leaf default cannot be read out of these rows, and a maintainer
    should decide whether the composite is rebuilt on tropical evidence, reclassified, or withdrawn.'
