  scientific_note: 'The assembly is structurally complete and the two LAI components agree on lai_type
    1, but the composite''s own claims are not supported by what it selects. It declares place tropics
    and representativeness regional, and every component is a mid-latitude row: SE England for albedo,
    emissivity, water storage and leaf area index, Zurich for leaf growth power, London for drainage,
    Helsinki for the snow limit and the phenology, Morgan–Monroe State Forest in Indiana for biogenic CO2,
    and generic rows for maximum conductance and porosity. Four of those are classed city and one is classed
    site, and they stand in for a regional default, which is the substitution the scale test exists to catch,
    and the London drainage
    row is named a sample run. The OHM mapping compounds it: the summer positions take a record that declares
    season_label Summer and the winter positions a record that declares no season at all, in a place where
    a summer and winter split is not obviously meaningful. None of this is a claim about any component''s
    value; it is a claim that a tropical broad-leaf default cannot be read out of these rows, and a maintainer
    should decide whether the composite is rebuilt on tropical evidence, reclassified, or withdrawn.'
