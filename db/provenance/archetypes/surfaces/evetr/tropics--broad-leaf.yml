      note: The composite declares place tropics, and not one component declares a tropical place. Three
        declare se-england, one zurich, one morgan-monroe-state-forest, one helsinki, five generic,
        and the two OHM records declare no place at all. The biogen_co2 component is a single Indiana
        tower site named "Mixed Hardwood Forest"; the snow limit is a Helsinki record and the leaf growth
        power a Zurich one. Whether a
        tropical default should exist on this evidence, and if so which rows should fill it, is a maintainer's
        decision rather than something the entries settle.
