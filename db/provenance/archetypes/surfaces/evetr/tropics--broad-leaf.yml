      note: The composite declares place tropics, and not one component declares a tropical place. Six
        are generic, one is regional SE England, one is site-scoped Swindon, one Zurich, one Morgan-Monroe
        State Forest, one Helsinki, and the two OHM records declare no place at all. The biogen_co2 component
        is a single Indiana tower site named "Mixed Hardwood Forest"; snow limit is a generic Järvi default
        and leaf growth power a Zurich row. Whether a
        tropical default should exist on this evidence, and if so which rows should fill it, is a maintainer's
        decision rather than something the entries settle.
