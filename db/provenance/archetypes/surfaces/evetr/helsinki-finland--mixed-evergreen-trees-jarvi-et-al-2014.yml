  scientific_note: 'Three things in this composite need a maintainer, and none of them is a component''s
    value. The OHM mapping is asymmetric: summer_wet takes a mixed-forest coefficient set and the other
    three positions take a vegetation average whose own name says it includes soil and water, while neither
    record declares a season or a wetness state, so nothing justifies splitting the summer pair and joining
    the winter one. The drainage slot takes a London row named "EvergreenTree [sample run]" when the row
    the three sibling Helsinki composites use is available. And the label cites Järvi et al. (2014) while
    two of the thirteen components declare that source and the biogenic CO2 component is named for street
    trees. What is sound is the slot set, which is complete, the LAI pair, which agrees on lai_type 1,
    and the maximum conductance row, which is openly classed generic rather than passed off as a Helsinki
    value. The questions are all about selection and mapping, so they can be settled inside the composite
    without touching any record.'
