      note: 'The composite is named "Mixed Evergreen Trees, Järvi et al (2014)" and declares place helsinki.
        Three of its thirteen components declare source jarvi2014: snow_lim_patch, vegetation_growth and
        leaf_growth_power.
        The others declare ward2016 for albedo, emissivity, water_storage and leaf_area_index, havu-m2024
        for biogen_co2, jarvi2011 for drainage, breuer2003 for max_vegetation_conductance,
        grimmond1991b for the coefficient record filling summer_wet, and unreferenced for porosity and
        for the coefficient record filling the other three OHM positions. The biogen_co2 slot in particular
        takes records/surfaces/evetr/helsinki--havu-m2024--biogen-co2--evergreen-trees-street, a record
        named "Evergreen trees - street", in a composite labelled mixed. Whether the label is an inherited
        typology name or a claim about where the values came from is not something the entries settle.'
    target:
      conclusion: curation_required
      evidence_ids:
      - component-ohm-generic-unreferenced-all-vegetation-mixed-forest-20-mccaughey
      - component-ohm-generic-unreferenced-all-vegetation-vegetation-average-200
      - component-surfaces-evetr-se-england-ward2016-lai
      - component-surfaces-evetr-helsinki-havu-m2024-lai-power
      note: 'The composite declares target land_cover.evetr, every non-OHM component declares that same
        target, and the OHM positions take records declaring target ohm_coefficients, so slot types are
        right. leaf_area_index and leaf_growth_power both declare lai.lai_type 1, which satisfies the
        leaf_area_index coupling rule in schema/parameter_groups.yml, which makes an archetype whose two
        LAI components carry different lai_type values internally contradictory. The season and wet/dry
        mapping is where this composite differs from its siblings. summer_wet takes records/ohm/generic--unreferenced--all-vegetation--mixed-forest-20-mccaughey-1985
        while summer_dry, winter_wet and winter_dry take records/ohm/generic--unreferenced--all-vegetation--vegetation-average-200-this-is-the-average-of-codes-20-30-50-51-52-53-60-i-e-includes-soil-and-water.
        Neither record carries a season_label or any wetness declaration, so nothing in either supports
        splitting the summer pair while leaving the winter pair joined, and the two describe different
        surfaces: one a mixed forest, the other an average its own name says includes soil and water.
        A maintainer has to say which set the composite intends, because the entries give no ground for
        choosing.'
