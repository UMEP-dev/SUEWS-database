      note: 'The composite claims helsinki, and four slots take Helsinki rows: leaf_growth_power, biogen_co2,
        snow_lim_patch and vegetation_growth. drainage takes records/surfaces/evetr/london--jarvi2011--drainage,
        which declares place london and origin "London" and is named "EvergreenTree [sample run]". max_vegetation_conductance
        takes records/surfaces/evetr/vancouver--jarvi2011--max-conductance, which declares place generic
        and origin "Vancouver" and whose source field reads breuer2003, so it is offered as a generic
        value rather than a Vancouver one. albedo, emissivity, water_storage and leaf_area_index take
        se-england rows. The drainage selection is the one to settle: whether a Helsinki composite should
        draw its drainage from a London row that the database itself labels a sample run is a maintainer''s
        decision, particularly when records/surfaces/evetr/london--havu-m2024--drainage, the row the other
        Helsinki composites use, exists.'
    representativeness:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-evetr-london-jarvi2011-drainage
      note: 'The composite declares representativeness city. The Helsinki rows are classed city, the SE
        England rows regional, which is the ordinary direction of travel, and max_vegetation_conductance
        and porosity are classed generic, the class this database uses for a value offered without a place.
        drainage does not fit: records/surfaces/evetr/london--jarvi2011--drainage declares representativeness
        city while its own name reads "EvergreenTree [sample run]", which the quality pass in scripts/check_db.py
        reports as a suspect name. A published composite should not rest its drainage parameterisation
        on a row the database labels a sample run until someone has decided that it is the intended value.'
