  scientific_note: 'Two things in this composite need a maintainer, and neither is a component''s value.
    The OHM mapping is asymmetric: summer_wet takes a mixed-forest coefficient set and the other three
    positions take a vegetation average whose own name says it includes soil and water, while neither
    record declares a season or a wetness state, so nothing justifies splitting the summer pair and joining
    the winter one. And the label cites Järvi et al. (2014) while three of the thirteen components declare
    that source and the biogenic CO2 component is named for street trees. The drainage selection no longer
    creates a place or scale problem: its component is now correctly classified as a generic Järvi et al.
    literature tuple applicable to the evergreen-tree land-cover class, while its London origin preserves
    later application history. What is sound is the slot set, which is complete, the LAI pair, which agrees
    on lai_type 1, and the generic drainage and maximum-conductance rows. The remaining questions are about
    selection and mapping, so they can be settled inside the composite without touching any record.'
