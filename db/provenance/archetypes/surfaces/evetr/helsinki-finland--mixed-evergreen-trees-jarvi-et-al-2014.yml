      note: The composite fills all eleven named slots and the four OHM positions, which is the slot set
        every deciduous-tree, evergreen-tree and grass archetype in this database uses, so the assembly
        is complete. The porosity slot takes records/surfaces/evetr/generic--unreferenced--porosity, whose
