  scientific_note: 'The composite takes Zurich rows for its three distinctive slots, Helsinki city rows
    where no Zurich snow or phenology record exists, generic albedo, emissivity and drainage, regional
    SE England leaf area index, and site-scoped Swindon water storage. The corrected Zurich leaf-growth-power
    component is also site-scoped to four parks. Both site-to-city transfers need explicit curation. The two
    LAI components agree on lai_type 1, the slot set is complete, and the single unlabelled coefficient
    record across all four OHM positions is consistent with a record that declares no season. A separate
    source-registry point remains: the label says 2024 while db/sources.yml stores stagakis-s2024 with
    year 2025. The corrected biogen_co2 component has three values directly supported by Supplement
    Table S3 and three retained values whose provenance remains unresolved.'
