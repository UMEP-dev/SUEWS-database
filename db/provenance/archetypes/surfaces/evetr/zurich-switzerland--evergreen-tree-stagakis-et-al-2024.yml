      note: 'The composite is named "Evergreen Tree Stagakis et al. 2024" and declares place zurich with
        origin "Zurich, Switzerland". The components that distinguish it are leaf_growth_power, max_vegetation_conductance
        and biogen_co2. All three rows declare place zurich; leaf_growth_power and biogen_co2 declare source
        stagakis-s2024, while max_vegetation_conductance now records its earlier jarvi2011 parameter source.
        The label therefore identifies the Zurich configuration rather than the source of every value.
        One discrepancy is worth recording without overstating
        it: db/sources.yml stores stagakis-s2024 with year 2025 and doi 10.5194/bg-22-2133-2025, so the
        label''s year and the registry''s year differ. That is registry metadata rather than a composition
        defect, and it does not change what the label identifies.'
