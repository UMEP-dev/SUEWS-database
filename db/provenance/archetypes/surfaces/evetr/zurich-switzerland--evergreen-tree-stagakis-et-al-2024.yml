  scientific_note: 'The assembly takes Zurich rows for the three distinctive slots, falls back to SE
    England regional rows and Helsinki city rows where the database holds nothing for Zurich, and uses
    a generic coniferous-tree literature tuple for drainage. The corrected leaf-growth-power and biogenic-CO2
    components are site-scoped to four Zurich parks, so using them under this city-level composite requires
    maintainer adjudication. The two
    LAI components agree on lai_type 1, the slot set is complete, and the single unlabelled coefficient
    record across all four OHM positions is consistent with a record that declares no season. A separate
    source-registry point remains: the label says 2024 while db/sources.yml stores stagakis-s2024 with
    year 2025. The corrected biogen_co2 component is fully sourced leaf by leaf, but it is site-scoped
    to four parks and therefore narrower than this city-level composite. Its own only remaining question
    is whether Stagakis''s one Trees column should remain represented by separate deciduous and evergreen
    records.'
