  scientific_note: 'The composite does what a city archetype should: it takes Zurich rows for the three
    distinctive slots: Stagakis et al. supply leaf growth power and biogenic CO2, while maximum conductance
    is the earlier Järvi et al. literature value. It falls back
    to SE England regional rows and Helsinki city rows only where the database holds nothing for Zurich,
    the snow limit being the clearest case since there is exactly one evergreen-tree snow limit in the
    database. The two LAI components agree on lai_type 1, the slot set is complete, and the single unlabelled
    coefficient record across all four OHM positions is consistent with a record that declares no season.
    The one thing a maintainer must settle is the drainage component: records/surfaces/evetr/london--havu-m2024--drainage
    declares place london while its name reads "EvergreenTree - Helsinki, Zurich, Beijing"; Järvi et al.
    (2011) publishes the parameter while Havu''s archive later applies it in Helsinki. The record fills
    the drainage slot in all five composites placed at the three cities it names. A secondary, smaller
    point for the record: the label says 2024 while db/sources.yml stores
    stagakis-s2024 with year 2025.'
