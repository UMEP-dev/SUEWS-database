      note: 'The composite declares target land_cover.evetr. Every component declares that same target
        except two: biogen_co2 takes records/surfaces/common/beijing--zheng-y2023--biogen-co2, declaring
        target land_cover.common, which docs/FORMAT.md defines as the surface-agnostic class, and the
        four OHM positions take a record declaring target ohm_coefficients, which is the type that slot
        takes. leaf_area_index and leaf_growth_power both declare lai.lai_type 0, which satisfies the
        leaf_area_index coupling rule in schema/parameter_groups.yml, which makes an archetype whose two
        LAI components carry different lai_type values internally contradictory. All four OHM positions
        take one record, which carries no season_label, so an undifferentiated season and wet/dry mapping
        contradicts nothing the component declares.'
