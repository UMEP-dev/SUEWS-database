      note: 'The composite is named "Mixed Evergreen Trees" and declares place beijing with origin "Beijing,
        China". What distinguishes it from the other evergreen-tree composites is a group of Beijing rows:
        leaf_area_index, leaf_growth_power, max_vegetation_conductance and biogen_co2 all take records
        declaring place beijing, the last three sourced to zheng-y2023, and the biogenic CO2 record is
        itself named "Mixed trees". The label identifies what the composite assembles.'
