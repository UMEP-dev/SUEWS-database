      note: 'The drainage slot takes records/surfaces/evetr/london--havu-m2024--drainage, which declares
        place london and origin "London" while its own name reads "EvergreenTree - Helsinki, Zurich, Beijing"
        and its source field reads havu-m2024. That record fills the drainage slot in exactly the five
        evergreen-tree composites placed at the three cities its name lists, so the selection reads as
        deliberate and the declared place as wrong, but nothing in the repository settles which of the
        two is in error, and it should be settled once rather than five times. The rest of the borrowing
        is ordinary and forced: albedo, emissivity and water_storage take se-england rows because the
        database holds no Beijing radiative or storage record for evergreen trees, records/surfaces/evetr/helsinki--jarvi2014--snow-lim
        is the only evergreen-tree snow limit in the database, so that borrow is forced, and vegetation_growth
        takes a Helsinki record because no Beijing phenology record exists.'
