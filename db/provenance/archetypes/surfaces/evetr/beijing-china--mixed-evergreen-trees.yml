      note: 'The composite is named "Mixed Evergreen Trees" and declares place beijing with origin "Beijing,
        China". What distinguishes it from the other evergreen-tree composites is a group assembled for
        Beijing: leaf_growth_power and max_vegetation_conductance take Beijing records, leaf_area_index
        takes a stable Beijing-path row now correctly identified as generic Järvi literature, and biogen_co2
        takes the stable Beijing-path row now correctly scoped to its Viikki, Helsinki evidence site. The
        latter three carry source zheng-y2023, and the biogenic CO2 record is itself
        named "Mixed trees". The label identifies what the composite assembles.'
