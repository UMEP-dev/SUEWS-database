  scientific_note: 'Where Beijing evidence exists this composite uses it: leaf area index, leaf growth
    power, maximum conductance and biogenic CO2 all come from rows placed at beijing, three of them sourced
    to zheng-y2023, and the radiative, storage, snow and phenology slots borrow from SE England and Helsinki
    because the database holds no Beijing rows for them. Two selections need a maintainer rather than
    an agent. The leaf area index comes from records/surfaces/evetr/beijing--ward2016--lai, a row named
    "Evergreen Tree (sample data)" that nonetheless supplies the lai_min and lai_max the model will run
    on, and the drainage comes from records/surfaces/evetr/london--havu-m2024--drainage, whose place field
    says london while its name says "EvergreenTree - Helsinki, Zurich, Beijing". The drainage record fills
    that slot in all five of the composites placed at the three cities it names, so its place should be
    settled once for the class. Everything else in the assembly is coherent: the slot set is complete,
    the two LAI components agree on lai_type 0, and the single OHM set across all four season and wetness
    positions matches a coefficient record that declares no season. This review does not revisit any component''s
    values. The leaf_growth_power component is a one-park site fit inside this city-classed composite,
    so its scale also needs explicit composition curation.'
