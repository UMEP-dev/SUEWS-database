  scientific_note: 'Where Beijing evidence exists this composite uses it: leaf growth power and maximum
    conductance come from rows placed at beijing and sourced to zheng-y2023. Leaf area index is now explicitly
    the generic coniferous-tree literature set published by Järvi et al., with its Beijing path retained only
    as migration lineage.
    Biogenic CO2 retains its stable Beijing path and Zheng source but is now correctly scoped to its Viikki,
    Helsinki site evidence. The radiative, storage, snow and phenology slots borrow from SE England and
    Helsinki because the database holds no Beijing rows for them. The drainage and leaf-area-index components
    are correctly explicit as generic land-cover literature evidence; the drainage sidecar records Havu''s
    Helsinki configuration only as later application. Everything else in the assembly is coherent: the slot set is complete,
    the two LAI components agree on lai_type 0, and the single OHM set across all four season and wetness
    positions matches a coefficient record that declares no season. This review does not revisit any component''s
    values. The leaf_growth_power component is a one-park site fit and the biogenic CO2 component is a
    Viikki site compilation inside this city-classed composite, so their scale needs explicit composition
    curation.'
