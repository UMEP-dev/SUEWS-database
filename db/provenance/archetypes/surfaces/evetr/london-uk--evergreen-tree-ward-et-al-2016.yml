        every deciduous-tree, evergreen-tree and grass archetype in this database uses, so the assembly
        is complete. The porosity slot takes records/surfaces/evetr/generic--unreferenced--porosity, whose
        parameters block is empty and whose origin reads "Porisity only used for Deciduous Tree. This
        is a Dummy Variable", so that slot contributes no value by design rather than by omission. The
        composite is not unique. archetypes/surfaces/evetr/swindon-uk--evergreen-tree-ward-et-al-2016
