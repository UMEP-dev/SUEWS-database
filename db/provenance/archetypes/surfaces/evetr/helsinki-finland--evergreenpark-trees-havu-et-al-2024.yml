        composites is biogen_co2, which takes records/surfaces/evetr/helsinki--havu-m2024--biogen-co2--evergreen-trees-grass,
        named "Evergreen trees + grass" and sourced to havu-m2024, whose registry year is 2024. A fourth
        variant from the same source, records/surfaces/evetr/helsinki--havu-m2024--biogen-co2--evergreen-trees-low-veg,
        named "Evergreen trees + low veg", exists and is selected by no archetype in the database. Nothing
        in either record states which plot type a park corresponds to, so the choice is not documented,
        but trees over grass is the closer reading of the two names and neither contradicts the label.
