        with origin "Helsinki, Finland". The component that distinguishes it from the forest and street
        composites is biogen_co2, which takes records/surfaces/evetr/helsinki--havu-m2024--biogen-co2--evergreen-trees-grass,
        named "Evergreen trees + grass" and sourced to havu-m2024, whose registry year is 2024. A fourth
