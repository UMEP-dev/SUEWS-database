  scientific_note: 'This composite is the park member of a family of three that share every slot but biogenic
    CO2. It takes the Havu et al. variant named "Evergreen trees + grass", which reads as trees over grass
    and so as a park, while a fourth variant named for low vegetation sits unused in the database; the
    entries do not record which plot type each label came from, so the selection is undocumented rather
    than contradicted. Helsinki rows fill the slots for which Helsinki evidence exists; the remaining
    slots use generic albedo, emissivity and snow limit, regional SE England leaf area index, and site-scoped Swindon
    water storage. The water-storage transfer requires curation. The two LAI components agree on lai_type 1, and one unlabelled
    coefficient record fills all four OHM positions. Drainage is openly generic land-cover literature
    evidence, with Havu''s later Helsinki application recorded in its own sidecar.'
