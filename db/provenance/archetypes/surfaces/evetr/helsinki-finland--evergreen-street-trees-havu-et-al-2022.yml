  scientific_note: The assembly is sound and matches its sibling Helsinki composites slot for slot, with
    the street biogenic CO2 record as the one component that carries the typology. The two LAI components
    agree on lai_type 1, the slot set is complete, and the four OHM positions take one coefficient record
    that declares no season, which the undifferentiated mapping permits. Two things need a maintainer.
    The label cites Havu et al. 2022 while the street-specific biogen_co2 and maximum-conductance components
    declare source havu-m2024 and db/sources.yml holds no source dated 2022 at all, so either the label's
    year is wrong or a source was never registered;
    an agent must not guess a publication to close that gap. And the drainage slot takes records/surfaces/evetr/london--havu-m2024--drainage,
    which declares place london while its name reads "EvergreenTree - Helsinki, Zurich, Beijing" and it
    fills that slot in all five composites placed at the three cities it names. Neither question touches
    a component's values, and both are cheaper to settle once for the class than composite by composite.
