  scientific_note: The assembly is sound and matches its sibling Helsinki composites slot for slot, with
    the street biogenic CO2 record as the component that carries the typology. The two LAI components
    agree on lai_type 1, the slot set is complete, and the four OHM positions take one coefficient record
    that declares no season. One separate question still needs a maintainer. The label cites Havu et al.
    2022 while the street-specific biogen_co2 and maximum-conductance components declare source havu-m2024
    and db/sources.yml holds no source dated 2022, so either the label's year is wrong or a source was never
    registered. Drainage is now explicitly generic land-cover literature evidence, with Havu's later Helsinki
    application recorded in its own sidecar. Water storage is a Swindon site value used in this Helsinki
    city typology, while snowpack_limit is a generic Järvi default; the site-to-city transfer requires curation.
