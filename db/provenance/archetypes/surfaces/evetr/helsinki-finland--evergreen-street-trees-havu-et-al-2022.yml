      note: 'The composite is named "Evergreen Street trees, Havu et al. 2022". The street half is borne
        out: biogen_co2 takes records/surfaces/evetr/helsinki--havu-m2024--biogen-co2--evergreen-trees-street,
        named "Evergreen trees - street", which is what tells this composite apart from the forest and
        park ones. The year is not. db/sources.yml holds one key naming Havu as first author, havu-m2024,
        recorded with year 2024, and no source in that registry carries year 2022 at all. The street-specific
        biogen_co2 and maximum-conductance components declare source havu-m2024. Either the label''s year
        is wrong or the composite
        was built from a publication that was never registered. Naming a candidate 2022 paper would be
        a fabrication, so a maintainer has to settle it.'
