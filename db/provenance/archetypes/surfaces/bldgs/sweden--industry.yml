  scientific_note: 'The two slots that make this an industrial typology are well chosen and Swedish: the
    construction is records/constructions/sweden--unreferenced--industrial, place sweden, and the albedo
    is a Gothenburg row named ''Industry, dark roofs''. Emissivity, water storage and the snow limit come
    from Helsinki, which the record set forces, since the database holds no Swedish row for those building
    properties; drainage is generic. What deserves a maintainer''s attention is the coefficient slot.
    All four ohm positions take records/ohm/generic--jarvi2014--buildings, an archived code-799 record
    that declares neither place nor representativeness, where every other Swedish building composite
    takes records/ohm/helsinki--jarvi2014--buildings. A country-scale default resting on that placeless
    legacy row, and diverging from its siblings for no recorded reason, is a curation decision rather
    than something this review can settle. The same is true of the composite''s declared
    regional reach, which no component except the construction supports. Neither question requires a component
    value to change; both live in the composite.'
