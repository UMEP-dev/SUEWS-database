      - component-ohm-generic-jarvi2014-buildings
      note: 'The composite''s own target, land_cover.bldgs, is right for a building-surface typology,
        and every slot takes a component declared for it: the albedo, emissivity, water_storage, drainage
        and snow_lim_patch slots each take a record declaring target land_cover.bldgs, the construction
        slot takes a record declaring target construction, and the ohm positions take records declaring
        target ohm_coefficients. No record under records/surfaces/bldgs or records/ohm declares attaches_to,
        which in this database is carried only by the profile records, so slot fit here is judged on the
        components'' declared target.'
    values:
      conclusion: not_applicable
      note: The composite declares no parameters block of its own, so it asserts no value beyond the components
        it selects.
