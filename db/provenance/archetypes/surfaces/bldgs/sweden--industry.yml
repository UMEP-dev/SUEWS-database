      - component-constructions-sweden-unreferenced-industrial
      - component-surfaces-bldgs-helsinki-jarvi2014-snow-lim
      - component-ohm-generic-jarvi2014-buildings
      note: The composite claims place sweden. The construction declares place sweden and the albedo declares
        place gothenburg. Emissivity, water storage and the snow limit take records declaring place helsinki,
        which db/places.yml resolves to country finland; drainage is generic; and the four ohm positions take
        records/ohm/generic--jarvi2014--buildings, which declares no place at all. The database holds
        no Swedish record for any of those quantities, so the Helsinki substitution is forced rather than
        careless. The generic drainage selection needs no place transfer, but neither the Helsinki substitutions
        nor the placeless coefficient row is justified anywhere in the composite,
        and only a maintainer can settle whether both are intended.
    representativeness:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-bldgs-gothenburg-oke1987-albedo
      - component-surfaces-bldgs-helsinki-jarvi2014-emissivity
      - component-surfaces-bldgs-helsinki-ward2016-water-storage
      - component-surfaces-bldgs-helsinki-jarvi2011-drainage
      - component-constructions-sweden-unreferenced-industrial
      - component-surfaces-bldgs-helsinki-jarvi2014-snow-lim
      - component-ohm-generic-jarvi2014-buildings
      note: The composite declares representativeness regional. The construction is the only component
        of that class. Emissivity, water storage, the snow limit and the albedo declare representativeness
        city, drainage is generic, and records/ohm/generic--jarvi2014--buildings declares no representativeness
        at all while naming itself 'Archived code-799 roof average'. A country-scale default therefore
        rests on four city rows and one archived legacy row whose reach is undeclared.
    method:
      conclusion: supported
      evidence_ids:
      - component-ohm-generic-jarvi2014-buildings
      note: An assembly of existing records into slots; the composite produces no value of its own. records/ohm/generic--jarvi2014--buildings
        fills all four ohm positions, so the composite draws no summer/winter and no wet/dry distinction,
        and that record declares no season_label of its own.
    identity:
      conclusion: supported
      evidence_ids:
      - component-ohm-generic-jarvi2014-buildings
      note: 'All seven slots are filled and no second Swedish industry composite exists. The ohm slot
        is where this composite parts company with its siblings: archetypes/surfaces/bldgs/sweden--brick-house-traditional-neighbourhood,
        archetypes/surfaces/bldgs/sweden--concrete-million-program, archetypes/surfaces/bldgs/sweden--detached-houses-wood,
        archetypes/surfaces/bldgs/sweden--mixed-city, archetypes/surfaces/bldgs/sweden--nordic-functionalism-wood
        and archetypes/surfaces/bldgs/sweden--stone-houses-traditional-neighbourhood all take records/ohm/helsinki--jarvi2014--buildings
        in the same four positions, while this one takes records/ohm/generic--jarvi2014--buildings. The
        two are distinct records and nothing in the composite explains the divergence; it is recorded
        here as a fact rather than read as an error.'
