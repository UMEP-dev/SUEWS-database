  scientific_note: 'Most of this composite is anchored in the place it claims. Its albedo and emissivity
    are Swindon rows named ''Suburban residential'', its water storage and drainage are SE England rows,
    and its OHM mapping is confirmed by the components themselves: the summer positions take the record
    declaring season_label Summer and the winter positions the record declaring season_label Winter. The
    one component from outside the United Kingdom, the Helsinki snow limit, is the only building snowpack_limit
    record the database has, so that slot could not have been filled otherwise. What does not follow is
    the construction. A composite labelled suburban residential takes records/constructions/uk--lindberg-f2020--central-london-sample-run,
    a record that names a different settlement type and flags itself as a sample run, while twelve uk--hertwig2024a
    residential construction records sit unused. Choosing among those means choosing a build period and
    a roof form, which is a maintainer''s decision and not one this review should make on resemblance.
    Nothing here requires a component value to change, and the components'' own values remain subject
    to their evidence assessments.'
