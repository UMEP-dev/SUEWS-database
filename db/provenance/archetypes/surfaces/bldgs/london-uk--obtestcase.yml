      - component-surfaces-bldgs-helsinki-jarvi2014-snow-lim
      - component-ohm-generic-ward2016-buildings-summer
      - component-ohm-generic-ward2016-buildings-winter
      note: The composite is classed city. The two London radiative rows are classed city, the two SE
        England water rows and the UK construction are classed regional, which is a broadening and acceptable,
        and the Helsinki snowpack limit is classed city. The two OHM rows declare no representativeness
        field at all, so for a quarter of the assembly the scale the composite claims cannot be checked
        against the component. That is not universal among generic rows, since records/ohm/generic--unreferenced--paved--asphalt-902
        does declare both place and representativeness, so a maintainer should decide whether an OHM row
        may fill a place-bearing and scale-bearing composite while declaring neither.
