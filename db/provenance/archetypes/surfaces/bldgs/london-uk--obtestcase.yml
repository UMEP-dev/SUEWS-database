      - component-ohm-generic-ward2016-buildings-winter
      note: 'The composite claims place london and origin ''London, UK''. Every component that declares
        a place declares one inside the United Kingdom except the snowpack limit: the albedo and emissivity
        rows are place london, the water storage and drainage rows place se-england, and the construction
        place uk, while records/surfaces/bldgs/helsinki--jarvi2014--snow-lim is place helsinki and is
        the only buildings snowpack_limit record in the database, so that selection is forced. Two components
        declare no place at all: records/ohm/generic--ward2016--buildings and records/ohm/generic--ward2016--buildings--code-798-x-multiplier-for-winter-7982
        carry no place field, so for a quarter of the assembly the London claim cannot be checked against
        the component, and a maintainer should settle whether generic OHM rows may fill a place-bearing
        composite without declaring a place. Worth recording separately: the composite pairs radiative
        rows named ''Central London'' with a construction the record describes as UK residential stock
        from 2010 onwards, flat roof, multi-family apartment blocks, which is a building-stock class rather
        than a Central London one.'
    representativeness:
      conclusion: curation_required
      evidence_ids:
      - component-surfaces-bldgs-london-ward2016-albedo
      - component-surfaces-bldgs-london-ward2016-emissivity
      - component-surfaces-bldgs-se-england-ward2016-water-storage
      - component-surfaces-bldgs-se-england-ward2016-drainage
