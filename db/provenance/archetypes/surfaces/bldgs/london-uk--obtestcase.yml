  scientific_note: 'The components here are individually unremarkable and the mapping is right: the Central
    London radiative rows, the SE England water rows and a UK residential construction from hertwig2024a,
    with the seasonal OHM split honoured correctly and the only out-of-country component, the Helsinki
    snowpack limit, forced by the absence of any other buildings snowpack_limit record. The problem is
    what the entry is for. Its name field reads OBTESTCASE, a test-case identifier that describes nothing,
    and it differs from the published Central London default archetypes/surfaces/bldgs/london-uk--central-london-ward-et-al-2016
    in exactly one reference, the construction. Read charitably, it is a legitimate variant typology,
    Central London radiative properties over post-2010 multi-family apartment blocks, that was never given
    a real name. Read literally, it is a test fixture that reached the published database and acquired
    a typology entry, archetypes/typologies/uk--obtestcase, on the way. Nothing in the files settles which,
    so a maintainer must. Two smaller matters ride along: the two OHM rows declare neither place nor representativeness,
    and the construction is a UK stock class rather than a Central London one. This review does not revisit
    any component value.'
