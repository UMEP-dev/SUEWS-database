      note: Eight distinct components fill the seven slots a buildings archetype carries, with the four
        ohm slots split by season across two records, so the assembly is complete. No other archetype
        carries an identical uses block. archetypes/surfaces/bldgs/london-uk--central-london-ward-et-al-2016
        shares seven of the eight references and differs only in the construction slot, where it takes
        records/constructions/uk--lindberg-f2020--central-london-sample-run, and archetypes/surfaces/bldgs/swindon-uk--suburban-residential-ward-et-al-2016
        shares six. The construction is therefore the only thing that distinguishes this entry from the
        published Central London default, which is the fact a maintainer needs when deciding what to do
        about its name.
