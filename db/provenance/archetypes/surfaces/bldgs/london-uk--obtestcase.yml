      note: 'The name field of the composite reads ''OBTESTCASE'' and its entry path is archetypes/surfaces/bldgs/london-uk--obtestcase.
        The label says nothing about what the archetype assembles; it is a test-case identifier, which
        is the suspect-name class AGENTS.md records as a quality warning left for human adjudication.
        What the composite actually holds is the Central London radiative parameterisation from ward2016
        laid over records/constructions/uk--hertwig2024a--residential-from-2010-flat-roof-type-multi-family-apartment-blocks,
        whose own name reads ''Residential,from 2010, flat roof, type: multi-family, apartment blocks''.
        A maintainer must decide whether this is a genuine typology that needs a descriptive name or a
        test fixture that should not be published; archetypes/typologies/uk--obtestcase references it,
        so the decision reaches that entry too.'
    target:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-london-ward2016-albedo
      - component-surfaces-bldgs-london-ward2016-emissivity
      - component-surfaces-bldgs-se-england-ward2016-water-storage
