  scientific_note: 'The construction is the right record and it is Swedish: records/constructions/gothenburg--bjork2002--traditional-stone-neighbourhood-city-late-1800s-early-1900s,
    a rendered brick fabric from Gothenburg, matches the composite''s name exactly. Around it the assembly
    is entirely borrowed. The albedo is a London row named ''Central London'', chosen over the two generic
    archived configurations with Gothenburg lineage, neither of which describes a rendered facade, and the remaining five
    slots are Helsinki records for which no Swedish alternative exists. The sharper problem is uniqueness.
    Slot for slot this composite selects the identical set to archetypes/surfaces/bldgs/helsinki--city-centre,
    so a Swedish regional stone typology and a Finnish city centre resolve to the same parameters and
    differ only in the labels on their envelopes. Its legacy_id, 20258001, does not share the form of
    its siblings either, which is consistent with a later addition. Whether the duplication is intended,
    and which of the two should change, is a curation decision; nothing here calls for a component value
    to change, and the components'' own values remain subject to their evidence assessments.'
