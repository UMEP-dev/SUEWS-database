  scientific_note: 'Two things are wrong with this composite and they are independent. The first is the
    name. The entry is called ''Brick House, Traditional Neighbourhood'', but the construction it selects,
    records/constructions/gothenburg--bjork2002--traditional-neighbourhood-early-1900s, has a wall of
    wood, felt sheathing, wood, wood and dense plaster under a clay-tile roof, with no brick anywhere
    in the stack. The bjork2002 construction that does carry brick, records/constructions/gothenburg--bjork2002--traditional-stone-neighbourhood-city-late-1800s-early-1900s
    with records/materials/generic--hertwig2024a--brick-protected at 0.29 m, is the one taken by the archetype
    named for stone. That is a striking pattern but it is not proof of a swap, and this review will not
    assert one: what is established is that the label and the selected construction disagree, and a maintainer
    must decide whether to rename the archetype or reselect its construction. The second problem is scale
    and place together. The composite claims to be a Swedish regional typology, yet exactly one of its
    seven components is Swedish; five are classed city and water storage and drainage are generic, so a country default is
    assembled mostly from city evidence taken in Finland and, for albedo, in London. Some of that is forced by what
    the database holds, but the albedo is not: two generic archived configurations with Gothenburg lineage
    exist, Wood and ''Industry, dark roofs'', and neither was taken. The whole Swedish buildings family shares this shape, so it should
    be settled once rather than seven times. This review does not revisit any component value.'
