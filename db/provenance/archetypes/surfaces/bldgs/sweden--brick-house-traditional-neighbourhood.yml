      note: The name field of the composite reads 'Brick House, Traditional Neighbourhood'. Its construction
        slot takes records/constructions/gothenburg--bjork2002--traditional-neighbourhood-early-1900s,
        whose own name reads 'Traditional Neighbourhood, early 1900s' and whose wall stack is records/materials/generic--cibse2015--wood
        at 0.025 m, records/materials/generic--hertwig2024a--felt-sheathing at 0.001 m, records/materials/generic--cibse2015--wood
        at 0.075 m, records/materials/generic--cibse2015--wood at 0.025 m and records/materials/generic--hertwig2024a--plaster-dense
        at 0.025 m. No layer is brick, and the roof is clay tile over wood. The one bjork2002 construction
        in the database whose wall does carry brick is records/constructions/gothenburg--bjork2002--traditional-stone-neighbourhood-city-late-1800s-early-1900s,
        with records/materials/generic--hertwig2024a--brick-protected at 0.29 m, and that record is taken
        by archetypes/surfaces/bldgs/sweden--stone-houses-traditional-neighbourhood. The archetype named
        for brick therefore has a timber wall while the archetype named for stone has a brick wall. This
        review does not assert that the two selections were exchanged; it records that the name and the
        selected construction disagree, and a maintainer must decide which of the two is wrong.
