      note: 'The composite claims place sweden, whose registry entry reads kind country. Exactly one of
        the seven components is in Sweden: records/constructions/gothenburg--bjork2002--traditional-neighbourhood-early-1900s,
        place gothenburg, origin ''Gothenburg, Sweden''. The albedo slot takes records/surfaces/bldgs/london--ward2016--albedo,
