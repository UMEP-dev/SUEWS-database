      note: 'The composite is classed regional, at the scale of Sweden. Every one of its seven components
        is classed city: the London albedo, the four Helsinki surface rows, the Helsinki OHM row, and
        records/constructions/gothenburg--bjork2002--traditional-neighbourhood-early-1900s, which declares
        place gothenburg and representativeness city. A country-scale default assembled entirely from
        city measurements is the case this review is asked to treat as a finding, and it cannot be fixed
        inside the composite: either the class the composite declares is too broad for what it holds,
        or the slots need country-scale rows that do not yet exist. The same pattern runs through the
        Swedish buildings family, so a maintainer should settle it once for the family rather than archetype
        by archetype.'
