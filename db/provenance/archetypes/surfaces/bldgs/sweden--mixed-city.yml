      note: The composite is named Mixed-City and the construction it selects, records/constructions/stockholm--bjork2002--mixed-city-2000s,
        is named 'Mixed-City, 2000s', so the label matches on that slot. The albedo slot takes records/surfaces/bldgs/gothenburg--oke1987--albedo--wood,
        a record named 'Wood ', while the construction this same composite selects describes a fabric
        of roofing shingle, gypsum, mineral fibre slab and wood in which wood is one material among several
        rather than the defining one. The composite therefore asserts a wood surface in one slot and a
        mixed fabric in another, and nothing in it reconciles the two. Whether the wood albedo is the
        intended selection for a mixed-city typology is a maintainer's decision, not one this review can
        make.
