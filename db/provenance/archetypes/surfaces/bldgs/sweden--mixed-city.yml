  scientific_note: 'The construction slot is the one that does its job here: records/constructions/stockholm--bjork2002--mixed-city-2000s
    is named ''Mixed-City, 2000s'' and is Swedish. Two things about the rest need a maintainer. The first
    is the albedo. The composite takes records/surfaces/bldgs/gothenburg--oke1987--albedo--wood, a row
    named ''Wood '', which is also what the two wood typologies in this family take, while the construction
    it selects describes shingle, gypsum, mineral fibre slab and wood together. Nothing in the composite
    says why a wood albedo represents a mixed-city surface, and this review will not infer a reason from
    the fact that sibling composites make the same choice. The second is scale: the composite declares
    representativeness regional, yet every component it selects, the Stockholm construction included,
    declares representativeness city, so a national default is carried entirely by city rows. The Helsinki
    records filling emissivity, water storage, drainage, the snow limit and the OHM positions are forced,
    since no Swedish record exists for any of those quantities, but that too is unstated. All of this
    lives in the composite and none of it requires a component value to change.'
