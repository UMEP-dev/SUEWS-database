        wet from dry, so taking the same row for both wetness states within a season is the only mapping
        their content supports. None of these records declares attaches_to, which in this database appears
        only on the profile and snow-profile records, so the SUEWS field each slot writes is fixed by
        the slot name alone and cannot be cross-checked against the component.'
