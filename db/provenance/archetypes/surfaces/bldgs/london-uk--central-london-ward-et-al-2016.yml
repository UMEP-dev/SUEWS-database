  scientific_note: 'This is the most internally coherent composite in the batch on source and the most
    consequential on reach. Four of its eight components declare source ward2016; the water-storage component
    declares source jarvi2011 and the drainage component declares source ward2018. The albedo and emissivity
    rows are placed in London, the water rows in SE England, and the seasonal OHM mapping is genuinely
    correct: the summer-labelled row fills both summer slots and the winter-labelled row fills both winter
    slots, with no wet or dry distinction in either record to honour. Two slots need a maintainer. The
    construction is records/constructions/uk--lindberg-f2020--central-london-sample-run, whose own name
    reads ''Central London [sample run]'' and whose mapped layers use sample-run materials while roof
    layer three has no proven material record, so the
    thermal stack of the Central London default of this database is a sample configuration rather than
    a surveyed one, and sample-run names are precisely the class the repository checks raise for human
    adjudication. And the two OHM rows declare neither place nor representativeness, so for a quarter
    of the assembly the London and city claims cannot be checked against the component at all. Both matter
    more than they would in an isolated archetype, because twelve region archetypes take this composite
    as their buildings default, covering the Middle East, most of Africa, North America and most of Latin
    America. The snowpack limit reaching to Helsinki is a third-order concern by comparison, and it is
    forced, since no other buildings snowpack_limit record exists. This review does not revisit any component
    value.'
