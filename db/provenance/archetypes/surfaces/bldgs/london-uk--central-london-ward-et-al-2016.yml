      note: 'The composite declares target land_cover.bldgs, which agrees with its position under archetypes/surfaces/bldgs.
        The albedo, emissivity, water_storage, drainage and snow_lim_patch slots each take a record declaring
        target land_cover.bldgs; the construction slot takes a record declaring target construction; and
        the four ohm slots take records declaring target ohm_coefficients. This is one of the few composites
        where the season mapping can be checked against the components, and it is right: records/ohm/generic--ward2016--buildings
        declares season_label Summer and fills summer_wet and summer_dry, while records/ohm/generic--ward2016--buildings--code-798-x-multiplier-for-winter-7982
