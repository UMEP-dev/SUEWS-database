  scientific_note: 'Zurich''s city centre is assembled without a single Swiss component. Its albedo is a London row, while emissivity, water storage, drainage and snowpack_limit are generic;
    its construction
    is a London record named ''Central London [sample run]'', and all four OHM positions take
    a Beijing roof-average row. Some substitution is unavoidable, because the database holds no Swiss
    building record at all, but the particular substitutions were not forced: twenty building OHM records
    exist, several of them European, and the Beijing row was taken with nothing recorded to explain it.
    The consequence shows in the composite''s identity. Slot for slot it is archetypes/surfaces/bldgs/helsinki--kumpula
    with the OHM record swapped and archetypes/surfaces/bldgs/beijing--city-centre with the albedo swapped,
    so what separates a Zurich city centre from those two entries is one coefficient record chosen for
    Beijing. The Central London albedo is site evidence used in a city composite. These place, evidence-reach
    and identity questions live in the composite and can be settled without changing any component value.
    A maintainer must decide which records should stand in for Zurich, whether their reach supports a
    city composite and whether the entry earns a separate identity once that is decided. The components'' own values remain subject to their evidence
    assessments; this review does not revisit them.'
