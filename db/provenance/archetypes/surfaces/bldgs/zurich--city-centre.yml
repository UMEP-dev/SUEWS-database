        selects the same record in every slot except ohm, where it takes records/ohm/helsinki--jarvi2014--buildings
        rather than records/ohm/beijing--zheng-y2023--buildings. archetypes/surfaces/bldgs/beijing--city-centre
        selects the same record in every slot except albedo, where it takes records/surfaces/bldgs/shanghai--ao2016--albedo
