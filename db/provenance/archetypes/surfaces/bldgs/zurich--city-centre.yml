      note: 'The composite claims place zurich, which db/places.yml resolves to country switzerland. Not
        one component carries a Swiss place. The albedo declares place london; emissivity, water storage
        and the snow limit declare place helsinki; drainage is generic; the construction declares place london and
        is named ''Central London [sample run]''; and all four ohm positions take records/ohm/beijing--zheng-y2023--buildings,
        place beijing. Substitution is unavoidable because the database holds no Swiss building record,
        but the ohm choice was not forced: twenty records under records/ohm carry buildings in their path,
        among them records/ohm/helsinki--jarvi2014--buildings, the calculated rooftop average at
        records/ohm/generic--unreferenced--buildings, the two seasonal records/ohm/generic--ward2016--buildings
        rows and eight records/ohm/london--xie2024--buildings rows. A Zurich typology assembled from London,
        Helsinki, generic and Beijing records, with a Beijing row taken over every European alternative and no
        reason recorded, is something only a maintainer can settle.'
