      note: The composite declares target land_cover.bldgs, which agrees with its position under archetypes/surfaces/bldgs.
        The albedo, emissivity, water_storage, drainage and snow_lim_patch slots each take a record declaring
        target land_cover.bldgs; the construction slot takes a record declaring target construction; and
        the four ohm slots take a record declaring target ohm_coefficients. records/ohm/helsinki--jarvi2014--buildings
        declares no season_label and no wet or dry distinction, so filling summer_wet, summer_dry, winter_wet
        and winter_dry with the one record is the only mapping its content supports. None of these records
        declares attaches_to, which in this database appears only on the profile and snow-profile records,
        so the SUEWS field each slot writes is fixed by the slot name alone and cannot be cross-checked
        against the component.
