  scientific_note: 'On selection this composite is the strongest of the buildings family. Three of its
    seven components are Helsinki rows, water storage and drainage are generic building-class rows, and the two remaining
    transfers are forced rather than careless: the
    database holds no Finnish buildings albedo record and no Finnish construction record, so a Central
    London albedo and a Gothenburg masonry perimeter block are the closest available stand-ins, and both
    are declared plainly in the components. Five components are classed city and water storage and drainage are generic,
    matching or exceeding the reach the composite claims, and the four ohm slots correctly take one record
    because that record declares no
    season. What needs a maintainer is identity. archetypes/surfaces/bldgs/sweden--stone-houses-traditional-neighbourhood
    holds an identical uses block, so the same seven records are published as both a Helsinki city typology
    and a Sweden-wide regional one, and either one of those two claims is wrong or the two entries must
    be reconciled. Two further points a later reader should not have to rediscover. records/ohm/helsinki--jarvi2014--buildings
    is a calculated mean of earlier roof records and therefore uses source unreferenced; its Järvi 2014
    path remains a stable legacy identity rather than a source claim. The emissivity and snowpack limit
    rows do declare source jarvi2014. And this city-scale composite
    is the buildings default for two region archetypes, western Europe and northern Europe, which stretches
    one Helsinki city centre across a continent. This review does not revisit any component value.'
