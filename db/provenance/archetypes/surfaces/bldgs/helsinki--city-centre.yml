      - component-constructions-gothenburg-bjork2002-traditional-stone-neighbourhood
      - component-surfaces-bldgs-helsinki-jarvi2014-snow-lim
      - component-ohm-helsinki-jarvi2014-buildings
      note: 'The composite claims place helsinki, whose registry entry reads country finland and koppen
        Dfb. Three of the seven components are Helsinki rows: the emissivity and snowpack
        limit records and records/ohm/helsinki--jarvi2014--buildings. Drainage is a generic building-class
        record. The other two are records/surfaces/bldgs/london--ward2016--albedo, place london, name
        ''Central London'', and records/constructions/gothenburg--bjork2002--traditional-stone-neighbourhood-city-late-1800s-early-1900s,
        place gothenburg, origin ''Gothenburg, Sweden''. Both are transfers the database forces. It holds
        no buildings albedo record placed in Finland, and the only other northern European rows are records/surfaces/bldgs/gothenburg--oke1987--albedo,
        named ''Industry, dark roofs'', and records/surfaces/bldgs/gothenburg--oke1987--albedo--wood,
        named ''Wood '', neither of which describes a city-centre roof. It holds no Finnish construction
        record at all, and the one selected is a Nordic masonry perimeter block whose wall stack runs
        external lime-sand render, records/materials/generic--hertwig2024a--brick-protected at 0.29 m,
        wood and dense plaster, which is a defensible stand-in for a Nordic city centre.'
    representativeness:
      conclusion: supported
      evidence_ids:
      - component-surfaces-bldgs-london-ward2016-albedo
      - component-surfaces-bldgs-helsinki-jarvi2014-emissivity
      - component-surfaces-bldgs-helsinki-ward2016-water-storage
      - component-surfaces-bldgs-helsinki-jarvi2011-drainage
      - component-constructions-gothenburg-bjork2002-traditional-stone-neighbourhood
      - component-surfaces-bldgs-helsinki-jarvi2014-snow-lim
      - component-ohm-helsinki-jarvi2014-buildings
      note: 'The composite is classed city; five components are classed city and the water-storage and drainage
        components are generic, so none is stretched past its stated reach. One point is worth recording for a later
        reader: records/ohm/helsinki--jarvi2014--buildings
        carries the name ''Roof (own for SMEAR III, Helsinki) [750]'', which names a single measurement
        site rather than the city centre as a whole, and the same row also fills the four ohm slots of
        archetypes/surfaces/bldgs/helsinki--kumpula. One measurement site therefore supplies the roof
        coefficients of both Helsinki buildings archetypes. Whether that record deserves its own city
        classing belongs to its evidence assessment, not to this review.'
    method:
      conclusion: supported
      note: An assembly of existing records into slots; the composite produces no value of its own.
