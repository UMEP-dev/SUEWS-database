      - component-surfaces-bldgs-helsinki-jarvi2014-snow-lim
      - component-ohm-helsinki-jarvi2014-buildings
      related_records:
      - archetypes/surfaces/bldgs/sweden--stone-houses-traditional-neighbourhood
      note: All seven slots are filled, and the four ohm slots take one record, which is consistent with
        records/ohm/helsinki--jarvi2014--buildings declaring no season_label. The composite is not unique.
        archetypes/surfaces/bldgs/sweden--stone-houses-traditional-neighbourhood carries a uses block
        identical to this one, reference for reference, and a sweep of every archetype in the repository
        that carries a uses block finds these two to be the only exact pair among the fourteen buildings
        archetypes. They differ only in name, in place, helsinki against sweden, and in representativeness,
        city against regional. The same seven records are therefore published twice under two different
        place and scale claims, and a maintainer must decide whether both should exist and, if so, what
        distinguishes them.
