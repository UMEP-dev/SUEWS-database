  findings:
    name:
      conclusion: supported
      note: The name field of the composite reads 'City centre ', with a trailing space, its place field
        reads helsinki and its origin field Helsinki, so together with the entry path archetypes/surfaces/bldgs/helsinki--city-centre
        the label identifies a Helsinki city-centre building typology. The trailing space is cosmetic
        and does not impair identification; it is shared with archetypes/surfaces/bldgs/beijing--city-centre
        and with no other buildings archetype.
