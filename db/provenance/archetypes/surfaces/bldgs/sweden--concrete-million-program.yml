  scientific_note: 'The one slot that carries the identity of this typology is right. records/constructions/sweden--bjork2002--high-rise-million-program-mid-1900s
    is a Swedish record, classed regional, named ''High Rise Million Program, mid 1900s'', with concrete
    tiles as its outermost wall layer, so the label, place and scale of the composite all hold for the
    component that actually distinguishes it from its siblings. Everything else is borrowed. Emissivity,
    the snowpack limit and the OHM coefficients are Helsinki city rows; water storage and drainage are generic,
    and the
    albedo is records/surfaces/bldgs/london--ward2016--albedo, a Central London city row. Two consequences
    follow. The composite claims regional but five of its seven components are classed city, so a national
    default rests on city measurements, which is not correctable inside the composite and needs either
    a narrower class or country-scale rows that do not yet exist. And the albedo selection is the one
    borrowing that was not forced: two Gothenburg-lineage configurations exist, the generic archived Wood
    row and ''Industry, dark roofs'',
    neither describing a concrete-tile facade, and no file records why the London row was preferred to
    either. Both points recur across the Swedish buildings family and should be settled once for the family.
    This review does not revisit any component value.'
