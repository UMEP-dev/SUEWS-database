      - component-ohm-helsinki-jarvi2014-buildings
      note: 'The composite is classed regional, at the scale of Sweden, and one slot matches that exactly:
        records/constructions/sweden--bjork2002--high-rise-million-program-mid-1900s declares place sweden
        and representativeness regional. Five components are classed city, namely records/surfaces/bldgs/london--ward2016--albedo
        and three Helsinki rows; water storage and drainage are generic. A country-scale default whose radiative, water, snow
        and OHM parameters mostly come from city evidence is the case this review is asked to treat as
        a finding, and it cannot
        be fixed inside the composite. The same pattern runs through the Swedish buildings family, so
        a maintainer should settle it once for the family rather than archetype by archetype.'
