      note: 'The composite claims place sweden, whose registry entry reads kind country. Exactly one of
        the seven components is in Sweden: records/constructions/sweden--bjork2002--high-rise-million-program-mid-1900s,
        place sweden. The albedo slot takes records/surfaces/bldgs/london--ward2016--albedo, place london,
        the emissivity, snowpack limit and OHM slots take Helsinki records, place helsinki,
        country finland, and water storage and drainage take generic building-class records. The database does hold two
        buildings albedo rows with Gothenburg lineage: the generic archived records/surfaces/bldgs/gothenburg--oke1987--albedo--wood,
        named Wood, and records/surfaces/bldgs/gothenburg--oke1987--albedo, named ''Industry, dark
        roofs''. Other Swedish buildings archetypes do use them, but neither describes a concrete-tile
        facade, and nothing in the files records why a Central London city-centre albedo was taken instead.
        Part of the Helsinki borrowing is forced, since records/surfaces/bldgs/helsinki--jarvi2014--snow-lim
        is the only buildings snowpack_limit record in the database and no Swedish water storage or emissivity
        row exists. The generic water-storage and drainage rows need no Swedish substitute, but the composite as a whole
        rests on one Swedish record out of seven
        while claiming to be a Swedish typology, and a maintainer should decide whether that is a defensible
        national default.'
    representativeness:
