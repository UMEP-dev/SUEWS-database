  scientific_note: 'The assembly is structurally complete and every slot takes a record declared for it,
    so in form the composition is sound. Its weakness is the provenance of place. The composite claims
    a Beijing city centre, yet only the albedo, from a site in a Shanghai central business district, and
    the OHM coefficients, from Beijing, are Chinese. No composition source supports transferring the
    site-scale Shanghai albedo to city-scale Beijing. Emissivity, water storage, drainage and the snowpack
    limit are Helsinki rows, and the
    construction is records/constructions/uk--lindberg-f2020--central-london-sample-run, a London record named
    ''Central London [sample run]'' built entirely from sample-run materials. Part of that is forced:
    records/surfaces/bldgs/helsinki--jarvi2014--snow-lim is the only buildings snowpack_limit record in
    the database, and no Chinese water storage or drainage row exists to choose instead. One part is not
    forced. records/surfaces/bldgs/shanghai--ao2016--emissivity sits unused in the database, from the
    same study and place as the albedo row this composite already takes, while the emissivity slot reaches
    to Helsinki. The stakes run wider than one archetype, because six region archetypes take this city-scale
    composite as their buildings default, so a London sample-run construction and four Helsinki rows are inherited
    across much of Asia, the Caribbean and Oceania. A maintainer should settle the emissivity selection
    and the standing of the sample-run construction once, for the family, rather than archetype by archetype.
    This review does not revisit any component value.'
