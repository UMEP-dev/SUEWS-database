      note: 'The composite claims place beijing, whose registry entry reads country china and koppen Dwa.
        Only two of the seven components are in China: records/surfaces/bldgs/shanghai--ao2016--albedo,
        place shanghai, and records/ohm/beijing--zheng-y2023--buildings, place beijing. The emissivity,
        water storage and snowpack limit slots take Helsinki records, place helsinki, country finland,
        koppen Dfb; drainage takes a generic building-class record; and the construction slot takes
        records/constructions/uk--lindberg-f2020--central-london-sample-run,
        place london, whose own name reads ''Central London [sample run]'' and whose mapped roof and wall
        materials carry the sample-run marker; its third roof layer has no proven material reference. Two questions follow
        that a maintainer must settle. The database holds records/surfaces/bldgs/shanghai--ao2016--emissivity,
        place shanghai, representativeness site, urban_setting central_business_district and source ao2016,
        the companion of the albedo row this composite already takes, and
        it goes unused while the emissivity slot reaches to Helsinki. And the record on which the thermal
        layers of this archetype rest is a sample configuration rather than any surveyed Chinese stock,
        which is the suspect-name class the repository checks leave for human adjudication.'
