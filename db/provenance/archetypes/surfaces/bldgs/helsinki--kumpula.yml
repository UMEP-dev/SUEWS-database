  scientific_note: 'Kumpula is the one archetype in this batch whose OHM selection can be read as deliberate
    rather than borrowed: records/ohm/helsinki--jarvi2014--buildings names a specific measurement site
    in its own name field, ''Roof (own for SMEAR III, Helsinki) [750]'', and Kumpula is a named Helsinki
    neighbourhood rather than a generic city typology. Three further Helsinki rows supply emissivity,
    water storage and the snowpack limit, while a generic building-class row supplies drainage. Against
    that, two slots reach to London. The
    albedo is forced, because no Finnish buildings albedo record exists. The construction is not obviously
    forced, and it is the finding: records/constructions/uk--lindberg-f2020--central-london-sample-run
    is a London record whose name reads ''Central London [sample run]'' and whose mapped layers use sample-run
    materials while roof layer three has no proven material record, so the thermal stack of a Helsinki neighbourhood rests on a sample configuration
    for a different city in a different climate. The comparison that makes this hard to dismiss is internal
    to the repository: the sibling archetype archetypes/surfaces/bldgs/helsinki--city-centre takes a Nordic
    construction instead, and no file records why. A maintainer should decide whether Kumpula should take
    a Nordic construction too, or whether the sample-run record should be withdrawn from the archetypes
    altogether. This review does not revisit any component value.'
