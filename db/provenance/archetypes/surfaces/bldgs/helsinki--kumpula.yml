      note: 'The composite claims place helsinki, country finland. Two of the seven components are Helsinki
        rows: the snowpack limit record and records/ohm/helsinki--jarvi2014--buildings,
        whose name reads ''Roof (own for SMEAR III, Helsinki) [750]''. The albedo slot takes records/surfaces/bldgs/london--ward2016--albedo,
        place london, name ''Central London'', a transfer the database forces because it holds no buildings
        albedo record placed in Finland. Emissivity, water storage and drainage take generic building-class records. The construction
        slot is what a maintainer must settle. It takes
        records/constructions/uk--lindberg-f2020--central-london-sample-run, place london, whose own name
        reads ''Central London [sample run]'' and whose mapped roof and wall materials carry the sample-run
        marker while roof layer three has no proven material record, so a Central London sample configuration sets
        the thermal layers of a Helsinki neighbourhood. The other Helsinki buildings archetype, archetypes/surfaces/bldgs/helsinki--city-centre,
        instead takes a Nordic construction, records/constructions/gothenburg--bjork2002--traditional-stone-neighbourhood-city-late-1800s-early-1900s.
        Nothing in the files records why the two were chosen differently.'
