  scientific_note: 'The selection is coherent where Sweden''s own records reach and borrowed where they
    do not. The construction, records/constructions/sweden--bjork2002--detached-houses-wood, is a Swedish
    regional record whose name matches the composite''s and whose layers are mostly wood, and the albedo
    is a Gothenburg row named ''Wood '', so the two slots that carry the typology''s identity are Swedish
    and consistent with the label. Emissivity, the snow limit and all four OHM positions
    come from Helsinki records, because the database contains no Swedish record for those quantities and
    only one building snowpack_limit record in total; water storage and drainage are generic. That substitution is forced rather
    than careless, but it is nowhere stated, and it also leaves a composite declaring representativeness
    regional resting on four city rows. Both questions live in the composite and can be settled without
    touching a component value: a maintainer should either record that Nordic cross-border substitution
    is the intended policy for these typologies, or narrow what the composite claims to what its components
    support. The components'' own values remain subject to their evidence assessments; this review does
    not revisit them.'
