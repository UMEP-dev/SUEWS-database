  scientific_note: 'The selection is coherent at the level of archived identity and borrowed at the level
    of evidence reach. The construction, records/constructions/sweden--bjork2002--detached-houses-wood,
    retains a Swedish application identity and mostly wood layers but is now explicitly an unreferenced,
    assumed configuration with generic reach. The albedo is likewise a generic, unreferenced archived row
    named Wood whose Gothenburg origin is migration history, so neither identity-bearing slot provides
    regional evidence. The snow limit and all four OHM positions come from Helsinki records, because
    the database contains no Swedish record for those quantities and only one building snowpack_limit
    record in total; emissivity, water storage and drainage are generic. That substitution is forced rather
    than careless, but it is nowhere stated, and it leaves a composite declaring representativeness
    regional resting on two city rows and five generic components. Both questions live in the composite and can be settled without
    touching a component value: a maintainer should either record that Nordic cross-border substitution
    is the intended policy for these typologies, or narrow what the composite claims to what its components
    support. The components'' own values remain subject to their evidence assessments; this review does
    not revisit them.'
