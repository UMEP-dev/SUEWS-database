      note: 'The composite is named ''Nordic Functionalism, Wood''. The construction it selects, records/constructions/sweden--bjork2002--nordic-functionalism-mid-1900s,
        is named ''Nordic Functionalism, mid 1900s '' and carries no wood qualifier: its five wall layers
        are limestone, brick twice, mineral wool batts and dense plaster, with no wood among them, and
        its roof is clay tile over wood-wool slab, waterproof covering and air. The only component supporting
        the composite''s Wood qualifier is the albedo row records/surfaces/bldgs/gothenburg--oke1987--albedo--wood,
        named Wood. That construction is also the only Nordic Functionalism record in records/constructions,
        so no wood variant was passed over. A maintainer should decide whether the composite''s name claims
        more than it assembles or whether a wood-framed fabric record is missing.'
