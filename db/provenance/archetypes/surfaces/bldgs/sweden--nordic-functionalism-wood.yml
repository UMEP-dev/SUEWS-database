  scientific_note: The composite promises a wood variant of Nordic Functionalism and does not assemble
    one. Its construction, records/constructions/sweden--bjork2002--nordic-functionalism-mid-1900s, is
    Swedish, regional and correctly named for the period, but its wall is limestone, brick, mineral wool
    and plaster with no wood layer, and it is the only Nordic Functionalism construction the database
    holds. The Wood in the composite's name is carried by the albedo alone, now a generic archived row named
    Wood. Either the name claims a variant the database cannot yet describe, in which case the fabric record
    is missing, or the name should say what the construction says; a maintainer has to choose, and this
    review will not choose for them. Alongside that, the composite declares representativeness regional
    while three of its seven components are city rows; its emissivity, snow limit and OHM
    coefficients come from Helsinki because no Swedish record for those quantities exists, while water storage and drainage
    are generic.
    None of this requires a component value to change.
