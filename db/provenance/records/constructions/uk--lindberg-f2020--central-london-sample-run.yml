  scientific_note: 'This entry is retained as a traceable SUEWS configuration identity, not presented
    as a construction stack published verbatim by Lindberg et al. Historical code 801 at https://github.com/UMEP-dev/SUEWS/blob/a665422686c8464f7829aa16a46134331e0c04af/docs/source/inputs/tables/ESTM_input/SUEWS_ESTMCoefficients.txt#L10
