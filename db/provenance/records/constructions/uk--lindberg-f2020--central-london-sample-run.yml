    2 supplies aggregate London material classes, not those layer thicknesses. Source unreferenced and
    method assumed make that distinction explicit; source_legacy_ref 90240057 retains the article link
    carried by pre-migration row 37240894. Stable path, London/city scope, origin, legacy ID, sample-run
    name and all parameter values remain unchanged.'
