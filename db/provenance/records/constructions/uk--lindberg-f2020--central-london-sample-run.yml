  scientific_note: 'The corrected record preserves the stable path, London/city scope, source key, origin,
    legacy ID and sample-run name. Code 801 settles the layer count and thicknesses and exposes the former
    wall thickness 0.7606 as a conductivity copied into the wrong field. Table 2 supplies aggregate London
    material classes, not layer thicknesses. The record schema can store a thickness without a material,
    but cannot store historical per-layer conductivity and volumetric heat capacity directly; because
    roof layer three has no proven material record, only its 0.12 m thickness is retained. Issue #257
    remains the separate identity decision.'
