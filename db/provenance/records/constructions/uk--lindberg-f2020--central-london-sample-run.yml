      label: Pre-migration Spartacus Material rows 36243784, 36243786 and 36243787
      url: https://github.com/UMEP-dev/SUEWS-database/blob/053c004ef46c14194fdc39bbb8932908db294abd/db/spartacus_material.yml
      note: The material registry maps 36243784 to conductivity 1.142, 36243786 to 0.93 and 36243787
