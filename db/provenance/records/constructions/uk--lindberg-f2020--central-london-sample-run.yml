  findings:
    name:
      conclusion: curation_required
      evidence_ids:
      - lindberg-london
      - estm-801
      note: Central London is supported, but the bracketed "sample run" marker identifies a separate
        curation question about whether demonstration material belongs in the published database. This
        scope correction does not remove or reinterpret that marker.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/257
    target:
      conclusion: supported
      evidence_ids:
      - lindberg-table-2
      - estm-801
      note: Both the article and historical ESTM row describe building roof, wall and internal thermal
        construction properties, matching the construction target.
    values:
      conclusion: supported
      evidence_ids:
      - lindberg-table-2
      - estm-801
      note: Historical code 801 supports the three roof thicknesses 0.05, 0.15 and 0.12 m and the
        three wall thicknesses 0.087, 0.0497 and 0.0497 m. Material references are retained only where
        the pinned conductivity and pre-migration material mapping agree. The third roof layer correctly
        carries only its supported thickness because no material record represents its k 0.05 W m-1 K-1
        and rhoCp 290000 J m-3 K-1 without inventing a specific-heat/density split.
    source:
      conclusion: curation_required
      evidence_ids:
      - lindberg-table-2
      - estm-801
      note: Lindberg et al. document the London ESTM construction class and aggregate material properties;
        the pinned historical SUEWS registry, rather than Table 2, supplies the corrected layer triplets.
        The record format has one source field and cannot distinguish those two evidence roles.
    place:
      conclusion: supported
      evidence_ids:
      - lindberg-london
      - estm-801
      note: The record now declares London. The article models a 21.5 km by 21.4 km London domain and
        identifies its building classes as London; historical code 801 is labelled "GLA Urban fabric
        >80", place London, origin GLA. The stable path and origin retain legacy UK migration text.
    representativeness:
      conclusion: supported
      evidence_ids:
      - lindberg-london
      - estm-801
      note: City matches a construction class applied across the London/GLA urban domain. The evidence
        does not support the former UK-regional generalisation.
    method:
      conclusion: unresolved
      evidence_ids:
      - lindberg-table-2
      - estm-801
      note: The record declares no method. The pre-migration mapping and code 801 establish this correction,
        but the available evidence does not document how the original assembly was produced.
    identity:
      conclusion: curation_required
      evidence_ids:
      - estm-801
      note: Historical code 801 establishes a distinct high-density GLA construction class and now fixes
        the layer transformation. The sample-run identity remains separate curation under issue 257.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/257
