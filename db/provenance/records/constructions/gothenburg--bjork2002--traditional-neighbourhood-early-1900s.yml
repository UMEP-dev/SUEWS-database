  scientific_note: >-
    This is an identity and release-policy resolution, not a claim that value 6 is scientifically preferable
    to value 2. UMEP 4.4.3 and the database migration use 6, which makes the wall one horizontally aggregated
    layer. UMEP 4.5 and later use 2, which separates the 1 mm felt-sheathing layer during aggregation. Total
    material thickness and steady thermal resistance are unchanged, but transient storage behavior may
    differ. The maintainer chose to preserve historical 4.4.3 behavior; the record is therefore explicitly
    unreferenced and assumed, with the later release divergence retained as evidence rather than overwritten.
