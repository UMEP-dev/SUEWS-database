  scientific_note: 'The exact values have two distinct provenance roles. Järvi et al. (2011) is the
    original fit publication: Table 5(b) reports the pooled five-dataset 50th-percentile G1-G6 set at
    printed precision, while Sections 3.2 and 4.2 document its non-linear least-squares and bootstrap
    derivation. The later SUEWS v2016a workbook is the exact default compilation: SUEWS_Conductance row
    3 labels code 100 as Default and Jarvi et al. (2011), while B3:L3 retain the complete eleven-value
    tuple. The stored numbers are unchanged; origin is corrected from Unspecified to Vancouver and Los
    Angeles, and method is recorded as fitted.'
