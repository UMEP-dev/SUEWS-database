  scientific_note: Ward et al. publish six fitted response coefficients and three fixed limits, but
    express soil-moisture limitation with a 120 mm wilting-point deficit rather than the s1 and s2 fields
    stored by SUEWS. The authoritative v2016a workbook maps the proposed gsChoice 2 parameterisation to
    code 200 with s1 5.56 and s2 0. This change preserves the released model tuple and makes that mixed
    provenance explicit instead of attributing artifact-only cells to the paper or presenting them as
    an exact encoding of its 120 mm deficit. It also records Swindon as the observational origin while
    retaining the source-supported generic application scope.
