  scientific_note: 'This record encodes a decision rather than a measurement: irrigation off, every day,
    all year. Stagakis et al. list irrigation only as a SUEWS submodel and publish no schedule in the article,
    supplement or parameter table. The values remain unchanged as an explicit assumption; the paper attribution
    and unsupported Zurich/city evidence scope are removed while origin preserves migration lineage.'
