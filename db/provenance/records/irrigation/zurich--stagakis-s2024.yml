    - kind: section
      label: Sect. 2.3.3, SUEWS
      page: 2139
      url: https://doi.org/10.5194/bg-22-2133-2025
      note: Describes the SUEWS configuration used. Irrigation is named only as one of the submodels SUEWS
        contains; no irrigation setting, schedule or fraction is stated anywhere in the article or its
        supplement.
  - id: stagakis-parameter-table
    source: stagakis-s2024
    role: compilation
    locators:
    - kind: supplementary
      label: Supplement Table S3, Parameters used by SUEWS model
      page: 3
      url: https://doi.org/10.5194/bg-22-2133-2025-supplement
      note: One Trees column and one Lawn column. It gives Fpho,max 8.3 and 8.92, ai 0.78 and 1.7, bi
        0.08 and 0.06, LAImax 4.8 and 3, LAImin 0.66 and 1.6, G2-G6, TL, TH, dtheta_WP 132.5 and 143 mm,
        Kdown,max 1200, GDD 300, SDD -300, Tbase,GDD 5, Tbase,SDD 10, and the four LAI power coefficients
        0.04, 0.0005, -1.5 and 0.0025. It gives no maximum conductance, no G1, no soil depth, no soil
        storage capacity, no light-response alpha or theta and no minimum respiration.
  - id: stagakis-scope
    source: stagakis-s2024
    role: compilation
    locators:
    - kind: section
      label: Title and abstract
      page: 2133
      url: https://doi.org/10.5194/bg-22-2133-2025
      note: The study covers four urban parks in the city of Zurich and evaluates the models against in
        situ measurements made in those parks; it is park-scale, not a city-wide determination.
  scientific_note: 'This record encodes a decision rather than a measurement: irrigation off, every day,
    all year. The cited study says nothing about it. Section 2.3.3 lists irrigation among the SUEWS submodels
    and moves on, and the supplement''s parameter table has no irrigation row. The configuration may well
    be exactly what the authors ran, and for four Zurich parks it would be unsurprising, but the publication
    does not record it, so the record is asserting on the authors'' behalf. Beyond the sourcing, there
    is a design question worth a maintainer''s attention: a row that turns a submodel off is not the same
    kind of thing as a parameter derived from evidence, and giving it a citation implies it is.'
