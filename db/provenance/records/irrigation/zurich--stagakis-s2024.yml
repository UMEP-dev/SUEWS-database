  findings:
    name:
      conclusion: curation_required
      evidence_ids:
      - stagakis-suews-section
      note: No Irrigation describes a switched-off configuration rather than a measured property. The
        article never states whether irrigation was enabled, so the name asserts something the source
        does not.
    target:
      conclusion: supported
      evidence_ids:
      - stagakis-suews-section
      note: The stored fields are SUEWS irrigation settings, which is the irrigation target.
    values:
      conclusion: unresolved
      evidence_ids:
      - stagakis-suews-section
      - stagakis-parameter-table
      note: The article mentions irrigation once, as one of the submodels SUEWS contains, and gives no
        irrigation setting. Table S3 has no irrigation row. Nothing published shows the day-of-year window
        of 1 to 366, the zero automatic fraction, or the all-zero watering days and fractions.
    source:
      conclusion: unresolved
      evidence_ids:
      - stagakis-suews-section
      note: The cited study cannot be shown to establish these settings. It is plausible that irrigation
        was simply left off for the park simulations, but plausibility is not evidence and this audit
        will not record it as one.
    place:
      conclusion: unresolved
      evidence_ids:
      - stagakis-scope
      note: Nothing published ties an irrigation configuration to Zurich.
    representativeness:
      conclusion: correction_required
      evidence_ids:
      - stagakis-scope
      note: City representativeness would in any case overstate a four-park study, and a whole-city irrigation
        claim least of all follows from park simulations.
    method:
      conclusion: unresolved
      evidence_ids:
      - stagakis-suews-section
      note: A model configuration rather than a determined value; which it is cannot be settled from the
        publication.
    identity:
      conclusion: curation_required
      evidence_ids:
      - stagakis-suews-section
      note: Whether a switched-off irrigation configuration should be a citable database record at all,
        as opposed to a model default, is a maintainer decision.
  evidence:
  - id: stagakis-suews-section
    source: stagakis-s2024
