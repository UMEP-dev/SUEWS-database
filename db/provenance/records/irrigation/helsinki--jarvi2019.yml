  findings:
    name:
      conclusion: supported
      evidence_ids:
      - helsinki-irrigation-archive
      note: The archived rows are labelled Helsinki-Sm01, Helsinki-Sm02 and Helsinki-Sm03,
        and the record retains the generic Irrigation display name used for this target.
    target:
      conclusion: supported
      evidence_ids:
      - helsinki-irrigation-archive
      note: The values are published in SUEWS_Irrigation.txt and therefore belong to the
        irrigation target.
    values:
      conclusion: supported
      evidence_ids:
      - helsinki-irrigation-archive
      - published-irrigation-coefficients
      note: Codes 1-3 in the archived Kumpula input contain the complete stored tuple exactly.
        Supplementary Table S4 of Järvi et al. (2017) independently prints the same six legacy
        irrigation coefficients.
    source:
      conclusion: supported
      evidence_ids:
      - helsinki-irrigation-archive
      note: The Zenodo repository directly publishes the complete configuration row. The associated
        2019 article links the repository and documents the Kumpula model application, but does not
        print the atomic irrigation tuple, so the data-repository key is the precise record source.
    place:
      conclusion: supported
      evidence_ids:
      - helsinki-irrigation-archive
      - kumpula-model-scope
      note: The selected input is in the Kumpula model-run archive, and the associated article locates
        Kumpula in Helsinki.
    representativeness:
      conclusion: supported
      evidence_ids:
      - helsinki-irrigation-archive
      - kumpula-model-scope
      note: The Kumpula model run applies the row to the three sectors around the measurement site;
        the record makes no claim that this configuration was determined city-wide.
    method:
      conclusion: supported
      evidence_ids:
      - helsinki-irrigation-archive
      - published-irrigation-coefficients
      note: The record adopts a published model-input configuration, so literature is the record-level
        method. This does not imply that the Helsinki study fitted the six inherited coefficients.
    identity:
      conclusion: supported
      evidence_ids:
      - helsinki-irrigation-archive
      note: Archive codes 1-3 are byte-for-value identical and differ only in their Helsinki-Sm labels,
        so one evidence record preserves the scientific value set without triplication.
  evidence:
