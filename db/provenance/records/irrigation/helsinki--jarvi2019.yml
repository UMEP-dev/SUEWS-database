    role: compilation
    locators:
    - kind: supplementary
      label: Supplementary Table S4, overall-area irrigation parameters
      page: 6
      url: https://doi.org/10.1038/s41598-017-05733-y
      note: Prints the exact six coefficients -19.1853, 2.2195, 0.7836, -5.7556,
        0.6658 and 0.2351 as parameters used in the SUEWS model runs; it does not
        document their derivation.
  - id: kumpula-model-scope
    source: jarvi2019
    role: validation
    locators:
    - kind: table
      label: Table 1, Kumpula site characteristics
      page: 8367
      url: https://doi.org/10.1029/2018JD029576
    - kind: section
      label: Sect. 4.1, Model Evaluation in Helsinki
      page: 8368
      url: https://doi.org/10.1029/2018JD029576
      note: Defines the Kumpula measurement site and the three 1-km sectors Ku1-Ku3 used
        for the model evaluation; it does not publish the irrigation row.
  scientific_note: Järvi et al. (2011) establish the irrigation-model form and fit Vancouver
    observations, but they do not publish this coefficient tuple. Their Sect. 4.3 reports automatic
    coefficients -84.54, 9.96 and 3.67, with manual coefficients set to 0.30 times those values.
    The exact later tuple is first located here in the 2017 supplementary compilation and the archived
    2016-dated model input; its original derivation remains unlocated. The dataset is nevertheless a
    direct source for the complete Helsinki application row, so the citation is corrected without
    crediting the 2011 authors with numbers they did not publish.
