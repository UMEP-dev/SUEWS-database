  scientific_note: >-
    The complete row is fully traceable as an archived Vancouver application configuration, but it is
    not the tuple published by Järvi et al. (2011). The original database workbook and pinned v2016a
    release both preserve start day 152, end day 243, faut 0.2, daily all-one controls and the six legacy
    coefficients. The paper publishes start day 121 for all Vancouver sites and faut 0.01 for Vs87; it
    reports the fitted coefficients at lower precision and describes the manual coefficients as 0.30 of
    the automatic values. Because the active exported controls are release configuration choices and the
    fitted values are retained only as non-exported compatibility metadata, the record remains
    unreferenced and is classified as assumed. Ref 99240099 is an unreferenced placeholder, not a source
    lineage identifier. No value, stable path, origin or legacy ID is changed.
