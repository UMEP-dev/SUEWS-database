  findings:
    name:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: The label restates the target. Neither the article nor the archive names the row, and the
        record claims no published name.
    target:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: The archived row is a SUEWS_Irrigation entry, which is what the irrigation target holds.
    values:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      - zheng-supplement
      note: SUEWS_SiteSelect.txt gives the Beijing grid IrrigationCode 5, and code 5 of SUEWS_Irrigation.txt
        carries Ie_start 60, Ie_end 334, InternalWaterUse 0, Faut 0, H_maintain -999, Ie_a1 -19.1853,
        Ie_a2 2.2195, Ie_a3 0.7836, Ie_m1 -5.7556, Ie_m2 0.6658, Ie_m3 0.2351 and DayWat and DayWatPer
        of 1 on every day, which is the record exactly. Supplement Table S3 gives the same six coefficients
        rounded to -19.19, 2.22, 0.78, -5.76, 0.67 and 0.24.
    source:
      conclusion: correction_required
      evidence_ids:
      - zheng-supplement
      - zheng-model-archive
      note: Supplement Table S3 heads the block as overall model parameter values used in model runs in
        Beijing following Kokkonen et al. (2019), so Zheng et al. apply the six irrigation coefficients
        rather than deriving them, and the article body contains no irrigation section at all. The dates
        and day flags, by contrast, are established only by the released Beijing input. One source key
        currently carries both halves.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/328
    place:
      conclusion: curation_required
      evidence_ids:
      - zheng-supplement
      note: Beijing is where the row was applied. The inherited coefficients are not Beijing determinations,
        so whether this record should carry Beijing as its place is a curation decision.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/328
    representativeness:
      conclusion: correction_required
      evidence_ids:
      - zheng-domain
      note: The record claims city representativeness, but Sect. 3 states that the modelled area is a
        1 km circle around the IAP tower.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/328
    method:
      conclusion: curation_required
      evidence_ids:
      - zheng-supplement
      - zheng-model-archive
      note: The row mixes coefficients fitted in earlier work with a schedule that exists only as model
        configuration, so no single production method describes it.
    identity:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: The archive holds codes 4 and 5 with identical contents and the Beijing grid uses code 5;
        the database holds one record, which is the right count.
