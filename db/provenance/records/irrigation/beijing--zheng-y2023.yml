    - kind: dataset
      label: ModelRuns/Input/SUEWS_Irrigation.txt, code 5
      url: https://doi.org/10.5281/zenodo.8012194
      note: Carries every stored value, including the day-of-year window 60 to 334 and the six Ie coefficients
