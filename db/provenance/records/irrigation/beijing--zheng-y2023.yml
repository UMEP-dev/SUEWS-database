  scientific_note: >-
    Every stored number is confirmed against the released Beijing model input. The row is retained as one
    archived application configuration because its schedule and flags belong with the exact code selected
    by the model, while its empirical coefficients are inherited overall SUEWS parameters rather than a
    Beijing fit. Source unreferenced prevents false attribution to Zheng et al.; method assumed describes
    the complete configuration choice; source_legacy_ref 90240067 preserves the application link. Beijing
    and site identify the released 1 km IAP-tower domain, not city-wide evidence. No value, stable path,
    origin, legacy ID or legacy coefficient is changed.
