      url: https://doi.org/10.5281/zenodo.8012194
      note: Assigns Code_EveTr 991, Code_DecTr 992, Code_Grass 993 and IrrigationCode 5 to the modelled
        Beijing grid, so those rows are the ones the published runs used.
  - id: zheng-supplement
    source: zheng-y2023
    role: compilation
    locators:
    - kind: supplementary
      label: Supplement Table S3, overall model parameter values used in model runs in Beijing
      page: 2
      url: https://doi.org/10.5194/gmd-16-4551-2023-supplement
      note: Publishes b0,a = -19.19 mm, b1,a = 2.22 mm K-1, b2,a = 0.78 mm d-1, b0,m = -5.76 mm, b1,m
        = 0.67 mm K-1 and b2,m = 0.24 mm d-1, and attributes the whole table to Kokkonen et al. (2019).
  - id: zheng-domain
    source: zheng-y2023
    role: compilation
    locators:
    - kind: section
      label: Sect. 3, Study site and measurements
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: The model domain is a 1 km circle around the IAP tower, covering roughly 80 % of the accumulated
        flux footprint; no city-wide domain is modelled.
  scientific_note: 'Every stored number is confirmed against the released Beijing model input, so nothing
    here is unverifiable. The difficulty is that one record carries two different kinds of provenance.
    The six empirical irrigation coefficients are inherited: the supplement presents them as overall parameters
    following Kokkonen et al. (2019), rounded, and the article never discusses irrigation. The start and
    end days, the automatic fraction and the day flags exist only in the released input. Attributing the
    whole row to Zheng et al. credits them with coefficients they did not derive; attributing it elsewhere
    loses the schedule. A maintainer needs to decide whether to split the record or to record the two
    roles separately.'
