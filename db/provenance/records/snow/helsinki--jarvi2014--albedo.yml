  scientific_note: Both values are the article's own, which is unusual in this group, and the text is
    explicit that they were set from observations and differ from the earlier Lemonsu ageing function.
    Figure 4 and Sections 2.2.2–3.1 locate those observations at the Pr suburban site in Montreal, so
    the record now declares that site and site-scale representativeness. Its stable path and origin remain
    legacy migration identifiers rather than claims about where the parameters were determined. The only
    unresolved question is whether a value set from observations by comparison with an existing ageing
    function should be classed measured or fitted.
