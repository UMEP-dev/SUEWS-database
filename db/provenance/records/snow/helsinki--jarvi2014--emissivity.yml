  findings:
    name:
      conclusion: curation_required
      evidence_ids:
      - jarvi-table-4b
      note: The record is named Snow (sample data). Nothing in the article describes this value as sample
        data, and a name that marks a value as a test fixture while the database serves it as evidence
        is a curation problem in its own right, the more so because this is the only snow emissivity record
        in the database.
    target:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4b
      note: A snow emissivity is a snow property.
    values:
      conclusion: supported
      evidence_ids:
      - jarvi2011-table-2b
      - jarvi-table-4b
      note: Järvi et al. (2011) Table 2b gives epsilon_snow 0.99, and Järvi et al. (2014) Table 4b republishes
        epsilon_s 0.99. Both match the stored value.
    source:
      conclusion: supported
      evidence_ids:
      - jarvi2011-table-2b
      - jarvi-table-caption
      note: Järvi et al. (2011) publishes the value in Table 2b. The Järvi et al. (2014) Table 4 caption
        states that sources are as in the 2011 paper unless marked otherwise, and the emissivity cell
        has no footnote, so the later paper is correctly retained only as compilation evidence.
    place:
      conclusion: not_applicable
      note: The record declares no place. Järvi et al. (2011) presents 0.99 as a general model-run input
        used in both Los Angeles and Vancouver, not as a value determined at either city; the stable path
        and origin retain legacy Helsinki migration text only.
    representativeness:
      conclusion: supported
      evidence_ids:
      - jarvi2011-table-2b
      note: Generic representativeness matches a general model-run input published without a place-specific
        derivation and used across both evaluated cities.
    method:
      conclusion: supported
      evidence_ids:
      - jarvi2011-table-2b
      - jarvi-table-caption
      note: Literature records an inherited published input. Järvi et al. (2011) is the parameter source
        and Järvi et al. (2014) explicitly carries it forward.
    identity:
      conclusion: curation_required
      evidence_ids:
      - jarvi-table-4b
      note: This is the only snow emissivity record in the database, so every snow composite depends on
        it, and it is named as sample data. That combination needs a decision.
