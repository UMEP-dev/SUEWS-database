      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: Gives alpha_s,min 0.18, alpha_s,max 0.85, epsilon_s 0.99, a0 0.1, a1 9.9 x 10^3 as printed,
        a2 0.0102, GDD 300, SDD -450, TBaseGDD 5 degC, TBaseSDD 10 degC, TBaseQF 18.2 degC, Ks 0.0005
        mm s-1, a_r 0.0016 mm W-1 h-1 and T_lim 2.2 degC, among others. It is a single set for the whole
        area.
  - id: jarvi-table-caption
    source: jarvi2014
    role: compilation
    locators:
    - kind: text
      label: Table 4 caption
      page: 1701
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: States that sources of the values are as in Järvi et al. (2011) unless indicated otherwise
        below, so an unfootnoted cell in this table is an inherited value rather than one this study determined.
  scientific_note: 'The value is exactly what Järvi et al. (2011) Table 2b publishes as a general model-run
    input, and Järvi et al. (2014) Table 4b republishes it while pointing unfootnoted inputs back to the
    earlier paper. That supports a generic, placeless literature record rather than Helsinki city evidence.
    The remaining difficulty is the name: this record
    calls itself sample data, nothing in the article supports that description, and it is the only snow
    emissivity the database has, so every snow composite rests on a row labelled as a test artefact. Either
    the label is wrong and should go, or it is right and the record should not be serving composites.
    That is a maintainer''s call, not an audit''s.'
