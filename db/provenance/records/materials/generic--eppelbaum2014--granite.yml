  scientific_note: >-
    Deattribution is a whole-record curation decision required by the one-source export format, not a claim
    that every field lacks evidence. Eppelbaum remains exact field-scoped validation evidence for conductivity
    2.68. Albedo 0.35 is absent from the complete monograph: every albedo or ordinary reflectivity passage
    concerns planetary material, not granite. Emissivity 0.96 is absent too; the book uses emissivity only
    as a generic Stefan-Boltzmann symbol and contains no rock emissivity table. The specific heat 1900 is
    also absent and conflicts with three stated granite alternatives. Density 2650 is not stated either;
    the book offers a different melting-context value and a broad range that merely contains 2650. No
    replacement is substituted because the intended sources or transformations are unknown. All five values
    and the stable identity are retained as an explicit unreferenced assumed configuration, with all four
    unsupported fields now carrying explicit dispositions.
