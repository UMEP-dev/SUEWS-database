  derivation:
    kind: arithmetic_mean
    expression: 'For each of a1, a2 and a3: (code 713 + code 701 + code 702 + code 703 + code 704 + code 705 + code 706 + code 707) / 8.'
    description: 'The sums are a1 = 1.52, a2 = 4.32 and a3 = -121; dividing each by eight gives 0.19,
      0.54 and -15.125 exactly. Legacy code 708 is not an input; the historical selection rationale is
      undocumented, but the accepted eight-row reconstruction is unique and fully reproducible.'
  scientific_note: 'Leena Järvi confirmed that the SMEAR III roof values were selected from earlier-literature
    OHM coefficients in the legacy text table rather than fitted to Helsinki observations. Repository-wide
    subset reconstruction uniquely identifies codes 713 and 701-707 as the equal-weight inputs. Code
    708 is excluded by the exact arithmetic; why it was not selected was not documented. This uncertainty
    concerns the historical selection rationale, not the reproducibility of the stored tuple.'
