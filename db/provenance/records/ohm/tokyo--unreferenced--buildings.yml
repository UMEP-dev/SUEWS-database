  scientific_note: >-
    Yoshida et al. (1991) supplies the Kyoto canyon observations but no OHM coefficients.
    Grimmond and Oke (1999) publishes the stored fitted triplet. The corrected origin, resolved
    place and site-specific representativeness now all identify Kyoto while the stable path
    deliberately remains unchanged. The evidence-backed coefficient set applies to the canyon
    physical component (facet), not directly to a SUEWS land-cover class. The related Ref-null row
    is retained only as a separate unresolved migration identity under issue 738. No source
    identifies which current building archetype should attach this record, so any such attachment
    remains a separate composition decision.
