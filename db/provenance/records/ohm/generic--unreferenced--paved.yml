  scientific_note: Legacy code 800 is the component-wise arithmetic mean of seven release-table rows.
    Its stored values are preserved exactly. The release's code 801 uses a2 = 0.10 h, whereas both checked
    publications give 0.48 h for the corresponding Doll concrete row; using the publication value would
    change the mean. This sidecar makes that discrepancy visible while preserving the stable release
    lineage rather than silently altering a long-standing model input.
