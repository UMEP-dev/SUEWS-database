  scientific_note: >-
    The exact Code 904 tuple is directly recoverable from a pinned SUEWS release table, so the record no
    longer needs a false Zheng et al. parameter attribution. The historical HCW calculation is not
    recoverable from the public workbooks: the coefficients are literal cells with no formula or derivation
    sheet. Although Code 904 equals the mean of the rounded seasonal rows 907 and 908, numeric coincidence
    cannot establish lineage. The record therefore cites the public configuration artifact and remains
    method assumed for focused human review. Anandakumar supplies the observation inputs and Alland site;
    Zheng supplies later Beijing application evidence. No coefficient, stable path, place or downstream
    selection changes.
