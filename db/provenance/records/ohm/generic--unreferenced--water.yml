  scientific_note: Grimmond and Oke (1999) is the canonical parameter publication; Souch et al. supplied
    the observation input. The sidecar preserves the role distinction without attributing the fitted
    coefficients to Souch. Section 7(a) establishes that the published tuple applies to the individual
    water surface type before surface-fraction weighting into a site-specific OHM coefficient, so its
    applicable scale is the land-cover class.
