  scientific_note: The original full text establishes that this is a fitted winter OHM tuple from one instrumented teaching-building roof slab. The paper discusses the surrounding urban setting and possible wider applicability, but it does not sample or validate roofs across Nanjing. The database therefore classifies the evidence at site scale while preserving Nanjing as the location. The separate summer fit remains in its own record and review.
