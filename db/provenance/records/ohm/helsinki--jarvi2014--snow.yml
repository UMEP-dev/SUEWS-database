  scientific_note: The publication and exact values are supported. The record now declares the Pr suburban
    site in Montreal and site representativeness because that is where a2 and a3 were optimized against
    observed sensible heat. The place-neutral a1 assumption does not support a different location, and
    the completed triplet's later use at all sites describes evidence travel rather than origin. Human
    curation is still required under issue 71 because the tuple combines coefficient-specific methods.
