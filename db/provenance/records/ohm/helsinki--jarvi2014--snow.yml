  scientific_note: The publication supports the triplet, subject to an internal inconsistency for a2.
    Section 3.1.2 states the optimum is 0.60 and Table 4(b) uses 0.6 in the final model parameters,
    whereas Table 3 prints 0.5. The record retains 0.6 because the narrative and final parameter table
    agree. It declares the Pr suburban site in Montreal and site representativeness because that is where
    a2 and a3 were optimized against observed sensible heat. The place-neutral a1 assumption does not
    support a different location, and the completed triplet's later use at all sites describes evidence
    travel rather than origin. The coefficient-specific method metadata preserves that a1 is assumed
    from shallow-water and heat-capacity relationships, whereas a2 and a3 are fitted.
