      source: grimmond1999
      role: compilation
      locators:
        - kind: table
          label: Table 4
          page: 932
          note: >-
            Repeats the mixed-forest triplet and attributes the observational source to
            McCaughey (1985). Its post-1991 footnote does not change the fact that the exact
            triplet already appears on p. 313 of Grimmond et al. (1991).
  scientific_note: >-
    McCaughey (1985) is the observation input, Grimmond et al. (1991) is the publication
    that states the stored fitted coefficients, and Grimmond and Oke (1999) is a later
    compilation. Of the three full publications checked, Grimmond et al. (1991) is the
    earliest one containing the exact triplet; the remaining lineage is preserved here.
