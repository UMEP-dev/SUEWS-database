  scientific_note: 'Järvi et al. (2014) models snow transport with SWE,Lim and a site-specific clearing
    time, not an hourly schedule. Its Table 4 gives 40 mm for buildings and 100 mm for pavement, and the
    paper contains no all-zero removal profile. The accessible V2016a profile table likewise contains only
    a Helsinki daytime snow-removal row. This unchanged all-zero record is therefore an explicit model
    configuration assumption: source unreferenced and method assumed. Its display name is corrected to
    No snow removal; the stable path retains the historical misspelling because it is record identity.'
