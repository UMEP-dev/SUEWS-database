  scientific_note: >-
    The complete two-row configuration is recoverable from the original database workbook: weekday
    clearing is active from 06:00 through 17:00 and weekend clearing from 07:00 through 17:00. Archived
    v2016a and v2017a SUEWS profile tables corroborate the weekday vector and Helsinki label. Järvi et al.
    (2014) explains the threshold-triggered, site-specific clearing process but does not publish either
    schedule. The database therefore retains the exact pair as an assumed Helsinki application
    configuration, uses unreferenced to avoid false publication attribution, and preserves legacy source
    ID 90240015 only as lineage. No value, stable path, origin or legacy ID is changed.
