    locators:
    - kind: table
      label: Table 1, characteristics of the observational sites
      page: 1696
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: 'Five sites: Kumpula, Pasila and Pihlajamäki in Helsinki, and an urban and a suburban site
        in Montreal. Each Helsinki eddy covariance footprint is a 1 km radius circle and the catchments
        are 23.8 and 44.8 ha. London is not a study site; the word appears in the article only in a code-availability
        address and in a publisher''s address in the reference list.'
  scientific_note: 'Snow removal in this article is a threshold, not a schedule: a snow water equivalent
    limit of 40 mm on buildings and 100 mm on pavement, applied uniformly across the sites because nothing
    better was available. There is no diurnal profile in it. The three records in this family encode switching
    patterns instead, and the citation does not support any of them.'
