    - kind: section
      label: Sect. 3.2 and Appendix C, snow transport limit
      page: 1700
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: Snow removal enters the model through SWE,Lim, a limit of the snow water equivalent for snow
        removal, given in Table 4a as 40 mm for buildings and 100 mm for pavement. The article says the
        same values were used at all sites because no additional information was available. It publishes
