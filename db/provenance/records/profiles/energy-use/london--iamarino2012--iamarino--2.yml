  derivation:
    kind: other
    description: Aggregate adjacent half-hours from the GreaterQF winter domestic-unrestricted profiles;
      normalise each day type separately, and take an equal Saturday-Sunday mean for the holiday profile.
    expression: working_day[h] = (Wd[2h] + Wd[2h+1]) / sum(Wd); holiday[h] = 0.5 * ((Sat[2h]
      + Sat[2h+1]) / sum(Sat) + (Sun[2h] + Sun[2h+1]) / sum(Sun)), for h = 0..23.
    external_inputs:
    - id: winter-weekday-total
      evidence_id: greaterqf-v3-profile
      parameter: ElUNr_Wi weekday block sum
      value: 48.0
      note: Sum of the first 48 half-hour values; adjacent pair sums divided by this total are the exact
        working-day entries.
    - id: winter-saturday-total
      evidence_id: greaterqf-v3-profile
      parameter: ElUNr_Wi Saturday block sum
      value: 48.002
      note: Sum of rows 49-96 before within-day normalisation.
    - id: winter-sunday-total
      evidence_id: greaterqf-v3-profile
      parameter: ElUNr_Wi Sunday block sum
      value: 47.999
      note: Sum of rows 97-144 before within-day normalisation; GreaterQF applies this profile to Sundays
        and public holidays.
  scientific_note: The scientific and numeric lineages are distinct. Iamarino et al. document that the
    London model uses UKERC domestic-unrestricted reference profiles, while Elexon/UKERC preserve the
    originating profile-class dataset and definitions. The exact higher-precision half-hour inputs used here
    survive in the GreaterQF v3.2 public-release archive. The deterministic calculation above reproduces
    both stored residential vectors, but no located publication prints those final 24 values. The record
    therefore moves from a misleading paper citation to an explicit unreferenced calculation, preserving
    Ref 90240007 only as historical metadata. Stable path, name, place, representativeness, values and legacy
    IDs are unchanged.
