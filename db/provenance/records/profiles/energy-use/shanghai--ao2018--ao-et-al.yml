    values:
      conclusion: supported
      evidence_ids:
      - ao-profile-publication
      note: Ao et al. Figure 3a and section 3.1 establish the three scaled weekday, weekend and holiday
        profile shapes and their reported max:min ratios. The paper does not print the normalized two-decimal
        arrays; the versioned legacy rows preserve all 72 exact compiled values and cite Ao et al. through
        reference 90240064. No value is changed.
    source:
      conclusion: supported
      evidence_ids:
      - ao-profile-publication
      - liu-electricity-input
      - sailor-industry-input
      - shanghai-energy-input
      - yu-population-input
      - zhong-population-input
      note: Ao et al. is the publication that derives and presents the profiles, so it remains the parameter
        source. The other publications supply electricity, industry and population inputs and are recorded
        separately rather than being credited with the final vectors.
    place:
      conclusion: supported
      evidence_ids:
      - ao-profile-publication
      note: Section 2.2 and Figure 3a identify the final profiles with the XJH site in Shanghai.
    representativeness:
      conclusion: supported
      evidence_ids:
      - ao-profile-publication
      note: The city electricity profile is scaled by XJH industry and dynamic-population assumptions;
        Figure 3a labels the result as the XJH site profile.
    urban_setting:
      conclusion: supported
      evidence_ids:
      - ao-profile-publication
      note: The paper describes XJH as a dense central business district dominated by office and residential
        buildings.
    method:
      conclusion: supported
      evidence_ids:
      - ao-profile-publication
      - liu-electricity-input
      - sailor-industry-input
      - shanghai-energy-input
      - yu-population-input
      - zhong-population-input
