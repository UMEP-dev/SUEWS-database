  evidence:
  - id: ao-profile-publication
    source: ao2018
    role: parameter_source
    locators:
    - kind: section
      label: Section 2.2, Estimation of anthropogenic heat flux QF
      page: 1986
      url: https://doi.org/10.1175/JHM-D-18-0057.1
      note: States that weekday, weekend and holiday building profiles are based on city electricity and
        scaled by Shanghai's electricity fraction, XJH industry fraction and dynamic population density.
    - kind: figure
      label: Figure 3a, XJH building anthropogenic heat profiles, scale 2
      page: 1987
      url: https://doi.org/10.1175/JHM-D-18-0057.1
      note: Presents the weekday, weekend and holiday curves after accounting for dynamic population density.
    - kind: section
      label: Section 3.1, Anthropogenic heat fluxes
      page: 1989
      url: https://doi.org/10.1175/JHM-D-18-0057.1
      note: Describes each curve's hourly shape and gives scale-2 max:min ratios of 4.7, 3.2 and 3.4 before
        two-decimal profile rounding.
    - kind: dataset
      label: Historical database rows 60240944-60240946
      url: https://github.com/UMEP-dev/SUEWS-database/blob/053c004ef46c14194fdc39bbb8932908db294abd/db/profiles.yml#L28994-L29086
      note: Preserves the exact two-decimal vectors, day types and Ref 90240064 that resolves to Ao et
        al.; this is compilation lineage, not a second derivation source.
  - id: liu-electricity-input
    source: liu2013
    role: input_data
    locators:
    - kind: section
      label: Introduction and Section 1, Shanghai power-load characteristics
      page: 455-457
      url: https://html.rhhz.net/yyqxxb/html/20130408.htm
      note: Uses Shanghai Electric Power Company 15-minute load data for 2004-2008 and separates working
        from non-working days, including holiday effects.
  - id: sailor-industry-input
    source: sailor2011
    role: input_data
    locators:
    - kind: section
      label: Section 2.2, Industry
      page: 191
      url: https://doi.org/10.1002/joc.2106
      note: States that industrial energy use is relatively weather-insensitive and has a more uniform
        diurnal and seasonal distribution; Ao et al. use this as their uniform industrial-load assumption.
  - id: shanghai-energy-input
    source: shanghai-statistics2016
    role: input_data
    locators:
    - kind: table
      label: Chapter 6 Table 6.1, energy consumption in main years
      url: https://tjj.sh.gov.cn/tjnj/2016tjnj/C0601.htm
      note: Official rows give total and industrial energy and electricity consumption for 2005-2009;
        Ao et al. reproduce these in Table A1 and use them for the approximately 14% electricity fraction
        and XJH industry scaling.
  - id: yu-population-input
    source: yu2016
    role: input_data
    locators:
    - kind: section
      label: Section 3.1.2, Population Data, and Figure 4
      page: 419
      url: https://doi.org/10.1007/s13753-016-0111-8
      note: Finds Jing'an daytime population 39.2% above nighttime overall and 147.7% above nighttime
        in its busiest subdistrict, one basis for Ao et al.'s XJH dynamic-population scaling.
  - id: zhong-population-input
    source: zhong2017
    role: input_data
    locators:
    - kind: section
      label: Section 3.1, population time dynamics
      page: 975-976
      url: https://doi.org/10.11821/dlyj201705013
      note: Shows population moving into central Shanghai from 0600 to 1000, remaining concentrated until
        1800, then returning outward.
    - kind: figure
      label: Figure 7, central-city daytime-to-nighttime population ratio
      page: 979
      url: https://doi.org/10.11821/dlyj201705013
      note: Maps central-city neighborhood daytime-to-nighttime ratios, supporting the approximately 1.5
        ratio adopted by Ao et al.
  scientific_note: This record is an adoption of Ao et al.'s XJH scale-2 building-heat profiles. Ao et
    al. calculated those curves from city electricity data, energy and industry fractions, a uniform industrial-load
    assumption and dynamic population evidence; the database did not repeat that calculation from atomic
    inputs. Keeping source ao2018 and method literature therefore credits the derivation publication,
    while the sidecar separates every located input-data role. The paper supplies the derivation and plotted
    curves, and the immutable legacy rows supply the exact two-decimal compilation lineage.
