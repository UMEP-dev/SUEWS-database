  scientific_note: >-
    Close-reading Table 3 resolves the relationship that the issue initially left open: its caption
    requires a constant hourly amount within each delineated period, and dividing the Arcadia Prof2
    shares by their period lengths produces the exact code 12 vector. The record therefore changes from
    a false Lindberg citation to an unreferenced database calculation over published inputs. The original
    Grimmond study establishes the observation lineage but does not print the shares, so it is not credited
    with the derived output. Table 4 now resolves the profile's evidence location and scale as the 78.5 ha
    Arcadia measurement site. The stable path, legacy Los Angeles origin string, source, method,
    source_legacy_ref, values and legacy ID remain unchanged.
