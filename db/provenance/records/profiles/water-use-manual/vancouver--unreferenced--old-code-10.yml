  scientific_note: >-
    The original issue treated the article's three period shares and the release's 24 hourly values as
    different representations. Close-reading Table 3 resolves the relationship: the caption explicitly
    says water use is constant in every hour of each delineated period, and half-up conversion of the
    published 0.15/0.35/0.50 shares produces the exact code 10 vector. The hourly values sum to 0.99 rather
    than 1.00 because each period's per-hour value was rounded separately. The record therefore remains
    unreferenced as a database calculation over published inputs, while the derivation and release artifact
    make every output reproducible. Vancouver is retained, and representativeness is narrowed from city
    to the 21 ha Vs87 site. No value, stable path, origin or legacy ID changes.
