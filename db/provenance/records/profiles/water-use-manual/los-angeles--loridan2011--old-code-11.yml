  scientific_note: >-
    The provenance chain has four distinct layers. Grimmond et al. report the underlying San Gabriel
    lower-tree-cover neighborhood survey and billing observations. Järvi et al. publish the normalised
    Prof3 period shares and the constant-within-period rule. Half-up conversion of those shares produces
    the exact 24 hourly values retained here, and the pinned V2016a table is the release compilation of
    that derived vector. The hourly values sum to 0.99 because each period's per-hour value was rounded
    separately. Loridan et al. do not publish any layer of this water-use profile, so the record remains
    an unreferenced database calculation while preserving Ref 90240005 only as historical metadata. Table
    3's explicit Prof3 label and Grimmond et al.'s original site description correct the active place from
    Los Angeles to San Gabriel and narrow representativeness from city to site. Values, stable path, origin
    and legacy ID remain unchanged. No coordinates or Koppen class are inferred for the new place.
