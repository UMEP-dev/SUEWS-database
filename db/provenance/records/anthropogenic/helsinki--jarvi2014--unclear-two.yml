      url: https://github.com/UMEP-dev/SUEWS-database/blob/053c004ef46c14194fdc39bbb8932908db294abd/db/anthropogenic_emission.yml#L184-L218
      note: >-
        Preserves the stable record identity, Helsinki origin and Ref 90240015, but rounds qf_b and vehicle
