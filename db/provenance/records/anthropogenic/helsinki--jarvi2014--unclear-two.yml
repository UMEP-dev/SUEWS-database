  scientific_note: This is the weaker of the pair. Table 4b gives one set of area parameters, and the
    record's distinguishing figures, qf_a 0.1337 and 0.1153, qf_c 0.0149, a vehicle energy factor of 4110000
    J km-1 and a weekend population factor of 0.68, are not among them or anywhere else in the article.
    The study has five sites across two cities, so a second parameter set is not implausible; it is simply
    not published here. Until someone establishes where it came from, the record is a set of numbers with
    a citation that does not carry them and a name that admits as much.
