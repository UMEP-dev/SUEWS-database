  findings:
    name:
      conclusion: supported
      evidence_ids: [jarvi2019-data-code51, migration-code51]
      note: >-
        The neutral archival name identifies the complete Kumpula Ku1 anthropogenic-emission
        configuration stored as Code 51 without presenting the whole row as a tuple published in a paper.
    target:
      conclusion: supported
      evidence_ids: [jarvi2019-data-code51]
      note: The archived SUEWS_AnthropogenicEmission row directly supplies the heat and CO2 fields.
    values:
      conclusion: supported
      evidence_ids: [jarvi2019-data-code51, jarvi2019-ku1]
      note: >-
        Code 51 states every active field. Aligning the record with that row restores qf_b 0.00986,
        qf_c 0.01, EF_umolCO2perJ 1.159 and vehicle CO2 factors 0.285. The later paper independently
        confirms the Ku1 qf_a values but publishes an improved heat tuple rather than this archived row.
    source:
      conclusion: supported
      evidence_ids: [jarvi2019-data-code51, migration-code51]
      issue_urls: [https://github.com/UMEP-dev/SUEWS-database/issues/192]
      note: >-
        The canonical source is the pinned Järvi et al. data archive containing the exact executable
        configuration. source_legacy_ref 90240015 preserves the migrated Järvi 2014 registry link without
        requiring that paper to support the later heat-plus-CO2 row.
    place:
      conclusion: supported
      evidence_ids: [jarvi2019-data-code51, jarvi2019-ku1]
      note: SiteSelect applies Code 51 to Kumpula grid 1, and the paper identifies Ku1 within Helsinki.
    representativeness:
      conclusion: supported
      evidence_ids: [jarvi2019-data-code51, jarvi2019-ku1]
      note: >-
        Site is the supported reach: the configuration is applied to one Kumpula spatial sector inside
        the local model and observational domain, not asserted as a Helsinki-wide parameter determination.
    method:
      conclusion: supported
      evidence_ids: [jarvi2019-data-code51, jarvi2019-ku1]
      note: >-
        Literature records adoption of the complete pinned configuration artifact. It does not claim that
        every inventory, metabolic, traffic and degree-day field shares one underlying production method.
    identity:
      conclusion: supported
      evidence_ids: [jarvi2019-data-code51, migration-code51, related-code10]
      related_records: [records/anthropogenic/helsinki--jarvi2014]
      note: >-
        Archive Code 51, SiteSelect's explicit selection, stable legacy ID 53240051 and the migrated row
        establish one distinct Ku1 configuration. The related Code 10 record is a different combined
        Helsinki configuration.
  evidence:
