  scientific_note: >-
    The apparent mixed-source conflict arose because the journal tables and migrated workbook were compared
    without adopting the exact public model input selected by the run. Zenodo 2572472 contains Code 51 twice
    in independently packaged, byte-identical tables, and SiteSelect applies it to Kumpula grid 1. The run uses
    EmissionsMethod 45 and emits the CO2 components, so deleting the CO2 block would misrepresent the executable
    configuration. Four evidence-authorised corrections restore the exact archived row: qf_b 0.00986, qf_c
    0.01, EF 1.159 and vehicle CO2 0.285. Järvi et al. (2019) remains field-level validation for the Ku1
    identity and qf_a values, not the source of the complete archived tuple. Legacy-only fields retain their
    migrated values for traceability.
