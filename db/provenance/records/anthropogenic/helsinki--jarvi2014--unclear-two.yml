  scientific_note: >-
    Järvi et al. (2019) identifies this record's distinctive base and HDD coefficients as the Kumpula Ku1
    sector, a northern land-use sector within the Kumpula EC site's 1-km radius. The record now says that
    in its display name and declares site representativeness while retaining Helsinki as its registry place.
    Its source remains Järvi et al. (2014), pending separate resolution of the mixed Järvi 2014/2019
    parameter set: the 2019 CDD is zero whereas the stored qf_b is 0.0099, and the full CO2 block is not
    established by either paper as one record-level source.
