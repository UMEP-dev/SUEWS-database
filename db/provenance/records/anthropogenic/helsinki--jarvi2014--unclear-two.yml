  findings:
    name:
      conclusion: supported
      evidence_ids:
      - jarvi2019-table-1
      - jarvi2019-appendix-c
      note: Table 1 identifies the published values as the Ku1 column, and the paper defines Ku1 as the
        Kumpula northern land-use sector. The active name therefore states the source's site-sector identity.
    target:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4b
      note: The stored fields are anthropogenic heat and CO2 model parameters, which is the anthropogenic_emissions
        target.
    values:
      conclusion: unresolved
      evidence_ids:
      - jarvi-table-4b
      - jarvi2019-table-1
      - jarvi2019-appendix-c
      note: Järvi et al. (2019) Table 1 gives the stored qf_a values 0.1337 and 0.1153 and qf_c 0.0149
        for Ku1, while Appendix C gives a vehicle heat factor of 4.11 x 10^6 J km-1 vehicle-1. However,
        the 2019 Appendix sets the CDD coefficient to zero, not the stored qf_b 0.0099; the rest of the
        CO2 block is not established as one published parameter set. The all-record source/value mixture
        remains unresolved.
    source:
      conclusion: unresolved
      evidence_ids:
      - jarvi-table-4b
      - jarvi2019-table-1
      - jarvi2019-appendix-c
      note: The record still declares Järvi et al. (2014), whose Table 4b is not this set. Järvi et al.
        (2019) identifies the Ku1 base and HDD values, but conflicts on qf_b and does not establish the
        whole CO2 block as one source. Changing the source would require resolving that mixed provenance.
    place:
      conclusion: supported
      evidence_ids:
      - jarvi2019-table-1
      - jarvi2019-appendix-c
      note: The paper places Ku1 in the Kumpula site within Helsinki. The registry place helsinki is therefore
        correct, while the display name carries the finer site-sector identity.
    representativeness:
      conclusion: supported
      evidence_ids:
      - jarvi2019-table-1
      - jarvi2019-appendix-c
      note: Table 1 reports Ku1 as a Kumpula land-use sector within a 1-km radius of the EC tower, and
        Appendix C says the coefficients are calculated for sectors within that 1-km circle. This supports
        site rather than Helsinki-wide representativeness.
    method:
      conclusion: unresolved
      evidence_ids:
      - jarvi-table-4b
      - jarvi2019-appendix-c
      note: Appendix C calculates a0 from an inventory approach and estimates a2 from EC sensible-heat
        observations, but the stored qf_b is not the Appendix C value and the remaining fields are not
        established as one production method. The record-level method remains unresolved.
    identity:
      conclusion: supported
      evidence_ids:
      - jarvi2019-table-1
      - jarvi2019-appendix-c
      note: The stored qf_a and qf_c values match the Ku1 column. Table 1 and Appendix C define that column
        as the Kumpula northern land-use sector, resolving the active display identity without resolving
        the source mixture.
      related_records:
      - records/anthropogenic/helsinki--jarvi2014
