  scientific_note: >-
    This retained configuration combines several provenance roles. Ward et al. (2013) compile metabolic
    and vehicle factors for a first-order Swindon inventory. Ward et al. (2016) publish the fitted heat
    coefficients, with the pinned release row preserving greater precision. The qf_model selector, fossil-fuel
    fractions, emission factor per joule, point-source flag and traffic units currently have compilation
    lineage only in the pre-migration database row. Field scopes now prevent those roles from being collapsed
    into a single Ward 2013 claim. Issue #377 remains open because the record still exposes one source and
    one method, and the scientific sources of the remaining configuration fields are unresolved; a maintainer
    must decide whether to retain this combined configuration or split it. No parameter value, source key,
    stable path, place, representativeness or identity changes in this assessment.
