      label: Appendix A1, Vehicular emissions
      page: 4661
      url: https://doi.org/10.5194/acp-13-4645-2013
      note: Gives a mean energy release of 3.97 MJ per vehicle kilometre from Sailor and Lu (2004) and
        a CO2 emission factor of 0.2069 kg per kilometre from the Department of Energy and Climate Change.
  - id: ward-scope
    source: ward2013
    role: compilation
    locators:
    - kind: table
      label: Table 1, Land cover within a radius of 500 m around the flux mast
      page: 4647
      url: https://doi.org/10.5194/acp-13-4645-2013
      note: 'The article''s only table. It fixes the study''s scale: a suburban site characterised over
        a 500 m radius, described in the title and abstract as a suburban area in Swindon, not a city-wide
        determination.'
  scientific_note: 'This record holds two different things. Its metabolic and vehicle emission factors
    really are in Ward et al., in Appendix A, and can be pointed to line by line; but the article presents
    them as literature values borrowed from Sailor and Lu and from Moriwaki and Kanda for a first-order
    Swindon inventory, so Ward et al. is their compiler, not their source. The qf_a, qf_b and qf_c coefficients
    are a different matter: they belong to a fitted temperature-dependent QF model, and this article neither
    publishes them nor uses that model. Citing one paper for both halves credits it with work it did not
    do and leaves the coefficients with no provenance at all. The scale claim compounds it, because the
    article is explicit that its estimate covers a suburban study area characterised over 500 m, not the
    city.'
