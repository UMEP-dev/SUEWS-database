      note: Gives 175 W per person for daytime, 75 W for nighttime and 125 W in transition, following
        Sailor and Lu (2004), and 280, 120 and 200 umol CO2 per second per person for the same periods,
        following Moriwaki and Kanda (2004).
  - id: ward-vehicles
