  scientific_note: >-
    The former blocker was the record format's single-source envelope, not an absence of public evidence.
    The canonical record now cites the exact original v2019a combined configuration, while scalar
    parameter overrides and field-scoped evidence preserve the distinct scientific roles. Ward et al.
    (2016) are credited for the fitted heat coefficients; Sailor and Lu (2004) for metabolic heat and
    vehicle energy; Ward et al. (2013) for the Swindon metabolic and vehicle CO2 calculation; and the
    pinned SUEWS input row for configuration-only fields. No source is made to support values it does
    not publish. The later v2019a table revision changes the vehicle factor to 0.285 while adding the
    point-source field; the record retains the Swindon-specific 0.2069 supported by Ward et al. (2013)
    and the initial Code 551 row, and uses the later revision only for the new flag. The two precision
    corrections reverse migration rounding rather than invent a new configuration.
