  findings:
    name:
      conclusion: curation_required
      note: The record is named Unclear, which identifies nothing. The article publishes no label for
        this parameter set, and the set itself spans two unrelated kinds of quantity, so a maintainer
        has to decide what the record is before it can be named.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/378
    target:
      conclusion: supported
      evidence_ids:
      - ward-metabolism
      - ward-vehicles
      note: Appendix A treats vehicular, building and metabolic emissions, which is what the anthropogenic_emissions
        target holds.
    values:
      conclusion: correction_required
      evidence_ids:
      - ward-metabolism
      - ward-vehicles
      note: 'Five stored values are in the article and one is a rounding of a published figure. Appendix
        A3 gives 175 W per person by day and 75 W by night, and 280 and 120 umol CO2 per second per person
        for the same periods, which are maxqfmetab, minqfmetab, maxfcmetab and minfcmetab; Appendix A1
        gives a mean energy release of 3.97 MJ per vehicle kilometre, which is enef_v_jkm as 3970000 J.
        The stored fcef_v_kgkm of 0.21 rounds the 0.2069 kg per kilometre the article publishes. Everything
        else is absent: the article contains no qf_a, qf_b or qf_c regression coefficients, no fossil-fuel
        fractions, no emission factor per joule, no qf_model selector and no base temperature. Its QF
        is a bottom-up inventory, not a regression.'
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/377
    source:
      conclusion: correction_required
      evidence_ids:
      - ward-metabolism
      - ward-vehicles
      note: 'Ward et al. compile the values they do publish rather than derive them: Appendix A3 attributes
        the metabolic heat rates to Sailor and Lu (2004) and the metabolic CO2 rates to Moriwaki and Kanda
        (2004), and Appendix A1 attributes the 3.97 MJ per kilometre to Sailor and Lu (2004). For the
        regression coefficients the article is not a compilation either, because it does not contain them
        at all.'
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/377
    place:
      conclusion: supported
      evidence_ids:
      - ward-scope
      note: The study site is in Swindon, which is the record's place.
    representativeness:
      conclusion: supported
      evidence_ids:
      - ward-scope
      note: Site matches the article's suburban study area and the 500 m radius around the flux mast used
        to characterise it. The estimate is for the study area, not Swindon as a whole.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/379
    urban_setting:
      conclusion: supported
      evidence_ids:
      - ward-scope
      note: Suburban is explicitly established by the article's title and abstract and by the site description
        of the residential area as typical of UK suburbia.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/379
    method:
      conclusion: curation_required
      evidence_ids:
      - ward-metabolism
      - ward-vehicles
      note: Two methods are present in one record. The metabolic and vehicle factors are literature values
        compiled for an inventory; the qf_a, qf_b and qf_c coefficients belong to a fitted temperature-dependent
        QF model that this article never runs. No single method describes the record as it stands.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/377
    identity:
      conclusion: curation_required
      evidence_ids:
      - ward-metabolism
      - ward-vehicles
      note: Whether this should remain one record or be split, so that the compiled inventory factors
        and the fitted heat coefficients each carry their own provenance, is a maintainer decision.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/377
