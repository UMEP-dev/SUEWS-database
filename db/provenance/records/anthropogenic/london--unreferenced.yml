  scientific_note: >-
    The one-source blocker is resolved by separating configuration identity from field-level scientific
    provenance. The exact combined tuple is public Code 11, with the original revision retaining 0.38
    for vehicle CO2 and a later revision introducing point-source flag 0. Järvi et al. (2011) establish
    that the heat coefficients were fitted to Vancouver Vs87, not London. The canonical place is therefore
    omitted and representativeness is generic, while the stable path and verbatim London origin preserve
    migration traceability. EF 1.159 is restored from the original table; no unsupported value is inferred.
