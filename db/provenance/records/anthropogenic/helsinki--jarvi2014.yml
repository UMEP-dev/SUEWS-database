      label: database.xlsx, AnthropogenicEmission row, legacy ID 53240010
      url: https://github.com/UMEP-dev/SUEWS-database/blob/746dcd5cc45044488d412c6a21b8bd4c021fd6f5/database.xlsx
      note: The pre-migration row identifies Helsinki and stores the heat branches, CO2 configuration,
