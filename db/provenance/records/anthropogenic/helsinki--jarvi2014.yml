  scientific_note: >-
    The apparent mixed-source blocker was caused by auditing the journal article and migrated workbook
    without the public model-run input bundle. Zenodo 2572472 contains the exact classic SUEWS table,
    and two independently packaged copies agree on Code 10. The record now follows that original
    configuration artifact, with four evidence-authorised corrections and no inferred values. Järvi
    et al. (2014) remains useful validation for the degree-day branch rather than being made to support
    CO2 fields it never prints. The Ku1 Code 51 record is scientifically distinct and is now resolved
    against its own exact archived input row.
