  scientific_note: 'The record now has a neutral configuration name grounded in the exact pre-migration
    row: it identifies the retained Helsinki artifact and its combined heat-and-CO2 scope without claiming
    a single publication or measurement site for the whole tuple. This resolves issue #191 while leaving
    the mixed field-level provenance in issue #190 open. Three of the heat coefficients can be pointed
    to in Table 4b, and one of those three
    raises a question about the article rather than the record: the table prints a1 as 9.9 x 10^3 where
    the stored 0.0099 corresponds to 9.9 x 10^-3. Given a0 of 0.1 and a2 of 0.0102 beside it, the printed
    exponent is almost certainly a typesetting slip, but this audit will not silently correct a published
    figure, so the discrepancy is recorded. The larger problem is the rest of the record. The anthropogenic
    heat minima and slopes and the whole CO2 block are not in this article. The related record is now
    identified as Kumpula Ku1 from the later 2019 study, but that does not establish this record''s identity
    or resolve either record''s mixed provenance.'
