  assessor:
    kind: agent
    name: provenance-audit
    version: '1.0'
  findings:
    name:
      conclusion: supported
      evidence_ids:
      - migration-combined-row
      note: The neutral name identifies the retained Helsinki configuration row and makes explicit that
        it combines anthropogenic heat and CO2 fields. It does not claim a single scientific source or
        a finer site identity that the full tuple cannot support.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/191
    target:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4b
      note: The stored fields are anthropogenic heat and CO2 model parameters, which is the anthropogenic_emissions
        target.
    values:
      conclusion: correction_required
      evidence_ids:
      - jarvi-table-4b
      note: 'Three heat coefficients are traceable and the rest are not. Table 4b gives a0 as 0.1, which
        is the stored qf_a, and a2 as 0.0102, which is qf_c. The stored qf_b of 0.0099 corresponds to
        a1 as 9.9 x 10^-3, whereas the table prints 9.9 x 10^3; the printed exponent is inconsistent with
        the neighbouring coefficients and with the stated unit, so this looks like a typesetting error
        in the article, but the audit records the discrepancy rather than assuming it away. The legacy
        base temperature of 18.2 degC matches TBaseQF. Nothing in the article publishes ah_min 15, the
        heating and cooling slopes of 2.7, the base temperatures of 7, or any of the CO2 block: the metabolic
        rates, the fossil-fuel fractions, the vehicle energy factor of 3970000 J km-1 or the emission
        factor of 0.29 kg km-1.'
    source:
      conclusion: correction_required
      evidence_ids:
      - jarvi-table-caption
      note: For the three traceable coefficients the Table 4 caption makes this a compiler rather than
        a source. For everything else it is not a source in any sense, since the values are absent.
    place:
      conclusion: correction_required
      evidence_ids:
      - jarvi-sites
      note: Helsinki is a study site, but the published coefficients are inherited and the remainder are
        unlocated.
    representativeness:
      conclusion: correction_required
      evidence_ids:
      - jarvi-sites
      note: The record claims city representativeness. Table 1 characterises the Helsinki eddy covariance
        footprints as 1 km radius circles and the two catchments as 23.8 and 44.8 ha; the study determines
        neighbourhood-scale values, not city-wide ones.
    method:
      conclusion: curation_required
      evidence_ids:
      - jarvi-table-4b
      note: Part inherited regression coefficients, part unlocated inventory factors, so no single production
        method describes the record.
    identity:
      conclusion: curation_required
      evidence_ids:
      - jarvi-table-4b
      note: The related record is now named Kumpula Ku1 sector from Järvi et al. (2019), but it still has
        a mixed Järvi 2014/2019 source and unresolved values. This record's distinct identity remains open.
      related_records:
      - records/anthropogenic/helsinki--jarvi2014--unclear-two
