      note: Gives soils an emissivity range from 0.90 for light, dry soil to 0.98 for dark, wet soil and
        collectively cites Sellers (1965), List (1966), Paterson (1969), and Monteith (1973); it does not
        identify a source per cell or the exact 0.94 selection.
  scientific_note: >-
    Ward et al. are the checked source that introduces the BSoil class and publishes the exact 0.94 model
    parameter. Järvi et al. (2011) contain no bare-soil column, so Ward's general statement that emissivities
    came from Järvi does not apply to this newly implemented BSoil cell. Ward instead states that the BSoil
    emissivity was based on Oke, whose original table supports a soil interval of 0.90 to 0.98 but not the
    exact 0.94 selection. The record therefore retains Ward as parameter source and records Oke as upstream
    range evidence. Its value, stable path, raw origin and legacy ID remain unchanged; site reach reflects
    its documented use in the London and Swindon study configurations rather than a regional determination.
