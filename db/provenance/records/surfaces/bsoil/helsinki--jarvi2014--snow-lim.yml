  findings:
    name:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Bare Soil matches the surface column the value is read from.
    target:
      conclusion: curation_required
      evidence_ids:
      - jarvi-table-4a
      note: Table 4a has no bare soil column. The 190 mm limit is uniform across the six surfaces it does
        list, so extending it to bare soil is reasonable, but it is an extension rather than something
        the table states.
    values:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Table 4a gives SWE,i max as 190 mm in every surface column, so the stored 190 is the published
        value. Bare soil has no column of its own in Table 4a; the value is the same 190 the table gives
        for every surface, so nothing turns on the gap, but the record's surface is not one the table
        names.
    source:
      conclusion: correction_required
      evidence_ids:
      - jarvi-table-caption
      note: The Table 4 caption states that sources of the values are as in Järvi et al. (2011) unless
        a footnote says otherwise, and this cell carries no footnote. Järvi et al. (2014) compiles the
        value rather than deriving it.
    place:
      conclusion: correction_required
      evidence_ids:
      - jarvi-sites
      note: Helsinki is where the study ran, but this cell is an inherited value rather than a Helsinki
        determination.
    representativeness:
      conclusion: correction_required
      evidence_ids:
      - jarvi-sites
      note: The record claims city representativeness. Table 1 characterises the Helsinki eddy covariance
        footprints as 1 km radius circles and the two catchments as 23.8 and 44.8 ha; the study determines
        neighbourhood-scale values, not city-wide ones.
    method:
      conclusion: curation_required
      evidence_ids:
      - jarvi-table-caption
      note: A value carried forward from an earlier publication, so the production method belongs to that
        publication rather than to this one.
    identity:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Six records carry the same 190 mm under this citation, one per surface. That is what Table
        4a prescribes, since the row is uniform, rather than an accidental duplication.
      related_records:
      - records/surfaces/bldgs/helsinki--jarvi2014--snow-lim
      - records/surfaces/dectr/helsinki--jarvi2014--snow-lim
      - records/surfaces/evetr/helsinki--jarvi2014--snow-lim
      - records/surfaces/grass/helsinki--jarvi2014--snow-lim
      - records/surfaces/paved/helsinki--jarvi2014--snow-lim
  evidence:
  - id: jarvi-table-4a
    source: jarvi2014
    role: compilation
    locators:
    - kind: table
      label: Table 4a, parameters used in SUEWS by surface
      page: 1701
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: 'Seven surface columns: Bldg, Pav, Everg., Decid., Irr. veg, Grass, Water. Si 0.25, 0.48,
        1.3, 0.3-0.8, blank, 1.9, 0; D0,i 10, 10, 0.013, 0.013, 10, 0.013; b 3, 3, 1.71, 1.71, 0.013,
        1.71; alpha_i 0.15, 0.09a, 0.10, 0.16b, 0.19, 0.19b, 0.08b; epsilon_i 0.95, 0.91, 0.98, 0.98,
        0.93, 0.93, 0.95; gi,max -, -, 7.4, 11.7, 40, 33.1; SWE,i max 190 for each of the six land surfaces
        and a dash for Water. Footnote a marks a value optimised using data from Helsinki, footnote b
        marks Vargo et al. (2013).'
  - id: jarvi-table-caption
    source: jarvi2014
    role: compilation
    locators:
    - kind: text
      label: Table 4 caption
      page: 1701
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: States that sources of the values are as in Järvi et al. (2011) unless indicated otherwise
        below, so an unfootnoted cell in this table is an inherited value rather than one this study determined.
  - id: jarvi-sites
    source: jarvi2014
    role: compilation
    locators:
    - kind: table
      label: Table 1, characteristics of the observational sites
      page: 1696
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: 'Five sites: Kumpula, Pasila and Pihlajamäki in Helsinki, and an urban and a suburban site
        in Montreal. Each Helsinki eddy covariance footprint is a 1 km radius circle and the catchments
        are 23.8 and 44.8 ha. London is not a study site; the word appears in the article only in a code-availability
        address and in a publisher''s address in the reference list.'
  scientific_note: 'The number is right and the table is unambiguous: SWE,i max is 190 mm in every surface
    column, which is why six records share it. Two things sit behind it. The table caption makes this
    an inherited value rather than a determination of this study, and the article''s own text says the
    snow transport limits were estimated from maximum mass allowances at one Helsinki catchment with the
    same values used at all sites because no further information was available. City representativeness
    for Helsinki does not follow from that. This record also asks the table for a surface it does not
    have: there is no bare soil column, and the value is carried across from the uniform row.'
