  scientific_note: >-
    Ao et al. (2018) publish the complete Xujiahui grass LAI tuple: they locally adjust the minimum from 1.6
    to 3.2 using site photographs, retain the inherited 5.9 maximum, and explicitly adopt thermal-only
    senescence Eq. (5b). SUEWS v2017a maps that equation to LAIType 0 and maps the migrated selector 1 to the
    day-length branch that Ao rejects. Changing the selector to 0 restores the published configuration.
    Järvi and Breuer document the distinct upstream lineages of the bounds without replacing Ao as the
    publication of the complete Shanghai application tuple.
