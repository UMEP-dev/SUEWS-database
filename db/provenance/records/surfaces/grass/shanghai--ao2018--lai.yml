  scientific_note: >-
    The tuple is intrinsically mixed. Ao et al. locally adjusted lai_min from 1.6 to 3.2 based on Xujiahui
    photographs and reported better model performance. The stored lai_max 5.9 instead comes through Järvi et al. from
    Breuer, where 5.9 is the median of a grass/herb/forb distribution rather than its maximum. Field-scoped
    evidence now records those roles without attributing both values to one publication. The numeric
    lai_type 1 remains migration fidelity because the papers do not explicitly map the selected equation
    to that code. Issue #354 remains open: one record-level source, method, place and representativeness
    cannot summarise all fields, and scoped parameter sources deliberately cannot make the record eligible
    for sign-off. No additional source material is missing, and no value, source, path, place or identity
    changes in this assessment.
