  findings:
    name:
      conclusion: supported
      evidence_ids:
      - flanagan-light-response
      - migration-row-30240009
      note: Flanagan et al. identify the ecosystem as a northern temperate grassland, and the migrated
        row preserves the concise name Temperate grassland.
    target:
      conclusion: supported
      evidence_ids:
      - flanagan-light-response
      - migration-row-30240009
      note: Flanagan fits grassland GPP light responses, and the migrated row explicitly classifies the
        tuple as Grass, represented by land_cover.grass.
    values:
      conclusion: supported
      evidence_ids:
      - flanagan-light-response
      - schmid-respiration
      - jarvi-winter-floor
      - migration-row-30240009
      note: Flanagan publishes annual alpha values 0.0254, 0.018 and 0.018 and annual Amax values 27.5,
        12.9 and 8.6. Their arithmetic means are 0.0204667 and 16.333, which round to stored 0.0205
        and 16.3, although neither the article nor archive documents who chose that aggregation.
        Schmid Eq. (5) supplies resp_a 1.08 and resp_b 0.064; Järvi Eq. (11) and Appendix B supply
        the later minimum respiration floor 0.60. The migration row is the exact five-value compilation.
    source:
      conclusion: supported
      evidence_ids:
      - flanagan-light-response
      - schmid-respiration
      - jarvi-winter-floor
      - migration-row-30240009
      note: The derived alpha and beta remain unreferenced rather than being falsely attributed to
        Flanagan, whose annual fits are recorded as calculation inputs. Parameter-level overrides cite
        Schmid for resp_a and resp_b and Järvi for min_res_bioco2; the workbook is compilation lineage.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/371
    place:
      conclusion: supported
      evidence_ids:
      - flanagan-site
      - schmid-site
      - jarvi-winter-floor
      note: The article locates the 64 ha study site approximately 1.5 km west of Lethbridge city limits
        at 49 degrees 43 minutes N and 112 degrees 56 minutes W. The resp_a and resp_b overrides record
        Schmid's Morgan-Monroe forest, and the minimum-respiration override records the Finnish chamber
        evidence, so neither borrowed subset inherits Lethbridge provenance.
    representativeness:
      conclusion: supported
      evidence_ids:
      - flanagan-site
      - schmid-site
      - jarvi-winter-floor
      note: The light-response inputs, borrowed respiration fit and winter floor each come from a single
        study site. Site is therefore the supported evidence reach for the envelope and all overrides.
    method:
      conclusion: supported
      evidence_ids:
      - flanagan-light-response
      - schmid-respiration
      - jarvi-winter-floor
      - migration-row-30240009
      note: The record-level calculated method describes the rounded arithmetic means used for alpha
        and beta. The resp_a and resp_b overrides are fitted coefficients published by Schmid, while
        the minimum-respiration override is the measured chamber statistic published by Järvi.
    identity:
      conclusion: supported
      evidence_ids:
      - migration-row-30240009
      note: Biogen CO2 row 30240009 preserves the exact name, origin, five active values, three -999
        legacy sentinels and reference ID 90240046. The stable path and legacy_id retain that identity;
        the -999 theta, alpha_enh and beta_enh entries are unavailable legacy fields, not sourced
        scientific values.
  evidence:
  - id: flanagan-site
    source: flanagan2002
    role: validation
    locators:
    - kind: section
      label: Materials and methods, Study site description
      page: 600
      url: https://doi.org/10.1046/j.1365-2486.2002.00491.x
      note: Describes a 64 ha moist-mixed grassland approximately 1.5 km west of Lethbridge city limits
        at 49 degrees 43 minutes N, 112 degrees 56 minutes W, with a flat prairie fetch.
  - id: flanagan-light-response
    source: flanagan2002
    role: input_data
    locators:
    - kind: equation
      label: Eq. (5), rectangular-hyperbola GPP light response
      page: 603
      url: https://doi.org/10.1046/j.1365-2486.2002.00491.x
      note: Defines alpha as apparent quantum yield and Amax as maximum GPP, fitted by nonlinear least
        squares separately for a 14-day peak-activity period in each year.
    - kind: figure
      label: Fig. 6, annual peak light-response fits for 1998, 1999 and 2000
      page: 608
      url: https://doi.org/10.1046/j.1365-2486.2002.00491.x
      note: Publishes alpha 0.0254, 0.018 and 0.018 and Amax 27.5, 12.9 and 8.6. Their rounded arithmetic
        means equal the stored alpha 0.0205 and beta 16.3; the paper does not publish those means.
  - id: schmid-respiration
    source: schmid2000
    role: parameter_source
    parameter_paths:
    - parameters.resp_a
    - parameters.resp_b
    locators:
    - kind: equation
      label: Eq. (5), ecosystem respiration versus soil temperature
      page: 369
      url: https://doi.org/10.1016/S0168-1923(00)00140-4
      note: Publishes RE = 1.08 exp(0.064 Ts), the exact resp_a and resp_b mechanically reused in this
        grassland compilation even though Schmid's observations are from a hardwood-forest site.
  - id: schmid-site
    source: schmid2000
    role: validation
    locators:
    - kind: section
      label: Sect. 2, Site and instrumentation
      page: 358
      url: https://doi.org/10.1016/S0168-1923(00)00140-4
      note: Locates the source of the borrowed respiration fit at the Morgan-Monroe State Forest tower
        in an extensive secondary-successional broadleaf forest in south-central Indiana.
  - id: jarvi-winter-floor
    source: jarvi2019
    role: parameter_source
    parameter_paths:
    - parameters.min_res_bioco2
    locators:
    - kind: equation
      label: Eq. (11), soil and vegetation respiration
      page: 8366
      url: https://doi.org/10.1029/2018JD029576
      note: Defines respiration as max(a_i exp(Tair b_i), 0.6) for each vegetated surface.
    - kind: section
      label: Appendix B, Estimating Minimum Soil Respiration
      page: 8379
      url: https://doi.org/10.1029/2018JD029576
      note: Reports a 0.60 +/- 0.07 micromol m-2 s-1 minimum from 1,677 half-hour observations during
        2009-2012 below -2 degrees C, measured by three automatic soil chambers in a Southern Finland
        boreal forest. Pumpanen et al. (2015) is cited for chamber methods, not for the 0.60 statistic.
  - id: migration-row-30240009
    source: umep-dev2025-database
    role: compilation
    locators:
    - kind: dataset
      label: database.xlsx, Biogen CO2 sheet, row ID 30240009
      url: https://github.com/UMEP-dev/SUEWS-database/blob/746dcd5cc45044488d412c6a21b8bd4c021fd6f5/database.xlsx
      note: Carries Temperate grassland, origin Lethbridge, Alberta, Canada, alpha 0.0205, beta 16.3,
        resp_a 1.08, resp_b 0.064, min_respi 0.6, three -999 inactive fields and Ref 90240046 in one row.
  derivation:
    kind: arithmetic_mean
    description: Calculate alpha_bio_co2 and beta_bio_co2 as separate unweighted means of the three
      annual Flanagan light-response fits, then round to the precision preserved by the database row.
    expression: alpha_bio_co2 = mean(0.0254, 0.018, 0.018); beta_bio_co2 = mean(27.5, 12.9, 8.6)
    external_inputs:
