  scientific_note: >-
    The tuple is not one publication's result. The Flanagan light-response pair is an undocumented
    rounded aggregation of three annual fits, so the canonical source for those calculated leaves is
    unreferenced and Flanagan is retained only as input data. The respiration coefficients are borrowed
    from Schmid's hardwood forest, the 0.6 winter floor is later Finnish chamber evidence published by
    Järvi et al., and the pre-migration workbook is the exact compilation. Field-level source, method and
    place overrides now preserve those roles without changing any value or stable identity.
