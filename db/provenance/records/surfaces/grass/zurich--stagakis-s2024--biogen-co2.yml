  method: literature
  findings:
    name:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      note: Grass corresponds to the Lawn column of Stagakis Supplement Table S3.
    target:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      - bellucco-local-fit
      - jarvi-winter-floor
      note: All six leaves are photosynthesis or respiration properties of the SUEWS grass land-cover class.
    values:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      - bellucco-local-fit
      - jarvi-winter-floor
      - havu-cross-check
      note: Stagakis Table S3 directly publishes beta_bio_co2 8.92, resp_a 1.7 and resp_b 0.06
        for Lawn. Bellucco Table 4 directly publishes the fitted Helsinki local-model alpha 0.031
        and theta 0.723. Järvi Eq. (11) and Appendix B publish the 0.6 minimum respiration floor.
        Havu Table B.1 does not publish the exact Stagakis lawn triple, so its citation in Table S3
        is retained as lineage rather than substituted for the artifact that states the stored values.
    source:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      - bellucco-local-fit
      - jarvi-winter-floor
      - havu-cross-check
      note: Stagakis is the direct parameter source for beta_bio_co2, resp_a and resp_b. Canonical
        field-level overrides identify Bellucco for alpha_bio_co2 and theta_bio_co2 and Järvi for
        min_res_bioco2. Havu is not promoted to parameter source because its published grass tuple
        differs from the three exact values used by Stagakis.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/217
    place:
      conclusion: supported
      evidence_ids:
      - stagakis-scope
      - bellucco-local-fit
      - jarvi-winter-floor
      note: Zurich is the application place for the Stagakis lawn configuration. The alpha and theta
        overrides preserve their Helsinki fit location, while the minimum-respiration override preserves
        the Southern Finland chamber evidence instead of making either value appear Zurich-derived.
    representativeness:
      conclusion: supported
      evidence_ids:
      - stagakis-scope
      - bellucco-local-fit
      - jarvi-winter-floor
      note: Stagakis evaluates a common lawn configuration at four individual parks, Bellucco fits one
        Helsinki flux site and Järvi derives the floor from one chamber site. Site is the supported
        evidence reach at both record and overridden-field levels.
    method:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      - bellucco-local-fit
      - jarvi-winter-floor
      note: Literature is the record-level method because Stagakis adopts the three exact lawn values
        in its model configuration. The alpha and theta overrides are fitted non-rectangular-hyperbola
        coefficients, and the minimum-respiration override is the measured winter chamber statistic
        that Järvi later installs as the model floor.
    identity:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      note: The six-leaf lawn tuple is distinct from the tree biogenic configurations and retains its
        stable path, values and legacy row identity.
  evidence:
  - id: stagakis-parameter-table
    source: stagakis-s2024
    role: parameter_source
    parameter_paths:
    - parameters.beta_bio_co2
    - parameters.resp_a
    - parameters.resp_b
    locators:
    - kind: supplementary
      label: Supplement Table S3, Parameters used by SUEWS model, Lawn column
      page: 3
      url: https://doi.org/10.5194/bg-22-2133-2025-supplement
      note: Directly gives Fpho,max 8.92, ai 1.7 and bi 0.06 for Lawn; these map to
        beta_bio_co2, resp_a and resp_b.
    - kind: dataset
      label: Zenodo parameter table, Parameters used by SUEWS model, Lawn column
      url: https://doi.org/10.5281/zenodo.13222637
      note: The open model archive repeats the exact 8.92, 1.7 and 0.06 parameter set used for
        the Zurich lawn simulations.
  - id: stagakis-scope
    source: stagakis-s2024
    role: validation
    locators:
    - kind: section
      label: Abstract and Sect. 2.1, study sites
      page: 2133
      url: https://doi.org/10.5194/bg-22-2133-2025
      note: Evaluates the models against in-situ observations from lawns and trees in four urban parks
        in Zurich; it does not establish a city-wide lawn parameter fit.
  - id: bellucco-local-fit
    source: bellucco2017
    role: parameter_source
    parameter_paths:
    - parameters.alpha_bio_co2
    - parameters.theta_bio_co2
    locators:
    - kind: table
      label: Table 4, mean 200-270 degree vegetated sector
      page: 118
      url: https://doi.org/10.1016/j.agrformet.2016.12.011
      note: Publishes the Helsinki local-model non-rectangular-hyperbola coefficients alpha 0.031
        and theta 0.723, averaged over the botanical-garden wind sector and used in the final local model.
  - id: jarvi-winter-floor
    source: jarvi2019
    role: parameter_source
    parameter_paths:
    - parameters.min_res_bioco2
    locators:
    - kind: equation
      label: Eq. (11), soil and vegetation respiration
      page: 8366
      url: https://doi.org/10.1029/2018JD029576
      note: Defines respiration as max(a_i exp(Tair b_i), 0.6) for each vegetated surface.
    - kind: section
      label: Appendix B, Estimating Minimum Soil Respiration
      page: 8379
      url: https://doi.org/10.1029/2018JD029576
      note: Reports a 0.60 +/- 0.07 micromol m-2 s-1 minimum from 1,677 cold-season half-hour
        observations measured by three automatic soil chambers in a Southern Finland boreal forest.
  - id: havu-cross-check
    source: havu-m2024
    role: validation
    locators:
    - kind: table
      label: Table B.1, Grass column
      page: 11
      url: https://doi.org/10.1016/j.ufug.2024.128261
      note: Gives Grass Fpho,max 5.3, a 1.2 (2.1 for mixed low vegetation), and b 0.09
        (0.06 for mixed low vegetation), not the exact Stagakis Lawn triple 8.92, 1.7 and 0.06.
    - kind: section
      label: Appendix B.4, Low vegetation
      page: 12
      url: https://doi.org/10.1016/j.ufug.2024.128261
      note: Describes the Helsinki lawn and mixed-low-vegetation fitting data and makes clear that
        the published grass and mixed-low-vegetation values are distinct parameterizations.
  scientific_note: >-
    The record is a mixed-source but fully traceable SUEWS lawn configuration. Stagakis directly
    publishes the three values it used for the Zurich runs. Bellucco supplies the earlier Helsinki
    light-response fit for alpha and theta, and Järvi supplies the separately measured winter
    respiration floor. Per-leaf provenance preserves those source, method and place distinctions
    without changing any numeric value or pretending that Havu's different published grass tuple
    is the exact source of the Stagakis values.
