    source: jarvi2014
    role: parameter_source
    locators:
    - kind: table
      label: Table 4a, parameters used in SUEWS by surface
      page: 1701
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: 'Seven surface columns: Bldg, Pav, Everg., Decid., Irr. veg, Grass, Water. Si 0.25, 0.48,
        1.3, 0.3-0.8, blank, 1.9, 0; D0,i 10, 10, 0.013, 0.013, 10, 0.013; b 3, 3, 1.71, 1.71, 0.013,
        1.71; alpha_i 0.15, 0.09a, 0.10, 0.16b, 0.19, 0.19b, 0.08b; epsilon_i 0.95, 0.91, 0.98, 0.98,
        0.93, 0.93, 0.95; gi,max -, -, 7.4, 11.7, 40, 33.1; SWE,i max 190 for each of the six land surfaces
        and a dash for Water. Footnote a marks a value optimised using data from Helsinki, footnote b
        marks Vargo et al. (2013).'
  - id: jarvi2011-no-snow
    source: jarvi2011
    role: validation
    locators:
    - kind: section
      label: Conclusions and future developments
      page: 229
      url: https://doi.org/10.1016/j.jhydrol.2011.10.001
      note: States that snow accumulation and melt were not yet included in SUEWS, ruling this paper
        out as the source of a snowpack threshold.
  scientific_note: Järvi et al. (2014) Table 4(a) directly publishes both irrigated-vegetation and grass
    SWE_i,max as 190 mm. The database has one land_cover.grass target, so one record serves irrigated
    and unirrigated grass archetypes for this shared threshold only. It is distinct from the 40/100 mm
    SWE_Lim snow-transport thresholds discussed elsewhere in the paper. The record now treats 190 mm
    as an unqualified land-cover default rather than a Helsinki city determination. No value, stable
    path, name, target, origin or legacy ID changes.
