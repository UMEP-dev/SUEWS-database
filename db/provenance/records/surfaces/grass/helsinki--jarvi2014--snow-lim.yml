  findings:
    name:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Grass is the database target used by irrigated and unirrigated grass archetypes. Table 4(a)
        gives the same 190 mm threshold in its Irr. veg and Grass columns; this shared record captures
        that common value without implying that the two source classes are otherwise interchangeable.
    target:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Table 4(a) publishes SWE_i,max for Irr. veg and Grass, both represented by land_cover.grass
        in the current database schema.
    values:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Table 4(a) gives SWE_i,max as 190 mm in both the Irr. veg and Grass columns, exactly matching
        the stored value.
    source:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      - jarvi2011-no-snow
      note: Järvi et al. (2014) are the first accessible publication of the 190 mm SUEWS threshold.
        The blanket Table 4 caption cannot make Järvi et al. (2011) its source because that paper explicitly
        states that snow accumulation and melt were not yet modelled.
    place:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Table 4(a) presents unqualified Irr. veg and Grass model defaults used across the Helsinki
        and Montreal applications. Generic records the absence of a source-specific place claim; it
        does not assert universal empirical validity.
    representativeness:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: The publication gives the threshold as an unqualified model default rather than a fitted
        Helsinki or Montreal result, so generic is the supported evidence class.
    applicable_scale:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: SWE_i,max is tabulated separately by SUEWS land-cover surface; the value therefore applies
        at land-cover scale.
    method:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Literature records direct adoption of the published Table 4(a) model input without a new
        calculation or fit in this database.
    identity:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Table 4(a) assigns 190 mm to buildings, pavement, evergreen trees, deciduous trees, irrigated
        vegetation and grass. The current schema maps both vegetation columns to one grass target, while
        retaining target-specific records for the other supported land covers. The bare-soil sibling
        remains unsupported because the table has no bare-soil column.
      related_records:
      - records/surfaces/bldgs/helsinki--jarvi2014--snow-lim
      - records/surfaces/bsoil/helsinki--jarvi2014--snow-lim
