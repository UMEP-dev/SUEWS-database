  scientific_note: >-
    The apparent blocker came from treating a mixed published tuple as if every leaf had one origin. Stagakis
    et al. publish and apply the exact four-value tuple in Zurich. Their reference column traces three
    leaves to Järvi et al. and marks the fourth as modified; parameter_provenance now preserves those roles.
    Table A1 and the official v2020a LAIEq definition together establish selector 1. The exact values,
    stable path, target, origin and legacy ID are unchanged. The active envelope reach is narrowed from
    city to site because the study covers four parks.
