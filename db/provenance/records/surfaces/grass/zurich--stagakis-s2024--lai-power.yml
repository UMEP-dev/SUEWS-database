  findings:
    name:
      conclusion: supported
      evidence_ids:
      - stagakis-table-a1
      - suews2020a-laieq
      note: Stagakis et al. print the Järvi-style power phenology equation used by SUEWS, and the official
        v2020a documentation maps that formulation to LAIEq 1. The retained name therefore describes the
        published model configuration.
    target:
      conclusion: supported
      evidence_ids:
      - stagakis-table-s3
      note: Supplement Table S3 assigns the four LAI-power coefficients to its Lawn column, matching
        land_cover.grass in this retained grass record.
    values:
      conclusion: supported
      evidence_ids:
      - stagakis-table-s3
      - jarvi2014-appendix-a
      - jarvi2011-equation-4
      note: Table S3 publishes the complete stored tuple 0.04, 0.0005, -1.5 and 0.0025. Järvi et al.
        publish the inherited leaves; Stagakis et al. explicitly mark the final 0.0025 senescence factor
        as a modification of the Järvi 2014 value.
    source:
      conclusion: supported
      evidence_ids:
      - stagakis-table-s3
      - jarvi2014-appendix-a
      - jarvi2011-equation-4
      note: The envelope source remains the publication that reports and applies the exact mixed tuple.
        Parameter-level provenance now attributes growth_lai and senescence_lai to Järvi 2014, growth_gdd
        to Järvi 2011, and the selector semantics to the official v2020a documentation; Stagakis remains
        the source of the modified senescence_sdd leaf.
    place:
      conclusion: supported
      evidence_ids:
      - stagakis-scope
      - stagakis-table-s3
      note: Zurich is the documented application location for the exact mixed tuple. The parameter-level
        overrides distinguish publication sources but do not claim place-free reach for the inherited
        leaves; every leaf retains the Zurich site application envelope.
    representativeness:
      conclusion: supported
      evidence_ids:
      - stagakis-scope
      note: The study evaluates SUEWS in four named Zurich parks, not as a city-wide determination. Site
        is therefore the supported envelope reach.
    method:
      conclusion: supported
      evidence_ids:
      - stagakis-table-s3
      note: Literature records direct adoption of the exact parameterisation published in Table S3; the
        database performs no new fit or transformation.
    identity:
      conclusion: supported
      evidence_ids:
      - stagakis-table-s3
      - stagakis-table-a1
      note: The stable path, target and legacy ID identify the Zurich grass configuration. Table S3 gives
        one Lawn tuple and prints the same coefficients for Trees, so the identical values in the vegetation
        sibling records are intentional rather than accidental duplicates.
      related_records:
      - records/surfaces/dectr/zurich--stagakis-s2024--lai-power
