  scientific_note: Järvi et al. (2011) directly publish the four coefficients in the general SUEWS dynamic
    LAI equation and do not attribute that equation or its constants to an earlier source. Vancouver is
    an evaluation location, not the derivation place for this parameter set. The stable path and migration
    origin remain unchanged, while place and representativeness are corrected to generic so the record
    does not imply a city-specific fit. The identical deciduous, evergreen and grass coefficient payloads
    follow Equation 4's common treatment of vegetation types.
