  findings:
    name:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: The row is the grass entry of the archived Beijing run.
    target:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Veg code 993 of the modelled Beijing grid points at biogenic code 33.
    values:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      - zheng-article
      - jarvi-grass-respiration
      note: Code 33 of SUEWS_BiogenCO2.txt carries alpha 0.031, beta 5.4973, resp_a 2.1, resp_b 0.06 and
        min_respi 0.6, which is the record exactly, and Veg code 993 points at it. Appendix D reports
        the fitted median Fpho,max = 5.497 +/- 0.110, so the archive carries one digit more than the article
        publishes. Järvi Table A1 gives grass a = 2.1 and b = 0.06 for Torni and Eq. 11 documents the
        0.6 minimum; Zheng Table 2 adopts those respiration values and rounds Fpho,max to 5.5. The stored
        alpha appears only in the archive, and the quarantined theta of -999 matches the archive's empty
        column.
    source:
      conclusion: supported
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      - jarvi-grass-respiration
      note: Parameter-level provenance now keeps Zheng et al. as the source for the archive-only alpha
        and their fitted Espoo beta, while assigning Järvi et al. to the adopted Torni grass respiration
        coefficients and Finnish respiration floor. Zheng remains the record-envelope source for the
        exact Beijing run configuration.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/331
    place:
      conclusion: supported
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      note: The envelope place is Espoo, where Appendix D fits beta. Parameter overrides locate the adopted
        respiration pair at Torni in Helsinki and the minimum floor at its central-Finland chamber site.
        The stable Beijing path and origin retain the later application lineage.
    representativeness:
      conclusion: supported
      evidence_ids:
      - zheng-article
      note: >-
        Site is the supported scope for every leaf: Appendix D uses one 0.7 ha Espoo lawn, Table A1
        reports the Torni site fit, and the floor comes from one central-Finland chamber site.
    method:
      conclusion: supported
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      - jarvi-grass-respiration
      note: The record-level literature method describes adoption of the published Zheng run configuration.
        Parameter overrides identify beta and the Järvi respiration coefficients as fitted, the respiration
        floor as an explicit model assumption, and the archive-only alpha as a literature configuration value.
    identity:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Biogenic code 33 is a distinct row in the archive and the stored tuple is distinct from the
        other Beijing biogenic record in the database.
  evidence:
