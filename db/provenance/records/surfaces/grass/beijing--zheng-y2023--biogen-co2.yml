  scientific_note: The values are confirmed twice, in the released input and in Appendix D. What the record
    misstates is where they come from. Appendix D is unambiguous that the photosynthesis parameter was
    fitted to an urban lawn in Espoo, Finland, and says in as many words that this value is then used
    for grass and lawn in the Beijing simulation; the respiration parameters are inherited Helsinki values.
    Presenting the row as Beijing city evidence is not supportable, and the row also mixes a fit that
    is genuinely Zheng et al.'s with parameters that are not.
