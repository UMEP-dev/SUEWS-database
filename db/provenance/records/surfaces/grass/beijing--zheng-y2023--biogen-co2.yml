assessment:
  status: curation_required
  assessed_at: '2026-08-24T17:10:04Z'
  assessor:
    kind: agent
    name: provenance-audit
    version: '1.0'
  findings:
    name:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: The row is the grass entry of the archived Beijing run.
    target:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Veg code 993 of the modelled Beijing grid points at biogenic code 33.
    values:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      - zheng-article
      - jarvi-grass-respiration
      note: Code 33 of SUEWS_BiogenCO2.txt carries alpha 0.031, beta 5.4973, resp_a 2.1, resp_b 0.06 and
        min_respi 0.6, which is the record exactly, and Veg code 993 points at it. Appendix D reports
        the fitted median Fpho,max = 5.497 +/- 0.110, so the archive carries one digit more than the article
        publishes. Järvi Table A1 gives grass a = 2.1 and b = 0.06 for Torni and Eq. 11 documents the
        0.6 minimum; Zheng Table 2 adopts those respiration values and rounds Fpho,max to 5.5. The stored
        alpha appears only in the archive, and the quarantined theta of -999 matches the archive's empty
        column.
    source:
      conclusion: curation_required
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      - jarvi-grass-respiration
      note: The roles are mixed. Zheng et al. publish the Espoo beta fit and compile the Beijing input,
        while Järvi et al. publish the adopted Kumpula grass respiration terms and Finnish respiration
        floor. Alpha is recoverable only from the archived compilation. The schema has one source field,
        so replacing zheng-y2023 with jarvi2019 would misattribute beta and hide the compilation role.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/331
    place:
      conclusion: supported
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      note: The active place is now Espoo. Appendix D locates the 0.7 ha eddy-covariance lawn at 60 deg
        11 min 16.02 sec N, 24 deg 49 min 56.85 sec E in Espoo and states that its fitted Fpho,max is then
        used in Beijing. The stable Beijing path and origin retain that application lineage.
    representativeness:
      conclusion: supported
      evidence_ids:
      - zheng-article
      note: Site is the supported scope because Appendix D fits the grass parameter to observations from
        one 0.7 ha urban lawn; it supplies no city-wide evidence for either Espoo or Beijing.
    method:
      conclusion: curation_required
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      - jarvi-grass-respiration
      note: beta is a nonlinear least-squares fit with bootstrapping described in Appendix D, while ai
        and bi and the respiration floor are inherited literature values and alpha is archive-only, so
        no single method describes the row.
    identity:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Biogenic code 33 is a distinct row in the archive and the stored tuple is distinct from the
        other Beijing biogenic record in the database.
  evidence:
  - id: zheng-model-archive
    source: zheng-y2023
    role: compilation
    locators:
    - kind: dataset
      label: ModelRuns/Input/SUEWS_BiogenCO2.txt, code 33
      url: https://doi.org/10.5281/zenodo.8012194
      note: Carries the stored tuple and is commented Modified from Ossinlampi, Kumpula grassland.
    - kind: dataset
      label: ModelRuns/Input/SUEWS_Veg.txt, code 993, columns BiogenCO2Code
      url: https://doi.org/10.5281/zenodo.8012194
      note: Points the Beijing surfaces at biogenic code 33.
    - kind: dataset
      label: ModelRuns/Input/SUEWS_SiteSelect.txt, Beijing grid 1 (2015 and 2016)
      url: https://doi.org/10.5281/zenodo.8012194
      note: Assigns Code_EveTr 991, Code_DecTr 992, Code_Grass 993 and IrrigationCode 5 to the modelled
        Beijing grid, so those rows are the ones the published runs used.
  - id: zheng-article
    source: zheng-y2023
    role: parameter_source
    locators:
    - kind: table
      label: Table 2, SUEWS biogenic model parameters used for all case runs
      page: 4559
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: Publishes Fpho,max, ai and bi with their credits; alpha and theta are absent from the article.
    - kind: equation
      label: Eq. (15), soil and vegetation respiration
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: States that 0.6 umol m-2 s-1 is the minimum respiration in winter time.
    - kind: section
      label: Appendix D, Fitting the maximum photosynthetic rate for the grass and lawn vegetation type
      page: 4572
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: Locates the eddy covariance lawn in Espoo, Finland, describes the nonlinear least-squares
        and bootstrap fit, reports Fpho,max = 5.497 +/- 0.110 umol m-2 s-1, and states that this value
        is used for grass and lawn in the Beijing simulation.
  - id: zheng-domain
    source: zheng-y2023
    role: compilation
    locators:
    - kind: section
      label: Sect. 3, Study site and measurements
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: The model domain is a 1 km circle around the IAP tower, covering roughly 80 % of the accumulated
        flux footprint; no city-wide domain is modelled.
  - id: jarvi-grass-respiration
    source: jarvi2019
    role: parameter_source
    locators:
    - kind: table
      label: Table A1, grass respiration parameters for Torni
      page: 15
      url: https://doi.org/10.1029/2018JD029576
      note: Publishes agrass = 2.1 +/- 0.8 and bgrass = 0.06 +/- 0.03 for the Torni/Kumpula Helsinki
        application adopted by Zheng.
    - kind: equation
      label: Eq. 11 and accompanying text
      page: 5
      url: https://doi.org/10.1029/2018JD029576
      note: Sets the 0.6 umol m-2 s-1 floor from winter soil-chamber measurements in a boreal forest
        in central Finland.
  scientific_note: >-
    The active place and scope now identify the Espoo lawn where Zheng et al. fitted beta, rather than
    the Beijing application. The stable Beijing path, origin lineage, target, values, source and legacy
    identity remain unchanged. The tuple is still mixed: Zheng et al. publish the Espoo beta fit and
    compile the row; Järvi et al. publish the adopted Kumpula grass respiration terms and Finnish floor;
    and alpha is only present in the archive. The one-source and one-method fields cannot express those
    roles without overclaiming, so source and method remain curation required.
