    - kind: dataset
      label: ModelRuns/Input/SUEWS_Veg.txt, code 993, columns BiogenCO2Code
      url: https://doi.org/10.5281/zenodo.8012194
      note: Points the Beijing surfaces at biogenic code 33.
    - kind: dataset
      label: ModelRuns/Input/SUEWS_SiteSelect.txt, Beijing grid 1 (2015 and 2016)
      url: https://doi.org/10.5281/zenodo.8012194
      note: Assigns Code_EveTr 991, Code_DecTr 992, Code_Grass 993 and IrrigationCode 5 to the modelled
        Beijing grid, so those rows are the ones the published runs used.
  - id: zheng-article
    source: zheng-y2023
    role: parameter_source
    parameter_paths:
    - parameters.beta_bio_co2
    locators:
    - kind: table
      label: Table 2, SUEWS biogenic model parameters used for all case runs
      page: 4559
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: Publishes Fpho,max, ai and bi with their credits; alpha and theta are absent from the article.
    - kind: equation
      label: Eq. (15), soil and vegetation respiration
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: States that 0.6 umol m-2 s-1 is the minimum respiration in winter time.
    - kind: section
      label: Appendix D, Fitting the maximum photosynthetic rate for the grass and lawn vegetation type
      page: 4572
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: Locates the eddy covariance lawn in Espoo, Finland, describes the nonlinear least-squares
        and bootstrap fit, reports Fpho,max = 5.497 +/- 0.110 umol m-2 s-1, and states that this value
        is used for grass and lawn in the Beijing simulation.
  - id: zheng-archive-alpha
    source: zheng-y2023
    role: parameter_source
    parameter_paths:
    - parameters.alpha_bio_co2
    locators:
    - kind: dataset
      label: ModelRuns/Input/SUEWS_BiogenCO2.txt, code 33, alpha column
      url: https://doi.org/10.5281/zenodo.8012194
      note: The pinned model input is the only located artifact that states alpha 0.031 for this exact
        grass row; the journal article does not publish alpha.
  - id: zheng-domain
    source: zheng-y2023
    role: compilation
    locators:
    - kind: section
      label: Sect. 3, Study site and measurements
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: The model domain is a 1 km circle around the IAP tower, covering roughly 80 % of the accumulated
        flux footprint; no city-wide domain is modelled.
  - id: jarvi-grass-respiration
    source: jarvi2019
    role: parameter_source
    parameter_paths:
    - parameters.resp_a
    - parameters.resp_b
    - parameters.min_res_bioco2
    locators:
    - kind: table
      label: Table A1, grass respiration parameters for Torni
      page: 15
      url: https://doi.org/10.1029/2018JD029576
      note: Publishes agrass = 2.1 +/- 0.8 and bgrass = 0.06 +/- 0.03 for the Torni Helsinki site,
        which Zheng adopts in its released configuration.
    - kind: equation
      label: Eq. 11 and accompanying text
      page: 5
      url: https://doi.org/10.1029/2018JD029576
      note: Sets the 0.6 umol m-2 s-1 floor from winter soil-chamber measurements in a boreal forest
        in central Finland.
  scientific_note: >-
    The active place and scope identify the Espoo lawn where Zheng et al. fitted beta, rather than the
    Beijing application. The stable Beijing path, origin lineage, target, values, envelope source and
    legacy identity remain unchanged. Parameter-level provenance now records the mixed tuple without
    overclaiming: Zheng et al. publish the fitted Espoo beta and the archive-only alpha in their released
    configuration, while Järvi et al. publish the adopted Torni respiration coefficients and set the
    0.6 respiration floor from a central-Finland winter soil-chamber site. Leaf-level place and scope
    overrides keep those production sites distinct from the Espoo beta fit.
