  findings:
    name:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: The row is the grass entry of the archived Beijing run.
    target:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Veg code 993 of the modelled Beijing grid points at biogenic code 33.
    values:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      - zheng-article
      note: Code 33 of SUEWS_BiogenCO2.txt carries alpha 0.031, beta 5.4973, resp_a 2.1, resp_b 0.06 and
        min_respi 0.6, which is the record exactly, and Veg code 993 points at it. Appendix D reports
        the fitted median Fpho,max = 5.497 +/- 0.110, so the archive carries one digit more than the article
        publishes; Table 2 gives ai = 2.1 and bi = 0.06 and rounds Fpho,max to 5.5; Eq. (15) states the
        0.6 minimum. The stored alpha appears only in the archive, and the quarantined theta of -999 matches
        the archive's empty column.
    source:
      conclusion: correction_required
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      note: The roles are mixed. Zheng et al. fitted beta themselves, which Appendix D sets out in full,
        so for that parameter they are the parameter publication. Table 2 credits ai and bi to Havu et
        al. (2022a) and Jarvi et al. (2019), and the archive comments the row as modified from Ossinlampi,
        Kumpula grassland. One source key currently carries both roles.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/331
    place:
      conclusion: correction_required
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      note: Appendix D locates the eddy covariance lawn at 60 deg 11' 16.02" N, 24 deg 49' 56.85" E, in
        Espoo, Finland, and states that the fitted Fpho,max is the value used for grass and lawn in the
        Beijing simulation. Sect. 4.5.1 calls the same site Helsinki, which is an inconsistency inside
        the article; either way it is not Beijing. Beijing is the application location.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/331
    representativeness:
      conclusion: correction_required
      evidence_ids:
      - zheng-domain
      note: 'City representativeness for Beijing is unsupported: the parameters are Finnish in origin
        and the Beijing run covers a 1 km circle around the IAP tower rather than the city.'
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/331
    method:
      conclusion: curation_required
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      note: beta is a nonlinear least-squares fit with bootstrapping described in Appendix D, while ai
        and bi are inherited literature values, so no single method describes the row.
    identity:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Biogenic code 33 is a distinct row in the archive and the stored tuple is distinct from the
        other Beijing biogenic record in the database.
