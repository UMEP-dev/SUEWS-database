      - jarvi-table-4a
      note: Grass, unirrigated matches the surface column the value is read from.
    target:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Drainage coefficients and a wet threshold are land_cover.grass properties.
    values:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Table 4a's Grass column gives D0,i 0.013 and b 1.71, which are drain_coef_1 and drain_coef_2,
        and Si 1.9 mm, which is the wet threshold. Column alignment was checked by character position,
        not inferred. The drainage equation number, drain_eq 2, is not stated in the table.
    source:
      conclusion: correction_required
      evidence_ids:
      - jarvi-table-caption
      note: The Table 4 caption states that sources of the values are as in Järvi et al. (2011) unless
        a footnote says otherwise, and this cell carries no footnote. Järvi et al. (2014) compiles the
        value rather than deriving it.
    place:
      conclusion: correction_required
      evidence_ids:
      - jarvi-sites
      note: Helsinki is where the study ran, but this cell is an inherited value rather than a Helsinki
        determination.
    representativeness:
      conclusion: correction_required
      evidence_ids:
      - jarvi-sites
      note: The record claims city representativeness. Table 1 characterises the Helsinki eddy covariance
        footprints as 1 km radius circles and the two catchments as 23.8 and 44.8 ha; the study determines
        neighbourhood-scale values, not city-wide ones.
    method:
      conclusion: curation_required
      evidence_ids:
      - jarvi-table-caption
      note: A value carried forward from an earlier publication, so the production method belongs to that
        publication rather than to this one.
    identity:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: The unirrigated and irrigated grass records take different columns of the same table row,
        so keeping them separate follows the source.
      related_records:
      - records/surfaces/grass/helsinki--jarvi2014--drainage--grass-irrigated
