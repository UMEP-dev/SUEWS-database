  scientific_note: >-
    Stagakis et al. Supplement Table S3 is the exact Zurich-study publication lineage for the stored
    SUEWS lawn tuple: LAImin 1.6 and LAImax 3. Its Table A1 shows the internal SUEWS LAI calculation
    bounded by those values. Havu et al. (2024), which the supplement cites across the LAI rows, instead
    publish 1.6 and 5.9 for Helsinki grass; Ao et al. (2018) publish 3.2 and 5.9 for Shanghai and only
    mention 1.6 as an earlier minimum. The record therefore cites Stagakis et al. as the exact parameter
    publication. The pre-migration row remains compilation evidence, and source_legacy_ref 90240064
    preserves its former Ao link without presenting that link as scientific support. No value, stable path,
    origin, place, representativeness or legacy ID changes.
