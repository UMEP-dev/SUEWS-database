  scientific_note: 'The optimised LAI coefficients are genuinely Zheng et al.''s own: Appendix A sets
    out the CMA-ES fit and Table 3 publishes the result, so the source attribution and the method are
    sound. The stored senescence_sdd was 0.001 where both the article and the released model input give
    0.0001, an order of magnitude, matching neither the optimised case nor the base case; it has been
    corrected. What remains is that the record claims city representativeness for coefficients fitted
    to one park''s satellite LAI series and applied to a 1 km circle. The three identical sibling records
    are intentional, not duplicates, and any correction has to move all three together.'
