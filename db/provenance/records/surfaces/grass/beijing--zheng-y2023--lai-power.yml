  scientific_note: 'The optimised LAI coefficients are genuinely Zheng et al.''s own: Appendix A sets
    out the CMA-ES fit and Table 3 publishes the result, so the source attribution and the method are
    sound. The stored senescence_sdd was previously corrected to the published 0.0001. Because the fit
    uses one park''s satellite LAI series and a 1 km domain and the paper calls the parameters site-specific,
    this grass record is now classified at site scale. The identical deciduous and evergreen sibling
    tuples are intentional; their representativeness is tracked separately in issues 325 and 324.'
