      note: The string AnOHM does not occur anywhere in the article. Storage heat is handled through the
        objective hysteresis model and, for snow, through coefficients determined in Sect. 3.1; no volumetric
        heat capacity, thermal conductivity or bulk transfer coefficient is published for any surface.
