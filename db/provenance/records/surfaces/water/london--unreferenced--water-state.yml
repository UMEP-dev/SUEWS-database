  scientific_note: >-
    This record is fully traceable as an archived internal database configuration, but not as a parameter
    publication or a released SUEWS application. The source workbook at commit 746dcd5 stores Water State
    row 2 as legacy ID 42240002, Water, London, Small Fountain, StateLimit 15, WaterDepth 10 and Ref 90240000;
    its bytes have SHA-256 50dfc15322115651f672fed86df1fdcc7dc8b13a58b7ced9b2e270b388aee6d3.
    The generated YAML at commit 053c004 preserves the same row exactly. None of the pinned SUEWS Water
    tables from v2016a through v2025a contains the row, and no pre-migration type or current archetype selects
    it. SUEWS documentation establishes StateLimit as a configurable maximum water state rather than evidence
    of a measured depth. The record therefore keeps the exact value, stable path, London origin, legacy ID
    and legacy WaterDepth, retains source unreferenced, records method assumed, and removes the unsupported
    claim that this unused configuration represents London at city scale.
