  scientific_note: >-
    Ward et al. (2016) is a later unchanged compilation for this value. Järvi et al. (2011) is the
    earliest checked publication that states the exact 0.10 SUEWS water parameter. Its footnote leads
    to Oke (1987), whose table supplies zenith-angle-dependent water ranges but does not itself select
    one all-angle scalar. The record therefore cites Järvi et al. (2011) as parameter source and records
    Oke (1987) as upstream input. The value, stable path and historical origin remain unchanged; active
    place and representativeness are generic and applicable scale is land cover.
