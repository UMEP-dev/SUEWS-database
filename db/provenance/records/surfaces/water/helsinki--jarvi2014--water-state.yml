  scientific_note: >-
    The 2000 mm pair is fully traceable as an archived SUEWS configuration but not as a published Järvi
    parameter. Git history first introduces code 1000 with StateLimit 2000, later restores it after a
    revert, and the v2017a table adds WaterDepth 2000 and the Helsinki/Järvi label. SUEWS documentation
    and source code establish the quantity as an upper open-water state and configured depth. The database
    therefore retains the exact row as an assumed Helsinki application configuration, uses unreferenced
    to avoid false publication attribution, and preserves legacy source ID 90240015 only as lineage. No
    value, stable path, origin, legacy ID or legacy WaterDepth is changed.
