  scientific_note: The legacy row associated this value with Helsinki and Järvi et al. (2014), whose Table 4a gives 0.08 but explicitly credits Vargo et al. (2013). Reading Vargo et al. shows that 0.08 is an equivalent WRF land-cover constant for open water, rather than a Helsinki observation. The verbatim legacy Alb_max value of 0.1 remains under legacy so the migrated database assertion is not erased, while the active parameter, source, place and representativeness now follow the published evidence.
