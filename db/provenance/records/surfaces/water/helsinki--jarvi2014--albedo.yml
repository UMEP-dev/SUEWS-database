        a marks a value optimised using data from Helsinki, footnote b marks Vargo et al. (2013).'
  - id: jarvi-sites
    source: jarvi2014
    role: compilation
    locators:
    - kind: table
      label: Table 1, characteristics of the observational sites
      page: 1696
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: 'Five sites: Kumpula, Pasila and Pihlajamäki in Helsinki, and an urban and a suburban site
        in Montreal. Each Helsinki eddy covariance footprint is a 1 km radius circle and the catchments
        are 23.8 and 44.8 ha. London is not a study site; the word appears in the article only in a code-availability
        address and in a publisher''s address in the reference list.'
  scientific_note: 'Table 4a puts water albedo at 0.08 and the record stores 0.1. The gap is small in
    absolute terms and both numbers are unremarkable for open water, which is what makes it worth stating
    precisely rather than waving through: the cited table does not contain 0.1 in the Water column. The
    footnote on that cell also credits Vargo et al. (2013), so even the correct figure would not belong
    to this citation. Whoever repairs this should decide between adopting 0.08 with the right credit and
    finding where 0.1 actually came from.'
