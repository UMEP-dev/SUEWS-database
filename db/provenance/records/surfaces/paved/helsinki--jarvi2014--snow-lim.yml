  scientific_note: 'The number is right and the table is unambiguous: SWE,i max is 190 mm in every surface
    column, which is why six records share it. Two things sit behind it. The table caption makes this
    an inherited value rather than a determination of this study, and the article''s own text says the
    snow transport limits were estimated from maximum mass allowances at one Helsinki catchment with the
    same values used at all sites because no further information was available. City representativeness
    for Helsinki does not follow from that.'
