    source:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      - jarvi2011-no-snow
      note: Järvi et al. (2014) are the first accessible publication of the 190 mm SUEWS threshold.
        The blanket Table 4 caption cannot make Järvi et al. (2011) its source because that paper explicitly
        states that snow accumulation and melt were not yet modelled.
    place:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Table 4(a) presents one unqualified paved-surface model default used across the Helsinki and
        Montreal applications. Generic records the absence of a source-specific place claim; it does
        not assert universal empirical validity.
    representativeness:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: The publication gives the threshold as an unqualified model default rather than a fitted
        Helsinki or Montreal result, so generic is the supported evidence class.
    applicable_scale:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: SWE_i,max is tabulated separately by SUEWS land-cover surface; the value therefore applies
        at land-cover scale.
    method:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Literature records direct adoption of the published Table 4(a) model input without a new
        calculation or fit in this database.
    identity:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Table 4(a) assigns 190 mm to buildings, pavement, evergreen trees, deciduous trees, irrigated
        vegetation and grass. The retained target-specific records therefore represent deliberate per-land-cover
        applications rather than accidental duplicates; the bare-soil sibling remains unsupported because
        the table has no bare-soil column.
