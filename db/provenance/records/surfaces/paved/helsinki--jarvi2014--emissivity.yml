      note: An emissivity is a land_cover.paved property.
    values:
      conclusion: correction_required
      evidence_ids:
      - jarvi-table-4a
      note: The record stores emis 0.95. Table 4a's epsilon_i row gives 0.91 in the Pav column and 0.95
        in the Bldg column, so the stored figure is the one published for the other surface. The two records
        under this citation carry each other's value. Column alignment was verified by character position
        in a layout-preserving extraction, not read off a flattened dump.
    source:
      conclusion: correction_required
      evidence_ids:
      - jarvi-table-caption
      note: The Table 4 caption states that sources of the values are as in Järvi et al. (2011) unless
        a footnote says otherwise, and this cell carries no footnote. Järvi et al. (2014) compiles the
        value rather than deriving it.
    place:
      conclusion: correction_required
      evidence_ids:
      - jarvi-sites
      note: Helsinki is the study location; the emissivity is an inherited value rather than a Helsinki
        determination.
    representativeness:
      conclusion: correction_required
      evidence_ids:
      - jarvi-sites
      note: The record claims city representativeness. Table 1 characterises the Helsinki eddy covariance
        footprints as 1 km radius circles and the two catchments as 23.8 and 44.8 ha; the study determines
        neighbourhood-scale values, not city-wide ones.
    method:
      conclusion: curation_required
      evidence_ids:
      - jarvi-table-caption
      note: A literature value carried into the model parameter table; the article performs no emissivity
        measurement, so the production method belongs to whichever publication it came from.
    identity:
      conclusion: supported
      evidence_ids:
      - jarvi-table-4a
      note: Table 4a gives buildings and pavement separate emissivity cells, so two records are correct
        even though their values are the wrong way round.
      related_records:
      - records/surfaces/bldgs/helsinki--jarvi2014--emissivity
