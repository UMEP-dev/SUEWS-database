  scientific_note: Järvi et al. (2011) Table 2(a) is the earliest checked publication of the exact SUEWS
    pavement emissivity 0.91. Its Oke (1987) footnote is an upstream literature pointer, but Oke Table
    8.2 gives asphalt emissivity 0.95 rather than 0.91 and therefore cannot be substituted as the exact
    parameter source. Järvi et al. (2014) later repeat 0.91 in the pavement column. The record now describes
    a generic land-cover literature parameter while preserving its stable path, origin and legacy identity.
