  scientific_note: >-
    Ao et al. publish the Paved albedo bounds as 0.12 and 0.14. Migration preserves 0.12 as the active
    parameters.alb value and strands 0.14 under legacy.Alb_max because the current nonvegetation model
    schema has only one alb field. The field-scoped parameter-source evidence therefore applies only to
    parameters.alb: provenance paths cannot point into legacy, and this partial scope deliberately prevents
    record-level sign-off. Issue #339 remains open for a maintainer or upstream model-schema decision:
    either represent both bounds or explicitly define a scalar policy. The source does not authorise an
    average or replacing 0.12 with 0.14. No value, source, path, place or identity changes in this assessment.
