  scientific_note: >-
    Ao et al. publish the Paved albedo bounds as 0.12 and 0.14, while SUEWS accepts one alb scalar.
    Canonical source_bounds now preserve the pair, state that the active 0.12 is the source minimum,
    render the pair on the record page and carry it in the exported RefValue description. This removes
    the silent migration loss without averaging the bounds, replacing the active value or changing the
    SUEWS data model. The maximum is no longer legacy-only: field-level provenance carries its
    canonical meaning while legacy.Alb_max retains the original column for migration fidelity.
