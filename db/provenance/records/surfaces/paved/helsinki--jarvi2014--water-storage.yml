  scientific_note: 'Järvi et al. (2011) publish the exact 0.48 mm Pavement storage capacity as a generic
    SUEWS land-cover value. Their Table 2 footnote names Davies and Hollis (1981), but the cited conference
    paper, pages 434-443 of the Second International Conference on Urban Storm Drainage proceedings,
    remains unread. The accessible same-author 1981 doctoral thesis instead reports 1.00 mm for the road
    surface (UCL Discovery 1317854: https://discovery.ucl.ac.uk/id/eprint/1317854/). Davies and Hollis
    therefore must not be claimed as the exact 0.48 mm parameter source without checking the conference
    paper. Järvi et al. (2014) later reuse the value in Helsinki. The stable path, Helsinki origin, legacy
    ID and values remain unchanged.'
