  scientific_note: The legacy record path and origin retain the 2013 study association, but Ward et al. (2013) publish no drainage tuple. Ward et al. (2018) distinguish the non-vegetated drainage equation from the vegetation equation and support the corrected 10 and 3 coefficients together with a 0.60 mm paved wet threshold. The official SUEWS 2017b Swindon row independently confirms the complete tuple. The prior 0.013 and 1.71 pair belonged to the vegetation formulation and was not valid for this paved record.
