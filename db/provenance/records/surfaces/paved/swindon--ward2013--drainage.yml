  scientific_note: 'Ward et al. (2013) is an observational paper. It reports fluxes, not model parameters,
    and the one parameterisation it does describe, in Appendix B, is the objective hysteresis model for
    storage heat. There is no drainage equation in it, so the citation cannot stand behind drain_eq 3,
    drain_coef_1 0.013, drain_coef_2 1.71 or a wet threshold of 0.6. The separate question raised against
    this record, whether those coefficients belong to the vegetation drainage formulation rather than
    a paved one, is not settled here either: it needs the source that actually published them, and this
    audit has not found it. The site-scale classification now matches the suburban study area characterised
    over 500 m.'
