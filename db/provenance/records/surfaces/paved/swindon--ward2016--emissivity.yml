  scientific_note: Ward et al. Table 2 is the only checked publication that maps the stored 0.95 directly
    to the SUEWS Paved class, so ward2016 remains the canonical source. The paper simultaneously says
    its UK emissivities came from Järvi et al. (2011), whose Table 2(a) maps 0.91 to Pavement and 0.95
    to Building. Ward reverses those two values. Oke's Asphalt 0.95 offers a plausible material context
    but cannot settle whether the reversal is intentional. This source-mapping contradiction is the
    sole remaining curation question. Generic scope and land_cover applicability remove the unsupported
    claim that 0.95 was Swindon city evidence while preserving the record's migrated identity and value.
