  scientific_note: This is the strongest record in the group. The value is in Table 4a, and its footnote
    marks it as optimised using Helsinki data, which makes this study the parameter publication rather
    than a compiler, unlike almost every other cell in the same table. What the footnote does not say
    is what the optimisation minimised or over which period, so the method behind the number is thinner
    than the attribution. City representativeness still overstates a study whose footprints are 1 km circles.
