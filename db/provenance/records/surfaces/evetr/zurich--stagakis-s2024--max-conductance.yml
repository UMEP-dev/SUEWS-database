  scientific_note: 'The parameter source is now settled: Järvi et al. (2011) publishes the exact 7.4
    mm s-1 conifer value, while the later Zurich study does not print maximum conductance. The stable
    path and Zurich place retain the application context, not an assertion that the value was derived
    in Zurich. Human curation is still needed for the city-scale claim and for the separate evergreen
    identity, because Stagakis evaluates four parks and parameterises one Trees class rather than distinct
    evergreen and deciduous classes.'
