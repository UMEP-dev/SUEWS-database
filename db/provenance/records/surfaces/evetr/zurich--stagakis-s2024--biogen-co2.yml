      note: The record is named Evergreen trees, but this study parameterises trees as a single class;
        the name draws a distinction the source does not make.
    target:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      note: Photosynthesis and respiration parameters are land_cover.evetr properties.
    values:
      conclusion: contradicted
      evidence_ids:
      - stagakis-parameter-table
      note: Three of the six stored values disagree with the cited study's own parameter table. The record
        stores beta_bio_co2 29.2138, resp_a 2.88 and resp_b 0.06; Table S3's Trees column gives Fpho,max
        8.3, ai 0.78 and bi 0.08. The remaining three, alpha_bio_co2 0.031, theta_bio_co2 0.723 and min_res_bioco2
        0.6, are not published in the article or supplement at all. Not one of the six is supported by
        this citation.
    source:
      conclusion: contradicted
      evidence_ids:
      - stagakis-parameter-table
      note: A source that publishes different numbers for the same quantities cannot be the source of
        the stored ones.
    place:
