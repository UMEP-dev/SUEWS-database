        The study does not parameterise evergreen and deciduous trees separately.
  scientific_note: 'This is the clearest failure in the group. The cited study publishes a complete SUEWS
    parameter set for trees, and every one of its numbers differs from what the record stores: 8.3 against
    29.2138 for the photosynthesis maximum, 0.78 against 2.88 and 0.08 against 0.06 for the respiration
    coefficients. The remaining three stored values are not in the publication at all. The citation is
    not merely thin here, it points the wrong way. One observation is worth passing on as a lead rather
    than a finding, because this audit has not verified it at its own source: the stored beta values,
    together with alpha 0.031 and theta 0.723, are the shape of a Helsinki parameter set rather than anything
    in this Zurich study, and the resemblance is close enough to be worth checking against the Helsinki
    records already in this database. Where 2.88 comes from is not apparent from any source read here.'
