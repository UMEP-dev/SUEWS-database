  findings:
    name:
      conclusion: curation_required
      evidence_ids:
      - stagakis-tree-classes
      note: The record is named Evergreen trees, but this study parameterises trees as a single class;
        the name draws a distinction the source does not make.
    target:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      note: Photosynthesis and respiration parameters are land_cover.evetr properties.
    values:
      conclusion: unresolved
      evidence_ids:
      - stagakis-parameter-table
      note: Three of the six stored values now match the cited study's own parameter table. Table S3's
        Trees column gives Fpho,max 8.3, ai 0.78 and bi 0.08, mapped here to beta_bio_co2, resp_a and
        resp_b. The remaining three, alpha_bio_co2 0.031, theta_bio_co2 0.723 and min_res_bioco2 0.6,
        are not published in the article or supplement and remain unresolved.
    source:
      conclusion: unresolved
      evidence_ids:
      - stagakis-parameter-table
      note: The source publishes the corrected beta_bio_co2, resp_a and resp_b values, but it does not
        publish the stored alpha_bio_co2, theta_bio_co2 or min_res_bioco2 values.
    place:
      conclusion: unresolved
      evidence_ids:
      - stagakis-scope
      note: The corrected beta_bio_co2, resp_a and resp_b values are used for trees in the Zurich study;
        the place basis of alpha_bio_co2, theta_bio_co2 and min_res_bioco2 remains unresolved.
    representativeness:
      conclusion: unresolved
      evidence_ids:
      - stagakis-scope
      note: The study covers four Zurich parks rather than a city-wide determination, and the provenance
        of three retained fields remains unresolved.
    method:
      conclusion: unresolved
      evidence_ids:
      - stagakis-parameter-table
      note: Table S3 establishes adoption of the corrected beta_bio_co2, resp_a and resp_b values, but
        the production method for the three retained unsupported fields remains open.
    identity:
      conclusion: curation_required
      evidence_ids:
      - stagakis-parameter-table
      - stagakis-tree-classes
      note: Two Zurich tree records exist under a citation that has one Trees column. Both records now
        carry the published Trees values, but whether the deciduous-evergreen split should survive remains
        a maintainer decision.
      related_records:
      - records/surfaces/dectr/zurich--stagakis-s2024--biogen-co2
  evidence:
  - id: stagakis-parameter-table
    source: stagakis-s2024
    role: parameter_source
    locators:
    - kind: supplementary
      label: Supplement Table S3, Parameters used by SUEWS model
      page: 3
      url: https://doi.org/10.5194/bg-22-2133-2025-supplement
      note: One Trees column and one Lawn column. It gives Fpho,max 8.3 and 8.92, ai 0.78 and 1.7, bi
        0.08 and 0.06, LAImax 4.8 and 3, LAImin 0.66 and 1.6, G2-G6, TL, TH, dtheta_WP 132.5 and 143 mm,
        Kdown,max 1200, GDD 300, SDD -300, Tbase,GDD 5, Tbase,SDD 10, and the four LAI power coefficients
        0.04, 0.0005, -1.5 and 0.0025. It gives no maximum conductance, no G1, no soil depth, no soil
        storage capacity, no light-response alpha or theta and no minimum respiration.
  - id: stagakis-scope
    source: stagakis-s2024
    role: compilation
    locators:
    - kind: section
      label: Title and abstract
      page: 2133
      url: https://doi.org/10.5194/bg-22-2133-2025
      note: The study covers four urban parks in the city of Zurich and evaluates the models against in
        situ measurements made in those parks; it is park-scale, not a city-wide determination.
  - id: stagakis-tree-classes
    source: stagakis-s2024
    role: compilation
    locators:
    - kind: section
      label: Sect. 2.4.1, land cover map, and Supplement Table S3
      page: 2140
      url: https://doi.org/10.5194/bg-22-2133-2025
      note: The land cover map separates deciduous, mixed and evergreen trees and notes that a large majority
        of Zurich's trees are deciduous, but the SUEWS parameter table carries a single Trees column.
        The study does not parameterise evergreen and deciduous trees separately.
  scientific_note: 'Supplement Table S3 now directly supports beta_bio_co2 8.3, resp_a 0.78 and resp_b
    0.08 for its single Trees class. This correction does not settle the three fields absent from the
    publication: alpha_bio_co2 0.031, theta_bio_co2 0.723 and min_res_bioco2 0.6 remain unsupported by
    this citation. Nor does it settle whether one published Trees class should remain represented by
    separate deciduous and evergreen records. Those provenance and identity questions remain open.'
