  scientific_note: 'The stored value is exactly what Zheng et al. publish and exactly what their released
    runs used, so the number, source, place, origin and legacy lineage remain unchanged. Appendix E says
    the city-wide purpose is achieved by averaging different species; only the deciduous and grass entries
    are such averages. The evergreen entry is one Pinus tabuliformis value, converted by G1, so its
    evidence reach is site. Code 991''s assignment to the Beijing grid documents model application, not
    a broader observation reach.'
