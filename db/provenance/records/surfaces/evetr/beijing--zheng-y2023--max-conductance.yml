      - zheng-parameter-publication
      note: Appendix E ties its city-representative claim to averaging across species, and the deciduous
        and grass entries are averages of four and three species. The evergreen entry is a single species,
        and Table E1 note b says the figure was obtained by dividing a maximum canopy conductance by G1
        = 3.5. Whether a single-species converted value should carry city representativeness is a maintainer
        decision, not something the paper settles.
