  scientific_note: 'The stored value is exactly what Zheng et al. publish and exactly what their released
    runs used, so the number itself is settled. What is not settled is the city label: Appendix E earns
    that label by averaging over species, and the evergreen entry has only one species, converted from
    a canopy-scale measurement by dividing by G1. The deciduous and grass records in the same group are
    averages and are assessed as supported. A maintainer should decide whether this record keeps city
    representativeness, narrows it, or is annotated as single-species.'
