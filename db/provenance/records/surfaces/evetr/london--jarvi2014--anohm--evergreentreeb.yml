  - id: jarvi-anohm-absent
    source: jarvi2014
    role: validation
    locators:
    - kind: text
      label: Whole-article search for AnOHM and its three input parameters
      page: 1691-1711
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: The article does not mention AnOHM or publish volumetric heat capacity, thermal conductivity
        and bulk transfer coefficient values for evergreen-tree; its study sites are in Helsinki and Montreal.
  - id: published-anohm-values
    source: sun2017
    role: validation
    locators:
    - kind: table
      label: Table 1(a), input-parameter sensitivity distributions
      page: 2880
      url: https://doi.org/10.5194/gmd-10-2875-2017
      note: Publishes generic means of 2.0 MJ m-3 K-1, 1.2 W m-1 K-1 and 4, not the exact stored tuple.
    - kind: table
      label: Table 3, UK-Ldn calibration
      page: 2883
      url: https://doi.org/10.5194/gmd-10-2875-2017
      note: Publishes the bulk London calibration 2.4 MJ m-3 K-1, 2.8 W m-1 K-1 and 4.3, not a
        separate evergreen-tree tuple of 1.0 MJ m-3 K-1, 1.2 W m-1 K-1 and 4.
  scientific_note: The exact 1000000/1.2/4 tuple first appears in the SUEWS v2017a text table as a
    London EveTr configuration, but its companion generator workbook retains 100000/1.2/4. Neither
    Järvi et al. nor Sun et al. publish the stored tuple. It is retained honestly as an unreferenced,
    assumed generic land-cover configuration; the stable London path/origin preserves its application lineage.
