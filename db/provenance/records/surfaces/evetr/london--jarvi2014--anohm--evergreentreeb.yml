      label: SUEWS_Veg.txt at the AnOHM-field introduction
      url: https://github.com/UMEP-dev/SUEWS/blob/d3659012860cb22f8c778e953e474d532cc08ae3/InputTables/SUEWS_Veg.txt
      note: The first non-reverted AnOHM input table contains no code 700 and stores 100000/1.2/4
