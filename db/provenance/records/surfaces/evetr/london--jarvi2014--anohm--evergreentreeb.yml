    target:
      conclusion: supported
      evidence_ids:
      - v2017a-evetr-row
      note: The three AnOHM fields are stored on the EvergreenTreeB surface row and therefore belong to land_cover.evetr.
    values:
      conclusion: supported
      evidence_ids:
      - v2017a-evetr-row
      - earlier-anohm-evetr-row
      - published-anohm-values
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/207
      note: The v2017a text table stores 1000000, 1.2 and 4 exactly. The earlier AnOHM table and the
        generator workbook committed with v2017a both store 100000 instead, while Sun et al. publish
        different generic and London values. The current tuple is therefore supported only as the
        released text-table assumption, not as a scientific determination.
    source:
      conclusion: supported
      evidence_ids:
      - v2017a-evetr-row
      - earlier-anohm-evetr-row
      - jarvi-anohm-absent
      - published-anohm-values
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/207
      note: Unreferenced is correct. Järvi et al. predate AnOHM, Sun et al. do not publish this exact
        tuple, and a release table can prove configuration lineage without becoming a scientific
        parameter source.
    place:
      conclusion: supported
      evidence_ids:
      - v2017a-evetr-row
      - jarvi-anohm-absent
      - published-anohm-values
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/207
      note: Generic is the active evidence place because no publication determines this tuple at a
        study location. London remains in the stable path and origin as the v2017a application label.
    representativeness:
      conclusion: supported
      evidence_ids:
      - v2017a-evetr-row
      - jarvi-anohm-absent
      - published-anohm-values
      note: Generic scope records an explicit configuration assumption; city would falsely present the
        tuple as a London observational or fitted result.
    applicable_scale:
      conclusion: supported
      evidence_ids:
      - v2017a-evetr-row
      note: The tuple is stored on the EvergreenTreeB surface row and applies to that land-cover class rather
        than a whole-neighbourhood bulk calibration.
    method:
      conclusion: supported
      evidence_ids:
      - v2017a-evetr-row
      - earlier-anohm-evetr-row
      note: Assumed accurately records a sample configuration whose production is undocumented; the
        companion workbook disagreement rules out treating the text row as a transparent calculation.
    identity:
      conclusion: supported
      evidence_ids:
      - v2017a-evetr-row
      note: Rows 700 and 661 are separate complete configurations with different OHM code families
        while reusing the same AnOHM subset. The stable path and legacy ID preserve row 700 without
        claiming that the repeated tuple is a second scientific determination.
      related_records:
      - records/surfaces/evetr/london--jarvi2014--anohm
