  scientific_note: >-
    The stored LAI bounds are published in Ao et al. for the Shanghai application, but their field-level
    lineage is older and mixed. Järvi et al. (2011) are the earliest located publication of the complete
    4/5.1 pair. Their footnote and Breuer Table 7 support only the maximum 5.1; the source or modelling
    basis of the minimum 4 is still unidentified. Ao et al. select an LAI equation, but the paper does not explicitly
    map it to the migrated numeric lai_type 1 code. The record therefore remains curation-required: replacing
    Ao with Breuer would falsely attribute the complete pair, while replacing it with Järvi would identify
    the earliest located direct publisher without recovering the original basis of the minimum. No stored
    value, source, path, place or identity is changed by this assessment.
