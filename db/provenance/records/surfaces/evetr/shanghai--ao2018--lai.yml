  scientific_note: >-
    Ao et al. (2018) use SUEWS v2017a, publish evergreen LAI bounds 4 and 5.1, and explicitly adopt the
    thermal-only leaf-off Eq. (5b) after rejecting the alternative Eq. (5c) because its day-length trigger is
    unsuitable at Xujiahui. The v2017a source code maps LAIType 0 to that thermal-only branch and LAIType 1 to
    the day-length branch. The migrated selector 1 therefore contradicts both the paper and the cited model
    version; changing it to 0 restores the published configuration. Older Järvi and Breuer tables document the
    inherited bound lineage without replacing Ao as the publication of the complete Shanghai input tuple.
