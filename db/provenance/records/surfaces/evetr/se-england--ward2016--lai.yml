      note: Evergreen Tree follows Järvi's coniferous-tree SUEWS category, but the SE England qualifier
        is later application context rather than the scope of the published bounds.
    target:
      conclusion: supported
      evidence_ids:
      - jarvi-table-2
      note: Järvi et al. publish the two bounds for the coniferous-tree SUEWS vegetation category represented
        by land_cover.evetr.
    values:
      conclusion: supported
      evidence_ids:
      - jarvi-table-2
      - jarvi2014-table-4
      - breuer-table-7
      note: Järvi et al. (2011) Table 2 publishes LAImin 4 and LAImax 5.1 for coniferous trees. Järvi et
        al. (2014) Table 4 repeats the pair. Breuer Table 7 supplies the 5.1 coniferous-forest median but
        not the lower bound 4.
    source:
      conclusion: supported
      evidence_ids:
      - jarvi-table-2
      - jarvi2014-table-4
      - breuer-table-7
      - ward-phenology
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/147
      note: Järvi et al. (2011) are the earliest located direct publisher of the complete 4/5.1 record.
        Järvi et al. (2014) explicitly reuse the earlier source set, while Ward et al. evaluate seasonal
        timing without publishing these bounds as a new SE England fit.
    place:
      conclusion: curation_required
      evidence_ids:
      - jarvi-table-2
      - ward-phenology
      note: Järvi Table 2 publishes general SUEWS model parameters, not an SE England determination.
        Ward establishes the UK application context but does not establish the bounds as regional evidence.
    representativeness:
