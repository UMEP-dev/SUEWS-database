  evidence:
  - id: breuer-table-7
    source: breuer2003
    role: parameter_source
    locators:
    - kind: table
      label: Table 7, coniferous forest interception capacity
      page: 286
      url: https://doi.org/10.1016/S0304-3800(03)00274-6
      note: Reports Ic = 1.3 mm as the median of 74 coniferous-forest values in the temperate literature
        review; this is the original summary underlying Si, not a London or Havu measurement.
  - id: calder-wright-fit
    source: calder1986
    role: parameter_source
    locators:
    - kind: equation
      label: Accepted manuscript Appendix 1, abstract and Eqs. 9 and 13
      url: https://nora.nerc.ac.uk/id/eprint/13072/1/N013072CR.pdf
      note: Fits the modified Rutter function D = 0.013(exp(1.71 C) - 1) mm h-1 to canopy-storage
        measurements at Sitka-spruce sites in Wales and Scotland; this is the original source of both
        drainage coefficients.
  - id: grimmond-oke-adoption
    source: grimmond1991a
    role: compilation
    locators:
    - kind: section
      label: Section 3.6, Drainage
      page: 1744
      url: https://doi.org/10.1029/91WR00557
      note: Defines the exponential vegetation drainage equation and says its coefficients are taken
        from Calder and Wright; the reference year is printed as 1985 although the registered paper was
        published in 1986.
    - kind: table
      label: Table 2, Coniferous column
      page: 1745
      url: https://doi.org/10.1029/91WR00557
      note: Adopts D0 = 0.013 and b = 1.71 for coniferous vegetation in the Vancouver 1987 base run.
  - id: jarvi-table-2
    source: jarvi2011
    role: parameter_source
    locators:
    - kind: table
      label: Table 2(a), Coniferous Trees column
      page: 223
      url: https://doi.org/10.1016/j.jhydrol.2011.10.001
      note: Compiles the complete stored tuple Si = 1.3 mm, D0 = 0.013 and b = 1.71. Its footnotes correctly
        point Si to Breuer and D0 to Grimmond and Oke (1991), but the b-row footnote to Grimmond et al.
        (1986) is contradicted by that paper's full text; Calder and Wright fitted b together with D0.
    - kind: equation
      label: Equation 18, unirrigated vegetation drainage
      page: 224
      url: https://doi.org/10.1016/j.jhydrol.2011.10.001
      note: Defines the exponential drainage form used by the stored equation selector and states that
        maximum rates and coefficients come from the literature.
  - id: havu-archive
    source: havu-m2024
    role: compilation
    locators:
    - kind: dataset
      label: Input_rcp.zip/Input_rcp/SUEWS_Veg.txt, rows 841–844
      url: https://doi.org/10.5281/zenodo.10572180
      note: The Helsinki forest, street and two park evergreen rows each carry WetThreshold 1.3, DrainageEq
        3, DrainageCoef1 0.013 and DrainageCoef2 1.71, demonstrating later Helsinki application rather
        than original parameter derivation.
  attempted_sources:
  - source: grimmond1986
    attempted_at: '2026-08-24T15:01:54Z'
    outcome: not_found
    note: The complete paper was close-read because Järvi Table 2 footnotes the b row to it. It contains
      neither 1.71 nor 0.013, does not define the exponential drainage function, and therefore is not
      the coefficient source.
  scientific_note: 'The active record is a generic coniferous-tree literature tuple: Breuer et al. provide
    the 1.3 mm median storage capacity, Calder and Wright originally fit D0 = 0.013 and b = 1.71 to Sitka-spruce
    canopy data, Grimmond and Oke adopt those coefficients into the urban model, Järvi et al. compile the
    complete SUEWS tuple, and Havu''s archive later applies it in Helsinki configurations. Järvi''s b-row
    footnote to Grimmond et al. (1986) is not supported by that paper. The stable path and origin retain
    migration lineage; no value, source key, target or legacy identity changed.'
