  scientific_note: >-
    Ward et al. (2016) is a later compilation for this value. Järvi et al. (2011) is the earliest checked
    publication that states the exact 0.98 model parameter. Its footnote leads to Oke (1987), whose
    original table supports a generic coniferous-forest interval of 0.97 to 0.99 but not the exact
    midpoint selection. The record therefore cites Järvi et al. (2011) as parameter source and records
    Oke (1987) as the upstream compilation. Its value, stable path and historical origin remain unchanged;
    active place and representativeness are generic.
