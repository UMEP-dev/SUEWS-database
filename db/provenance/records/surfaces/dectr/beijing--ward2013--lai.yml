  scientific_note: 'The citation problem is settled but the identity problem is not. Järvi et al. (2011)
    publishes the exact deciduous-tree LAI minimum and maximum, with the 5.5 maximum traced to Breuer
    et al. (2003), and the final Zheng Beijing archive shows the same pair used with equation type 0.
    Ward et al. (2013) is therefore removed as the parameter source. Neither Järvi nor Breuer establishes
    the values as Beijing measurements, while Zheng demonstrates application rather than local derivation.
    Issue #381 remains the place to decide whether this stable Beijing-labelled record should retain
    city representativeness or be recast as a generic literature parameter set.'
