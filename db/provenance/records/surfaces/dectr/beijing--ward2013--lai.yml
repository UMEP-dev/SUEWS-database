  scientific_note: 'Nothing connects this record to the paper it cites. Ward et al. (2013) is a twelve-month
    eddy covariance study of one suburban site in Swindon; it publishes no leaf area index values and
    no Chinese measurements, so it can support neither the stored range nor the Beijing label. One lead
    is worth recording for whoever repairs this, and it is a lead rather than a finding: Zheng et al.
    (2023), the Beijing SUEWS study, gives a deciduous maximum of 5.5 and minimum of 1.0 in its Table
    2 and credits them to Järvi et al. (2011). That would make the values a reused generic pair rather
    than Beijing evidence, but this audit has not opened Järvi et al. (2011), so the attribution stays
    open rather than being transferred on resemblance.'
