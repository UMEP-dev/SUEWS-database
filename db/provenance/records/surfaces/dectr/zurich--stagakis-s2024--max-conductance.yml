    role: compilation
    locators:
    - kind: section
      label: Title and abstract
      page: 2133
      url: https://doi.org/10.5194/bg-22-2133-2025
      note: The study covers four urban parks in the city of Zurich and evaluates the models against in
        situ measurements made in those parks; it is park-scale, not a city-wide determination.
  - id: stagakis-tree-classes
    source: stagakis-s2024
    role: compilation
    locators:
    - kind: section
      label: Sect. 2.4.1, land cover map, and Supplement Table S3
      page: 2140
      url: https://doi.org/10.5194/bg-22-2133-2025
      note: The land cover map separates deciduous, mixed and evergreen trees and notes that a large majority
        of Zurich's trees are deciduous, but the SUEWS parameter table carries a single Trees column.
        The study does not parameterise evergreen and deciduous trees separately.
  scientific_note: 'Table S3 is a full parameter listing for the SUEWS equations the paper sets out, and
    it has no maximum conductance row. The stored value 3.1 mm s-1 therefore has no locator in this source,
    and the Zenodo archive the article points to holds data rather than model inputs, so there is nowhere
    else in the publication to look. This is an honest dead end rather than a contradiction: the value
    may well have been used, but nothing published shows it. Two things would settle it, and both are
    outside this audit: the authors'' own SUEWS input files, or an earlier publication that carries the
    number and that this record should cite instead. Separately, the study treats trees as one class,
    so the split between a deciduous and an evergreen Zurich record does not come from here.'
