  scientific_note: 'The parameter source is now settled: Breuer et al. (2003) Table 7 publishes 3.1
    mm s-1 as the median stomatal conductance for deciduous forest, while Stagakis et al. do not print
    a maximum-conductance value. Havu et al. later publish the same value for Helsinki Street and Park
    vegetation, providing compilation context rather than the upstream citation. The stable path and
    Zurich place retain application context, not an assertion that the value was derived there. Human
    curation is still needed for the city-scale claim and tree-class identity because Breuer reports
    a global temperate forest category, while Stagakis parameterises one Trees class rather than separate
    deciduous and evergreen classes.'
