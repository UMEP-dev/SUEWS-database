      url: https://doi.org/10.5194/bg-22-2133-2025-supplement
      note: Directly gives Fpho,max 8.3, ai 0.78 and bi 0.08 for the one Trees class; these map to
        beta_bio_co2, resp_a and resp_b.
  - id: stagakis-scope
    source: stagakis-s2024
    role: validation
    locators:
    - kind: section
      label: Abstract and Sect. 2.1, study sites
      page: 2133
      url: https://doi.org/10.5194/bg-22-2133-2025
      note: Evaluates the models against in-situ observations from lawns and trees in four urban parks
        in Zurich; it does not establish a city-wide tree parameter fit.
  - id: stagakis-tree-classes
    source: stagakis-s2024
    role: compilation
    locators:
    - kind: section
      label: Sect. 2.4.1, land-cover map, and Supplement Table S3
      page: 2140
      url: https://doi.org/10.5194/bg-22-2133-2025
      note: The map separates deciduous, mixed and evergreen trees, but the SUEWS parameter table has
        one Trees column and does not parameterise evergreen and deciduous trees separately.
  - id: bellucco-local-fit
    source: bellucco2017
    role: parameter_source
    parameter_paths:
    - parameters.alpha_bio_co2
    - parameters.theta_bio_co2
    locators:
    - kind: table
      label: Table 4, mean 200-270 degree vegetated sector
      page: 118
      url: https://doi.org/10.1016/j.agrformet.2016.12.011
      note: Publishes the Helsinki local-model non-rectangular-hyperbola coefficients alpha 0.031
        and theta 0.723, averaged over the Botanical Garden wind sector and used in the final local model.
  - id: jarvi-winter-floor
    source: jarvi2019
    role: parameter_source
    parameter_paths:
    - parameters.min_res_bioco2
    locators:
    - kind: equation
      label: Equation 11, soil and vegetation respiration
      page: 8366
      url: https://doi.org/10.1029/2018JD029576
      note: Defines respiration as max(a_i exp(Tair b_i), 0.6) for each vegetated surface.
    - kind: section
      label: Appendix B, Estimating Minimum Soil Respiration
      page: 8379
      url: https://doi.org/10.1029/2018JD029576
      note: Reports a 0.60 +/- 0.07 micromol m-2 s-1 minimum from 1,677 cold-season half-hour
        observations measured by three automatic soil chambers in a Southern Finland boreal forest.
  scientific_note: >-
    The record is a mixed-source but fully traceable SUEWS Trees configuration used in Zurich.
    Stagakis publishes the three values it used for the Zurich runs, Bellucco supplies the earlier
    Helsinki light-response fit for alpha and theta, and Järvi supplies the separately measured winter
    respiration floor. Per-leaf provenance preserves those source, method and place distinctions without
    changing any numeric value. The only remaining question is whether one published Trees class should
    remain represented by separate deciduous and evergreen records.
