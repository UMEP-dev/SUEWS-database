  findings:
    name:
      conclusion: curation_required
      evidence_ids:
      - stagakis-tree-classes
      note: The record is named Deciduous trees, but Stagakis parameterises one Trees class. Whether
        that class should remain represented by separate deciduous and evergreen records is a human
        identity decision rather than a parameter-provenance gap.
      related_records:
      - records/surfaces/evetr/zurich--stagakis-s2024--biogen-co2
    target:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      note: The stored leaves are SUEWS tree photosynthesis and respiration parameters. Whether the
        shared Trees tuple should occupy both tree targets is recorded separately under identity.
    values:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      - bellucco-local-fit
      - jarvi-winter-floor
      note: Stagakis Table S3 directly publishes beta_bio_co2 8.3, resp_a 0.78 and resp_b 0.08
        for Trees. Bellucco Table 4 publishes alpha 0.031 and theta 0.723, and Järvi Equation 11
        publishes the 0.6 minimum-respiration floor.
    source:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      - bellucco-local-fit
      - jarvi-winter-floor
      note: Stagakis remains the envelope source for its Zurich Trees configuration. Canonical
        field-level overrides identify Bellucco for alpha_bio_co2 and theta_bio_co2 and Järvi for
        min_res_bioco2.
    place:
      conclusion: supported
      evidence_ids:
      - stagakis-scope
      - bellucco-local-fit
      - jarvi-winter-floor
      note: Zurich is the application place for the Stagakis Trees configuration. The alpha and theta
        overrides preserve their Helsinki fit location, while the minimum-respiration override preserves
        the Southern Finland chamber evidence instead of making those values appear Zurich-derived.
    representativeness:
      conclusion: supported
      evidence_ids:
      - stagakis-scope
      - bellucco-local-fit
      - jarvi-winter-floor
      note: Stagakis evaluates the Trees configuration at four individual parks, Bellucco fits one
        Helsinki flux site and Järvi derives the floor from one chamber site. Site is the supported
        evidence reach at record and overridden-field levels.
    method:
      conclusion: supported
      evidence_ids:
      - stagakis-parameter-table
      - bellucco-local-fit
      - jarvi-winter-floor
      note: Literature is the record-level method because Stagakis adopts the three exact Trees values
        in its model configuration. The alpha and theta overrides are fitted light-response coefficients,
        and the minimum-respiration override is the measured winter chamber statistic installed as the
        model floor.
    identity:
      conclusion: curation_required
      evidence_ids:
      - stagakis-parameter-table
      - stagakis-tree-classes
      note: Stagakis publishes one Trees column, while the migrated database retains equal-valued
        deciduous and evergreen records. A maintainer must decide whether that split should survive;
        no numeric value or leaf source is unresolved.
      related_records:
      - records/surfaces/evetr/zurich--stagakis-s2024--biogen-co2
  evidence:
