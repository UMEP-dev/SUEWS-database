    - kind: table
      label: Table 1, characteristics of the observational sites
      page: 1696
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: 'Five sites: Kumpula, Pasila and Pihlajamäki in Helsinki, and an urban and a suburban site
        in Montreal. Each Helsinki eddy covariance footprint is a 1 km radius circle and the catchments
        are 23.8 and 44.8 ha. London is not a study site; the word appears in the article only in a code-availability
        address and in a publisher''s address in the reference list.'
  - id: release-row-lineage
    record: records/surfaces/dectr/london--jarvi2014--anohm--dectree
    role: related
    note: SUEWS 2017a SUEWS_Veg.txt rows 662 and 701 are distinct DecTr configuration rows. They differ
      in other columns while both store rhoCp 1000000, k 1.2 and Ch 4; see the pinned release table at
      https://github.com/UMEP-dev/SUEWS/blob/2017ada79a7688860d11a8384b9f52c7de8c8273/docs/source/inputs/tables/SUEWS_SiteInfo/sample-table/SUEWS_Veg.txt#L11-L14.
  scientific_note: 'The citation is simply wrong for this record. AnOHM does not appear in Järvi et al.
    (2014) at all, and the article publishes no material thermal properties of any kind; its storage heat
    comes from the objective hysteresis model. The place is wrong too: the study''s five sites are in
    Helsinki and Montreal, and London is mentioned only in a web address and a reference list entry. This
    audit does not name a replacement source, because doing so on the strength of the scheme''s name would
    be exactly the inference this database forbids. What is still needed is the publication that introduced
    AnOHM and published these coefficients. The apparent duplicate is separately settled as two preserved
    release-row identities that reuse one AnOHM subset.'
