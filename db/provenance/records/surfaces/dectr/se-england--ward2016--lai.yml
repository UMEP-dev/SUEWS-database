      note: Deciduous Tree follows Järvi's SUEWS category, but the SE England qualifier is later application
        context rather than the scope of the published bounds.
    target:
      conclusion: supported
      evidence_ids:
      - jarvi-table-2
      note: Järvi et al. publish the two bounds for the deciduous-tree SUEWS vegetation category represented
        by land_cover.dectr.
    values:
      conclusion: supported
      evidence_ids:
      - jarvi-table-2
      - jarvi2014-table-4
      - breuer-table-7
      note: Järvi et al. (2011) Table 2 publishes LAImin 1 and LAImax 5.5 for deciduous trees. Järvi et
        al. (2014) Table 4 repeats the pair. Breuer Table 7 supplies the 5.5 deciduous-forest median but
        not the lower bound 1.
    source:
      conclusion: supported
      evidence_ids:
      - jarvi-table-2
      - jarvi2014-table-4
      - breuer-table-7
      - ward-phenology
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/146
      note: Järvi et al. (2011) are the earliest located direct publisher of the complete 1/5.5 record.
        Järvi et al. (2014) explicitly reuse the earlier source set, while Ward et al. evaluate seasonal
        timing without publishing these bounds as a new SE England fit.
    place:
      conclusion: curation_required
      evidence_ids:
