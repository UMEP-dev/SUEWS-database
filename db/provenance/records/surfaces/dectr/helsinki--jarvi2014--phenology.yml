    - parameters.lai.gdd_full
    - parameters.lai.sdd_full
    locators:
    - kind: table
      label: Table 4(b), overall area parameter values and caption
      page: 1701
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: Repeats TBaseGDD 5 degrees C, GDD 300 and SDD -450 and states that unfootnoted values come
        from Järvi et al. (2011). These values have no site marker and are one shared overall-area set.
  scientific_note: The safe provenance correction separates the three unchanged Järvi et al. (2011)
    options from the one value first found at its stored precision in Järvi et al. (2014). The 2014
    paper prints TBaseSDD 10 degrees C but simultaneously attributes unfootnoted Table 4 values to the
    2011 paper, which prints 11 degrees C. That contradiction is the sole remaining curation question.
    The record retains 10 and its stable migrated identity until a curator decides which published version
    should govern. Generic place and representativeness describe shared run options rather than Helsinki
    evidence, while land_cover reflects their application to each vegetation type.
