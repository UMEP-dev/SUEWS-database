  findings:
    name:
      conclusion: supported
      evidence_ids:
      - jarvi2011-phenology
      - jarvi2014-tbase-sdd
      note: Deciduous Tree matches the land_cover.dectr vegetation type to which both papers apply the
        phenology controls.
    target:
      conclusion: supported
      evidence_ids:
      - jarvi2011-phenology
      - jarvi2014-tbase-sdd
      note: The equations apply growing- and senescence-degree-day controls to the daily leaf area index
        of each vegetation surface type.
    values:
      conclusion: curation_required
      evidence_ids:
      - jarvi2011-phenology
      - jarvi2014-tbase-sdd
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/990
      note: Järvi et al. (2011) directly publish TBaseGDD 5 degrees C, GDD 300 and SDD -450, but publish
        TBaseSDD 11 degrees C. Järvi et al. (2014) publish the stored TBaseSDD 10 degrees C while their
        Table 4 caption says unfootnoted values come from the 2011 paper. A curator must decide whether
        10 is an intentional cold-climate choice or a table or caption error; no parameter value is changed
        here.
    source:
      conclusion: supported
      evidence_ids:
      - jarvi2011-phenology
      - jarvi2014-tbase-sdd
      - jarvi2014-compilation
      note: Parameter-level overrides identify Järvi et al. (2011) as the original exact publication
        for base_temperature, gdd_full and sdd_full. Järvi et al. (2014) remains the parameter source
        for the stored base_temperature_senescence value 10 and is a later compilation for the other
        three leaves.
    place:
      conclusion: supported
      evidence_ids:
      - jarvi2011-phenology
      - jarvi2014-compilation
      note: Generic describes shared model-run options rather than a determination made for Helsinki.
        Järvi et al. (2011) list the values as general run options, and Järvi et al. (2014) place them
        in the overall-area table without a site qualifier.
    representativeness:
      conclusion: supported
      evidence_ids:
      - jarvi2011-phenology
      - jarvi2014-compilation
      note: The sources use one shared option set rather than establishing city-wide Helsinki evidence,
        so generic avoids the former unsupported city reach.
    applicable_scale:
      conclusion: supported
      evidence_ids:
      - jarvi2011-phenology
      - jarvi2014-tbase-sdd
      note: Both LAI equations apply the controls to vegetation surface type i, establishing land_cover
        scale even though one numeric set is shared between the vegetation classes.
    method:
      conclusion: supported
      evidence_ids:
      - jarvi2011-phenology
      - jarvi2014-tbase-sdd
      note: Both tables publish model options, and neither documents a fit that yields these four exact
        thresholds. Assumed records their role as model choices without claiming an unsupported measurement
        or optimization.
    identity:
      conclusion: supported
      evidence_ids:
      - jarvi2014-tbase-sdd
      note: Stable path, origin and legacy ID preserve the migrated Helsinki application row. The same
        overall option set is mapped to deciduous, evergreen and grass targets, so the matching sibling
        tuples are not independent determinations.
      related_records:
      - records/surfaces/evetr/helsinki--jarvi2014--phenology
      - records/surfaces/grass/helsinki--jarvi2014--phenology
