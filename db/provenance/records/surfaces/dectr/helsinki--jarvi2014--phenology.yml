      url: https://doi.org/10.1016/j.jhydrol.2011.10.001
      note: Defines daily LAI for vegetation type i using growing and senescence degree days and their
        base temperatures.
    - kind: table
      label: Table 2(b), general model run options
      page: 223
      url: https://doi.org/10.1016/j.jhydrol.2011.10.001
      note: Directly publishes TBaseGDD 5 degrees C, GDD 300 and SDD -450. It publishes TBaseSDD 11
        degrees C, so it does not support the stored value 10 for that leaf.
  - id: jarvi2014-tbase-sdd
    source: jarvi2014
    role: parameter_source
    parameter_paths:
    - parameters.lai.base_temperature_senescence
    locators:
    - kind: table
      label: Table 4(b), overall area parameter values
      page: 1701
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: Directly publishes the stored TBaseSDD 10 degrees C. The value has no footnote even though
        the caption says unfootnoted values come from Järvi et al. (2011), whose Table 2(b) instead gives
        11 degrees C.
    - kind: section
      label: Appendix A, Leaf area index
      page: 1707
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: Applies TBaseSDD within the revised cold-climate LAI equation but explains changes to other
