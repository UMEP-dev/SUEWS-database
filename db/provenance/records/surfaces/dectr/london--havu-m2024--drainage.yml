  scientific_note: 'The active record is a generic deciduous-tree literature tuple. Breuer et al. provide
    the 0.8 mm deciduous median. Calder and Wright originally fit D0 = 0.013 and b = 1.71 to Sitka-spruce
    canopy data; Grimmond and Oke explicitly transfer those coefficients to deciduous vegetation and
    define 0.8 mm as the in-leaf storage capacity. Järvi compile the complete deciduous SUEWS tuple, and
    Havu later apply it in Helsinki. Järvi''s b-row footnote to Grimmond et al. (1986) is unsupported.
    The stable path and origin retain migration lineage; no value, source key, target or legacy identity changed.'
