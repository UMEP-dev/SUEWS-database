  evidence:
  - id: breuer-table-7
    source: breuer2003
    role: parameter_source
    locators:
    - kind: table
      label: Table 7, deciduous forest interception capacity
      page: 286
      url: https://doi.org/10.1016/S0304-3800(03)00274-6
      note: Reports Ic = 0.8 mm as the median of 30 deciduous-forest values; this is the exact upper
        storage value carried by the record, not a London or Havu measurement.
  - id: calder-wright-fit
    source: calder1986
    role: parameter_source
    locators:
    - kind: equation
      label: Accepted manuscript Appendix 1, abstract and Eqs. 9 and 13
      url: https://nora.nerc.ac.uk/id/eprint/13072/1/N013072CR.pdf
      note: Fits D = 0.013(exp(1.71 C) - 1) mm h-1 to Sitka-spruce canopy-storage measurements. This
        is the original source of both coefficients, not a deciduous measurement; the later deciduous
        assignment is located separately.
  - id: grimmond-oke-adoption
    source: grimmond1991a
    role: compilation
    locators:
    - kind: section
      label: Sections 3.6 and 3.7, Drainage and Storage Capacity
      page: 1744
      url: https://doi.org/10.1029/91WR00557
      note: Defines the exponential vegetation drainage equation, points its coefficients upstream to
        Calder and Wright, and describes storage capacity as literature-based and seasonally variable
        for deciduous vegetation.
    - kind: table
      label: Table 2 and following storage-capacity text, Deciduous column
      page: 1745
      url: https://doi.org/10.1029/91WR00557
      note: Assigns D0 = 0.013 and b = 1.71 to deciduous vegetation and states 0.3 mm when leafless and
        0.8 mm when in leaf, explicitly establishing the stored upper value and cross-surface coefficient transfer.
  - id: jarvi-table-2
    source: jarvi2011
    role: parameter_source
    locators:
    - kind: table
      label: Table 2(a), Deciduous Trees column
      page: 223
      url: https://doi.org/10.1016/j.jhydrol.2011.10.001
      note: Compiles Si = 0.3-0.8 mm, D0 = 0.013 and b = 1.71 for deciduous trees. Its storage footnote
        points to Breuer and its D0 footnote to Grimmond and Oke (1991), but the b-row footnote to Grimmond
        et al. (1986) is contradicted by that paper's full text; Calder and Wright fitted b with D0.
    - kind: equation
      label: Equation 18, unirrigated vegetation drainage
      page: 224
      url: https://doi.org/10.1016/j.jhydrol.2011.10.001
      note: Defines the exponential drainage form used by the equation selector and states that maximum
        rates and coefficients come from the literature.
  - id: havu-archive
    source: havu-m2024
    role: compilation
    locators:
    - kind: dataset
      label: Input_rcp.zip/Input_rcp/SUEWS_Veg.txt, rows 831–834
      url: https://doi.org/10.5281/zenodo.10572180
      note: The Helsinki forest, street and two park deciduous rows each carry WetThreshold 0.8, DrainageEq
        3, DrainageCoef1 0.013 and DrainageCoef2 1.71, demonstrating later Helsinki application rather
        than original parameter derivation.
