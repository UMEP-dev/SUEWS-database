      note: The three AnOHM fields are stored on the DecTree surface row and therefore belong to land_cover.dectr.
    values:
      conclusion: supported
      evidence_ids:
      - v2017a-dectr-row
      - earlier-anohm-dectr-row
      - published-anohm-values
