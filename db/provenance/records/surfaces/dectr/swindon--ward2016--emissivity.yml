  scientific_note: >-
    Ward et al. (2016) is a later UK application table, and Järvi et al. (2011) is itself a compilation
    for this value: its Table 2 footnote f cites Oke (1987). Oke Table 1.1 directly gives 0.98 for leafed
    deciduous forest, making Oke the earliest checked publication that states the exact value. Oke records
    Sellers (1965), List (1966), Paterson (1969), and Monteith (1973) as collective table sources, without
    assigning the leafed-deciduous cell to one of them; that unresolved primary-data chain is documented,
    not invented. The record therefore cites the directly readable Oke table as literature evidence and
    has generic active scope; its stable path, historical Swindon origin, legacy ID and value remain unchanged.
