  findings:
    name:
      conclusion: supported
      evidence_ids:
      - jarvi-appendix-a
      - suews2020a-laieq
      note: The label identifies the deciduous-tree UK application of the Järvi LAI-power formulation;
        the official documentation identifies its selector as LAIEq 1.
    target:
      conclusion: supported
      evidence_ids:
      - jarvi-appendix-a
      - suews2016a-uk-rows
      note: The Järvi formulation is published for vegetated SUEWS surfaces, and the v2016a application
        table assigns this exact tuple to the London and Swindon deciduous-tree rows.
    values:
      conclusion: supported
      evidence_ids:
      - jarvi-appendix-a
      - suews2020a-laieq
      - suews2016a-uk-rows
      note: Appendix A publishes all four power coefficients, the official documentation identifies
        selector 1, and the v2016a rows preserve the complete five-field tuple for both UK sites.
    source:
      conclusion: supported
      evidence_ids:
      - jarvi-appendix-a
      - suews2020a-laieq
      note: Järvi et al. are the original source of the four fitted coefficients. The selector is separately
        attributed to the official SUEWS documentation rather than being folded into the paper citation.
    place:
      conclusion: supported
      evidence_ids:
      - suews2016a-uk-rows
      - ward2016-uk-application
      note: The SE England envelope records the exact London and Swindon application preserved by v2016a
        and evaluated by Ward et al.; it does not claim the coefficients were derived regionally.
    representativeness:
      conclusion: supported
      evidence_ids:
      - ward2016-uk-application
      note: Ward et al. evaluate the formulation at the two neighbourhood-scale study sites, so site
        is the supported application reach; regional determination is not established.
    applicable_scale:
      conclusion: supported
      evidence_ids:
      - jarvi-appendix-a
      note: Equation A1 defines LAI for surface type i, so the coefficients describe a SUEWS land-cover
        class rather than a whole neighbourhood or individual specimen.
    method:
      conclusion: supported
      evidence_ids:
      - jarvi-appendix-a
      note: Järvi et al. changed the coefficients after comparing simulated leaf-on and leaf-off timing
        with visual surveys, explicitly noting that no direct LAI measurements were available; fitted
        records this calibration-like origin.
    identity:
      conclusion: supported
      evidence_ids:
      - jarvi-appendix-a
      - suews2016a-uk-rows
      note: The stable path and legacy ID retain the UK deciduous-tree application identity while the
        split selector provenance preserves the source-coherent scientific tuple.
