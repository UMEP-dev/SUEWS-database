  findings:
    name:
      conclusion: supported
      evidence_ids:
      - zheng-parameter-publication
      - zheng-model-archive
      note: Table 3 states that every vegetation type uses the same LAI parameters within one case, and
        the archived Veg code 992 carries LAIEq 0, which is what the LaiEq = 0 part of the name records.
    target:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Veg code 992 is the deciduous row of the modelled Beijing grid.
    values:
      conclusion: correction_required
      evidence_ids:
      - zheng-parameter-publication
      - zheng-model-archive
      note: 'Three of the four coefficients match the source exactly: Table 3 gives w1,GDD = -1.42, w2,GDD
        = 0.00258 and w1,SDD = 2.0 for the LAI and gs_LAI cases, and the record stores those. The fourth
        does not. The record stores senescence_sdd = 0.001, while Table 3 gives w2,SDD = 0.0001 for those
        cases and 0.0015 for the base case, and the archived Veg code 992 gives LeafOffPower2 = 0.0001.
        The stored value matches neither case and is an order of magnitude above the optimised one.'
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/323
    source:
      conclusion: supported
      evidence_ids:
      - zheng-parameter-publication
      note: 'Zheng et al. is the parameter publication for the optimised coefficients: Appendix A sets
        out the CMA-ES workflow and Table 3 publishes the result.'
    place:
      conclusion: supported
      evidence_ids:
      - zheng-parameter-publication
      note: The LAI series and the modelling domain are both in Beijing.
    representativeness:
      conclusion: correction_required
      evidence_ids:
      - zheng-parameter-publication
      - zheng-domain
      note: The record claims city representativeness. Appendix A fits the coefficients to a six-year
        (2011-2016) Landsat 7 ETM+ LAI series for one park near the IAP tower, and Sect. 3 states that
        the modelled domain is a 1 km circle around that tower. The paper establishes neither city-wide
        sampling nor a city-wide domain.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/325
    method:
      conclusion: supported
      evidence_ids:
      - zheng-parameter-publication
      note: Appendix A describes a covariance matrix adaptation evolution strategy fit of the LAI sub-model
        to the interpolated satellite LAI series.
    identity:
      conclusion: supported
      evidence_ids:
      - zheng-parameter-publication
      note: 'This record holds the same four coefficients as its two sibling records, which is what the
        source prescribes rather than an accidental duplication: Table 3 states that all vegetation types
        use the same LAI parameters within one case, and the archived Veg rows 991, 992 and 993 repeat
        them.'
      related_records:
      - records/surfaces/evetr/beijing--zheng-y2023--lai-power
      - records/surfaces/grass/beijing--zheng-y2023--lai-power
