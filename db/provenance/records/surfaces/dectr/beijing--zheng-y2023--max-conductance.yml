  scientific_note: 'Appendix E states the purpose of these values plainly: "Here, we seek values that
    can represent the overall vegetation over the urban area in Beijing, and therefore the average is
    taken from different species." The species population ratios come from a field survey over Beijing
    (Ma et al., 2019), so the city label is the paper''s own claim rather than an inference. Zheng et
    al. compile published species-level conductances and average them; the underlying measurements are
    other authors'' and are not registry sources here, so the assessment records the method as literature
    rather than asserting an in-database derivation.'
