    kind: agent
    name: provenance-audit
    version: '1.0'
  findings:
    name:
      conclusion: supported
      evidence_ids:
      - havu-viikki-soil
      - zheng-model-archive
      note: Havu et al. derive the distinctive soil depth and storage capacity for their two Viikki street-tree
        sites, and Zheng's archive labels the complete reused row Viikki, Street trees.
    target:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: A SUEWS_Soil row shared by the vegetated surfaces, which is the common target.
    values:
      conclusion: supported
      evidence_ids:
      - havu-viikki-soil
      - zheng-model-archive
      - zheng-article
      note: 'Code 72 of SUEWS_Soil.txt carries SoilDepth 1000, SoilStoreCap 141, SatHydraulicCond 5.00E-04,
        SoilDensity 1.16 and InfiltrationRate 10, which is the record exactly, and the Beijing Veg rows
        991, 992 and 993 all point at it. Havu et al. publish the 1 m street-tree soil depth and state
        that the exact 0.141 m storage capacity was calculated from laboratory measurements; Zheng Table
        2 republishes the 1000 mm tree soil depth. Worth flagging
        for the maintainer: Table 2 lists 349 mm for grass and lawn, while the released run applies the
        1000 mm row to the grass surface as well, so the record follows the archive rather than the table.'
    source:
      conclusion: correction_required
      evidence_ids:
      - havu-viikki-soil
      - zheng-article
      - zheng-model-archive
      note: Havu et al. directly publish the Viikki depth and storage capacity, while Zheng's archive is
        the only located source for the complete five-field row. Changing the single source field to Havu
        would wrongly attribute the carried hydraulic conductivity, density and infiltration rate to that
        paper, so the complete lineage remains unresolved under the current schema.
    place:
      conclusion: supported
      evidence_ids:
      - havu-viikki-soil
      - zheng-model-archive
      note: The original study locates both street-tree sites in Viikki, Helsinki; Beijing is retained
        as the later application origin on the stable path.
    representativeness:
      conclusion: supported
      evidence_ids:
      - havu-viikki-soil
      - zheng-model-archive
      note: The depth and storage capacity were determined for two constructed street-tree sites in Viikki,
        so site scale is the supported scope rather than either Helsinki-wide or Beijing city evidence.
    method:
      conclusion: curation_required
      evidence_ids:
      - zheng-model-archive
      note: A reused parameter row rather than an independent determination; the production method belongs
        to the study that characterised the Viikki soil.
    identity:
      conclusion: curation_required
      evidence_ids:
      - zheng-model-archive
      note: The four stored parameters and the whole legacy block are identical to records/surfaces/common/helsinki--havu-m2024--soil--mixed-street-trees.
        Whether the database keeps a separate application record, aliases it, or merges the two is a maintainer
        decision.
      related_records:
      - records/surfaces/common/helsinki--havu-m2024--soil--mixed-street-trees
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/333
  evidence:
  - id: havu-viikki-soil
    source: havu2022
    role: input_data
    locators:
    - kind: section
      label: Sect. 2.1, Site description
      page: 2123
      url: https://doi.org/10.5194/bg-19-2121-2022
      note: Identifies two street-tree study sites in Viikki, Helsinki, and describes their 1 m-deep constructed
        structural soils.
    - kind: table
      label: Table 2, SUEWS street-tree parameters
      page: 2127
      url: https://doi.org/10.5194/bg-19-2121-2022
      note: Gives 1.00 m soil depth and 0.14 m water-storage capacity for both Tilia and Alnus sites; the
        following paragraph states the unrounded storage capacity as 0.141 m calculated from laboratory
        measurements.
    note: This is the earliest located direct publication of the distinctive SUEWS depth and storage-capacity
      pair; Riikonen et al. (2011) supplied the underlying site and laboratory information rather than
      publishing this complete SUEWS row.
  - id: zheng-model-archive
    source: zheng-y2023
    role: compilation
    locators:
    - kind: dataset
      label: ModelRuns/Input/SUEWS_Soil.txt, code 72
      url: https://doi.org/10.5281/zenodo.8012194
      note: Carries 1000, 141, 5.00E-04, 1.16 and 10, and is commented Viikki, Street trees.
    - kind: dataset
      label: ModelRuns/Input/SUEWS_Veg.txt, code 991, 992 and 993, columns SoilTypeCode
      url: https://doi.org/10.5281/zenodo.8012194
      note: All three Beijing vegetated rows point at soil code 72.
    - kind: dataset
      label: ModelRuns/Input/SUEWS_SiteSelect.txt, Beijing grid 1 (2015 and 2016)
      url: https://doi.org/10.5281/zenodo.8012194
      note: Assigns Code_EveTr 991, Code_DecTr 992, Code_Grass 993 and IrrigationCode 5 to the modelled
        Beijing grid, so those rows are the ones the published runs used.
  - id: zheng-article
    source: zheng-y2023
    role: compilation
    locators:
    - kind: table
      label: Table 2, SUEWS biogenic model parameters, soil depth row
      page: 4559
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: Gives 1000 mm for trees and 349 mm for grass and lawn, credited to Havu et al. (2022a) and
        Kokkonen et al. (2019). The storage capacity, hydraulic conductivity and density are not published
        anywhere in the article or its supplement.
  - id: zheng-domain
    source: zheng-y2023
    role: compilation
    locators:
    - kind: section
      label: Sect. 3, Study site and measurements
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: The model domain is a 1 km circle around the IAP tower, covering roughly 80 % of the accumulated
        flux footprint; no city-wide domain is modelled.
  scientific_note: 'The numbers are exactly what the released Beijing run used. Havu et al. directly
    publish the 1 m / 0.141 m pair for two Viikki street-tree sites, which settles the active name, Helsinki
    place and site representativeness. The complete row''s provenance is not settled: Zheng carries three
    other SUEWS properties that Havu does not publish, so the one-source record schema cannot credit Havu
    without over-attributing those values. The row also remains byte-identical to records/surfaces/common/helsinki--havu-m2024--soil--mixed-street-trees;
    issue 333 separately tracks whether both records should exist.'
