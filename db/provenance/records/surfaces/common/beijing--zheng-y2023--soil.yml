  scientific_note: 'The numbers are exactly what the released Beijing run used. Havu et al. publish the
    1 m depth and calculated 0.141 m storage capacity for two Viikki street-tree sites, while the independently
    released Havu input row supplies the exact hydraulic conductivity and density. Parameter-level provenance
    records those roles without over-attributing the complete row to one source. The exact duplicate remains
    intentional configuration reuse, not a second parameter determination: the Zheng archive applies code
    72 in the Beijing model, while the Havu archive selects the matching code-72 tuple for its distinct Helsinki
    street-tree surfaces. Retaining both stable records preserves those separate configuration lineages while
    the related-record link makes their shared tuple explicit. No path, origin, legacy lineage or value is changed.'
