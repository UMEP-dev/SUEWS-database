      label: Zenodo Input_met.zip/Input_met/SUEWS_Soil.txt, code 72
      url: https://doi.org/10.5281/zenodo.10572180
      note: Stores the matching executable tuple 1000, 141, 0.0005, 1.16 and 10 as the Helsinki Viikki
        street-tree soil.
    - kind: dataset
