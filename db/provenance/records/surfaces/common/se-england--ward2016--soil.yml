  findings:
    name:
      conclusion: supported
      evidence_ids:
      - ward-soil-assumption
      note: Ward et al. describe one soil-property set beneath every surface in their two UK
        applications, which supports the common-surface record name.
    target:
      conclusion: supported
      evidence_ids:
      - ward-soil-assumption
      note: Ward et al. explicitly apply the same depth and capacity to the soil stores beneath
        each surface, supporting the shared land_cover.common target.
    values:
      conclusion: supported
      evidence_ids:
      - ward-soil-assumption
      - berthier-reze-ksat
      - jarvi-ksat-compilation
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/139
      note: Ward et al. state soil depth 350 mm and maximum moisture capacity 150 mm. Berthier
        et al. publish saturated hydraulic conductivity 5.0 x 10^-7 m s^-1, exactly 0.0005 mm
        s^-1, and Järvi et al. carry the same value into the SUEWS parameter table. No value is changed.
    source:
      conclusion: supported
      evidence_ids:
      - ward-soil-assumption
      - berthier-reze-ksat
      - jarvi-ksat-compilation
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/139
      note: Ward remains the source for depth and capacity. The field-level override now cites
        Berthier 2006, the original publication of the conductivity value, while Järvi 2011 is
        recorded only as the later SUEWS compilation that explicitly attributes it to Berthier.
    place:
      conclusion: supported
      evidence_ids:
      - ward-soil-assumption
      - berthier-reze-ksat
      note: Ward supports the SE England application envelope for depth and capacity. Berthier
        identifies the conductivity parameter with the 4.7 ha Rezé suburban site in France,
        supporting the field-level place override.
    representativeness:
      conclusion: supported
      evidence_ids:
      - ward-soil-assumption
      - berthier-reze-ksat
      note: Ward uses the assumed depth and capacity at two UK sites, supporting the regional
        envelope. Berthier reports the conductivity in the base run for one Rezé site, so that
        leaf is scoped to site rather than SE England.
    method:
      conclusion: supported
      evidence_ids:
      - ward-soil-assumption
      - berthier-reze-ksat
      - jarvi-ksat-compilation
      note: Ward explicitly calls the shared depth and capacity assumptions. The conductivity is
        adopted unchanged from a published model-input table through the Järvi SUEWS compilation,
        supporting the literature method override for that leaf.
    identity:
      conclusion: supported
      evidence_ids:
      - ward-soil-assumption
      - jarvi-ksat-compilation
      note: The stable path and legacy ID preserve the migrated shared-soil tuple; field-level
        provenance changes neither its values nor its record identity.
  evidence:
  - id: ward-soil-assumption
    source: ward2016
    role: parameter_source
    parameter_paths:
    - parameters.soil_depth
    - parameters.soil_store_capacity
    locators:
    - kind: section
      label: Section 3.2, Model setup
      page: 6
      url: https://doi.org/10.1016/j.uclim.2016.05.001
      note: States that, without detailed information, the same soil properties were assumed
        beneath each surface, with soil-layer depth 350 mm and maximum moisture capacity 150 mm,
        for the Swindon and London applications.
  - id: berthier-reze-ksat
    source: berthier2006
    role: parameter_source
    parameter_paths:
    - parameters.saturated_hydraulic_conductivity
    locators:
    - kind: table
      label: Table 1, parameter values used in the model base runs
      page: 640
      url: https://doi.org/10.1016/j.jhydrol.2006.01.007
      note: Publishes UHE soil saturated hydraulic conductivity Ks as 5.0 x 10^-7 m s^-1;
        multiplying by 1000 converts it exactly to the stored 0.0005 mm s^-1.
    - kind: section
      label: Section 3, Application of the models above the Rezé site
      page: 638
      url: https://doi.org/10.1016/j.jhydrol.2006.01.007
      note: Describes the model application to a 4.7 ha suburban catchment at Rezé, France.
  - id: jarvi-ksat-compilation
    source: jarvi2011
    role: compilation
    parameter_paths:
    - parameters.saturated_hydraulic_conductivity
    locators:
    - kind: table
      label: Table 2b, general model run options
      page: 223
      url: https://doi.org/10.1016/j.jhydrol.2011.10.001
      note: Carries saturated hydraulic conductivity 0.0005 mm s^-1 into the SUEWS parameter
        table and attributes the value by footnote to Berthier et al. (2006).
  scientific_note: The SUEWS record combines two explicit Ward et al. UK soil-store assumptions
    with a hydraulic-conductivity value transmitted through Järvi et al. (2011). Following that
    paper's own footnote to the original source shows that Berthier et al. (2006), not Järvi or Ward,
    directly publish the exact conductivity value. Parameter-level provenance now preserves that
    original citation and its Rezé site scope without altering the migrated tuple.
