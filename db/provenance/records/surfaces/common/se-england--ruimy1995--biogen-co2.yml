  evidence:
  - id: ruimy-grouped-fit
    source: ruimy1995
    role: parameter_source
    parameter_paths:
    - parameters.alpha_bio_co2
    - parameters.beta_bio_co2
    locators:
    - kind: table
      label: Table 2.1, instantaneous all-data-set rectangular-hyperbola fit
      page: 24
      url: https://doi.org/10.1016/S0065-2504(08)60063-X
      note: For 1,362 observations across the complete grouped closed-canopy dataset, the table gives
        F-infinity 43.35, apparent quantum yield alpha 0.044 and dark-respiration intercept 4.29.
    - kind: equation
      label: Eq. 29, complete instantaneous closed-canopy dataset
      page: 37
      url: https://doi.org/10.1016/S0065-2504(08)60063-X
      note: Publishes the rectangular-hyperbola numerator and denominator with alpha 0.044 and
        saturation parameter 43.35; the separate fitted intercept is 4.29 and is not the stored
        temperature-response pair.
  - id: schmid-respiration
    source: schmid2000
    role: parameter_source
    parameter_paths:
    - parameters.resp_a
    - parameters.resp_b
    locators:
    - kind: equation
      label: Eq. 5, ecosystem respiration versus soil temperature
      page: 369
      url: https://doi.org/10.1016/S0168-1923(00)00140-4
      note: Publishes RE = 1.08 exp(0.064 Ts), the exact respiration pair mechanically reused in this
        compiled plant-canopy tuple.
  - id: schmid-site
    source: schmid2000
    role: validation
    locators:
    - kind: section
      label: Sect. 2, Site and instrumentation
      page: 358
      url: https://doi.org/10.1016/S0168-1923(00)00140-4
      note: Locates the respiration fit at the Morgan-Monroe State Forest tower in south-central Indiana.
  - id: jarvi-winter-floor
    source: jarvi2019
    role: parameter_source
    parameter_paths:
    - parameters.min_res_bioco2
    locators:
    - kind: equation
      label: Eq. 11, soil and vegetation respiration
      page: 8366
      url: https://doi.org/10.1029/2018JD029576
      note: Defines respiration as max(a_i exp(Tair b_i), 0.6) for each vegetated surface.
    - kind: section
      label: Appendix B, Estimating Minimum Soil Respiration
      page: 8379
      url: https://doi.org/10.1029/2018JD029576
      note: Reports the 0.60 minimum from chamber observations in a southern Finland boreal forest.
  - id: migration-row-30240007
    source: umep-dev2025-database
    role: compilation
    locators:
    - kind: dataset
      label: database.xlsx, Biogen CO2 sheet, row ID 30240007
      url: https://github.com/UMEP-dev/SUEWS-database/blob/746dcd5cc45044488d412c6a21b8bd4c021fd6f5/database.xlsx
      note: Carries Plant canopies, origin UK, SE England, alpha 0.044, beta 43.35, resp_a 1.08,
        resp_b 0.064, min_respi 0.6, three -999 inactive fields and Ref 90240043 in one compiled row.
  scientific_note: >-
    The stored tuple is traceable but is not one publication's result. Ruimy et al. supply the generic
    closed-canopy light-response fit; Schmid et al. supply the temperature-response pair from an Indiana
    hardwood forest; Järvi et al. later supply the 0.6 winter floor from Finnish chamber observations;
    and the pre-migration workbook combines them. Field-level provenance now preserves those roles
    without changing any value, raw legacy origin, stable path or legacy identity. The former south-east
    England evidence scope was a workbook attribution, not a claim supported by Ruimy et al.
