  findings:
    name:
      conclusion: supported
      evidence_ids:
      - schmid-site
      - migration-row-30240008
      note: Schmid et al. study a mixed secondary-successional broadleaf forest, and the migrated row
        preserves the name Mixed Hardwood Forest.
    target:
      conclusion: supported
      evidence_ids:
      - schmid-fits
      - migration-row-30240008
      note: The article derives ecosystem photosynthesis and respiration terms for vegetation, while
        the migrated row explicitly classifies the tuple as All vegetation, represented by land_cover.common.
    values:
      conclusion: supported
      evidence_ids:
      - schmid-fits
      - jarvi-winter-floor
      - migration-row-30240008
      note: Schmid Eq. (5) directly gives resp_a 1.08 and resp_b 0.064. Eq. (6) directly gives the
        light-saturated maximum beta 35 and the half-saturation constant 590; 35 / 590 = 0.059322,
        which rounds to stored alpha 0.0593. Järvi Eq. (11) and Appendix B publish the later minimum
        respiration floor 0.60. The pre-migration row is the exact stored five-value compilation.
    source:
      conclusion: supported
      evidence_ids:
      - schmid-fits
      - jarvi-winter-floor
      - migration-row-30240008
      note: Schmid is the effective source for alpha, beta, resp_a and resp_b. The parameter-level
        override identifies Järvi et al. as the distinct source for min_res_bioco2 and records its
        Finnish site evidence, while the workbook remains compilation lineage rather than a parameter
        publication.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/372
    place:
      conclusion: supported
      evidence_ids:
      - schmid-site
      - jarvi-winter-floor
      note: The paper locates the flux site in Morgan-Monroe State Forest, south-central Indiana, at
        39 degrees 19 minutes N and 86 degrees 25 minutes W, matching the record-level place. Järvi
        Appendix B locates the separate min_res_bioco2 evidence in a Southern Finland boreal forest,
        supporting its Finland override without implying Morgan-Monroe provenance.
    representativeness:
      conclusion: supported
      evidence_ids:
      - schmid-site
      - jarvi-winter-floor
      note: The Schmid coefficients come from one flux-tower site and the Järvi floor from one chamber
        site. Site is therefore the supported evidence reach for both the envelope and the overridden leaf.
    method:
      conclusion: supported
      evidence_ids:
      - schmid-fits
      - jarvi-winter-floor
      - migration-row-30240008
      note: The record-level fitted method applies to beta, resp_a and resp_b. The alpha override records
        its algebraic calculation from Schmid Eq. (6), and the min_res_bioco2 override records the later
        measured Finnish chamber statistic published by Järvi et al.
    identity:
      conclusion: supported
      evidence_ids:
      - migration-row-30240008
      note: Biogen CO2 row 30240008 preserves the exact name, origin, five active values, three -999
        legacy sentinels and reference ID 90240042. The stable path and legacy_id retain that identity;
        the -999 theta, alpha_enh and beta_enh entries are unavailable legacy fields, not sourced
        scientific values.
  evidence:
  - id: schmid-site
    source: schmid2000
    role: validation
    locators:
    - kind: section
      label: Sect. 2, Site and instrumentation
      page: 358
      url: https://doi.org/10.1016/S0168-1923(00)00140-4
      note: Locates the Morgan-Monroe State Forest tower at 39 degrees 19 minutes N, 86 degrees 25
        minutes W in an extensive secondary-successional broadleaf forest, with minimum fetch 4 km.
  - id: schmid-fits
    source: schmid2000
    role: parameter_source
    parameter_paths:
    - parameters.alpha_bio_co2
    - parameters.beta_bio_co2
    - parameters.resp_a
    - parameters.resp_b
    locators:
    - kind: equation
      label: Eq. (5), ecosystem respiration versus soil temperature
      page: 369
      url: https://doi.org/10.1016/S0168-1923(00)00140-4
      note: Publishes RE = 1.08 exp(0.064 Ts), with flux in micromol m-2 s-1 and Ts in degrees C.
    - kind: equation
      label: Eq. (6), gross ecosystem production versus PPFD
      page: 370
      url: https://doi.org/10.1016/S0168-1923(00)00140-4
      note: Publishes GEP = -1.4 + 35 PPFD / (590 + PPFD). Thus beta is 35 and the initial slope
        of the saturating component is 35 / 590 = 0.059322, rounded to 0.0593.
  - id: jarvi-winter-floor
    source: jarvi2019
    role: parameter_source
    parameter_paths:
    - parameters.min_res_bioco2
    locators:
    - kind: equation
      label: Eq. (11), soil and vegetation respiration
      page: 8366
      url: https://doi.org/10.1029/2018JD029576
      note: Defines respiration as max(a_i exp(Tair b_i), 0.6) for each vegetated surface.
    - kind: section
      label: Appendix B, Estimating Minimum Soil Respiration
      page: 8379
      url: https://doi.org/10.1029/2018JD029576
      note: Reports a 0.60 +/- 0.07 micromol m-2 s-1 minimum from 1,677 half-hour observations during
        2009-2012 below -2 degrees C, measured by three automatic soil chambers in a Southern Finland
        boreal forest. Pumpanen et al. (2015) is cited for chamber methods, not for the 0.60 statistic.
  - id: migration-row-30240008
    source: umep-dev2025-database
    role: compilation
    locators:
    - kind: dataset
      label: database.xlsx, Biogen CO2 sheet, row ID 30240008
      url: https://github.com/UMEP-dev/SUEWS-database/blob/746dcd5cc45044488d412c6a21b8bd4c021fd6f5/database.xlsx
      note: Carries Mixed Hardwood Forest, origin Midwest America, alpha 0.0593, beta 35, resp_a 1.08,
        resp_b 0.064, min_respi 0.6, three -999 inactive fields and Ref 90240042 in one compiled row.
  scientific_note: >-
    The stored values are all traceable but have distinct provenance roles. Schmid et al. fit the forest
    light-response and respiration functions; alpha is calculated from their published beta and
    half-saturation constant; Järvi et al. later publish the 0.6 chamber-observation floor; and the
    pre-migration workbook combines them. Parameter-level provenance now preserves those roles without
    changing any value or stable identity and prevents the Finnish chamber statistic from inheriting
    the Morgan-Monroe place.
