    - kind: table
      label: Table 2, SUEWS biogenic model parameters used for all case runs
      page: 4559
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: Publishes Fpho,max, ai and bi with their credits; alpha and theta are absent from the article.
    - kind: equation
      label: Eq. (15), soil and vegetation respiration
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: States that 0.6 umol m-2 s-1 is the minimum respiration in winter time.
  - id: zheng-domain
    source: zheng-y2023
    role: compilation
    locators:
    - kind: section
      label: Sect. 3, Study site and measurements
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: The model domain is a 1 km circle around the IAP tower, covering roughly 80 % of the accumulated
        flux footprint; no city-wide domain is modelled.
  scientific_note: Every stored number is confirmed, and the article independently corroborates the respiration
    parameters and the minimum respiration. The problem is the label. The released archive names this
    row Helsinki - decid Viikki Tilia, Table 2 credits its published components to Havu et al. and Jarvi
    et al., and alpha and theta are not in the article at all. The record presents a Helsinki lime-tree
    fit, reused for both Beijing tree surfaces, as Beijing city evidence.
