  findings:
    name:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: The archived run assigns biogenic code 26 to both the evergreen and the deciduous surface,
        so a mixed-tree label describes how the row is used.
    target:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Veg code 991 and 992 of the modelled Beijing grid points at biogenic code 26.
    values:
      conclusion: supported
      evidence_ids:
      - havu-viikki-tree-fit
      - bellucco-helsinki-light-response
      - jarvi-finnish-minimum-respiration
      - zheng-model-archive
      - zheng-article
      note: 'Code 26 of SUEWS_BiogenCO2.txt carries alpha 0.031, beta 8.3463, theta 0.723, resp_a 0.78,
        resp_b 0.08 and min_respi 0.6, which is the record exactly, and Veg codes 991 and 992 point at
        it. Havu Table 2 publishes the exact beta and respiration coefficients for the Viikki Tilia site;
        Bellucco Table 4 publishes alpha and theta for the Helsinki local model; and Jarvi Eq. 11 documents
        the 0.6 minimum. Zheng Table 2 rounds beta to 8.4 while corroborating the respiration coefficients.'
    source:
      conclusion: supported
      evidence_ids:
      - havu-viikki-tree-fit
      - bellucco-helsinki-light-response
      - jarvi-finnish-minimum-respiration
      - zheng-article
      - zheng-model-archive
      note: Parameter-level provenance now assigns Havu et al. to the Viikki Tilia beta and respiration
        coefficients, Bellucco et al. to alpha and theta, and Jarvi et al. to the Finnish minimum respiration.
        Zheng et al. remain the record-envelope source because their archived run publishes the exact compiled
        tuple and applies it in Beijing.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/330
      - https://github.com/UMEP-dev/SUEWS-database/issues/1021
    place:
      conclusion: supported
      evidence_ids:
      - havu-viikki-tree-fit
      - zheng-article
      - zheng-model-archive
      note: The active place is now Helsinki. Havu et al. locate the Tilia study site in Viikki, Helsinki,
        and the Zheng archive labels this exact row Helsinki - decid Viikki Tilia. Beijing is retained
        only in the stable record path and origin lineage as the application that introduced the row.
    representativeness:
      conclusion: supported
      evidence_ids:
      - havu-viikki-tree-fit
      note: Site is the supported scope because Havu et al. fitted the beta and respiration coefficients
        for the single Viikki Tilia street-tree site; neither that fit nor the other Finnish inputs establishes
        city-wide representativeness.
    method:
      conclusion: supported
      evidence_ids:
      - havu-viikki-tree-fit
      - bellucco-helsinki-light-response
      - jarvi-finnish-minimum-respiration
      - zheng-article
      - zheng-model-archive
      note: The record-level literature method describes adoption of the published Zheng run configuration.
        Parameter overrides identify the Bellucco and Havu coefficients as fitted and the Jarvi respiration
        floor as an explicit model assumption based on winter soil-chamber observations.
    identity:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Biogenic code 26 is a distinct row in the archive and the stored tuple is distinct from the
        other Beijing biogenic record in the database.
  evidence:
  - id: havu-viikki-tree-fit
    source: havu2022
    role: parameter_source
    parameter_paths:
    - parameters.beta_bio_co2
    - parameters.resp_a
    - parameters.resp_b
    locators:
    - kind: section
      label: Sect. 2.1, Site description
      page: 2123
      url: https://doi.org/10.5194/bg-19-2121-2022
      note: Locates the Tilia street-tree site in Viikki, Helsinki.
    - kind: table
      label: Table 2, Tilia site SUEWS parameters
      page: 2127
      url: https://doi.org/10.5194/bg-19-2121-2022
      note: Publishes Fpho,max = 8.3463 and respiration coefficients a = 0.78 and b = 0.08 for the Tilia
        site.
  - id: bellucco-helsinki-light-response
    source: bellucco2017
    role: parameter_source
    parameter_paths:
    - parameters.alpha_bio_co2
    - parameters.theta_bio_co2
    locators:
    - kind: section
      label: Sect. 3.2 and Table 4, Helsinki local model
      page: 6
      url: https://doi.org/10.1016/j.agrformet.2016.12.011
      note: Publishes alpha = 0.031 and theta = 0.723 for the Helsinki botanical-garden wind sector,
        a different scope from the Viikki Tilia site.
  - id: jarvi-finnish-minimum-respiration
    source: jarvi2019
    role: parameter_source
    parameter_paths:
    - parameters.min_res_bioco2
    locators:
    - kind: equation
      label: Eq. 11 and accompanying text
      page: 5
      url: https://doi.org/10.1029/2018JD029576
      note: Sets the 0.6 umol m-2 s-1 floor from winter soil-chamber measurements in a boreal forest
        in central Finland, not at the Viikki Tilia site.
  - id: zheng-model-archive
    source: zheng-y2023
    role: compilation
    locators:
    - kind: dataset
      label: ModelRuns/Input/SUEWS_BiogenCO2.txt, code 26
      url: https://doi.org/10.5281/zenodo.8012194
      note: Carries the stored tuple and is commented Helsinki - decid Viikki Tilia.
    - kind: dataset
      label: ModelRuns/Input/SUEWS_Veg.txt, code 991 and 992, columns BiogenCO2Code
      url: https://doi.org/10.5281/zenodo.8012194
      note: Points the Beijing surfaces at biogenic code 26.
    - kind: dataset
      label: ModelRuns/Input/SUEWS_SiteSelect.txt, Beijing grid 1 (2015 and 2016)
      url: https://doi.org/10.5281/zenodo.8012194
      note: Assigns Code_EveTr 991, Code_DecTr 992, Code_Grass 993 and IrrigationCode 5 to the modelled
        Beijing grid, so those rows are the ones the published runs used.
  - id: zheng-article
    source: zheng-y2023
    role: compilation
    locators:
    - kind: table
      label: Table 2, SUEWS biogenic model parameters used for all case runs
      page: 4559
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: Publishes Fpho,max, ai and bi with their credits; alpha and theta are absent from the article.
    - kind: equation
      label: Eq. (15), soil and vegetation respiration
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: States that 0.6 umol m-2 s-1 is the minimum respiration in winter time.
  - id: zheng-domain
    source: zheng-y2023
    role: compilation
    locators:
    - kind: section
      label: Sect. 3, Study site and measurements
      page: 4554
      url: https://doi.org/10.5194/gmd-16-4551-2023
      note: The model domain is a 1 km circle around the IAP tower, covering roughly 80 % of the accumulated
        flux footprint; no city-wide domain is modelled.
  scientific_note: >-
    The active place and scope identify the strongest supported evidence location, the Viikki Tilia site
    in Helsinki, rather than the Beijing application. The stable Beijing path, origin lineage, target,
    values, envelope source and legacy identity remain unchanged. Parameter-level provenance now records
    the mixed tuple without overclaiming: Havu et al. publish the fitted beta and respiration coefficients
    for Viikki; Bellucco et al. publish the fitted alpha and theta for another Helsinki EC scope; Jarvi et
    al. set the 0.6 respiration floor from winter soil-chamber evidence; and Zheng et al. compile and apply
    the exact row in Beijing.
