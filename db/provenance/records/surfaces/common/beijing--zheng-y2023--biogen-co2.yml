    name: provenance-audit
    version: '1.0'
  findings:
    name:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: The archived run assigns biogenic code 26 to both the evergreen and the deciduous surface,
        so a mixed-tree label describes how the row is used.
    target:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Veg code 991 and 992 of the modelled Beijing grid points at biogenic code 26.
    values:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      - zheng-article
      note: 'Code 26 of SUEWS_BiogenCO2.txt carries alpha 0.031, beta 8.3463, theta 0.723, resp_a 0.78,
        resp_b 0.08 and min_respi 0.6, which is the record exactly, and Veg codes 991 and 992 point at
        it. The article corroborates part of that: Table 2 gives Fpho,max = 8.4 for trees and ai = 0.78,
        bi = 0.08, and Eq. (15) states that 0.6 umol m-2 s-1 is the minimum winter respiration. The stored
        beta carries four decimals where the table rounds to 8.4, and alpha and theta appear only in the
        archive.'
    source:
      conclusion: correction_required
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      note: Table 2 credits Fpho,max, ai and bi to Havu et al. (2022a) and Jarvi et al. (2019), and the
        archive comments the row Helsinki - decid Viikki Tilia. Zheng et al. apply the row rather than
        deriving it.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/330
    place:
      conclusion: correction_required
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      note: The archive names the row's origin as Viikki Tilia, a Helsinki deciduous site. Beijing is
        the application location.
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/330
    representativeness:
      conclusion: correction_required
      evidence_ids:
      - zheng-domain
      note: 'City representativeness for Beijing is unsupported: the parameters are Finnish in origin
        and the Beijing run covers a 1 km circle around the IAP tower rather than the city.'
      issue_urls:
      - https://github.com/UMEP-dev/SUEWS-database/issues/330
    method:
      conclusion: curation_required
      evidence_ids:
      - zheng-article
      - zheng-model-archive
      note: An inherited fit applied unchanged, so the production method belongs to the study that made
        it.
    identity:
      conclusion: supported
      evidence_ids:
      - zheng-model-archive
      note: Biogenic code 26 is a distinct row in the archive and the stored tuple is distinct from the
        other Beijing biogenic record in the database.
