  scientific_note: >-
    Ao et al. (2016) directly publish Building emissivity 0.91 for their Xujiahui SUEWS application and are
    therefore the checked publication that states the exact stored parameter. Their Table 2 cites Oke (1987),
    but Oke Table 8.2 offers material-specific values and ranges rather than this exact Building mapping. Keeping
    source ao2016 records the first directly located exact assertion; recording Oke as upstream input preserves
    the source chain without fabricating a cell-level derivation. No value, source, path, place, method or identity
    changes are required.
