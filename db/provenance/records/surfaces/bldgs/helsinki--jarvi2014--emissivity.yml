      note: The record now stores emis 0.95, which is what Table 4a gives in its Bldg column. It previously
        stored 0.91, the figure published for the Pav column, and its paired record held the reverse,
        so the two surfaces carried each other's emissivity. Column identity was verified by character
        position in a layout-preserving extraction, not read off a flattened dump.
    source:
