  scientific_note: Järvi et al. (2011) Table 2(a) is the earliest checked publication that states
    the exact 0.95 as the SUEWS Building-class emissivity. Oke (1987) Table 8.2 is its explicitly
    cited upstream literature and gives approximately 0.95 for the average mid-latitude urban area,
    but the SUEWS surface-class mapping is made by Järvi et al. The canonical source is therefore
    jarvi2011, while the sidecar retains the Oke lineage. Järvi et al. (2014) later repeat the value.
    The record now describes a generic land-cover literature parameter while preserving its stable
    path, origin and legacy identity. No value changes.
