  scientific_note: 'Table 4a gives 0.95 in its Bldg column and this record now stores it. It previously
    stored 0.91, the value published for the Pav column, while its paired record held the reverse: the
    two emissivities were transposed. Both are plausible urban values, which is exactly why the swap survived
    casual reading, and why it was corrected on the strength of the table rather than of any single reading
    of it. Column alignment was verified by character position, because a flattened extraction of a seven-column
    table cannot be trusted for it. What remains open is provenance rather than value: the Table 4 caption
    makes every unfootnoted cell an inherited value, so the citation names a compiler, and the record
    still claims city representativeness for a study whose footprints are 1 km circles.'
