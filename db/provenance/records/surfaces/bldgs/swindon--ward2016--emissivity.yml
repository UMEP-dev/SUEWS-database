  scientific_note: Ward et al. Table 2 is the exact publication-level source for the stored Building
    0.91 input and therefore remains canonical. The same table says its UK emissivities came from Järvi
    et al. (2011), but Järvi's Table 2(a) maps 0.95 to Building and 0.91 to Pavement. Available evidence
    cannot decide whether Ward intentionally used a different UK mapping or transposed the two surface
    classes. This is the sole curation question. Active place and representativeness are generic because
    Ward used the same table at London and Swindon; origin, path, name and legacy ID preserve application
    history. No value changes.
