  scientific_note: 'Järvi et al. (2011) publish the exact 0.25 mm Building storage capacity as a generic
    SUEWS land-cover value. The Table 2 footnote names Falk and Niemczynowicz (1978), but that inaccessible
    conference paper has not been used as an unverified active source. Järvi et al. (2014) later reuse the
    value in Helsinki, and legacy row 43240005 records Ward et al. (2016) only as a migration reference,
    not as evidence that Ward published or determined the value. The stable path, Helsinki origin, legacy ID
    and values remain unchanged.'
