      label: Table 1, characteristics of the observational sites
      page: 1696
      url: https://doi.org/10.5194/gmd-7-1691-2014
      note: 'Five sites: Kumpula, Pasila and Pihlajamäki in Helsinki, and an urban and a suburban site
        in Montreal. Each Helsinki eddy covariance footprint is a 1 km radius circle and the catchments
        are 23.8 and 44.8 ha. London is not a study site; the word appears in the article only in a code-availability
        address and in a publisher''s address in the reference list.'
  scientific_note: The citation is simply wrong for this record. AnOHM does not appear in Järvi et al.
    (2014) at all, and the article publishes no material thermal properties of any kind; its storage heat
    comes from the objective hysteresis model. This audit does not name a replacement source, because
    doing so on the strength of the scheme's name would be exactly the inference this database forbids.
    What is needed is the publication that introduced AnOHM and published these coefficients.
