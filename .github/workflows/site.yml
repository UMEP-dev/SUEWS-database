name: site

on:
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'scripts/**'
      - '.github/provenance-verifiers.yml'
      - '.github/ISSUE_TEMPLATE/provenance-signoff.yml'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened, closed]

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'provenance sign-off')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the database browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --with pyyaml --with jsonschema --with rfc8785 --no-project
          python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
