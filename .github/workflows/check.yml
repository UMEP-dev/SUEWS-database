name: check

permissions:
  contents: read
  issues: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Structural and coupling checks
        run: make check
      - name: Provenance and export regression tests
        run: make test
      - name: Authenticate provenance sign-offs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make check-signoffs
      - name: Validate fragments against the supy data model
        run: make validate
