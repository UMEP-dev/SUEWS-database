name: Offer a photograph of a typology
description: Suggest a photograph to illustrate an urban typology, with the licence it may be published under.
title: "[photo] "
labels: ["photo offer"]
body:
  - type: markdown
    attributes:
      value: |
        A typology is a visual idea. "Mixed-City Ideal" and "Residential
        Functionalism" are far easier to recognise than to describe, so a
        photograph does more for a reader than another paragraph would.

        One condition, and it is not negotiable: **a photograph can only be
        published if we can say who took it and under what licence.** A
        photograph with no stated terms cannot be shown, however good it is
        and however clearly it belongs here — `db/images.yml` records two
        that cannot be published for exactly that reason.

        **Before you fill this in.** This issue is public and permanent.
        Whatever you write here stays readable, including in the edit
        history, and if the photograph is published the credit and licence
        travel with it into a public repository and its release history,
        where they persist even if the record later changes. So give the
        credit you are content to have published indefinitely — a name, a
        pseudonym or your GitHub username all work, and Creative Commons
        licences explicitly allow crediting by pseudonym.

        **Please do not post an email address, a phone number or a postal
        address**, here or in a comment. We do not need one: your GitHub
        account is the contact, and anything we need to ask we will ask in
        this thread. A private identifier posted in a public issue cannot
        really be taken back.

        Nothing here is auto-applied. Every photograph reaches the site
        through a pull request that a human reviews.
  - type: input
    id: typology
    attributes:
      label: Typology
      description: The record's path under `db/`, or its name.
      placeholder: archetypes/typologies/sweden--industrial
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Seen at
      description: >-
        The page you came from. The site fills this in for you.
  - type: dropdown
    id: whose
    attributes:
      label: Whose photograph is it
      description: >-
        This decides what is needed next. Pointing at someone else's
        published photograph asks nothing of you but a link; offering your
        own means granting a licence.
      options:
        - I took it myself
        - Someone else took it, and it is already published under a licence
    validations:
      required: true
  - type: input
    id: photo_url
    attributes:
      label: Where the photograph is
      description: >-
        A link. For someone else's photograph, link the page that describes
        it rather than the image file alone — a Wikimedia Commons file page,
        a Flickr photo page, an institutional archive entry — because that
        page is usually where the licence is stated. For your own, anywhere
        we can fetch it from, or attach it to this issue after posting.
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: How the photographer should be credited
      description: >-
        The name that will appear under the image. For someone else's
        photograph, copy the credit their licence asks for. For your own,
        this is your choice of name, pseudonym or username, and it will be
        published as you write it here.
    validations:
      required: true
  - type: dropdown
    id: licence
    attributes:
      label: Licence
      description: >-
        The terms the photograph may be republished under. If you took it
        yourself, this is the licence you are offering it under, so choose
        deliberately: these licences cannot be withdrawn from copies already
        published.
      options:
        - CC0 / public domain dedication
        - Public domain, or no known copyright restrictions
        - CC BY (attribution)
        - CC BY-SA (attribution, share alike)
        - Another Creative Commons licence
        - Some other licence or written permission
        - I do not know
    validations:
      required: true
  - type: input
    id: licence_evidence
    attributes:
      label: Where the licence is stated
      description: >-
        For someone else's photograph, a link to the page stating those
        terms. For your own, write "my own photograph" — the declaration
        below is what records the grant.
    validations:
      required: true
  - type: textarea
    id: shows
    attributes:
      label: What it shows
      description: >-
        Where and when, and why it is a fair example of this typology rather
        than an unusual corner of it. A caption is written from this.
  - type: checkboxes
    id: rights
    attributes:
      label: Before you post
      options:
        - label: >-
            Either I am the copyright holder of this photograph and I license
            it under the licence named above, or it is already published
            under that licence by someone else.
          required: true
        - label: >-
            This is a photograph of a place as built, not an architect's
            visualisation or a rendering of something proposed.
          required: true
        - label: >-
            No individual is the subject of the photograph. Anyone visible is
            incidental to a view of the street or the buildings.
          required: true
        - label: >-
            I understand that the credit and licence above will be published
            on the site and in a public repository, and will remain in its
            history.
          required: true
