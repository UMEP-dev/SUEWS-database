name: Problem with the website
description: Something on the site is broken, unreadable, or hard to use.
title: "[site] "
labels: ["site problem"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page where you saw it.
      placeholder: https://database.suews.io/
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and screen
      description: >-
        For example, Safari on a laptop, or Chrome on a phone. Worth filling in
        for anything that looks wrong rather than behaves wrong.
